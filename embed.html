<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpoLab · modo plataforma</title>
<style>
html,body{margin:0;padding:0;background:transparent;width:100%;overflow-x:hidden;font-family:Inter,"Segoe UI",Arial,sans-serif}
#opolabFrame{display:block;width:100%;border:0;background:transparent;min-height:560px;overflow:hidden}
#platformFooter{text-align:center;padding:18px 10px 22px;color:#0aa8e5;font-weight:900;background:linear-gradient(180deg,rgba(255,255,255,0),#f5fafc)}
#platformFooter em{display:block;color:#6c7e93;font-family:"Segoe Print","Comic Sans MS",cursive;font-weight:400;margin-top:4px;font-size:16px}
#platformFooter .copy{display:block;color:#8a99ab;font-size:11px;font-weight:500;margin-top:5px}
</style>
</head>
<body>
<iframe id="opolabFrame" title="OpoLab" scrolling="no"></iframe>
<div id="platformFooter">⚗ OpoLab · by Oposalud<em>Aprender también puede ser un juego</em><span class="copy">© 2026 Oposalud</span></div>
<script>
(function(){
  const frame=document.getElementById('opolabFrame');
  const params=new URLSearchParams(location.search);
  let path=params.get('path')||'dermatologia/';
  path=path.replace(/^\/+/, '');
  frame.src='./'+path;

  const EMBED_CSS=`
    html,body{min-height:0!important;overflow-x:hidden!important}
    body{background:#fff!important}
    .wrap,.shell,main{width:100%!important;max-width:none!important;margin:0!important;padding:8px 10px!important}
    .topbar,.nav,.crumbs{margin-top:0!important;margin-bottom:10px!important}
    .brand,.crumbCurrent,.crumbSep,.lab{display:none!important}
    .hero{margin-top:2px!important;margin-bottom:12px!important;gap:12px!important}
    .hero h1,.head h1{font-size:clamp(32px,4.5vw,50px)!important;margin-top:2px!important}
    .hero p,.head p,.subtitle{font-size:15px!important;line-height:1.35!important}
    .visual{height:120px!important;font-size:64px!important}
    .sectionTitle{margin:12px 0 10px!important}
    .games{gap:10px!important}
    .game{min-height:140px!important;padding:16px!important}
    .gameIcon{font-size:30px!important}
    .game h3{font-size:21px!important}
    .head{gap:12px!important}
    .hud{gap:7px!important}
    .pill{padding:9px 10px!important;min-width:0!important}
    .pill b,.pill strong{font-size:19px!important}
    .progress{margin:12px 0!important}
    .layout,.room{gap:12px!important}
    .panel{padding:12px!important;border-radius:16px!important}
    .panel h2{margin-bottom:10px!important;font-size:17px!important}
    .cards{gap:8px!important}
    .item{min-height:44px!important;padding:10px 12px!important;font-size:15px!important;border-radius:12px!important}
    .status{margin-top:10px!important;padding:12px 14px!important}
    .case,.challenge{min-height:0!important;padding:18px!important}
    .scene{margin:12px 0!important;padding:14px!important}
    .question{margin:20px 0 16px!important;font-size:28px!important}
    .answer{margin-top:18px!important}
    .side{padding:16px!important}
    footer,.foot,.brandFoot{display:none!important}
    .board{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:10px!important;align-items:start!important}
    @media(max-width:1050px){
      .layout,.room{grid-template-columns:1fr!important}
      .side,.map{display:none!important}
      .hero,.head{grid-template-columns:1fr!important}
      .hud{grid-template-columns:repeat(2,1fr)!important}
    }
    @media(max-width:640px){.board{grid-template-columns:1fr!important}}
  `;

  function adapt(){
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      let style=doc.getElementById('opolab-embed-style');
      if(!style){
        style=doc.createElement('style');
        style.id='opolab-embed-style';
        style.textContent=EMBED_CSS;
        doc.head.appendChild(style);
      }
      const resize=()=>{
        try{
          const h=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight,500);
          frame.style.height=(h+4)+'px';
        }catch(e){}
      };
      resize();
      if(window.ResizeObserver){
        if(frame._ro)frame._ro.disconnect();
        frame._ro=new ResizeObserver(resize);
        frame._ro.observe(doc.body);
      }
      setTimeout(resize,100);setTimeout(resize,450);
    }catch(e){}
  }
  frame.addEventListener('load',adapt);
})();
</script>
</body>
</html>
