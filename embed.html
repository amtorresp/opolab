<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpoLab · modo plataforma</title>
<style>
html,body{margin:0;padding:0;background:transparent;width:100%;overflow-x:hidden}
#opolabFrame{display:block;width:100%;border:0;background:transparent;min-height:720px;overflow:hidden}
</style>
</head>
<body>
<iframe id="opolabFrame" title="OpoLab" scrolling="no"></iframe>
<script>
(function(){
  const frame=document.getElementById('opolabFrame');
  const params=new URLSearchParams(location.search);
  let path=params.get('path')||'dermatologia/';
  path=path.replace(/^\/+/, '');
  frame.src='./'+path;

  const EMBED_CSS=`
    html,body{min-height:0!important;overflow-x:hidden!important}
    body{background:#fff!important}
    .wrap,.shell,main{width:100%!important;max-width:none!important;margin:0!important;padding:12px 14px!important}
    .topbar,.nav,.crumbs{margin-top:0!important;margin-bottom:12px!important}
    .brand,.crumbCurrent,.crumbSep,.lab{display:none!important}
    .hero{margin-top:4px!important;margin-bottom:14px!important;gap:16px!important}
    .hero h1,.head h1{font-size:clamp(34px,5vw,54px)!important;margin-top:4px!important}
    .hero p,.head p,.subtitle{font-size:16px!important;line-height:1.4!important}
    .visual{height:135px!important;font-size:72px!important}
    .sectionTitle{margin:14px 0 12px!important}
    .games{gap:12px!important}
    .game{min-height:150px!important;padding:18px!important}
    .gameIcon{font-size:32px!important}
    .game h3{font-size:22px!important}
    .head{gap:14px!important}
    .hud{gap:8px!important}
    .pill{padding:10px 12px!important;min-width:0!important}
    .pill b,.pill strong{font-size:20px!important}
    .progress{margin:14px 0!important}
    .board,.layout,.room{gap:14px!important}
    .panel{padding:16px!important}
    .item{min-height:48px!important;padding:12px 14px!important;font-size:16px!important}
    .status{margin-top:12px!important;padding:14px 16px!important}
    .case,.challenge{min-height:0!important;padding:20px!important}
    .scene{margin:14px 0!important;padding:16px!important}
    .question{margin:24px 0 18px!important;font-size:30px!important}
    .answer{margin-top:22px!important}
    .side{padding:18px!important}
    footer,.foot{display:none!important}
    @media(max-width:1050px){
      .board,.layout,.room{grid-template-columns:1fr!important}
      .side,.map{display:none!important}
      .hero,.head{grid-template-columns:1fr!important}
      .hud{grid-template-columns:repeat(2,1fr)!important}
    }
  `;

  function adapt(){
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      let style=doc.getElementById('opolab-embed-style');
      if(!style){
        style=doc.createElement('style');
        style.id='opolab-embed-style';
        style.textContent=EMBED_CSS;
        doc.head.appendChild(style);
      }
      doc.documentElement.classList.add('opolab-embedded');
      doc.body.classList.add('opolab-embedded');

      const resize=()=>{
        try{
          const h=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight,620);
          frame.style.height=(h+8)+'px';
        }catch(e){}
      };
      resize();
      if(window.ResizeObserver){
        if(frame._ro)frame._ro.disconnect();
        frame._ro=new ResizeObserver(resize);
        frame._ro.observe(doc.body);
      }
      setTimeout(resize,100);
      setTimeout(resize,500);
    }catch(e){}
  }
  frame.addEventListener('load',adapt);
})();
</script>
</body>
</html>
