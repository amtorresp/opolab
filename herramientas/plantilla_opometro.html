<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpoMetro · Digestivo | OpoLab</title>
<meta name="description" content="Recorre el aparato digestivo como una red de metro y repasa preguntas reales de OPE con explicación.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#082b5c;--navy2:#0d3a75;--cyan:#0aa8e5;--mint:#16a37a;--violet:#6b5ce7;--amber:#f2a33a;
  --ink:#0f2440;--muted:#5b6f8a;--line:#dbe5ef;--bg:#f5f8fc;--card:#ffffff;
  --ok:#14936c;--okbg:#e8f8f1;--ko:#d0435a;--kobg:#fff0f2;
  --lc:var(--cyan);
  --r:18px;--shadow:0 1px 2px rgba(8,43,92,.06),0 8px 24px rgba(8,43,92,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",Inter,"Segoe UI",system-ui,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(8,43,92,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(8,43,92,.035) 1px,transparent 1px);background-size:28px 28px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #8fd8f5;outline-offset:2px}
.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:22px 0 30px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.back{color:var(--navy);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px}
.brand{color:var(--cyan);font-weight:800;font-size:14px;letter-spacing:.01em}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .08s ease,box-shadow .2s ease,background .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.line{background:var(--lc);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.ghost:hover{border-color:#9fd9f2}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.small{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:#eef4fa;color:var(--navy)}

/* HERO */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:stretch;margin-bottom:18px}
.heroTxt{background:var(--navy);color:#fff;border-radius:24px;padding:28px 30px;position:relative;overflow:hidden}
.heroTxt:after{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;border:28px solid rgba(10,168,229,.18)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#7fd3f5}
.hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.04;margin:10px 0 10px;letter-spacing:-.02em}
.hero h1 span{color:#5fd0f7}
.hero p{margin:0;color:#c9d9ee;font-size:16px;max-width:560px;position:relative;z-index:1}
.lines{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}
.lpill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.lpill i{width:18px;height:6px;border-radius:9px;display:inline-block}
.ticket{background:#fff;border-radius:24px;padding:22px 22px 18px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;display:flex;flex-direction:column}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:22px;height:22px;background:var(--bg);border-radius:50%;transform:translateY(-50%)}
.ticket:before{left:-11px}.ticket:after{right:-11px}
.tkHead{display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:12px;margin-bottom:12px}
.tkHead b{font-size:13px;letter-spacing:.1em;color:var(--muted)}
.tkHead span{font-weight:800;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f6f9fd;border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:24px;color:var(--navy);line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:10px;background:#e7eef6;border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mint));border-radius:99px;transition:width .5s}
.tkFoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}

/* MODES */
.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:22px 0 10px;gap:10px}
.sectionTitle h2{font-size:22px;margin:0;letter-spacing:-.01em}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mode{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--shadow);transition:border-color .2s,transform .15s;position:relative}
.mode:hover{border-color:#9fd9f2;transform:translateY(-2px)}
.mode .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;margin-bottom:10px}
.mode h3{margin:0 0 4px;font-size:17px}
.mode p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.mode .badge{position:absolute;top:12px;right:12px;background:var(--ko);color:#fff;border-radius:99px;font-size:12px;font-weight:800;padding:2px 9px}

/* MAP */
.mapCard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:14px 14px 6px;box-shadow:var(--shadow)}
.mapCard svg{width:100%;height:auto;display:block}
.mapCard .st{cursor:pointer}
.mapCard .st:hover circle.node,.mapCard .st:focus circle.node{r:21}
.mapCard text{font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:4px 8px 8px;font-size:12px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:6px;border-radius:9px;margin-right:6px;vertical-align:middle}
.stations{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.stCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;border-top:5px solid var(--lc);transition:transform .15s}
.stCard:hover{transform:translateY(-2px)}
.stCard b{display:block;font-size:14px;line-height:1.25}
.stCard span{display:block;font-size:12px;color:var(--muted);margin:3px 0 8px;min-height:32px;line-height:1.35}
.mini{height:6px;background:#e9eff6;border-radius:9px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--lc)}
.stCard small{display:block;margin-top:5px;font-size:11px;color:var(--muted);font-weight:700}

/* STATION */
.stHero{border-radius:24px;padding:24px 26px;color:#fff;background:var(--lc);position:relative;overflow:hidden;margin-bottom:14px}
.stHero:after{content:"";position:absolute;inset:auto -40px -70px auto;width:220px;height:220px;border-radius:50%;border:26px solid rgba(255,255,255,.16)}
.stHero .eyebrow{color:rgba(255,255,255,.85)}
.stHero h1{margin:6px 0 4px;font-size:clamp(28px,4vw,42px);letter-spacing:-.02em}
.stHero p{margin:0;opacity:.92}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:17px}
.claves{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.claves li{position:relative;padding:10px 12px 10px 38px;background:#f7fafd;border-radius:12px;font-size:14px;line-height:1.45}
.claves li:before{content:attr(data-n);position:absolute;left:10px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--lc);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.claves b{color:var(--navy)}
.actions{display:grid;gap:9px}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-of-type{border-bottom:0}
.kv b{color:var(--navy)}

/* QUIZ */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.qtitle{font-weight:800;color:var(--navy);font-size:15px;text-align:center;flex:1}
.qcount{font-weight:800;color:var(--muted);font-size:14px;min-width:60px;text-align:right}
.track{display:flex;align-items:center;margin:4px 0 14px;padding:0 4px}
.track .dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #c9d6e4;flex:none;transition:all .25s}
.track .seg{height:4px;background:#c9d6e4;flex:1;min-width:2px}
.track .dot.ok{background:var(--ok);border-color:var(--ok)}
.track .dot.ko{background:var(--ko);border-color:var(--ko)}
.track .dot.ans{background:var(--navy);border-color:var(--navy)}
.track .dot.cur{border-color:var(--lc);box-shadow:0 0 0 5px color-mix(in srgb,var(--lc) 25%,transparent);transform:scale(1.15)}
.track .seg.done{background:var(--lc)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);max-width:900px;margin:0 auto}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip.src{background:#fff6e8;color:#8a5a12}
.chip.stn{background:color-mix(in srgb,var(--lc) 14%,#fff);color:var(--navy)}
.qtext{font-size:clamp(18px,2.2vw,22px);line-height:1.38;margin:0 0 16px;font-weight:700;white-space:pre-line}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4;font-weight:500;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:color-mix(in srgb,var(--lc) 60%,#fff);background:#fbfdff}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:#eef4fa;color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:14px;text-transform:lowercase}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--navy);background:#f3f7fc}
.opt.sel .k{background:var(--navy);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt.ko .k{background:var(--ko);color:#fff}
.opt.dim{opacity:.6}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;display:none;animation:pop .25s ease}
.fb.show{display:block}
.fb.ok{background:var(--okbg);border:1px solid #bfe8d6}
.fb.ko{background:var(--kobg);border:1px solid #f3c4cc}
.fb.neutral{background:#f3f7fc;border:1px solid var(--line)}
.fbHead{font-weight:800;font-size:16px;margin-bottom:6px}
.fb.ok .fbHead{color:var(--ok)}.fb.ko .fbHead{color:var(--ko)}
.why{margin:0;font-size:15px;line-height:1.55}
.why b{color:var(--navy)}
.flag{margin-top:10px;background:#fff8e6;border:1px dashed #e5b552;border-radius:12px;padding:9px 12px;font-size:13px;color:#7a5410}
.fbAct{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.fbAct .hint{font-size:12px;color:var(--muted);margin-left:auto}
.qfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;max-width:900px;margin-left:auto;margin-right:auto}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* RESULT */
.res{max-width:900px;margin:0 auto}
.resTop{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{width:150px;height:150px}
.resTop h2{margin:0 0 6px;font-size:28px}
.resGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.revItem{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:#fff}
.revItem summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;gap:10px;align-items:flex-start}
.revItem summary::-webkit-details-marker{display:none}
.revItem summary .st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;margin-top:1px}
.revItem .body{margin-top:10px;font-size:14px}
.revItem .body p{margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* SETUP / ESCALAS / ARCHIVO */
.seg3{display:flex;gap:8px;flex-wrap:wrap}
.seg3 button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:700}
.seg3 button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.filters button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.flash{max-width:760px;margin:0 auto}
.flash .term{font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--navy);margin:4px 0 14px;line-height:1.2}
.arch .opt{cursor:default}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin-left:6px}
.tag.N{background:#fde7ea;color:#a3283b}.tag.O{background:#fff1d6;color:#8a5a12}.tag.H{background:var(--okbg);color:var(--ok)}

/* FOOTER */
.foot{text-align:center;color:var(--cyan);font-weight:800;margin-top:30px}
.foot em{display:block;color:#6c7e93;font-family:"Segoe Print","Comic Sans MS",cursive;font-weight:400;margin-top:4px}
.copy{display:block;color:#8a99ab;font-size:12px;font-weight:500;margin-top:6px}
.reset{background:none;border:0;color:#8a99ab;font-size:12px;text-decoration:underline;margin-top:8px}

@media (max-width:980px){
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stations{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero,.grid2{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{width:calc(100% - 32px);padding-top:14px}
  .heroTxt{padding:22px}
  .modes{grid-template-columns:1fr 1fr;gap:8px}
  .mode{padding:12px}.mode p{display:none}
  .mapCard{display:none}
  .qcard{padding:16px}
  .opt{font-size:14px;padding:10px 12px}
  .resTop{grid-template-columns:1fr;justify-items:center;text-align:center}
  .resGrid{grid-template-columns:1fr 1fr 1fr}
  .stats b{font-size:20px}
}
body.embedded .wrap{width:100%;max-width:none;padding:10px 12px}
body.embedded .brand{display:none}
body.embedded .heroTxt{padding:18px 20px}
body.embedded .hero h1{font-size:34px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- v2 ---- */
.modes.m8{grid-template-columns:repeat(4,minmax(0,1fr))}
.mode .new{position:absolute;top:12px;right:12px;background:var(--amber);color:#fff;border-radius:99px;font-size:10px;font-weight:800;padding:2px 8px;letter-spacing:.06em}
.rank{display:grid;gap:8px}
.rk{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;width:100%}
.rk:hover{border-color:#9fd9f2}
.rk .pos{font-weight:800;color:var(--muted);font-size:15px;text-align:center}
.rk .pos.top{color:#fff;background:var(--amber);border-radius:10px;padding:4px 0}
.rk b{display:block;font-size:15px}
.rk .meta{font-size:12px;color:var(--muted)}
.rk .hbar{height:8px;background:#eef3f8;border-radius:99px;overflow:hidden;margin-top:6px}
.rk .hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f6c26b);border-radius:99px}
.rk .n{font-weight:800;color:var(--navy);font-size:20px;text-align:right;line-height:1}
.rk .n small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.traps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.trap{background:#fff;border:1px solid var(--line);border-left:6px solid var(--ko);border-radius:16px;padding:14px 16px;text-align:left}
.trap:hover{border-color:#f3c4cc}
.trap h3{margin:0 0 4px;font-size:16px}
.trap p{margin:0;font-size:13px;color:var(--muted)}
.trap small{display:block;margin-top:8px;font-weight:700;font-size:12px;color:var(--navy)}
.rule{background:#fff;border:2px dashed var(--ko);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.rule .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ko)}
.rule p{margin:6px 0 0}
.caseBox{background:#fff8ec;border:1px solid #f1d7a8;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:15px;line-height:1.5}
.caseBox b{color:#8a5a12}
.others{margin-top:10px}
.others summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--navy)}
.others ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:6px}
.others li{font-size:14px;background:rgba(255,255,255,.7);border-radius:10px;padding:7px 10px}
.whyNot{margin:8px 0 0;font-size:14px;background:rgba(255,255,255,.75);border-radius:10px;padding:8px 10px}
.labGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.labWrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.colon svg{width:100%;max-width:420px;display:block;margin:auto}
.colon .seg{cursor:pointer;transition:stroke .2s}
.segInfo{display:grid;gap:8px}
.segInfo .kv b{text-align:right}
.bristolPic{background:#fbf7f2;border-radius:16px;padding:14px;display:grid;place-items:center;margin-bottom:12px}
.bristolPic svg{width:100%;max-width:340px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.steps span{font-size:12px;font-weight:800;border-radius:8px;padding:4px 8px;background:#eef3f8;color:var(--muted)}
.steps span.ok{background:var(--okbg);color:var(--ok)}
.steps span.ko{background:var(--kobg);color:var(--ko)}
.steps span.cur{background:var(--navy);color:#fff}
.bolo{display:flex;gap:14px;align-items:center;background:#f6f9fd;border-radius:16px;padding:14px;margin-bottom:12px}
.bolo .cup{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tbl td.r{text-align:right;font-weight:700}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:12px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--navy)}
.lmsTag{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;color:var(--ok);background:var(--okbg);border-radius:6px;padding:2px 8px}
@media (max-width:980px){.modes.m8{grid-template-columns:repeat(2,minmax(0,1fr))}.labGrid,.traps{grid-template-columns:1fr}.labWrap{grid-template-columns:1fr}}
@media print{.topbar,.foot,.noPrint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>

<div class="wrap">
  <div class="topbar">
    <a class="back" href="../../">⌂ OpoLab</a>
    <div class="brand">⚗ OpoLab · by Oposalud</div>
  </div>
  <main id="app" tabindex="-1"></main>
  <div class="foot">⚗ OpoLab · by Oposalud<em>Aprender también puede ser un juego</em><span class="copy">© 2026 Oposalud</span></div>
</div>
<script>
const Q=/*__PREGUNTAS__*/[];
const C=/*__CONTENIDO__*/{};
const FICHAS=C.fichas||{},ESCALAS=C.escalas||[],CONCEPTOS=C.conceptos||{},TRAMPAS=C.trampas||[],CASOS=C.casos||[];

const LINES={1:{name:'Línea 1 · Tubo digestivo',c:'#0aa8e5'},2:{name:'Línea 2 · Glándulas anejas',c:'#16a37a'},3:{name:'Línea 3 · Cuidados enfermeros',c:'#6b5ce7'},C:{name:'Estación Central',c:'#082b5c'}};
const ST=[

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(a,b)=>b?Math.round(a*100/b):0;

/* ---------- progreso ---------- */
const KEY='opolab-digestivo-v1';
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&v.q?v:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}SC.commit()}
let S=load()||{q:{},sims:[],esc:{best:0}};
S.lab=S.lab||{};
const rec=id=>S.q[id]||(S.q[id]={n:0,ok:0,st:0,r:0,lv:0,due:0});
const isMastered=id=>!!(S.q[id]&&S.q[id].st>=2);
const isPending=id=>!!(S.q[id]&&S.q[id].r);
const isDue=id=>isPending(id)&&(S.q[id].due||0)<=Date.now();
const INTERVAL=[0,1,3,7];
/* Repaso espaciado: un fallo vuelve hoy; cada acierto seguro en repaso lo aleja (1, 3 y 7 días) hasta salir de la cola. */
function register(id,ok,sure,silent){
  const r=rec(id);r.n++;
  if(!ok){r.st=0;r.r=1;r.lv=0;r.due=0}
  else if(!sure){r.ok++;r.r=1;r.lv=Math.max(r.lv||0,0);r.due=Date.now()+DAY}
  else{r.ok++;r.st++;if(r.r){r.lv=(r.lv||0)+1;if(r.lv>=INTERVAL.length){r.r=0;r.lv=0;r.due=0}else r.due=Date.now()+INTERVAL[r.lv]*DAY}}
  if(!silent)save();
}
function statsOf(qs){return {total:qs.length,mastered:qs.filter(q=>isMastered(q.id)).length,pending:qs.filter(q=>isPending(q.id)).length,due:qs.filter(q=>isDue(q.id)).length,seen:qs.filter(q=>S.q[q.id]&&S.q[q.id].n).length,
  n:qs.reduce((a,q)=>a+(S.q[q.id]?S.q[q.id].n:0),0),ok:qs.reduce((a,q)=>a+(S.q[q.id]?S.q[q.id].ok:0),0)}}
const stationStats=sid=>statsOf(VALID.filter(q=>q.s===sid));
function globalStats(){const t=statsOf(VALID);t.acc=pct(t.ok,t.n);t.answered=t.n;
  const next=VALID.filter(q=>isPending(q.id)&&!isDue(q.id)).map(q=>S.q[q.id].due).sort((a,b)=>a-b)[0];t.next=next;return t}

/* ---------- SCORM 1.2 (solo si la plataforma lo ofrece) ---------- */
const SC={api:null,
  init(){let w=window;for(let i=0;i<10&&w;i++){try{if(w.API){this.api=w.API;break}}catch(e){break}if(w.parent===w)break;w=w.parent}
    if(!this.api&&window.opener){try{this.api=window.opener.API||null}catch(e){}}
    if(!this.api)return;
    try{this.api.LMSInitialize('')}catch(e){this.api=null;return}
    const d=this.get('cmi.suspend_data');if(d&&!Object.keys(S.q).length)this.unpack(d);
    window.addEventListener('pagehide',()=>{this.commit();try{this.api.LMSFinish('')}catch(e){}});},
  get(k){try{return this.api.LMSGetValue(k)||''}catch(e){return ''}},
  set(k,v){try{this.api.LMSSetValue(k,String(v))}catch(e){}},
  pack(){const m=[],p=[];for(const [id,r] of Object.entries(S.q)){if(!/^\d+$/.test(id))continue;if(r.st>=2)m.push((+id).toString(36));if(r.r)p.push((+id).toString(36))}return 'v1;m='+m.join(',')+';p='+p.join(',')},
  unpack(d){try{const o=Object.fromEntries(d.split(';').slice(1).map(x=>x.split('=')));(o.m||'').split(',').filter(Boolean).forEach(x=>{const r=rec(parseInt(x,36));r.n=Math.max(r.n,2);r.ok=Math.max(r.ok,2);r.st=2});(o.p||'').split(',').filter(Boolean).forEach(x=>{const r=rec(parseInt(x,36));r.n=Math.max(r.n,1);r.r=1})}catch(e){}},
  commit(){if(!this.api)return;const g=statsOf(VALID),sc=pct(g.mastered,g.total);
    this.set('cmi.core.score.min',0);this.set('cmi.core.score.max',100);this.set('cmi.core.score.raw',sc);
    this.set('cmi.core.lesson_status',sc>=80?'completed':'incomplete');this.set('cmi.suspend_data',this.pack().slice(0,4000));
    try{this.api.LMSCommit('')}catch(e){}}
};

function mapSVG(){

function prioritize(pool,n){
  const rank=q=>isDue(q.id)?0:!S.q[q.id]?1:!isMastered(q.id)?2:3;
  pool=shuffle(pool).sort((a,b)=>rank(a)-rank(b));
  return n==='all'?pool:pool.slice(0,+n);
}
function pickTrip(sid,n){
  const pool=VALID.filter(q=>q.s===sid);
  return n==='pend'?shuffle(pool.filter(q=>isPending(q.id))):prioritize(pool,n);
}

/* ---------- motor de preguntas ---------- */
let G=null;
function startQuiz(items,opt){
  if(!items.length){emptyMsg();return}
  G=Object.assign({items:items.map(q=>({q,order:q.ns?[...q.o.keys()]:shuffle([...q.o.keys()]),pick:null,ok:null})),i:0,color:'var(--cyan)',back:'home',t0:Date.now()},opt);
  drawQ();
}
function emptyMsg(){
  const g=globalStats();
  render(`<div class="card" style="max-width:640px;margin:20px auto;text-align:center"><div style="font-size:46px">🎉</div><h2 style="margin:6px 0">Nada pendiente para hoy</h2><p class="small">Cuando falles una pregunta o la aciertes dudando, volverá aquí en el momento oportuno.${g.next?`<br>Próximo repaso: <b>${new Date(g.next).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</b>.`:''}</p><button class="btn primary" data-go="home">Volver al mapa</button></div>`);
}
function trackHTML(){
  return G.items.map((it,i)=>{
    let c='dot';if(i===G.i)c+=' cur';if(it.pick!==null){c+=G.mode==='sim'?' ans':(it.ok?' ok':' ko')}
    return (i?`<span class="seg${i<=G.i?' done':''}"></span>`:'')+`<span class="${c}"></span>`;
  }).join('');
}
function drawQ(){
  const it=G.items[G.i],q=it.q,s=stById[q.s];
  const opts=it.order.map((oi,pos)=>`<button class="opt" data-pos="${pos}"><span class="k">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`).join('');
  const many=G.items.length>30;
  render(`
  <div class="qtop"><button class="btn ghost" data-exit>✕ Salir</button><div class="qtitle">${esc(G.title)}</div><div class="qcount">${G.i+1}/${G.items.length}</div></div>
  ${many?`<div class="bar" style="margin:0 0 14px"><i style="width:${pct(G.i,G.items.length)}%;background:var(--lc)"></i></div>`:`<div class="track" aria-hidden="true">${trackHTML()}</div>`}
  ${G.rule&&G.i===0?`<div class="rule" style="max-width:900px;margin:0 auto 12px"><div class="lbl">🪤 LA TRAMPA</div><p>${esc(G.rule.engano)}</p></div>`:''}
  <article class="qcard">
    ${q.intro?`<div class="caseBox"><b>🩺 Caso:</b> ${esc(q.intro)}</div>`:''}
    <div class="qchips"><span class="chip src">${q.intro?'🧪':'📍'} ${esc(q.ex)}</span><span class="chip stn" style="--lc:${colorOf(q.s)}">● ${esc(s.name)}</span></div>
    <h2 class="qtext">${esc(q.q)}</h2>
    <div class="opts" role="group" aria-label="Opciones de respuesta">${opts}</div>
    <div class="fb" aria-live="polite"></div>
  </article>
  ${G.mode==='sim'?`<div class="qfoot"><button class="btn ghost" data-prev ${G.i?'':'disabled'}>← Anterior</button><button class="btn primary" data-next ${it.pick===null?'disabled':''}>${G.i===G.items.length-1?'Entregar examen':'Siguiente →'}</button></div>`:''}
  `,G.color);
  if(G.mode==='sim'&&it.pick!==null) $$('.opt')[it.pick].classList.add('sel');
}
function othersHTML(it){
  const q=it.q;if(!q.po)return '';
  const rows=it.order.map((oi,pos)=>q.po[oi]&&oi!==q.a&&pos!==it.pick?`<li><b>${L[pos]})</b> ${esc(q.po[oi])}</li>`:'').join('');
  return rows?`<details class="others"><summary>¿Por qué fallan las demás opciones?</summary><ul>${rows}</ul></details>`:'';
}
function answer(pos){
  const it=G.items[G.i],q=it.q;
  if(G.mode==='sim'){
    it.pick=pos;it.ok=it.order[pos]===q.a;
    $$('.opt').forEach((b,i)=>b.classList.toggle('sel',i===pos));
    $('[data-next]').disabled=false;$('.track')&&($('.track').innerHTML=trackHTML());
    return;
  }
  if(it.pick!==null) return;
  it.pick=pos;it.ok=it.order[pos]===q.a;
  const cp=it.order.indexOf(q.a),mine=it.order[pos];
  $$('.opt').forEach((b,i)=>{b.disabled=true;if(i===cp)b.classList.add('ok');else if(i===pos)b.classList.add('ko');else b.classList.add('dim')});
  const fb=$('.fb');
  fb.className='fb show '+(it.ok?'ok':'ko');
  const last=G.i===G.items.length-1;
  fb.innerHTML=`<div class="fbHead">${it.ok?'✓ ¡Correcto!':`✗ La correcta es la ${L[cp]})`}</div>
    ${!it.ok&&q.po&&q.po[mine]?`<p class="whyNot"><b>Tu respuesta, la ${L[pos]}):</b> ${esc(q.po[mine])}</p>`:''}
    <p class="why" style="margin-top:8px"><b>Por qué:</b> ${esc(q.e)}</p>
    ${othersHTML(it)}
    ${DOCENTE&&q.f?`<div class="flag">🧑‍🏫 <b>Nota de revisión:</b> ${esc(q.f)}</div>`:''}
    <div class="fbAct">${it.ok?
      `<button class="btn primary" data-sure="1">💡 Lo sabía</button><button class="btn ghost" data-sure="0">🤔 He dudado</button><span class="hint">Teclas S / D</span>`:
      `<button class="btn primary" data-sure="0">${last?'Ver resultado':'Siguiente →'}</button><span class="hint">Enter</span>`}</div>`;
  $('.track')&&($('.track').innerHTML=trackHTML());
  fb.querySelector('.fbAct button').focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function next(sure){
  const it=G.items[G.i];
  if(G.mode!=='sim') register(it.q.id,it.ok,!!sure);
  if(G.i<G.items.length-1){G.i++;drawQ()}else finish();

function finish(){

const SEQ=['N5','N10','N20','L5','L10','L20','P5','P10','P20'];

}
let MV=null;
function mecv(){
  const scen=shuffle([{f:'N10'},{f:'N20'},{f:'L5'},{f:'L10'},{f:'L20'},{f:'N5',f2:'P10'},{f:null},{f:'L5',eff:'N20'},{f:'P20'}])[0];

}
const SIGNS=['tose tras tragar','su voz se vuelve húmeda («voz de gárgaras»)','la saturación baja del 96 % al 92 %'];
function mecvDraw(){
  const b=MV.cur,unsafe=b===MV.scen.f||b===MV.scen.f2,eff=b===MV.scen.eff;
  const res=unsafe?`⚠️ Al administrarlo, ${shuffle(SIGNS)[0]}.`:eff?'Deglución segura, pero queda residuo en la boca y traga en dos veces.':'Deglución segura: sin tos, voz normal y saturación estable.';
  const correct=mecvNext(b,unsafe);
  const cands=uniq([correct,mecvNext(b,false),'P5','FIN','L5',b]).filter(x=>x!==b||true);
  const opts=shuffle(uniq([correct,...shuffle(cands.filter(x=>x!==correct)).slice(0,3)])).map(x=>x===b?'REP':x);
  MV.step={b,unsafe,eff,correct,opts};
  render(`${backBtn('lab','← Laboratorio')}
  <article class="qcard"><div class="row" style="justify-content:space-between"><span class="chip stn" style="--lc:#16a37a">Simulador MECV-V</span><span class="small">Paciente incorporado · saturación basal 96 %</span></div>
  <div class="steps">${SEQ.map(x=>{const l=MV.log.find(y=>y.b===x);return `<span class="${x===b?'cur':l?(l.unsafe?'ko':'ok'):''}">${x[0]}${x.slice(1)}</span>`}).join('')}</div>
  <div class="bolo"><div class="cup" style="background:${VCOL[b[0]]}">${b.slice(1)} ml</div><div><b>Bolo: ${bname(b)}</b><div style="margin-top:4px">${res}</div></div></div>

  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-mv="${i}"><span class="k">${L[i]}</span><span>${o==='REP'?'Repetir el mismo bolo':o==='FIN'?'Finalizar la exploración':'Administrar '+bname(o)}</span></button>`).join('')}</div>
  <div class="fb" aria-live="polite"></div></article>`,'#16a37a');
}
function mecvAnswer(i){
  const st=MV.step;if(st.done)return;st.done=true;

    st.eff?'Es una alteración de la EFICACIA: la prueba es positiva para ese bolo, pero NO obliga a interrumpirla. Se continúa con el siguiente.':

  const V={sim:simSetup,escalas:escalasHome,archivo,cae,trampas,casos,lab,informe,bristol,mecv,colon:()=>{COL.mode='explore';colon()}};
  if(V[k]) return V[k]();
  if(k==='repaso'){const items=shuffle(VALID.filter(q=>isDue(q.id))).slice(0,20);return startQuiz(items,{mode:'repaso',title:'Repaso inteligente',color:'#d0435a'})}
  if(k==='next'){const s=ST.slice().sort((a,b)=>{const A=stationStats(a.id),B=stationStats(b.id);return pct(A.mastered,A.total)-pct(B.mastered,B.total)})[0];return station(s.id)}
}
app.addEventListener('click',e=>{

  if(d.pos!==undefined) return answer(+d.pos);
  if(d.sure!==undefined) return next(d.sure==='1');
  if(t.hasAttribute('data-next')){if(G.i<G.items.length-1){G.i++;drawQ()}else{const blank=G.items.filter(i=>i.pick===null).length;if(!blank||confirm(`Tienes ${blank} sin responder (cuentan como en blanco). ¿Entregar?`))finish()}return}
  if(t.hasAttribute('data-prev')){G.i--;drawQ();return}

  if(t.hasAttribute('data-backto')) return goBack(G.back);
  if(t.hasAttribute('data-redo')) return startQuiz(shuffle(G.fails),{mode:'repaso',title:'Repetir fallos',color:'#d0435a',back:G.back,rule:G.rule});
  const grp=t.parentElement&&t.parentElement.dataset.group;
  if(grp==='n'){SIM.n=+d.v;return simSetup()}
  if(grp==='s'){SIM.s=d.v;return simSetup()}
  if(grp==='org'){SIM.org=d.v;return simSetup()}
  if(grp==='cat'){EX.cat=d.v;return escalasHome()}
  if(t.hasAttribute('data-simgo')){const f=[SIM.org!=='all'?SIM.org:'',SIM.s!=='all'?stById[SIM.s].name:'',SIM.rec?'desde '+RECENT:''].filter(Boolean).join(' · ');return startQuiz(shuffle(simPool()).slice(0,SIM.n),{mode:'sim',title:'Simulacro OPE',color:'#3c3fb8',filtro:f})}

  if(t.hasAttribute('data-exnext')) return exNext();
  if(t.hasAttribute('data-colonquiz')){COL.mode='quiz';COL.round={order:shuffle(SEGS.map(s=>s.k)),i:0,ok:0,state:{},done:false};return colonQuiz()}

  if(t.hasAttribute('data-brnext')) return bristolNext();
  if(d.mv!==undefined) return mecvAnswer(+d.mv);
  if(t.hasAttribute('data-mvnext')) return mecvNextStep();
  if(t.hasAttribute('data-csv')) return csv();
  if(t.hasAttribute('data-print')) return window.print();
});
app.addEventListener('change',e=>{if(e.target.matches('[data-rec]')){SIM.rec=e.target.checked;simSetup()}});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g.st,[data-seg]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||/input|textarea|select/i.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  const opts=$$('.opt:not([disabled])',app).filter(b=>b.tagName==='BUTTON');
  const idx='abcde'.indexOf(k)>=0?'abcde'.indexOf(k):'12345'.indexOf(k);
  if(idx>=0&&opts[idx]&&k.length===1){opts[idx].click();e.preventDefault();return}
  if(k==='s'){const b=$('[data-sure="1"]',app);if(b){b.click();e.preventDefault()}}
  if(k==='d'){const b=$('[data-sure="0"]',app);if(b&&$('[data-sure="1"]',app)){b.click();e.preventDefault()}}
  if(k==='enter'&&e.target.tagName!=='BUTTON'){const b=$('.fbAct .btn.primary',app)||$('[data-next]:not([disabled])',app);if(b){b.click();e.preventDefault()}}
});
if(self!==top)document.body.classList.add('embedded');
SC.init();
home();

</script>
