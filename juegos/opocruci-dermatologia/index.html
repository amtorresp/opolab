<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpoCruci · Dermatología</title><style>:root{--n:#082b5c;--b:#0aa8e5;--m:#6b7d95;--l:#dce8ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff,#f4f9fb);font-family:Inter,"Segoe UI",Arial,sans-serif;color:#17355f}.wrap{width:min(1120px,calc(100% - 20px));margin:10px auto}.nav{display:flex;gap:8px;align-items:center}.back,.reset{border:1px solid var(--l);background:#fff;color:var(--n);border-radius:10px;padding:7px 10px;font-weight:800;text-decoration:none;font-size:13px}.reset{margin-left:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:10px 0}.head h1{font-size:34px;margin:0;color:var(--n)}.head h1 span{color:var(--b)}.head p{font-size:13px;color:var(--m);margin:4px 0}.pill{background:#fff;border:1px solid var(--l);border-radius:11px;padding:7px 12px}.pill small{display:block;font-size:9px;color:var(--m);font-weight:900}.pill b{font-size:17px}.game{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px}.card{background:#fff;border:1px solid var(--l);border-radius:15px;padding:14px;box-shadow:0 6px 18px rgba(8,43,92,.05)}.cross{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;max-width:650px;margin:auto;background:#dce8ef;padding:3px;border-radius:8px}.sq{aspect-ratio:1;position:relative;background:#fff}.sq.block{background:var(--n)}.sq input{width:100%;height:100%;border:0;text-align:center;text-transform:uppercase;font-weight:900;color:var(--n);font-size:clamp(11px,1.8vw,17px);outline:none;background:transparent}.sq input:focus{background:#e9f9fe}.sq.correct{background:#e7f7ef}.sq.wrong{background:#fff0f2}.num{position:absolute;top:1px;left:2px;font-size:7px;color:#71839a;z-index:2}.clues h2{font-size:16px;margin:0 0 8px}.clue{padding:7px 0;border-bottom:1px solid #edf2f5;font-size:12px;line-height:1.35}.clue b{color:#0785bc}.actions{display:flex;gap:6px;margin-top:12px}.btn{border:0;border-radius:9px;background:var(--n);color:#fff;padding:9px 11px;font-weight:900}.btn.alt{background:#eaf8fc;color:#087dab}.msg{margin-top:10px;padding:10px;background:#edf8fc;border-radius:9px;font-size:12px}.foot{text-align:center;color:var(--b);font-weight:900;margin:18px 0}.foot em{display:block;color:#6c7e93;font-family:"Segoe Print","Comic Sans MS",cursive;font-weight:400;margin-top:4px}.copy{display:block;color:#8a99ab;font-size:11px;font-weight:500;margin-top:5px}@media(max-width:800px){.game{grid-template-columns:1fr}.head{display:block}.pill{display:inline-block;margin-top:6px}}</style></head><body><div class="wrap"><nav class="nav"><a class="back" href="../../dermatologia/">← Dermatología</a><b>OpoCruci · Dermatología</b><button class="reset" id="reset">↻ Reiniciar</button></nav><header class="head"><div><h1>Crucigrama <span>clínico</span></h1><p>Completa los conceptos dermatológicos a partir de las pistas.</p></div><div class="pill"><small>PROGRESO</small><b id="progress">0 / 8</b></div></header><main class="game"><section class="card"><div id="cross" class="cross"></div><div class="actions"><button class="btn" id="check">Comprobar</button><button class="btn alt" id="hint">Revelar una letra</button></div><div id="msg" class="msg">Los acentos no son necesarios.</div></section><aside class="card clues"><h2>Horizontales</h2><div id="across"></div><h2 style="margin-top:14px">Verticales</h2><div id="down"></div></aside></main><div class="foot">⚗ OpoLab · by Oposalud<em>Aprender también puede ser un juego</em><span class="copy">© 2026 Oposalud</span></div></div><script>'use strict';const N=15;const entries=[{n:1,w:'PARKLAND',r:7,c:3,d:'A',cl:'Fórmula de reposición de líquidos utilizada en grandes quemados.'},{n:2,w:'BRADEN',r:6,c:5,d:'D',cl:'Escala negativa para valorar riesgo de lesiones por presión.'},{n:3,w:'ERITEMA',r:10,c:5,d:'A',cl:'Enrojecimiento cutáneo que puede ser blanqueable o no.'},{n:4,w:'NORTON',r:11,c:5,d:'A',cl:'Escala clásica de riesgo de lesiones por presión con cinco parámetros.'},{n:5,w:'BAUX',r:9,c:11,d:'D',cl:'Índice pronóstico clásico que relaciona edad y porcentaje de superficie quemada.'},{n:6,w:'EMINA',r:8,c:1,d:'A',cl:'Escala cuyo nombre resume cinco factores de riesgo.'},{n:7,w:'WALLACE',r:3,c:8,d:'D',cl:'Regla utilizada para estimar rápidamente la extensión de una quemadura en adultos.'},{n:8,w:'RAN',r:6,c:4,d:'D',cl:'Código de tres colores para describir el lecho de una herida.'}];let solution=Array.from({length:N},()=>Array(N).fill('')),nums={};for(const e of entries){for(let i=0;i<e.w.length;i++){let r=e.r+(e.d==='D'?i:0),c=e.c+(e.d==='A'?i:0),ch=e.w[i];if(solution[r][c]&&solution[r][c]!==ch)throw new Error(`Cruce inválido en ${r},${c}`);solution[r][c]=ch}nums[`${e.r},${e.c}`]=(nums[`${e.r},${e.c}`]||[]).concat(e.n)}const $=x=>document.getElementById(x);function render(){let h='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let ch=solution[r][c],num=nums[`${r},${c}`];h+=ch?`<div class="sq">${num?`<span class="num">${num.join('/')}</span>`:''}<input maxlength="1" data-r="${r}" data-c="${c}" aria-label="casilla"></div>`:'<div class="sq block"></div>'}$('cross').innerHTML=h;$('across').innerHTML=entries.filter(e=>e.d==='A').map(e=>`<div class="clue"><b>${e.n}.</b> ${e.cl}</div>`).join('');$('down').innerHTML=entries.filter(e=>e.d==='D').map(e=>`<div class="clue"><b>${e.n}.</b> ${e.cl}</div>`).join('');document.querySelectorAll('input').forEach(inp=>{inp.oninput=()=>{inp.value=inp.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z]/g,'').toUpperCase()}})}function completed(){let n=0;for(const e of entries){let ok=true;for(let i=0;i<e.w.length;i++){let r=e.r+(e.d==='D'?i:0),c=e.c+(e.d==='A'?i:0),inp=document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);if(!inp||inp.value!==e.w[i])ok=false}if(ok)n++}return n}$('check').onclick=()=>{document.querySelectorAll('.sq').forEach(s=>s.classList.remove('correct','wrong'));document.querySelectorAll('input').forEach(inp=>{if(!inp.value)return;let ok=inp.value===solution[+inp.dataset.r][+inp.dataset.c];inp.parentElement.classList.add(ok?'correct':'wrong')});let n=completed();$('progress').textContent=`${n} / ${entries.length}`;$('msg').textContent=n===entries.length?'🎉 Crucigrama completado.':`${n} conceptos completos. Las letras incorrectas aparecen marcadas.`};$('hint').onclick=()=>{let pending=[...document.querySelectorAll('input')].filter(i=>!i.value||i.value!==solution[+i.dataset.r][+i.dataset.c]);if(!pending.length)return;let inp=pending[Math.floor(Math.random()*pending.length)];inp.value=solution[+inp.dataset.r][+inp.dataset.c];inp.parentElement.classList.remove('wrong');inp.parentElement.classList.add('correct');$('msg').textContent='💡 He revelado una letra.'};$('reset').onclick=()=>{document.querySelectorAll('input').forEach(i=>i.value='');document.querySelectorAll('.sq').forEach(s=>s.classList.remove('correct','wrong'));$('progress').textContent='0 / 8';$('msg').textContent='Los acentos no son necesarios.'};render();</script></body></html>
