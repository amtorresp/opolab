<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpoCaso · Dermatología</title><style>:root{--n:#082b5c;--b:#0aa8e5;--m:#6d7d94;--l:#d9e7ee}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff,#f4f9fb);font-family:Inter,"Segoe UI",Arial,sans-serif;color:#15365e}.shell{width:min(1180px,calc(100% - 20px));margin:10px auto}.nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}.back,.reset{color:var(--n);background:#fff;border:1px solid var(--l);border-radius:10px;padding:7px 10px;font-weight:800;text-decoration:none;font-size:13px}.reset{margin-left:auto}.crumb{font-weight:900;color:#0786bc;font-size:13px}.hero{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:8px}.hero h1{font-size:34px;line-height:1;margin:0;color:var(--n)}.hero h1 span{color:var(--b)}.hero p{font-size:13px;color:var(--m);margin:4px 0 0}.hud{display:flex;gap:6px}.pill{min-width:105px;background:#fff;border:1px solid var(--l);border-radius:12px;padding:7px 9px}.pill small{display:block;color:var(--m);font-weight:800;font-size:9px}.pill strong{display:block;color:var(--n);font-size:17px;margin-top:2px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px}.card{background:#fff;border:1px solid var(--l);border-radius:15px;box-shadow:0 6px 18px rgba(8,43,92,.05)}.case{padding:12px;min-height:0}.stage{display:flex;justify-content:space-between}.badge{background:#eaf8fc;color:#087ba8;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:900}.caseNo{color:var(--m);font-weight:900;font-size:11px}.scene{margin:9px 0;padding:11px;border-radius:12px;background:#f1fafd;border:1px solid #d8edf5}.scene h2{font-size:20px;margin:0 0 5px;color:var(--n)}.scene p{font-size:13px;line-height:1.35;margin:0;color:#405b7d}.clues{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.fact{padding:7px;background:#fbfdfe;border:1px solid var(--l);border-radius:9px}.fact b{display:block;color:var(--n);font-size:10px}.fact span{color:var(--m);font-size:11px}.prompt{font-size:15px;font-weight:900;color:var(--n);margin:10px 0 7px}.choices{display:grid;gap:6px}.choice{width:100%;text-align:left;border:2px solid #dce8ef;background:#fff;border-radius:10px;padding:8px;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:7px}.letter{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#eaf8fc;color:#087fae;font-weight:900;font-size:12px}.choice b{display:block;color:var(--n);font-size:12px}.choice span span{color:var(--m);font-size:11px}.feedback{margin-top:7px;padding:9px 10px;border-radius:9px;font-size:12px}.good{background:#e9f8f2;color:#176f55}.warn{background:#fff8e8;color:#8d6517}.bad{background:#fff1f2;color:#9c3340}.continue{width:100%;height:38px;margin-top:7px;border:0;border-radius:9px;background:var(--n);color:#fff;font-weight:900}.side{padding:10px}.patient{border-radius:11px;background:linear-gradient(145deg,#0a3e76,#12b9db);color:#fff;padding:11px}.patient h3{font-size:18px;margin:4px 0}.patient p{font-size:11px;line-height:1.35;margin:0}.timeline{margin-top:10px;font-size:11px}.timeline h4,.reason h4{margin:0 0 7px}.step{display:grid;grid-template-columns:21px 1fr;gap:6px;margin:6px 0;opacity:.4}.step.active,.step.done{opacity:1}.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#eef5f8}.reason{margin-top:10px;border-top:1px solid var(--l);padding-top:8px}.meter{height:6px;background:#e8eef2;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--b)}.hidden{display:none!important}.final{padding:30px;text-align:center}.score{font-size:44px;font-weight:900;color:var(--b)}.brandFoot{text-align:center;color:var(--b);font-weight:900;margin:18px 0 24px}.brandFoot em{display:block;color:#6c7e93;font-family:"Segoe Print","Comic Sans MS",cursive;font-weight:400;margin-top:4px}.brandFoot .copy{display:block;color:#8a99ab;font-size:11px;font-weight:500;margin-top:5px}@media(max-width:780px){.layout{grid-template-columns:1fr}.side{display:none}.hero{grid-template-columns:1fr}.clues{grid-template-columns:1fr}.crumb{display:none}}</style></head><body><div class="shell"><nav class="nav"><a class="back" href="../../dermatologia/">← Dermatología</a><span class="crumb">OpoCaso · Dermatología</span><button class="reset" id="resetBtn">↻ Reiniciar</button></nav><section id="game"><header class="hero"><div><h1>Opo<span>Caso</span></h1><p>Analiza la situación y decide qué harías a continuación.</p></div><div class="hud"><div class="pill"><small>CASO</small><strong id="caseCount"></strong></div><div class="pill"><small>CRITERIO</small><strong id="score">0</strong></div></div></header><div class="layout"><main class="card case"><div class="stage"><span class="badge" id="stageBadge"></span><span class="caseNo" id="caseTitle"></span></div><div class="scene"><h2 id="sceneTitle"></h2><p id="sceneText"></p></div><div class="clues" id="facts"></div><div class="prompt" id="prompt"></div><div class="choices" id="choices"></div><div id="feedback" class="feedback hidden"></div><button id="continueBtn" class="continue hidden">Continuar →</button></main><aside class="card side"><div class="patient"><small>Historia clínica</small><h3 id="patientName"></h3><p id="patientInfo"></p></div><div class="timeline" id="timeline"></div><div class="reason"><h4>Índice de razonamiento</h4><div class="meter"><i id="meter"></i></div></div></aside></div></section><section id="final" class="card final hidden"><h2 id="finalTitle"></h2><div class="score" id="finalScore"></div><p id="finalText"></p><button class="continue" id="replayBtn">Jugar otra guardia</button></section><div class="brandFoot">⚗ OpoLab · by Oposalud<em>Aprender también puede ser un juego</em><span class="copy">© 2026 Oposalud</span></div></div><script>'use strict';const cases=[{name:'Marta, 74 años',info:'Lesión dolorosa en pierna derecha. Antecedentes de HTA y varices.',steps:[{badge:'● RECEPCIÓN',title:'Una herida que no cierra',text:'Marta consulta por una lesión de tres semanas de evolución en el tercio distal de la pierna. Refiere molestias y aumento de volumen al final del día.',facts:[['Evolución','3 semanas'],['Dolor','Moderado'],['Antecedente','Varices']],prompt:'Antes de decidir el tratamiento local, ¿qué valoración es prioritaria?',choices:[['Valorar pulsos e índice tobillo-brazo','Permite conocer la situación arterial antes de plantear determinadas medidas terapéuticas.',2,'good'],['Aplicar compresión alta directamente','Antes de indicar compresión debe valorarse la situación vascular.',0,'warn'],['Indicar reposo absoluto','No resuelve la necesidad de caracterizar primero la lesión.',-1,'bad']]},{badge:'● VALORACIÓN',title:'Nuevos datos de la exploración',text:'La lesión es irregular y exudativa. Los pulsos están presentes y el índice tobillo-brazo es 0,95.',facts:[['ITB','0,95'],['Pulsos','Presentes'],['Morfología','Irregular']],prompt:'Integrando todos los datos, ¿qué etiología resulta más probable?',choices:[['Úlcera venosa','El conjunto de datos orienta a etiología venosa.',2,'good'],['Úlcera arterial','La exploración vascular no es la más característica.',-1,'bad'],['Lesión por presión','No existe un mecanismo de presión mantenida.',-1,'bad']]},{badge:'● PLAN',title:'Plan terapéutico',text:'Se realiza limpieza de la herida, protección de la piel perilesional y selección del apósito.',facts:[['ITB','0,95'],['Exudado','Alto'],['Piel','Frágil']],prompt:'¿Qué intervención debe formar parte del abordaje etiológico?',choices:[['Compresión terapéutica adaptada','La compresión es un pilar tras valorar la situación arterial.',2,'good'],['Reposo absoluto prolongado','No favorece el retorno venoso.',0,'warn'],['Antiséptico rutinario','No constituye tratamiento etiológico.',0,'warn']]}]},{name:'Javier, 39 años',info:'Accidente doméstico por líquido caliente.',steps:[{badge:'● TRIAGE',title:'Valoración inicial',text:'Observas lesiones compatibles con quemadura en el miembro superior derecho y la cara anterior del tronco.',facts:[['Agente','Líquido caliente'],['Zonas','MS derecho + tronco anterior'],['Edad','39 años']],prompt:'¿Qué dato debes cuantificar para valorar la extensión?',choices:[['Superficie corporal quemada','La extensión es esencial para valorar gravedad.',2,'good'],['Escala de Braden','No mide extensión de quemaduras.',-1,'bad'],['Índice tobillo-brazo','No cuantifica superficie quemada.',-1,'bad']]},{badge:'● CÁLCULO',title:'Estimación de la extensión',text:'La quemadura afecta por completo al miembro superior derecho y a la cara anterior del tronco.',facts:[['Paciente','Adulto'],['MS derecho','Completo'],['Tronco','Anterior']],prompt:'Aplicando Wallace, ¿qué porcentaje aproximado está quemado?',choices:[['27%','9% del miembro superior + 18% del tronco anterior.',2,'good'],['18%','Solo contabiliza el tronco anterior.',0,'warn'],['36%','Sobrestima la extensión.',-1,'bad']]},{badge:'● REPOSICIÓN',title:'Necesidades de fluidoterapia',text:'Javier pesa 70 kg y presenta una SCQ del 27%.',facts:[['Peso','70 kg'],['SCQ','27%'],['Periodo','24 h']],prompt:'Según Parkland, ¿qué volumen total corresponde a las primeras 24 horas?',choices:[['7.560 ml','Es el resultado del cálculo.',2,'good'],['3.780 ml','Es la mitad del volumen total.',0,'warn'],['10.800 ml','No corresponde al cálculo.',-1,'bad']]}]},{name:'Lucía, 82 años',info:'Paciente encamada con movilidad muy limitada.',steps:[{badge:'● DETECCIÓN',title:'Hallazgo durante el aseo',text:'En sacro observas eritema persistente, piel íntegra y no blanqueable.',facts:[['Piel','Íntegra'],['Hallazgo','Eritema'],['Zona','Sacro']],prompt:'¿Cómo clasificarías el hallazgo?',choices:[['LPP categoría 1','Piel intacta con eritema no blanqueable.',2,'good'],['LPP categoría 2','Implica pérdida parcial del grosor cutáneo.',-1,'bad'],['Dermatitis por incontinencia','El patrón descrito orienta más a presión.',0,'warn']]},{badge:'● RIESGO',title:'Valoración integral',text:'Lucía presenta movilidad limitada, humedad frecuente y nutrición deficiente.',facts:[['Movilidad','Limitada'],['Humedad','Frecuente'],['Nutrición','Deficiente']],prompt:'¿Qué herramienta es adecuada para estimar el riesgo de LPP?',choices:[['Escala de Braden','Valora los principales factores de riesgo.',2,'good'],['Glasgow melanoma','No evalúa riesgo de LPP.',-1,'bad'],['Wallace','Se utiliza en quemaduras.',-1,'bad']]},{badge:'● PREVENCIÓN',title:'Plan preventivo',text:'El equipo establece medidas preventivas para las próximas 24 horas.',facts:[['Dependencia','Alta'],['Humedad','Frecuente'],['Movilidad','Limitada']],prompt:'¿Qué estrategia ofrece un abordaje más completo?',choices:[['Reposicionamiento, manejo de humedad, superficies de apoyo y soporte nutricional','Aborda de forma conjunta los factores de riesgo.',2,'good'],['Solo crema barrera','No cubre todos los factores.',0,'warn'],['Masajear la zona eritematosa','No es una medida adecuada.',-1,'bad']]}]}];let c=0,s=0,score=0,locked=false,displayChoices=[];const $=id=>document.getElementById(id);function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function timeline(){let labels=['Detectar','Valorar','Decidir'];$('timeline').innerHTML='<h4>Ruta clínica</h4>'+labels.map((x,i)=>`<div class="step ${i<s?'done':i===s?'active':''}"><div class="dot">${i<s?'✓':i+1}</div><div><b>${x}</b></div></div>`).join('')}function load(){locked=false;let cs=cases[c],st=cs.steps[s];displayChoices=sh(st.choices);$('caseCount').textContent=`${c+1} / 3`;$('score').textContent=score;$('caseTitle').textContent=`CASO ${String(c+1).padStart(2,'0')}`;$('stageBadge').textContent=st.badge;$('sceneTitle').textContent=st.title;$('sceneText').textContent=st.text;$('patientName').textContent=cs.name;$('patientInfo').textContent=cs.info;$('facts').innerHTML=st.facts.map(f=>`<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('');$('prompt').textContent=st.prompt;$('choices').innerHTML=displayChoices.map((ch,i)=>`<button class="choice" data-i="${i}"><span class="letter">${'ABC'[i]}</span><span><b>${ch[0]}</b><span>${ch[1]}</span></span></button>`).join('');$('feedback').className='feedback hidden';$('continueBtn').classList.add('hidden');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));timeline();$('meter').style.width=`${Math.max(10,Math.min(100,50+score*5))}%`}function choose(i){if(locked)return;locked=true;let ch=displayChoices[i];score+=ch[2];$('score').textContent=score;$('feedback').className=`feedback ${ch[3]}`;$('feedback').innerHTML=`<strong>${ch[2]>=2?'✓ Decisión sólida':ch[2]===0?'⚠ Decisión incompleta':'✕ Decisión de riesgo'}</strong><br>${ch[1]}`;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('continueBtn').classList.remove('hidden')}function next(){if(s<2){s++;load()}else if(c<2){c++;s=0;load()}else end()}function end(){$('game').classList.add('hidden');$('final').classList.remove('hidden');$('finalTitle').textContent=score>=14?'Guardia excelente':score>=9?'Buen razonamiento clínico':'Caso completado';$('finalScore').textContent=score+' pts';$('finalText').textContent='Has completado los tres casos clínicos.'}$('continueBtn').onclick=next;$('resetBtn').onclick=()=>{if(confirm('¿Reiniciar OpoCaso?')){c=s=score=0;$('final').classList.add('hidden');$('game').classList.remove('hidden');load()}};$('replayBtn').onclick=()=>{c=s=score=0;$('final').classList.add('hidden');$('game').classList.remove('hidden');load()};load();</script></body></html>
