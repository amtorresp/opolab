","I: euforia, atención reducida · II: letargia, desorientación · III: estupor · IV: coma."],["Truelove-Witts","Escalas y test","Valora la actividad (gravedad del brote) de la colitis ulcerosa.","Grave: 6 o más deposiciones con sangre, fiebre, taquicardia, anemia y VSG elevada."],["CDAI","Escalas y test","Valora la actividad de la enfermedad de Crohn.","Crohn's Disease Activity Index."],["Criterios de Ranson","Escalas y test","Estiman el pronóstico de la pancreatitis aguda.","Al ingreso: edad, leucocitos, glucemia, LDH y AST. La amilasa NO puntúa."],["Arts y Sigstad","Escalas y test","Valoran los síntomas del síndrome de dumping.","Sistemas de puntuación del vaciamiento gástrico rápido tras la cirugía gástrica."],["Clasificación de Montreal (CU)","Clasificaciones","Clasifica la colitis ulcerosa por extensión y gravedad.","E1 proctitis · E2 colitis izquierda · E3 extensa; gravedad S0-S3."],["Clasificación de Montreal (Crohn)","Clasificaciones","Clasifica el Crohn por edad al diagnóstico, localización y comportamiento.","A1-A3 · L1-L4 · B1 inflamatorio, B2 estenosante, B3 fistulizante (+ «p» si es perianal)."],["Clasificación de Hinchey","Clasificaciones","Estadifica la diverticulitis y sus complicaciones (absceso, peritonitis).","Guía el tratamiento de la diverticulitis complicada y no complicada."],["Clasificación de Atlanta","Clasificaciones","Estratifica la gravedad de la pancreatitis aguda.","Leve, moderadamente grave o grave; por fases: temprana o tardía."],["Astler-Coller / Dukes","Clasificaciones","Estadiaje pronóstico del cáncer colorrectal.","A: mucosa · B: pared sin ganglios (B3 invade órganos vecinos) · C: con ganglios."],["Hernia de hiato tipo I","Clasificaciones","Hernia por deslizamiento: la más frecuente (> 90 %) y asociada al reflujo.","Tipo II paraesofágica (cirugía) · III mixta · IV con otras vísceras."],["Signo de Blumberg","Signos","Dolor a la descompresión brusca: irritación peritoneal.","En la FID orienta a apendicitis."],["Signo de Rovsing","Signos","Al presionar la FII aparece dolor en la FID: apendicitis.","Los gases se desplazan hacia el ciego y lo distienden."],["Signo de Dunphy","Signos","Aumenta el dolor en McBurney al toser: apendicitis.",""],["Signo de Aaron","Signos","Al presionar McBurney aparece dolor epigástrico o precordial: apendicitis.",""],["Signo del psoas (Cope)","Signos","Dolor en la FID con la extensión o flexión de la cadera derecha: apendicitis retrocecal.","Paciente en decúbito lateral izquierdo extendiendo la pierna derecha hacia atrás."],["Signo del obturador (Cope)","Signos","Dolor hipogástrico al flexionar y rotar hacia dentro la cadera derecha: apendicitis retrocecal o pélvica.",""],["Signo de Murphy","Signos","Se interrumpe la inspiración al palpar el hipocondrio derecho: colecistitis aguda.",""],["Signo de Cullen","Signos","Equimosis azulada periumbilical: pancreatitis necrotizante o hemorrágica.","Infrecuente, pero indica gravedad."],["Signo de Grey-Turner","Signos","Equimosis azulada en los flancos: pancreatitis necrotizante o hemorrágica.","Infrecuente, pero indica gravedad."],["Signo de Courvoisier-Terrier","Signos","Vesícula palpable e indolora con ictericia: tumor de la cabeza del páncreas o periampular.",""],["Signo de Kehr","Signos","Dolor referido al hombro izquierdo: rotura esplénica.","La sangre irrita el diafragma (nervio frénico)."],["Asterixis (flapping)","Signos","Temblor aleteante de las manos en extensión: encefalopatía hepática.","Gesto de «detener el tráfico»."],["Signo de Trousseau","Signos","Espasmo carpiano al inflar el manguito: hipocalcemia (por ejemplo, en la pancreatitis).",""],["Punto de McBurney","Signos","Unión del tercio externo con los dos tercios internos de la línea ombligo-EIAS derecha.","Proyección de la base del apéndice."],["Tríada de Charcot","Tríadas","Dolor cólico + fiebre + ictericia: colangitis aguda.",""],["Pentada de Reynolds","Tríadas","Charcot + shock + confusión mental: colangitis grave.","Más frecuente en ancianos."],["Tríada de la colecistitis","Tríadas","Dolor brusco en hipocondrio derecho + fiebre + leucocitosis.",""],["Maniobra de Masako","Maniobras de deglución","Tragar saliva con la lengua sujeta entre los dientes: fortalece la pared faríngea posterior.",""],["Maniobra de Mendelsohn","Maniobras de deglución","Mantener la laringe elevada 2-3 s al tragar: mejora la apertura del EES.",""],["Deglución supersupraglótica","Maniobras de deglución","Inspirar, retener el aire, tragar con fuerza y toser: protege la vía aérea.",""],["Deglución forzada","Maniobras de deglución","Tragar apretando fuerte todos los músculos: aumenta la propulsión del bolo.",""],["Sonda de Levin","Sondas","Nasogástrica de 1 luz: aspiración, lavado, nutrición y muestras.","14-18 Fr en adultos."],["Sonda de Salem","Sondas","Nasogástrica de 2 luces (una de aire): aspiración sin succionar la mucosa.",""],["Sonda de Foucher / Ewald","Sondas","Orogástrica de gran calibre: lavado gástrico.",""],["Sonda de Sengstaken-Blakemore","Sondas","3 vías y 2 balones: varices esofágicas sangrantes.","Balón gástrico 200-250 ml; esofágico con aire a presión controlada."],["Sonda de Minnesota","Sondas","4 vías y 2 balones: Sengstaken con aspiración esofágica.",""],["Sonda de Linton-Nachlas","Sondas","3 vías y un único balón gástrico: varices fúndicas.",""],["Sonda de Miller-Abbott","Sondas","Nasoentérica de 2 luces con globo: descompresión intestinal.",""],["Sonda de Cantor / Harris","Sondas","Nasoentérica de 1 luz con reservorio de mercurio (en desuso).",""],["Sonda Freka / Nutrisoft","Sondas","Finas y flexibles: nutrición enteral prolongada.",""],["Sonda de Plummer","Sondas","Dilata estenosis esofágicas (no sirve para alimentar).",""],["Tubo de Kehr (en T)","Sondas","Drenaje biliar tras explorar el colédoco.","Bolsa por debajo del punto de inserción; pinzar antes y después de las comidas."]],"conceptos":{"heces_ostomia":"Heces según el tipo de ostomía","sng_verif":"Verificar la posición de la SNG","lavado":"Lavado gástrico y carbón activado","sondas_tipos":"Tipos de sondas","peg":"Gastrostomía (PEG) y fármacos por sonda","sng":"SNG y nutrición enteral","enemas":"Enemas y fecalomas","irrigacion":"Irrigación de la colostomía","ostomias":"Tipos y cuidados de las ostomías","charcot":"Colangitis y tríada de Charcot","biliar":"Colecistitis, colelitiasis y Kehr","pancreas":"Pancreatitis y páncreas","encefalo":"Encefalopatía hepática","cirrosis":"Cirrosis, ascitis y varices","dumping":"Gastrectomía, dumping y B12","ulcera":"Úlcera péptica y H. pylori","erge":"ERGE, hernia de hiato y esófago","disfagia":"Disfagia y deglución","bucal":"Salud bucodental","eii":"Crohn y colitis ulcerosa","ccr":"Cribado y cáncer colorrectal","apendic":"Apendicitis y signos abdominales","obstruccion":"Obstrucción, íleo y abdomen agudo","hemorragia":"Hemorragia digestiva","eliminacion":"Estreñimiento, diarrea e incontinencia","valoracion":"Síntomas y pruebas diagnósticas","anatomia":"Anatomía y fisiología"},"trampas":[{"id":"cabecero","t":"Cabecero, no pies","engano":"Cambian «elevar el cabecero» por «elevar los pies» o hablan de grados en vez de centímetros.","regla":"En la ERGE se eleva el CABECERO 15-20 cm con tacos (no con almohadas), no se acuesta en las 3 h tras comer y no duerme sobre el lado derecho."},{"id":"posiciones","t":"Fowler para la SNG, Sims para el enema","engano":"Intercambian las posiciones de cada técnica: Sims para la SNG, lateral derecho para el enema...","regla":"SNG: Fowler (≥ 45°) con el cuello flexionado. Enema y colonoscopia: Sims o decúbito lateral IZQUIERDO. Lavado gástrico: lateral izquierdo + Trendelenburg. Nutrición por sonda: semi-Fowler."},{"id":"verificacion","t":"pH sí, auscultación no","engano":"Proponen la auscultación del aire insuflado, las burbujas en agua o la ausencia de tos como métodos fiables.","regla":"Referencia: radiografía. A pie de cama: aspirar y medir el pH (≤ 4 = estómago). La auscultación NO es fiable."},{"id":"distal","t":"Cuanto más distal, más sólida","engano":"Mezclan la consistencia de las heces entre tramos (por ejemplo, «colostomía izquierda: heces líquidas»).","regla":"Ciego: líquidas → ascendente: semilíquidas → transverso: blandas → descendente: semiblandas → sigma: sólidas. Las proximales son más irritantes."},{"id":"cucrohn","t":"Colitis ulcerosa ≠ Crohn","engano":"Atribuyen a la CU rasgos del Crohn (transmural, segmentaria, de boca a ano, granulomas, fístulas) o al revés.","regla":"CU: recto, continua, mucosa, rectorragia, megacolon tóxico, el tabaco protege. Crohn: íleon terminal, transmural, en parches, fístulas y afectación perianal, el tabaco empeora."},{"id":"ulceradolor","t":"La duodenal se calma comiendo","engano":"Cambian la relación del dolor con la comida o lo sitúan en el hipogastrio.","regla":"Duodenal: dolor 1,5-3 h tras comer, CEDE con la comida, nocturno. Gástrica: 20-30 min, no cede. Ambas son epigástricas."},{"id":"balones","t":"Sengstaken 3 vías, Minnesota 4","engano":"Confunden el número de vías y balones de las sondas de taponamiento.","regla":"Sengstaken-Blakemore: 3 vías y 2 balones. Minnesota: 4 vías (añade aspiración esofágica). Linton-Nachlas: 3 vías y 1 balón gástrico."},{"id":"lavado","t":"Para lavar, sondas gruesas por la boca","engano":"Ofrecen sondas finas, de nutrición o de taponamiento para el lavado gástrico.","regla":"Lavado gástrico: Foucher/Ewald (orogástricas gruesas). Sengstaken, Freka o Miller-Abbott NO sirven para lavar. Faucher no sirve para alimentar."},{"id":"alimentacion","t":"Ostomías: ¿alimentan o eliminan?","engano":"Cuelan una yeyunostomía o una gastrostomía entre las ostomías de eliminación.","regla":"Nutrición: faringostomía, esofagostomía, gastrostomía, yeyunostomía. Eliminación: ileostomía, colostomía, urostomía o ureterostomía."},{"id":"charcot","t":"Charcot es colangitis, no colecistitis","engano":"Atribuyen la tríada de Charcot a la colecistitis o la colelitiasis.","regla":"Charcot (dolor + fiebre + ictericia) = colangitis; con shock y confusión = Reynolds. Colecistitis = dolor + fiebre + leucocitosis + Murphy."},{"id":"disfagia","t":"Disfagia: girar, no inclinar; sin pajitas","engano":"Proponen pajitas, texturas mixtas o inclinar la cabeza hacia el lado afectado.","regla":"Barbilla al pecho; en hemiplejia, GIRAR la cabeza hacia el lado afectado; espesantes; evitar pajitas, jeringas y dobles texturas."},{"id":"encefalo","t":"Encefalopatía: proteínas sí, estreñimiento no","engano":"Proponen dieta hipoproteica o una dieta astringente.","regla":"Hoy: dieta hipercalórica e HIPERproteica (ESPEN) y evitar el estreñimiento (lactulosa). El estreñimiento es un desencadenante, no un síntoma."},{"id":"b12","t":"Sin estómago no hay B12","engano":"Ofrecen vitaminas liposolubles o del grupo B distintas de la B12.","regla":"El factor intrínseco (células parietales) es necesario para absorber la B12 en el íleon terminal → B12 intramuscular de por vida tras la gastrectomía."},{"id":"contraindica","t":"Indicación ≠ contraindicación de la SNG","engano":"Presentan como indicación una contraindicación (esófago perforado, cáusticos).","regla":"Contraindicaciones: cáusticos, perforación u obstrucción esofágica, fractura facial o de la base del cráneo. El bajo nivel de conciencia no es absoluta (se protege antes la vía aérea)."}],"casos":[{"id":"carmen","s":"boca","t":"Carmen y el vaso de agua","intro":"Carmen, 78 años, ingresa por un ictus con hemiparesia IZQUIERDA. Está consciente y orientada. Al ofrecerle agua, tose.","q":[{"q":"Carmen conserva la cognición. ¿Qué herramienta de cribado autoadministrada utilizarías?","o":["EAT-10","MNA","Escala de Bristol","Índice de Barthel"],"a":0,"e":"El EAT-10 es un cuestionario autoadministrado de 10 preguntas (0-40 puntos); un resultado ≥ 3 indica riesgo de disfagia. El MNA valora la nutrición, Bristol las heces y Barthel las actividades básicas."},{"q":"Realizas el MECV-V. ¿Con qué bolo empiezas?","o":["5 ml de viscosidad néctar","5 ml de líquido","20 ml de pudin","10 ml de líquido"],"a":0,"e":"Se empieza por la viscosidad intermedia (néctar) y el menor volumen (5 ml) para proteger al paciente, y se avanza a 10 y 20 ml si la deglución es segura."},{"q":"Con 10 ml de néctar, Carmen tose y su saturación baja del 96 % al 92 %. ¿Qué haces?","o":["Pasar a la viscosidad pudin, saltándote la líquida","Pasar a 5 ml de líquido","Repetir 10 ml de néctar","Terminar la prueba: dieta absoluta"],"a":0,"e":"La tos y una desaturación ≥ 3 % son alteraciones de la SEGURIDAD: no se pasa al líquido, se salta directamente a pudin. Solo si también falla con pudin se da por finalizada la exploración."},{"q":"Para las comidas, ¿qué indicación postural le das?","o":["Sentada a 90°, barbilla al pecho y cabeza GIRADA hacia el lado izquierdo","Inclinar la cabeza hacia el lado izquierdo","Tumbada a 30° con el cuello en extensión","Beber con pajita para controlar el volumen"],"a":0,"e":"En la hemiparesia se rota la cabeza hacia el lado AFECTADO: así el bolo pasa por el lado sano. Inclinarla, extender el cuello o usar pajitas aumenta el riesgo de aspiración."}]},{"id":"antonio","s":"higado","t":"Antonio, cirrosis descompensada","intro":"Antonio, 58 años, tiene una cirrosis de origen alcohólico. Ingresa por aumento del perímetro abdominal, oliguria y 4 kg más en una semana.","q":[{"q":"¿Qué control diario es el más útil para seguir su ascitis?","o":["Peso y perímetro abdominal","Glucemia capilar","Temperatura","Amilasa sérica"],"a":0,"e":"El peso y el perímetro abdominal diarios (junto con la diuresis) reflejan la evolución de la ascitis y la respuesta a los diuréticos y a la dieta sin sal."},{"q":"Se le realiza una paracentesis evacuadora de 7 litros. ¿Qué es correcto?","o":["Vaciar la vejiga, puncionar en el lado izquierdo, vigilar la TA y reponer albúmina","Puncionar en el lado derecho","Si se extraen más de 5 l no hace falta albúmina","Colocarle en decúbito prono"],"a":0,"e":"Antes de puncionar se vacía la vejiga; se punciona en el lado izquierdo (evitando el hígado), se vigila la hipotensión y, a partir del 5.º litro, se repone albúmina (10 g por cada 1,5 l extraídos)."},{"q":"Al tercer día vomita sangre roja abundante; TA 85/50. ¿Qué haces PRIMERO?","o":["Canalizar dos vías gruesas y reponer la volemia","Colocar ya una sonda de Levin","Darle suero oral","Hacer la endoscopia sin estabilizarle"],"a":0,"e":"La prioridad es la estabilización hemodinámica. Después: somatostatina o terlipresina y endoscopia con ligadura. La Sengstaken-Blakemore es un puente si fracasa lo anterior."},{"q":"Días después está desorientado en el tiempo, letárgico y con flapping. ¿Qué es INCORRECTO?","o":["Pautar una dieta hipoproteica estricta","Lactulosa hasta lograr 2-3 deposiciones blandas","Buscar desencadenantes (hemorragia, estreñimiento, infección)","Evitar las benzodiacepinas"],"a":0,"e":"Es una encefalopatía de grado II (West Haven). Hoy NO se restringen las proteínas (ESPEN): la dieta es hipercalórica e hiperproteica. Se usa lactulosa, se corrigen los desencadenantes y se evitan los sedantes."}]},{"id":"laura","s":"agudo","t":"Laura y el dolor que migra","intro":"Laura, 22 años, consulta por un dolor que empezó alrededor del ombligo hace 8 horas y ahora está en la fosa iliaca derecha. Tiene náuseas, no tiene hambre y está a 38,2 °C.","q":[{"q":"Al presionar la fosa iliaca IZQUIERDA le duele la derecha. ¿Qué signo es?","o":["Rovsing","Murphy","Blumberg","Cullen"],"a":0,"e":"Rovsing: la presión en la FII desplaza los gases hacia el ciego y despierta dolor en la FID. Murphy = colecistitis; Blumberg = dolor al descomprimir; Cullen = equimosis periumbilical."},{"q":"Tiene migración del dolor, anorexia, náuseas, dolor en FID, 38,2 °C, 14.000 leucocitos y 80 % de neutrófilos, sin rebote. ¿Qué puntuación de Alvarado obtiene?","o":["9: apendicitis","7: probable","5: posible","10: apendicitis"],"a":0,"e":"Migración 1 + anorexia 1 + náuseas 1 + dolor en FID 2 + fiebre 1 + leucocitosis 2 + desviación izquierda 1 = 9 (sin rebote). 9-10 puntos = apendicitis."},{"q":"Mientras espera la cirugía, ¿qué NO harías?","o":["Aplicar un enema y calor local para aliviarla","Dieta absoluta","Vía venosa y analgesia pautada","Profilaxis antibiótica según protocolo"],"a":0,"e":"En el abdomen agudo están contraindicados los enemas y los laxantes (riesgo de perforación). Lo indicado es dieta absoluta, vía venosa, analgesia y profilaxis antibiótica."},{"q":"Tras la apendicectomía, ¿cuál es la complicación MÁS FRECUENTE?","o":["Infección de la herida quirúrgica","Peritonitis difusa","Pileflebitis","Obstrucción por bridas"],"a":0,"e":"La complicación más frecuente es la infección de la herida; la más GRAVE es la peritonitis por perforación."}]},{"id":"jose","s":"ostom","t":"José estrena colostomía","intro":"José, 65 años, va a ser intervenido de un cáncer de recto: se le hará una colostomía terminal sigmoidea definitiva.","q":[{"q":"En la consulta preoperatoria, ¿dónde marcas el estoma?","o":["Fosa iliaca izquierda, sobre el recto anterior, comprobándolo de pie, sentado y tumbado","Sobre la línea de la cintura","En la fosa iliaca derecha","Sobre la cicatriz de una cirugía previa"],"a":0,"e":"El marcaje es tarea enfermera: sobre el músculo recto anterior (menos hernias y prolapsos), en el lado del colon abocado y evitando cintura, pliegues, cicatrices y prominencias óseas."},{"q":"¿Cómo serán sus heces cuando coma con normalidad?","o":["Sólidas y poco irritantes","Líquidas y continuas","Semilíquidas e irritantes","Blandas"],"a":0,"e":"En el sigma el colon ya ha absorbido el agua: las heces son sólidas y poco irritantes, y la evacuación puede regularse."},{"q":"Para cambiar el dispositivo, ¿qué es correcto?","o":["Despegar de arriba abajo, lavar con agua tibia y jabón neutro, secar a toques y recortar el orificio unos 3 mm mayor que el estoma","Desinfectar el estoma con povidona yodada","Secar con secador para que pegue mejor","Recortar el orificio 1 cm mayor para que no roce"],"a":0,"e":"Sin desinfectantes ni secador. El orificio debe ajustarse (unos 3 mm mayor): si q /* Repaso espaciado: un fallo vuelve hoy; cada acierto seguro en repaso lo aleja (1, 3 y 7 días) hasta salir de la cola. */
function register(id,ok,sure,silent){
  const r=rec(id);r.n++;S.days[today()]=(S.days[today()]||0)+1;
  if(!ok){r.st=0;r.r=1;r.lv=0;r.due=0}
  else if(!sure){r.ok++;r.r=1;r.due=Date.now()+DAY}
  else{r.ok++;r.st++;if(r.r){r.lv=(r.lv||0)+1;if(r.lv>=INTERVAL.length){r.r=0;r.lv=0;r.due=0}else r.due=Date.now()+INTERVAL[r.lv]*DAY}}
  if(!silent){save();checkBadges()}
}
function statsOf(qs){return {total:qs.length,mastered:qs.filter(q=>isMastered(q.id)).length,pending:qs.filter(q=>isPending(q.id)).length,due:qs.filter(q=>isDue(q.id)).length,seen:qs.filter(q=>S.q[q.id]&&S.q[q.id].n).length,
  n:qs.reduce((a,q)=>a+(S.q[q.id]?S.q[q.id].n:0),0),ok:qs.reduce((a,q)=>a+(S.q[q.id]?S.q[q.id].ok:0),0)}}
const stationStats=sid=>statsOf(ALL.filter(q=>q.s===sid));

    const d=this.get('cmi.suspend_data');if(d&&!Object.keys(S.q).length)this.unpack(d);
    window.addEventListener('pagehide',()=>{this.commit();try{this.api.LMSFinish('')}catch(e){}});},
  get(k){try{return this.api.LMSGetValue(k)||''}catch(e){return ''}},
  set(k,v){try{this.api.LMSSetValue(k,String(v))}catch(e){}},
  pack(){const m=[],p=[];for(const [id,r] of Object.entries(S.q)){if(!/^\d+$/.test(id))continue;if(r.st>=2)m.push((+id).toString(36));if(r.r)p.push((+id).toString(36))}return 'v1;m='+m.join(',')+';p='+p.join(',')},
  unpack(d){try{const o=Object.fromEntries(d.split(';').slice(1).map(x=>x.split('=')));(o.m||'').split(',').filter(Boolean).forEach(x=>{const r=rec(parseInt(x,36));r.n=Math.max(r.n,2);r.ok=Math.max(r.ok,2);r.st=2});(o.p||'').split(',').filter(Boolean).forEach(x=>{const r=rec(parseInt(x,36));r.n=Math.max(r.n,1);r.r=1})}catch(e){}},
  commit(){if(!this.api)return;const g=statsOf(ALL),sc=pct(g.mastered,g.total);
    this.set('cmi.core.score.min',0);this.set('cmi.core.score.max',100);this.set('cmi.core.score.raw',sc);
    this.set('cmi.core.lesson_status',sc>=80?'completed':'incomplete');this.set('cmi.suspend_data',this.pack().slice(0,4000));
    try{this.api.LMSCommit('')}catch(e){}}
};

function prioritize(pool,n){
  const rank=q=>isDue(q.id)?0:!S.q[q.id]?1:!isMastered(q.id)?2:3;
  pool=shuffle(pool).sort((a,b)=>rank(a)-rank(b));
  return n==='all'?pool:pool.slice(0,+n);
}
function pickTrip(sid,n){const pool=ALL.filter(q=>q.s===sid);return n==='pend'?shuffle(pool.filter(q=>isPending(q.id))):prioritize(pool,n)}
function dailyTrip(){
  const due=shuffle(ALL.filter(q=>isDue(q.id))).slice(0,5);
  const freq={};ALL.forEach(q=>freq[q.t]=(freq[q.t]||0)+1);
  const rest=ALL.filter(q=>!due.includes(q)&&!isMastered(q.id)).map(q=>({q,w:Math.random()*(1+freq[q.t]/10)*(S.q[q.id]?0.6:1)})).sort((a,b)=>b.w-a.w).map(x=>x.q);
  return shuffle([...due,...rest.slice(0,10-due.length)]);
}

function buscar(){

  const inp=$('#bq');inp.focus();inp.setSelectionRange(BQ.length,BQ.length);
  inp.addEventListener('input',()=>{BQ=inp.value;hits()});hits();

function hits(){
  const box=$('#hits'),w=norm(BQ.trim());
  if(w.length<3){box.innerHTML=`<p class="small">Escribe al menos 3 letras.</p>`;return}
  const terms=w.split(/\s+/).filter(Boolean);
  const res=IDX.filter(x=>terms.every(t=>x.t.includes(t))).slice(0,60);
  const hl=s=>{let h=esc(s);terms.forEach(t=>{const re=new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');h=h.replace(re,'<mark>$1</mark>')});return h};
  const hlAcc=s=>{const n=norm(s);let out='',i=0;const marks=[];terms.forEach(t=>{let k=n.indexOf(t);while(k>=0){marks.push([k,k+t.length]);k=n.indexOf(t,k+1)}});
    marks.sort((a,b)=>a[0]-b[0]);marks.forEach(([a,b])=>{if(a<i)return;out+=esc(s.slice(i,a))+'<mark>'+esc(s.slice(a,b))+'</mark>';i=b});return out+esc(s.slice(i))};
  box.innerHTML=res.length?`<p class="small">${res.length===60?'Más de 60':res.length} resultado${res.length>1?'s':''}${res.length>1?` · <button class="btn ghost" style="padding:4px 10px;font-size:13px" data-hitsall>Practicar estas ${res.length}</button>`:''}</p>`+res.map(({q})=>`<button class="hit" data-hit="${q.id}"><b>${hlAcc(q.q.length>220?q.q.slice(0,220)+'…':q.q)}</b><small><span style="color:${colorOf(q.s)};font-weight:800">● ${esc(stById[q.s].name)}</span><span>${esc(q.ex)}</span>${q.st?'<span style="color:var(--obs);font-weight:800">Obsoleta</span>':''}${isMastered(q.id)?'<span style="color:var(--ok);font-weight:800">Dominada</span>':''}</small></button>`).join(''):`<p class="small">Sin resultados para «${esc(BQ)}».</p>`;
  box._ids=res.map(x=>x.q.id);
}

  ${DOCENTE?`<div class="sectionTitle"><h2>Claves discutidas (${flagged.length})</h2><span class="small">Visible solo en modo docente</span></div>${flagged.map(card).join('')}`:''}`,'#b7791f');
}

/* ---------- informe ---------- */
function informe(){
  lastView='informe';
  const g=globalStats();
  const cons=Object.entries(CONCEPTOS).map(([k,l])=>{const t=statsOf(ALL.filter(q=>q.t===k));return {l,t,acc:pct(t.ok,t.n)}}).filter(x=>x.t.n>=3).sort((a,b)=>a.acc-b.acc);
  render(`${backBtn()}
  ${heroBox('Informe de progreso','Mi informe · Digestivo',`Generado el ${new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}. Puedes descargarlo o imprimirlo para enviárselo a tu docente.`,'#0b2a55')}
  <div class="row noPrint" style="margin-bottom:12px"><button class="btn primary" data-csv>${I('descarga')}Descargar CSV</button><button class="btn ghost" data-print>${I('imprimir')}Imprimir o guardar en PDF</button></div>
  <section class="grid2">
    <div class="card"><h3>Por estaciones</h3><table class="tbl"><tr><th>Estación</th><th>Dominadas</th><th>Precisión</th><th>En repaso</th></tr>
      ${ST.map(s=>{const t=stationStats(s.id);return `<tr><td><span style="color:${LINES[s.line].c}">●</span> ${s.name}</td><td class="r">${t.mastered}/${t.total}</td><td class="r">${t.n?pct(t.ok,t.n)+' %':'—'}</td><td class="r">${t.pending}</td></tr>`}).join('')}
      <tr><td><b>Total</b></td><td class="r">${g.mastered}/${g.total}</td><td class="r">${g.n?g.acc+' %':'—'}</td><td class="r">${g.pending}</td></tr></table></div>
    <div class="card"><h3>Conceptos más flojos</h3>${cons.length?cons.slice(0,8).map(c=>`<div class="kv"><span>${esc(c.l)}</span><b>${c.acc} % <span class="small">(${c.t.n} resp.)</span></b></div>`).join(''):'<p class="small">Responde al menos 3 preguntas de un concepto para verlo aquí.</p>'}
      <h3 style="margin-top:16px">Otros datos</h3>
      <div class="kv"><span>Respuestas dadas</span><b>${g.n}</b></div>
      <div class="kv"><span>Días seguidos estudiando</span><b>${dayStreak()}</b></div>
      <div class="kv"><span>Mejor racha de aciertos</span><b>${S.best||0}</b></div>
      <div class="kv"><span>Simulacros (última nota)</span><b>${S.sims.length} ${S.sims[0]?'('+S.sims[0].nota.toFixed(2)+')':''}</b></div>
      <div class="kv"><span>Récord OpoEscalas</span><b>${S.esc.best||0}/10</b></div></div>
  </section>
  <div class="sectionTitle"><div><span class="eyebrow">${S.badges.length} de ${BADGES.length}</span><h2>Mis insignias</h2></div></div>
  <section class="badges">${BADGES.map(b=>`<div class="bdg ${S.badges.includes(b.id)?'':'off'}"><div class="md" style="background:${b.c}">${I('medalla')}</div><b>${esc(b.t)}</b><span>${esc(b.d)}</span></div>`).join('')}</section>`,'#0b2a55');
}
function csv(){
  const rows=[['id','estacion','concepto','examen','estado','vistas','aciertos','racha_segura','en_repaso','dominada']];
  ALL.forEach(q=>{const r=S.q[q.id]||{n:0,ok:0,st:0,r:0};rows.push([q.id,stById[q.s].name,CONCEPTOS[q.t]||q.t,q.ex,q.st?'obsoleta':'vigente',r.n,r.ok,r.st,r.r?'sí':'no',r.st>=2?'sí':'no'])});
  const txt='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='informe-opometro-digestivo.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- navegación y eventos ---------- */
function go(k){
  if(k==='home'||k==='mapa'){home();if(k==='mapa')setTimeout(()=>{const m=$('.mapCard');(m&&m.offsetParent?m:$('.metroV')).scrollIntoView({behavior:'smooth'})},50);return}
  const V={sim:simSetup,escalas:escalasHome,archivo,cae,trampas,casos,lab,informe,bristol,mecv,buscar,colon:()=>{COL.mode='explore';colon()}};
  if(V[k]) return V[k]();
  if(k==='repaso'){const items=shuffle(ALL.filter(q=>isDue(q.id))).slice(0,20);return startQuiz(items,{mode:'repaso',title:'Repaso inteligente',color:'#d23f57'})}
  if(k==='dia') return startQuiz(dailyTrip(),{mode:'dia',title:'Viaje del día',color:'#0aa8e5'});
  if(k==='next'){const s=ST.slice().sort((a,b)=>{const A=stationStats(a.id),B=stationStats(b.id);return pct(A.mastered,A.total)-pct(B.mastered,B.total)})[0];return station(s.id)}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-st],[data-seg]');if(!t||!t.closest('#app,#top'))return;
  const d=t.dataset;
  if(t.hasAttribute('data-snd')){S.snd=!S.snd;save();topbar();if(S.snd)SND.ok();return}
  if(d.go) return go(d.go);
  if(t.hasAttribute('data-reset')){if(confirm('¿Borrar todo tu progreso en este navegador?')){S={q:{},sims:[],esc:{best:0},lab:{},days:{},badges:[],snd:S.snd,best:0};save();home()}return}
  if(d.seg){COL.sel=d.seg;return colon()}
  if(d.st&&!d.trip) return station(d.st);
  if(d.trip){const s=stById[d.trip];return startQuiz(pickTrip(d.trip,d.n),{mode:'station',title:s.name,color:LINES[s.line].c,back:d.trip})}
  if(d.concepto) return startQuiz(prioritize(ALL.filter(q=>q.t===d.concepto),15),{mode:'concepto',title:CONCEPTOS[d.concepto],color:'#c27a12',back:'cae'});
  if(d.trampa) return trampa(d.trampa);
  if(d.trapgo){const t=TRAMPAS.find(x=>x.id===d.trapgo);return startQuiz(prioritize(trapQs(d.trapgo),'all'),{mode:'trampa',title:'Trampa: '+t.t,color:'#d23f57',back:'trampa:'+d.trapgo,rule:t})}
  if(d.caso){const c=CASOS.find(x=>x.id===d.caso);return startQuiz(casoItems(c),{mode:'caso',title:'Supuesto: '+c.t,color:colorOf(c.s),back:'casos'})}
  if(d.hit) return startQuiz([byId[d.hit]],{mode:'buscar',title:'Pregunta del buscador',color:'#0b2a55',back:'buscar'});
  if(t.hasAttribute('data-hitsall')) return startQuiz(($('#hits')._ids||[]).map(i=>byId[i]),{mode:'buscar',title:'Búsqueda: '+BQ,color:'#0b2a55',back:'buscar'});
  if(t.hasAttribute('data-obsgo')) return startQuiz(shuffle(OBS),{mode:'obs',title:'Preguntas obsoletas',color:'#b7791f',back:'archivo'});
  if(d.pos!==undefined) return answer(+d.pos);
  if(d.sure!==undefined) return next(d.sure==='1');
  if(t.hasAttribute('data-next')){if(G.i<G.items.length-1){G.i++;drawQ()}else{const blank=G.items.filter(i=>i.pick===null).length;if(!blank||confirm(`Tienes ${blank} sin responder (cuentan como en blanco). ¿Entregar?`))finish()}return}
  if(t.hasAttribute('data-prev')){G.i--;drawQ();return}
  if(t.hasAttribute('data-exit')){if(G.mode==='sim'&&G.items.some(i=>i.pick!==null)&&!confirm('¿Salir del simulacro? Se perderán las respuestas.'))return;clearInterval(G.tm);return goBack(G.back)}
  if(t.hasAttribute('data-backto')) return goBack(G.back);
  if(t.hasAttribute('data-redo')) return startQuiz(shuffle(G.fails),{mode:'repaso',title:'Repetir fallos',color:'#d23f57',back:G.back,rule:G.rule});
  const grp=t.parentElement&&t.parentElement.dataset.group;
  if(grp==='n'){SIM.n=+d.v;return simSetup()}
  if(grp==='s'){SIM.s=d.v;return simSetup()}
  if(grp==='org'){SIM.org=d.v;return simSetup()}
  if(grp==='cat'){EX.cat=d.v;return escalasHome()}
  if(t.hasAttribute('data-simgo')){const items=shuffle(simPool()).slice(0,SIM.n);const f=[SIM.org!=='all'?SIM.org:'',SIM.s!=='all'?stById[SIM.s].name:'',SIM.rec?'desde '+RECENT:''].filter(Boolean).join(' · ');return startQuiz(items,{mode:'sim',title:'Simulacro OPE',color:'#3c3fb8',filtro:f,back:'sim',secs:SIM.crono?items.length*60:0})}
  if(t.hasAttribute('data-exgo')) return exStart();
  if(d.ex!==undefined) return exAnswer(+d.ex);
  if(t.hasAttribute('data-exnext')) return exNext();
  if(t.hasAttribute('data-colonquiz')){COL.mode='quiz';COL.round={order:shuffle(SEGS.map(s=>s.k)),i:0,ok:0,state:{},done:false};return colonQuiz()}
  if(d.cons!==undefined) return colonAnswer(+d.cons);
  if(t.hasAttribute('data-colonnext')) return colonNext();
  if(d.br!==undefined) return bristolAnswer(+d.br);
  if(t.hasAttribute('data-brnext')) return bristolNext();
  if(d.mv!==undefined) return mecvAnswer(+d.mv);
  if(t.hasAttribute('data-mvnext')) return mecvNextStep();
  if(t.hasAttribute('data-csv')) return csv();
  if(t.hasAttribute('data-print')) return window.print();
});
app.addEventListener('change',e=>{if(e.target.matches('[data-rec]')){SIM.rec=e.target.checked;simSetup()}if(e.target.matches('[data-crono]')){SIM.crono=e.target.checked}});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g.st,[data-seg]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||/input|textarea|select/i.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  const opts=$$('.opt:not([disabled])',app).filter(b=>b.tagName==='BUTTON');
  const idx='abcde'.indexOf(k)>=0?'abcde'.indexOf(k):'12345'.indexOf(k);
  if(idx>=0&&opts[idx]&&k.length===1){opts[idx].click();e.preventDefault();return}
  if(k==='s'){const b=$('[data-sure="1"]',app);if(b){b.click();e.preventDefault()}}
  if(k==='d'){const b=$('[data-sure="0"]',app);if(b&&$('[data-sure="1"]',app)){b.click();e.preventDefault()}}
  if(k==='enter'&&e.target.tagName!=='BUTTON'){const b=$('.fbAct .btn.primary',app)||$('[data-next]:not([disabled])',app);if(b){b.click();e.preventDefault()}}
});
if(self!==top)document.body.classList.add('embedded');
SC.init();
topbar();
home();

</script>
</body>
</html>
