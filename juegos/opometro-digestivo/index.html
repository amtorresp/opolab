s). Para la dentición temporal se usa el índice cod (sin ausentes).","a":2},{"id":78,"ex":"Galicia · 2016","org":"Galicia","y":2016,"s":"ostom","t":"ostomias","q":"¿Cuáles de las siguientes son complicaciones tardías de las ostomías?","o":["Estenosis, sangrado, necrosis y hundimiento.","Estenosis, necrosis, prolapso y hernia paraestomal.","Estenosis, dehiscencia, malposición y alteraciones cutáneas.","Estenosis, complicaciones cutáneas, prolapso y hernia paraestomal."],"e":"Complicaciones TARDÍAS: estenosis, retracción, prolapso, hernia paraestomal, granulomas y complicaciones cutáneas. Las PRECOCES (postoperatorio inmediato) son el sangrado, el edema, la isquemia o necrosis y la dehiscencia mucocutánea.","a":3},{"id":79,"ex":"Castilla y León · 2016","org":"Castilla y León","y":2016,"s":"ostom","t":"irrigacion","q":"Las recomendaciones en la fase postoperatoria para el cuidado del paciente ostomizado son todas menos una, indique cuál:","o":["Evaluar el estoma inmediatamente después de la operación, así como el estado del estoma y de la piel periestomal con cada cambio del dispositivo.","Se puede emplear una irrigación por colostomía como un procedimiento seguro y eficaz para el manejo de colostomías descendentes o sigmoides en determinados pacientes adultos.","Introducir en la colostomía un supositorio de glicerina para ayudar a la evacuación de los residuos.","Formar al paciente y a sus familiares para que puedan reconocer las complicaciones que afectan al estoma y a la piel periestomal."],"e":"La guía RNAO recomienda EVITAR introducir supositorios de glicerina en la colostomía. Sí se recomienda evaluar el estoma y la piel en cada cambio, enseñar a reconocer complicaciones y la irrigación en colostomías descendentes o sigmoideas seleccionadas.","a":2},{"id":80,"ex":"Extremadura · 2016","org":"Extremadura","y":2016,"s":"sondas","t":"sondas_tipos","q":"De las siguientes sondas nasogástricas, ¿Cuál consta de 4 luces?","o":["Miller-Abbott.","Moss.","Minnesota.","Sengstaken-Blakemore."],"e":"La sonda de Minnesota es una Sengstaken-Blakemore modificada con una 4.ª luz para aspirar el contenido esofágico: 4 vías y 2 balones. La Sengstaken tiene 3 vías, la Linton-Nachlas 3 vías y un balón, y la Miller-Abbott 2 luces.","tr":"balones","a":2,"po":["Miller-Abbott: 2 luces.","Moss: 3 luces.","","Sengstaken: 3 vías (la Minnesota es la de 4)."]},{"id":81,"ex":"Galicia · 2016","org":"Galicia","y":2016,"s":"agudo","t":"obstruccion","q":"¿Cuál de las siguientes no es una posible causa del íleo paralítico?","o":["Infarto agudo de miocardio.","Bezoar.","Retención aguda de orina.","Todas son posibles causas."],"e":"El bezoar (masa de material no digerible) obstruye la luz intestinal: produce un íleo MECÁNICO intraluminal, no paralítico. El íleo paralítico puede ser reflejo a procesos extraabdominales o retroperitoneales, como el IAM, la retención urinaria, el cólico renal o la cirugía.","a":1,"ns":1},{"id":82,"ex":"Galicia · 2016","org":"Galicia","y":2016,"s":"sondas","t":"sondas_tipos","q":"Se le ha colocado a un paciente una SNG (sonda nasogástrica) de silicona. Señale la respuesta incorrecta sobre este tipo de sondas:","o":["No se endurece en presencia de jugos digestivos.","Es un material biocompatible y no tóxico.","Requiere recambio mensual.","Son bien toleradas por el paciente porque no irritan el tramo nasofaríngeo."],"e":"Las sondas de silicona (y poliuretano) son biocompatibles, blandas, no se endurecen con los jugos digestivos y se toleran bien, por lo que pueden permanecer varios meses. Las que necesitan recambio frecuente (cada 7-15 días) son las de PVC, que se endurecen. Por eso la opción c es la incorrecta.","a":2,"ns":1},{"id":83,"ex":"Galicia · 2016","org":"Galicia","y":2016,"s":"ostom","t":"peg","q":"Tras la colocación de una PEG a un paciente, los cuidados de enfermería en planta serán:","o":["No utilizar la sonda durante 24 horas.","No utilizar la sonda durante aproximadamente 8 horas, después se podrá pasar medicación por la misma.","Mantener al paciente en decúbito supino.","Cada 2-3 días debe girarse la sonda al menos una vuelta."],"e":"Tras colocar una PEG se suele esperar unas horas (en torno a 6-8 h, según el protocolo) antes de usarla, empezando con agua y medicación y después con nutrición. Se mantiene el cabecero elevado y la sonda se gira a diario, una vez cicatrizado el trayecto, para evitar adherencias.","a":1},{"id":84,"ex":"Canarias · 2016","org":"Canarias","y":2016,"s":"estom","t":"ulcera","q":"De los siguientes enunciados, no supone una complicación de la úlcera péptica:","o":["Perforación de estómago.","Hemorragia digestiva.","Obstrucción pilórica.","Shock Neurogénico."],"e":"Las complicaciones de la úlcera péptica son la hemorragia, la perforación, la penetración y la obstrucción pilórica. La hemorragia masiva puede llevar a un shock HIPOVOLÉMICO, pero no a un shock neurogénico, que se debe a la pérdida del tono simpático (lesión medular).","a":3},{"id":85,"ex":"Canarias · 2016","org":"Canarias","y":2016,"s":"sondas","t":"sng","q":"Señale la respuesta incorrecta, en relación con el sondaje nasogástrico.","o":["Previene la broncoaspiración en pacientes intubados.","Sirve para drenar el contenido gástrico.","Se utilizará cuando exista perforación de esófago.","Se puede utilizar para administrar fármacos."],"e":"La perforación esofágica contraindica de forma absoluta el sondaje nasogástrico, igual que la estenosis u obstrucción esofágica o la ingesta de cáusticos. La SNG sirve para drenar o descomprimir, alimentar, administrar fármacos y reducir el riesgo de aspiración en pacientes intubados.","tr":"contraindica","a":2,"po":["Es cierto: descomprimir el estómago reduce la aspiración en intubados.","Es cierto: drenar es una de sus funciones principales.","","Es cierto: se usa para administrar fármacos."]},{"id":86,"ex":"Canarias · 2016","org":"Canarias","y":2016,"s":"higado","t":"encefalo","q":"¿Qué tipo de dieta está indicada en un enfermo cirrótico con encefalopatía hepática?","o":["Dieta hipoproteica.","Dieta hipersódica.","Dieta hiperproteica.","Dieta hipocalórica."],"e":"ANTES: la dieta hipoproteica era la respuesta clásica. HOY: según la ESPEN no se restringen las proteínas, porque empeora la sarcopenia y el amoniaco. La dieta indicada es hiperproteica e hipercalórica (sin sal si hay ascitis). Una dieta hipersódica o hipocalórica nunca ha estado indicada.","st":"O","a":2},{"id":87,"ex":"Andalucía TL · 2016","org":"Andalucía","y":2016,"s":"ostom","t":"ostomias","q":"En los cuidados a pacientes con colostomías hay que tener presente que:","o":["Se debe dar una alimentación variada.","Restringir el uso de alimentos como: cebollas, guisantes, nueces, coco.","El yogur y la mantequilla ayudan a eliminar el mal olor y las heces fluidas.","Todas son recomendaciones apropiadas."],"e":"En el colostomizado se aconseja una dieta variada, introduciendo los alimentos poco a poco. Se limitan los flatulentos o de difícil digestión (cebolla, legumbres, coles, frutos secos, coco) y se aprovechan los que reducen el olor y espesan las heces (yogur, mantequilla, perejil).","a":3,"ns":1},{"id":88,"ex":"Cantabria · 2017","org":"Cantabria","y":2017,"s":"intestino","t":"ccr","q":"¿En qué año se implanta el programa de cribado de cáncer de colon en la Comunidad Autónoma de Cantabria?","o":["2006.","2008.","2010.","2012."],"e":"Es un dato autonómico (Cantabria inició el programa en 2008 según la clave). Lo que debes dominar para cualquier OPE: población diana de 50-69 años (ampliándose a 74), test inmunoquímico fecal (FIT) bienal y colonoscopia si es positivo.","a":1,"f":"Dato de calendario autonómico: poco valor didáctico fuera de Cantabria."},{"id":89,"ex":"Cantabria · 2017","org":"Cantabria","y":2017,"s":"boca","t":"bucal","q":"La enfermera, para fomentar la salud bucodental, debe informar a la población con los siguientes:","o":["Es recomendable cambiar el cepillo de dientes una vez al año.","La pasta de dientes tiene que contener flúor.","Hay que iniciar el cepillado cuando salgan los primeros dientes incisivos.","Los cepillos eléctricos son igual de recomendables que los manuales."],"e":"El cepillo de dientes debe cambiarse cada 3 meses o cuando las cerdas estén deformadas, no una vez al año: esa es la afirmación errónea. Sí son correctas la pasta fluorada, la higiene desde la erupción del primer diente y que el cepillo eléctrico es tan válido como el manual si se usa bien.","a":0,"f":"El enunciado parece incompleto: la clave señala la afirmación FALSA, como si la pregunta pidiera la incorrecta."},{"id":90,"ex":"Cantabria · 2017","org":"Cantabria","y":2017,"s":"sondas","t":"sondas_tipos","q":"Se le ha colocado a un niño una SNG (sonda nasogástrica) de silicona. Señale la respuesta incorrecta sobre este tipo de sondas:","o":["No se endurece en presencia de jugos digestivos.","Es un material biocompatible y no tóxico.","Requiere recambio mensual.","Son bien toleradas por el niño porque no irritan el tramo nasofaríngeo."],"e":"Las sondas de silicona son biocompatibles, blandas y no se endurecen con los jugos digestivos, por eso se toleran bien y duran meses. El recambio frecuente es propio de las de PVC. La afirmación incorrecta es que requieren recambio mensual.","a":2},{"id":91,"ex":"Cantabria · 2017","org":"Cantabria","y":2017,"s":"sondas","t":"sng","q":"¿En qué posición se debe poner a un paciente para colocarle una sonda nasogástrica?","o":["Posición de Sims.","Posición de Fowler.","Decúbito lateral derecho.","Decúbito lateral izquierdo."],"e":"Para colocar una SNG, el paciente debe estar en Fowler (sentado, cabecero a 45° o más) con el cuello ligeramente flexionado: facilita el paso al esófago y reduce el riesgo de aspiración. En niños pequeños o en inconscientes se prefiere la posición de Sims.","tr":"posiciones","a":1,"po":["Sims solo en inconscientes o niños pequeños.","","El decúbito lateral derecho no facilita la inserción.","El decúbito lateral izquierdo es para el enema o el lavado gástrico, no para colocar la SNG."]},{"id":92,"ex":"Cantabria · 2017","org":"Cantabria","y":2017,"s":"intestino","t":"eii","q":"La enfermedad de Crohn suele afectar particularmente:","o":["Al yeyuno.","Al apéndice.","Al íleon.","Al páncreas."],"e":"La enfermedad de Crohn puede afectar a cualquier tramo, de la boca al ano, pero predomina en el ÍLEON terminal y el colon derecho, con afectación segmentaria («en parches») y transmural. Las fístulas y la afectación perianal son características.","a":2},{"id":93,"ex":"Cantabria · 2017","org":"Cantabria","y":2017,"s":"valor","t":"eliminacion","q":"Dentro de los cuidados a un paciente que se le ha realizado un tránsito baritado (papilla de bario) para el estudio del esófago, no se encuentra:","o":["Vigilar la aparición de diarrea producida por la irritación del bario.","Vigilar la distensión abdominal.","Vigilar que las heces vuelvan a ser de color marrón normal.","Vigilar la aparición o disminución de ruidos intestinales."],"e":"El bario no irrita: tiende a ESTREÑIR y deja las heces blanquecinas. Tras el tránsito baritado se recomiendan abundantes líquidos, vigilar que las heces recuperen el color normal y controlar la distensión y los ruidos intestinales (riesgo de impactación). Vigilar la «diarrea por irritación» no forma parte de los cuidados.","a":0},{"id":94,"ex":"La Rioja · 2017","org":"La Rioja","y":2017,"s":"agudo","t":"apendic","q":"La complicación más grave de la apendicitis es:","o":["Absceso intraabdominal.","Pileflebitis.","Oclusión intestinal.","Peritonitis difusa aguda."],"e":"La complicación más grave de la apendicitis es la peritonitis difusa por perforación del apéndice, con riesgo de shock séptico. La complicación más FRECUENTE es la infección de la herida quirúrgica. El absceso y la pileflebitis son posibles, pero menos graves o más raras.","a":3},{"id":95,"ex":"La Rioja · 2017","org":"La Rioja","y":2017,"s":"boca","t":"erge","q":"La enfermedad por reflujo gastroesofágico (ERGE) puede desembocar en una metaplasia conocida como:","o":["Acalasia.","Esófago de Barrett.","Mallory-Weiss.","Enfermedad de Chagas."],"e":"El esófago de Barrett es una metaplasia: el epitelio escamoso del esófago distal se sustituye por epitelio cilíndrico de tipo intestinal por la agresión ácida crónica. Es una lesión premaligna (adenocarcinoma de esófago). La acalasia es un trastorno motor y el Mallory-Weiss, un desgarro por vómitos.","a":1},{"id":96,"ex":"La Rioja · 2017","org":"La Rioja","y":2017,"s":"valor","t":"hemorragia","q":"Ante una sospecha de hemorragia digestiva aguda (HDA), haremos la siguiente prueba para su confirmación. Señala la correcta:","o":["Determinación de sangre en heces mediante tira reactiva.","Reacción de las heces con agua oxigenada.","Detección de sangre en aspirado nasogástrico con tira reactiva.","Ninguna es correcta."],"e":"Ninguna de las pruebas propuestas confirma una HDA: las tiras reactivas en heces o en el aspirado y el agua oxigenada dan falsos positivos y negativos. El diagnóstico, que además permite tratar el punto sangrante, es la endoscopia digestiva alta, una vez estabilizado el paciente.","a":3,"ns":1},{"id":97,"ex":"Extremadura · 2017","org":"Extremadura","y":2017,"s":"ostom","t":"ostomias","q":"A un paciente al que se le ha practicado una ostomía de eliminación podremos recomendarle ciertos alimentos que harán disminuir el olor de sus heces. Señale cuál de los siguientes es uno de ellos:","o":["Mantequilla.","Espárragos.","Huevos.","Carne de cerdo."],"e":"Entre los alimentos que reducen el olor de las heces están el yogur, la mantequilla, el queso fresco, el perejil y el zumo de limón. Los espárragos, los huevos, las coles, la cebolla, el ajo y el pescado azul AUMENTAN el olor.","a":0},{"id":98,"ex":"Extremadura · 2017","org":"Extremadura","y":2017,"s":"valor","t":"hemorragia","q":"Ante un paciente con hemorragia digestiva alta no varicosa tendremos en cuenta ciertas recomendaciones para el manejo y estabilización de su situación. Señale la respuesta incorrecta:","o":["Canalizaremos al menos dos accesos venosos de grueso calibre para una infusión rápida de líquidos.","No será necesaria la transfusión de unidades de concentrado de hematíes para reponer la volemia.","La volemia será repuesta en exceso para evitar la recidiva hemorrágica.","La volemia será repuesta con cristaloides o coloides a un ritmo adecuado para evitar la hipoperfusión."],"e":"En la HDA no varicosa la volemia se repone con cautela: reponer en exceso aumenta la presión venosa y favorece que la lesión vuelva a sangrar. Se canalizan dos vías gruesas, se infunden cristaloides a ritmo adecuado y se transfunde con criterio restrictivo cuando la hemoglobina es < 7 g/dl.","a":2,"f":"La opción 2 también es discutible: la transfusión SÍ puede ser necesaria (estrategia restrictiva, con Hb < 7 g/dl)."},{"id":99,"ex":"Extremadura · 2017","org":"Extremadura","y":2017,"s":"anat","t":"dumping","q":"Judit es una niña que está ingresada en la unidad de rehabilitación intestinal porque tiene un fracaso intestinal por una resección duodenal. Indique cuál de los siguientes signos puede presentar:","o":["Diarrea osmótica severa.","Malabsorción de hierro.","Sobrecrecimiento bacteriano.","Déficit de vitamina B12."],"e":"El duodeno es el lugar principal de absorción del hierro (y del calcio). Si se reseca, la consecuencia característica es la ferropenia. La B12 se absorbe en el íleon y el sobrecrecimiento bacteriano no es un efecto específico de la resección duodenal.","tr":"b12","a":1,"po":["La diarrea osmótica grave es propia de resecciones extensas del delgado, no del duodeno.","","El sobrecrecimiento bacteriano no es específico de la resección duodenal.","La B12 se absorbe en el íleon terminal, no en el duodeno."]},{"id":100,"ex":"Murcia · 2018","org":"Murcia","y":2018,"s":"valor","t":"ccr","q":"Un paciente que presenta unas heces de un color negro, de consistencia pegajosa y con mal olor, se denomina:","o":["Melenas.","Sangre oculta en heces.","Vómitos.","Hematoquecia."],"e":"Melena: heces negras, brillantes, pegajosas («alquitranadas») y malolientes por sangre digerida. Suele indicar un origen alto (por encima del ángulo de Treitz). La hematoquecia es sangre roja mezclada con las heces.","a":0},{"id":101,"ex":"Murcia · 2018","org":"Murcia","y":2018,"s":"sondas","t":"lavado","q":"Si queremos realizar un lavado gástrico, en caso de intoxicación utilizaremos una SNG de:","o":["Foucher.","Miller-Abbott.","Levin.","Salem."],"e":"En el lavado gástrico por intoxicación se usa una sonda orogástrica de gran calibre y una luz, como la Foucher (o la Ewald), para extraer restos sólidos de fármaco. Miller-Abbott es nasoentérica para descompresión y Levin/Salem son nasogástricas de menor calibre.","tr":"lavado","a":0,"po":["","Miller-Abbott: nasoentérica de descompresión.","Levin: calibre insuficiente para restos de tóxicos.","Salem: de aspiración, no de lavado de tóxicos."]},{"id":102,"ex":"Euskadi · 2018","org":"País Vasco","y":2018,"s":"intestino","t":"ulcera","q":"Dentro de la enfermedad inflamatoria intestinal, señale cuál de las siguientes manifestaciones es la menos frecuente en la enfermedad de Crohn:","o":["Diarrea hemática.","Ulceración perineal.","Insuficiencia nutricional.","Estenosis intestinal."],"e":"La diarrea con sangre es típica de la colitis ulcerosa (afecta siempre al recto y la mucosa es friable). En el Crohn predominan el dolor abdominal, la diarrea sin sangre, la malnutrición, las estenosis y la afectación perianal (fisuras, fístulas, abscesos).","tr":"cucrohn","a":0,"po":["","La ulceración perineal (fístulas, fisuras) es característica del Crohn.","La malnutrición es frecuente en el Crohn por malabsorción.","La estenosis es un patrón típico del Crohn (B2)."]},{"id":103,"ex":"Euskadi · 2018","org":"País Vasco","y":2018,"s":"sondas","t":"sng_verif","q":"Centrándose en el procedimiento de inserción de una sonda nasogástrica, ¿Cuál de los siguientes métodos, para comprobar su correcta colocación, es el más fiable y el que debería realizar?","o":["Auscultación de la insuflación de aire a través de la sonda.","Observación de síntomas respiratorios, como tos e incapacidad para hablar.","Colocación del extremo de la sonda en agua, para detectar la salida de burbujas de aire.","Método de determinación del pH gástrico."],"e":"A pie de cama, el método más fiable es aspirar contenido y medir el pH: un pH ≤ 4 indica posición gástrica (con IBP puede ser menos ácido). El método de referencia es la radiografía. La auscultación de aire, la observación de tos o las burbujas en agua NO son fiables.","tr":"verificacion","a":3,"po":["La auscultación no es fiable.","La ausencia de tos no descarta una sonda en la vía aérea (sobre todo con bajo nivel de conciencia).","Las burbujas en agua no son un método fiable.",""]},{"id":104,"ex":"Euskadi · 2018","org":"País Vasco","y":2018,"s":"higado","t":"encefalo","q":"Indique cuál de las siguientes complicaciones no es característica en una cirrosis con hipertensión portal:","o":["Hidronefrosis.","Ascitis.","Encefalopatía.","Hemorragias."],"e":"La hipertensión portal produce ascitis, varices con hemorragia, esplenomegalia y contribuye a la encefalopatía. La hidronefrosis (dilatación de la vía urinaria por obstrucción) no es una complicación de la cirrosis; el riñón se afecta como síndrome hepatorrenal.","a":0},{"id":105,"ex":"Andalucía · 2018","org":"Andalucía","y":2018,"s":"boca","t":"ulcera","q":"CASO II: Juan de 74 años que vive con María su mujer de 72 años (cuidadora principal), 2 hijas que viven fuera de Andalucía y no tiene ayuda de cuidadores formales. Vive en una casa de dos alturas, con dormitorio y salón en diferente\nplanta. Enfermedad de Alzheimer desde hace 4 años, Diabetes Mellitus tipo 2 e hipertensión arterial desde hace 15 años. Camina por la casa solo con marcha insegura acompañado por su mujer. No utiliza dispositivos de ayuda para desplazarse. Come a veces solo, alimentación triturada con escaso contenido proteico y rico en hidratos de carbono de absorción rápida. Toma líquidos escasos cuando le obligan. IMC (Índice de Masa Corporal) de 18. Dependencia para higiene personal y vestirse, con incontinencia urinaria total, interrupciones del sueño frecuentes, con alguna crisis de agitación esporádica nocturna. Tratamiento farmacológico: Metformina, Glicazida, Lorazepam, rivastigmina, memantina 20 mg y enalapril 10 mg. Hace 10 días ingresó en hospital por fiebre y disnea, diagnosticado de neumonía de posible causa aspirativa. Al alta presenta dificultad para la deambulación con marcha inestable y falta de fuerza para la bipedestación, con gran agitación por las noches, UPP (úlceras por presión) grado 1 en ambos talones por fricción. Continúa con el tratamiento farmacológico anterior más tratamiento antibiótico y Haloperidol gotas, protección de talones y agentes espesantes para la toma de líquidos. Al alta en la visita domiciliaria la cuidadora refiere que esta noche ha estado muy agitado y con sueño interrumpido, teniendo que permanecer a su lado toda la noche. El paciente ahora, está encamado, porque no pueden levantarlo al sillón, le ha dado de comer en la cama, refiere que sigue tosiendo después de tragar el agua, todavía no ha usado el espesante, se comprueba que no puede tragar el tratamiento oral en pastillas. La mujer afirma que tiene dificultad para manejar la nueva situación de salud de su marido, quiere seguir cuidándolo y está muy preocupada por los nuevos cuidados que necesita.\nPregunta: ¿Cuál de las siguientes intervenciones no sería correcta si durante el ingreso se ha detectado un deterioro de la deglución?","o":["Aconsejar a la cuidadora el uso de pajitas para la deglución de líquidos.","Utilizar agentes espesantes.","Ayudar al paciente a colocar la cabeza flexionada hacia delante, en preparación para la deglución.","Evitar líquidos."],"e":"En la disfagia se desaconsejan pajitas y jeringas: dan menos control del bolo y aumentan el riesgo de aspiración. Se usan espesantes, el paciente se sienta erguido, flexiona el cuello hacia delante al tragar (protege la vía aérea) y se evitan los líquidos finos sin espesar.","tr":"disfagia","a":0,"po":["","Es correcto: los espesantes reducen la aspiración.","Es correcto: la flexión cervical protege la vía aérea.","Según la clave es aceptable evitar los líquidos FINOS; lo incorrecto son las pajitas."]},{"id":106,"ex":"Andalucía · 2018","org":"Andalucía","y":2018,"s":"boca","t":"ostomias","q":"¿Cuándo utilizaría espesantes o bebidas de textura modificada para la hidratación del paciente?","o":["Cuando el paciente tiene estreñimiento.","Cuando el paciente tiene disfagia.","Cuando el paciente tiene una colostomía.","Cuando el paciente no puede utilizar la prótesis dental."],"e":"Los espesantes y las texturas modificadas (néctar, miel, pudin, según la IDDSI) se usan en la disfagia orofaríngea: el líquido espeso avanza más despacio y permite cerrar la vía aérea a tiempo, reduciendo la broncoaspiración. El volumen y la viscosidad adecuados se determinan con el MECV-V.","tr":"disfagia","a":1,"po":["El estreñimiento se trata con fibra y líquidos, no con espesantes.","","La colostomía no requiere texturas modificadas.","Sin prótesis se adaptan los sólidos (purés), no se espesan los líquidos."]},{"id":107,"ex":"Andalucía · 2018","org":"Andalucía","y":2018,"s":"boca","t":"disfagia","q":"¿Qué indicador no estaría relacionado con la valoración de la deglución?","o":["Glucemia superior a 270 mg/dl.","Tos tras la deglución.","Mantiene la comida en la boca.","Controla las secreciones orales."],"e":"Los indicadores de deglución valoran la seguridad y la eficacia: tos o cambios de voz tras tragar, retención de comida en la boca, manejo de las secreciones o sellado labial. Una glucemia elevada es un dato metabólico, no un indicador de deglución.","a":0},{"id":108,"ex":"Castilla - La Mancha · 2018","org":"Castilla-La Mancha","y":2018,"s":"valor","t":"cirrosis","q":"La causa más frecuente de hemorragia digestiva alta es:","o":["Gastritis.","Úlcera Péptica.","Varices esofágicas.","Gastropatía portal hipertensiva."],"e":"La úlcera péptica (sobre todo la duodenal) es la primera causa de HDA (más del 50%). Le siguen las varices esofagogástricas (en cirróticos), las lesiones agudas de la mucosa y el síndrome de Mallory-Weiss.","a":1},{"id":109,"ex":"Castilla - La Mancha · 2018","org":"Castilla-La Mancha","y":2018,"s":"sondas","t":"enemas","q":"Señale la respuesta correcta en relación con la técnica de extracción manual de fecalomas:","o":["La mayoría de los fecalomas se localizan en el colon sigmoideo.","El paciente se colocará en decúbito lateral izquierdo, flexionando ligeramente la rodilla derecha.","Para romper el fecaloma se realizarán movimientos de rotación con el dedo índice.","Se extraerá el fecaloma en una única sesión, independiente de su tamaño."],"e":"Para extraer un fecaloma se introduce el dedo enguantado y lubricado y se fragmenta la masa con movimientos suaves de rotación, sin forzar. La mayoría están en la ampolla RECTAL (no en el sigma), se extraen en varias sesiones con pausas y se vigila la respuesta vagal (bradicardia).","a":2},{"id":110,"ex":"Castilla - La Mancha · 2018","org":"Castilla-La Mancha","y":2018,"s":"intestino","t":"ccr","q":"Señale que grupo de edad constituye la población diana en el programa de prevención de cáncer colorrectal en Castilla-La Mancha:","o":["Entre 60 y 75 años.","Entre 40 y 70 años.","Entre 50 y 69 años.","Entre 55 y 80 años."],"e":"La población diana del cribado poblacional de cáncer colorrectal en España es de 50 a 69 años (ampliándose progresivamente a 74), con test inmunoquímico fecal (FIT) cada 2 años y colonoscopia si es positivo.","a":2},{"id":111,"ex":"Comunitat Valenciana · 2018","org":"C. Valenciana","y":2018,"s":"ostom","t":"ostomias","q":"Todas las ostomías que se citan a continuación son de eliminación, excepto una, que es de alimentación, ¿cuál?","o":["Ileostomía.","Yeyunostomía.","Colostomía.","Ureterostomía."],"e":"La yeyunostomía es una ostomía de ALIMENTACIÓN (la sonda llega al yeyuno para la nutrición enteral). Ileostomía y colostomía son de eliminación digestiva y la ureterostomía, de eliminación urinaria.","tr":"alimentacion","a":1,"po":["La ileostomía es de eliminación.","","La colostomía es de eliminación.","La ureterostomía es de eliminación urinaria."]},{"id":112,"ex":"Navarra · 2018","org":"Navarra","y":2018,"s":"intestino","t":"eii","q":"Indique cuál de las siguientes afirmaciones es correcta sobre la colitis ulcerosa:","o":["Es un trastorno inflamatorio intestinal crónico que afecta a la mucosa y a la submucosa del colon y el recto.","Las manifestaciones más predominantes son la diarrea, la rectorragia y el dolor abdominal.","La inflamación rectal causa impulso fecal y tenesmo intermitente.","Todas las respuestas son correctas."],"e":"Todas son ciertas: la colitis ulcerosa es una inflamación crónica de la mucosa y submucosa del colon y el recto, continua desde el recto; produce diarrea con sangre (rectorragia) y dolor, y la afectación rectal causa urgencia y tenesmo.","a":3,"ns":1},{"id":113,"ex":"Navarra · 2018","org":"Navarra","y":2018,"s":"estom","t":"ulcera","q":"El síndrome de Zollinger-Ellison es la úlcera péptica causada por un:","o":["Glucagonoma.","Gastrinoma.","Insulinoma.","Vipoma."],"e":"El síndrome de Zollinger-Ellison se debe a un gastrinoma (tumor productor de gastrina, a menudo pancreático o duodenal). El exceso de gastrina provoca hipersecreción ácida y úlceras múltiples, recurrentes o de localización atípica.","a":1},{"id":115,"ex":"Aragón · 2018","org":"Aragón","y":2018,"s":"agudo","t":"obstruccion","q":"¿Cuál de las siguientes áreas del aparato gastro-intestinal está en especial riesgo de sufrir isquemia?","o":["El duodeno.","El recto.","La flexión esplénica.","El estómago."],"e":"El ángulo esplénico del colon es una zona «frontera» entre la mesentérica superior y la inferior (punto de Griffiths), con irrigación más pobre, por lo que es especialmente vulnerable a la isquemia (colitis isquémica). El estómago y el duodeno tienen una irrigación muy rica.","a":2},{"id":116,"ex":"Aragón - Llamamiento excepcional · 2018","org":"Aragón","y":2018,"s":"sondas","t":"lavado","q":"La sonda más adecuada para realizar un lavado gástrico es:","o":["Sonda de Salem.","Sonda de Sengstaken-Blakemore.","Sonda de Foley.","Sonda de Levin."],"e":"Entre las opciones, la Levin (una luz, varios orificios distales) es la indicada para lavados y recogida de muestras. La Salem se usa para drenaje o descompresión con aspiración, la Sengstaken para comprimir varices y la Foley es vesical. Con tóxicos sólidos se prefieren sondas orogástricas gruesas (Foucher/Ewald).","tr":"lavado","a":3,"po":["La Salem se usa sobre todo para aspiración o descompresión.","La Sengstaken comprime varices: no es para lavar.","La Foley es vesical.",""]},{"id":117,"ex":"Aragón - Llamamiento excepcional · 2018","org":"Aragón","y":2018,"s":"sondas","t":"lavado","q":"En relación a los cuidados del paciente al que hay que realizar un lavado gástrico, es FALSO que:","o":["Los objetivos de la descontaminación gastrointestinal son: eliminar el tóxico, favorecer la adsorción por otras sustancias, reducir la absorción y facilitar la eliminación.","El carbón activado es el tratamiento de primera elección para la descontaminación digestiva en pacientes con intoxicación por medicamentos, por delante de otros procedimientos como el lavado gástrico, la sonda nasogástrica o la inducción del vómito.","Si se dispone de un antídoto para el tóxico es necesario el uso del carbón activado ya que éste aumentaría su utilidad.","El mecanismo de acción es la absorción continuada de la droga en el todo el tubo gastrointestinal, evacuándose con las heces los complejos carbón-toxina."],"e":"El carbón activado adsorbe muchos tóxicos y es la primera opción de descontaminación. Pero si existe un antídoto oral, el carbón puede adsorberlo y anular su efecto, por lo que no está indicado combinarlos. Por eso es falsa la afirmación de que el carbón «aumentaría su utilidad».","a":2},{"id":118,"ex":"La Rioja · 2018","org":"La Rioja","y":2018,"s":"bilipan","t":"pancreas","q":"El dolor en un enfermo con pancreatitis suele situarse:","o":["Retroesternal, puede irradiar al dorso.","Epigástrico, puede irradiar al dorso, especialmente en la zona subescapular derecha.","Epigástrico, puede irradiar al dorso o a la zona lumbar izquierda.","Hipogástrico, cuadrante inferior izquierdo o derecho."],"e":"El dolor pancreático es epigástrico, continuo e intenso, irradiado «en cinturón» a la espalda y a la zona lumbar o hipocondrio izquierdo. Mejora inclinando el tronco hacia delante. Si irradia a la zona subescapular derecha orienta a patología biliar.","a":2},{"id":119,"ex":"La Rioja · 2018","org":"La Rioja","y":2018,"s":"ostom","t":"heces_ostomia","q":"Respecto a las ostomías digestivas: ¿qué afirmación es la correcta?","o":["Según su localización podemos clasificarlas como colostomías de descompresión o colostomías de protección.","No todos los tipos de colostomías podrán ser permanentes o temporales, cada una tiene su indicación.","La cecostomía es la ostomía de la porción inicial del colon ascendente y las deposiciones serán líquidas.","Para el cuidado del estoma y la piel circundante, se lava con agua templada y jabón neutro y se aplicara un desinfectante acuoso para evitar la infección."],"e":"La cecostomía aboca el ciego, la porción inicial del intestino grueso, por eso las deposiciones son líquidas y muy irritantes. La opción d es falsa: el estoma se lava con agua y jabón neutro, sin desinfectantes. Las colostomías se clasifican por su localización (ascendente, transversa...) y por su duración (temporales o permanentes).","tr":"distal","a":2,"ns":1,"po":["Descompresión y protección son clasificaciones por FINALIDAD, no por localización.","Falso: cualquier colostomía puede ser temporal o permanente.","","Falso: no se aplican desinfectantes sobre el estoma."]},{"id":120,"ex":"La Rioja · 2019","org":"La Rioja","y":2019,"s":"boca","t":"bucal","q":"Índices de caries en dentición temporal más utilizadas. El promedio de dientes cariados y obturados por caries, es el índice:","o":["Índice Ceod.","Índice Ceos.","Índice Cod.","Índice Cos."],"e":"En la dentición temporal, el índice cod suma dientes cariados (c) y obturados (o) y lo divide entre los individuos estudiados. No cuenta los ausentes porque pueden haberse perdido por exfoliación fisiológica. En la dentición permanente se usa el CAOD.","a":2},{"id":121,"ex":"La Rioja · 2019","org":"La Rioja","y":2019,"s":"valor","t":"valoracion","q":"Características del vómito central:","o":["Se produce al adoptar determinada posición.","Variable, repetitivo, nunca es de iguales características.","Con esfuerzo precedido de nauseas con arcadas.","Sin esfuerzo no va precedido de nauseas."],"e":"El vómito central (por estimulación directa del centro del vómito: hipertensión intracraneal, fármacos...) aparece de forma brusca, sin esfuerzo y sin náuseas previas: es el vómito «en escopetazo». El vómito de origen digestivo suele ir precedido de náuseas, arcadas y cortejo vegetativo.","a":3},{"id":122,"ex":"La Rioja · 2019","org":"La Rioja","y":2019,"s":"intestino","t":"eii","q":"Cuál es estas afirmaciones, en relación a la colitis ulcerosa, es cierta:","o":["Implica inflamación transmural de la pared intestinal.","Puede afectar a cualquier segmento del tubo digestivo desde la boca hasta el ano.","Una complicación rara pero muy grave es el megacolon tóxico.","También se le puede llamar enteritis regional."],"e":"El megacolon tóxico (colon transverso dilatado > 6 cm con toxicidad sistémica) es una complicación rara pero muy grave, más frecuente en la colitis ulcerosa. La afectación transmural, de boca a ano, y el nombre de «enteritis regional» corresponden a la enfermedad de Crohn.","tr":"cucrohn","a":2,"po":["Transmural = Crohn.","De boca a ano = Crohn.","","«Enteritis regional» es el Crohn."]},{"id":123,"ex":"Aragón · 2019","org":"Aragón","y":2019,"s":"agudo","t":"erge","q":"¿Cuál de las siguientes patologías NO se relaciona con un cuadro de abdomen agudo?","o":["Apendicitis aguda.","Perforación de un divertículo de Meckel.","Reflujo gastroduodenal.","Rotura de aneurisma de aorta abdominal."],"e":"El abdomen agudo es un dolor abdominal agudo que precisa diagnóstico y tratamiento rápidos: inflamatorio (apendicitis), perforativo (divertículo de Meckel perforado) o vascular (rotura de aneurisma aórtico). El reflujo gastroduodenal produce síntomas dispépticos, no abdomen agudo.","a":2},{"id":124,"ex":"Aragón · 2019","org":"Aragón","y":2019,"s":"higado","t":"sng","q":"En la encefalopatía hepática, el objetivo terapéutico es combatir los factores desencadenantes. Indique cuál NO es una medida general de soporte:","o":["Colocar una sonda nasogástrica para administrar terapias orales en pacientes que no pueden tragar o con riesgo de aspiración.","Hidratación óptima. La administración de líquidos no salinos en gran cantidad debe realizarse con cautela para evitar la inducción de hiponatremia, particularmente en pacientes con cirrosis avanzada.","Corregir las alteraciones iónicas y ácido-base. En casos de hiponatremia grave debe corregirse lentamente.","Indicar dieta astringente para favorecer el estreñimiento."],"e":"En la encefalopatía hepática hay que EVITAR el estreñimiento: las bacterias del colon producen amoniaco y cuanto más tiempo permanecen las heces, más se absorbe. Por eso se usan lactulosa o lactitol para lograr 2-3 deposiciones blandas al día; una dieta astringente sería contraproducente.","tr":"encefalo","a":3,"po":["Es correcto: la SNG permite dar lactulosa si no traga.","Es correcto: hidratar con cautela por la hiponatremia.","Es correcto: corregir lentamente los iones.",""]},{"id":125,"ex":"Asturias · 2019","org":"Asturias","y":2019,"s":"intestino","t":"ccr","q":"La población diana incluida en el Programa de Detección Precoz de Cáncer Colorrectal es la comprendida:","o":["Entre 55 y 69 años.","Entre 50 y 69 años.","Entre 50 y 65 años.","Todas las opciones son falsas."],"e":"La población diana del programa de detección precoz de cáncer colorrectal es de 50 a 69 años (con ampliación progresiva hasta 74). Se invita a hombres y mujeres sin factores de riesgo a un FIT cada 2 años.","a":1,"ns":1},{"id":126,"ex":"Asturias · 2019","org":"Asturias","y":2019,"s":"ostom","t":"irrigacion","q":"¿En qué tipo de colostomías está indicado el uso de una irrigación?","o":["Colostomías terminales sigmoideas.","Colostomías con prolapso.","Ileostomías.","Colostomías ascendentes."],"e":"La irrigación se indica en colostomías terminales descendentes o sigmoideas, con heces formes y tránsito regular. Está contraindicada si hay prolapso, hernia o estenosis, en las ileostomías y en las colostomías ascendentes (efluente líquido).","a":0},{"id":127,"ex":"Canarias · 2019","org":"Canarias","y":2019,"s":"sondas","t":"sondas_tipos","q":"¿Qué medida considera adecuada para la prevención de la aspiración en un paciente con alimentación por sonda nasogástrica?","o":["Colocar al paciente en posición Semi-Fowler.","Colocar al paciente en posición Trendelenburg.","Utilizar solo alimentos a temperatura corporal.","Administrar solamente a pacientes portadores de Sonda de Linton."],"e":"Para prevenir la aspiración, el paciente con nutrición por sonda debe estar semiincorporado (semi-Fowler, 30-45°) durante la administración y al menos 30-60 minutos después. Trendelenburg aumenta el riesgo de reflujo; la temperatura del preparado no previene la aspiración.","tr":"posiciones","a":0,"po":["","El Trendelenburg favorece el reflujo y la aspiración.","La temperatura del preparado no previene la aspiración.","La Linton es una sonda de taponamiento, no de nutrición."]},{"id":128,"ex":"Canarias · 2019","org":"Canarias","y":2019,"s":"agudo","t":"sng","q":"Una obstrucción intestinal puede deberse a:","o":["Beber demasiada agua.","Una sonda nasogástrica.","Adherencias abdominales.","Toma de exceso de fibra en la dieta."],"e":"Las adherencias (bridas) postquirúrgicas son la primera causa de obstrucción del intestino delgado en pacientes ya operados; en los no operados, lo son las hernias. En el intestino grueso la causa más frecuente es el cáncer colorrectal.","a":2},{"id":129,"ex":"Canarias · 2019","org":"Canarias","y":2019,"s":"agudo","t":"sng","q":"Un paciente ha desarrollado íleo paralítico tras ser sometido a cirugía recientemente. ¿Cuál es la consideración de enfermería más importante al respecto?","o":["Asegurar la funcionalidad de la SNG.","Controlar ruidos intestinales cada hora.","Asegurarse que puede tomar una dieta líquida.","Mantener al paciente en reposo en cama estricto."],"e":"En el íleo paralítico postoperatorio lo prioritario es descomprimir: dieta absoluta y SNG permeable y funcionante para aspirar gases y secreciones, aliviar la distensión y evitar vómitos y aspiración. Se promueve la movilización precoz (no el reposo absoluto) y no se inicia la dieta hasta que vuelve el peristaltismo.","a":0},{"id":131,"ex":"Andalucía · 2019","org":"Andalucía","y":2019,"s":"valor","t":"obstruccion","q":"Uno de los signos que puede aparecer en el postoperatorio es el timpanismo, cuyo significado es:","o":["Paralización del peristaltismo intestinal.","Perforación timpánica por aumento de la presión.","Retención de gases en el intestino.","Dolor abdominal intenso."],"e":"El timpanismo es el sonido hueco y agudo a la percusión que indica aire o gas acumulado en el intestino (distensión por gases), frecuente en el postoperatorio por la disminución del peristaltismo. La matidez, en cambio, indica estructuras macizas o líquido.","a":2},{"id":132,"ex":"Andalucía · 2019","org":"Andalucía","y":2019,"s":"intestino","t":"ccr","q":"La semana pasada María recibió una carta para el cribado de cáncer de colon en su centro de salud; el motivo es:","o":["Tiene 61 años y reciben la carta todos los andaluces entre 55-75 años.","Ha tenido una hermana que ha fallecido hace unos años por cáncer de colon.","Se hacen el cribado todos los andaluces incluidos en la BDU con más de 60 años y alguna enfermedad crónica.","Están incluidos todos los hombres y mujeres con edad entre 50-69 años."],"e":"El cribado poblacional de cáncer colorrectal invita a todos los hombres y mujeres de 50 a 69 años sin factores de riesgo (se amplía progresivamente a 74). Tener una hermana fallecida por CCR la situaría en el grupo de RIESGO ELEVADO, que se sigue con colonoscopia, no con la carta del cribado.","a":3},{"id":133,"ex":"Andalucía · 2019","org":"Andalucía","y":2019,"s":"ostom","t":"heces_ostomia","q":"Señala la respuesta incorrecta en relación a los cuidados a pacientes con colostomía:","o":["Se debe dar una alimentación variada.","El zumo de naranja y el yogur ayudan a controlar los olores.","La cafeína y el chocolate ayudan a espesar las heces.","Los champiñones, el coco y los frutos secos pueden producir obstrucción intestinal."],"e":"La cafeína y el chocolate NO espesan las heces: estimulan el peristaltismo y pueden aumentar el débito. Para espesar se usan arroz, pasta, patata, plátano o zanahoria cocida. Champiñones, coco y frutos secos pueden obstruir el estoma si no se mastican bien.","a":2},{"id":134,"ex":"Castilla y León · 2019","org":"Castilla y León","y":2019,"s":"bilipan","t":"biliar","q":"La colecistitis aguda se caracteriza por la inflamación aguda de la vesícula biliar producida generalmente por:","o":["Cálculos biliares.","Traumatismos internos.","Hemorragia interna.","Obstrucción intestinal."],"e":"La mayoría de las colecistitis agudas (90-95%) son litiásicas: un cálculo obstruye el conducto cístico y la vesícula se inflama. Las colecistitis alitiásicas (en pacientes críticos, con ayuno prolongado o nutrición parenteral) son menos frecuentes, pero más graves.","a":0},{"id":135,"ex":"Castilla y León · 2019","org":"Castilla y León","y":2019,"s":"agudo","t":"biliar","q":"Cuando hablamos de un proceso patológico intraabdominal, de reciente inicio, que cursa con dolor, repercusión sistémica y requiere un rápido diagnóstico y tratamiento, estamos hablando de:","o":["Diarrea.","Gastritis.","Abdomen agudo.","Colecistitis."],"e":"Esa es la definición de abdomen agudo: un proceso intraabdominal de inicio reciente, con dolor como síntoma principal y repercusión sistémica, que requiere diagnóstico y tratamiento rápidos (a menudo quirúrgicos). La colecistitis puede ser una de sus causas, pero no es la definición.","a":2},{"id":136,"ex":"Cataluña B · 2019","org":"Cataluña","y":2019,"s":"ostom","t":"peg","q":"Respecto al procedimiento de la sonda de gastrostomía endoscópica percutánea (PEG), señala la respuesta CORRECTA:","o":["Hay que girar cada día la sonda 180º en el sentido de las agujas del reloj.","Al colocar la sonda, hay que introducirla en ángulo de 30º respecto al abdomen de la persona.","Si hay supuración a nivel del orificio de entrada de la sonda, hay que retirarla.","Al finalizar la administración de la alimentación por la PEG, hay que poner la persona en decúbito supino inmediatamente."],"e":"La sonda de PEG debe girarse a diario (una vez cicatrizado el trayecto) para evitar adherencias y el síndrome de enterramiento del disco interno («buried bumper»). Si supura, se cura y se valora una infección, no se retira sin más. Después de alimentar, el cabecero se mantiene elevado al menos 30 minutos.","a":0},{"id":137,"ex":"Cataluña B · 2019","org":"Cataluña","y":2019,"s":"anat","t":"anatomia","q":"Respecto a las secreciones pancreáticas que intervienen en el proceso de digestión, ¿cuál de estas afirmaciones es FALSA?","o":["La lipasa es una enzima que participa en la digestión de las grasas.","Las secreciones pancreáticas tienen un pH ácido.","La tripsina es una enzima que participa en la digestión de las proteínas.","Las secreciones intestinales almacenan aproximadamente un litro al día del jugo pancreático."],"e":"El jugo pancreático es ALCALINO: es rico en bicarbonato sódico, que neutraliza el quimo ácido que llega del estómago para que las enzimas actúen. Contiene lipasa (grasas), tripsina y quimotripsina (proteínas) y amilasa (hidratos de carbono).","a":1},{"id":138,"ex":"Cataluña B · 2019","org":"Cataluña","y":2019,"s":"higado","t":"cirrosis","q":"Las varices esofágicas se desarrollan en la mayoría de las personas diagnosticadas de cirrosis hepática. ¿Cuál es el mecanismo fisiológico que las provoca?","o":["Venotrombosis hepática.","Anomalías congénitas vasculares de la vena esplénica.","Vasculopatía periférica.","Hipertensión portal."],"e":"En la cirrosis, la fibrosis dificulta el paso de la sangre portal por el hígado y sube la presión en la porta (hipertensión portal). La sangre busca circuitos colaterales hacia la circulación sistémica, que se dilatan: varices esofágicas, gástricas y hemorroidales y circulación colateral abdominal.","a":3},{"id":139,"ex":"Extremadura TL y disc · 2019","org":"Extremadura","y":2019,"s":"anat","t":"anatomia","q":"¿Cuántos esfínteres tiene el esófago?","o":["Uno.","Dos.","Tres.","Ninguno."],"e":"El esófago tiene dos esfínteres: el superior (cricofaríngeo), que evita la entrada de aire al tubo digestivo, y el inferior o cardias, que evita el reflujo del contenido gástrico.","a":1},{"id":140,"ex":"Extremadura TL y disc · 2019","org":"Extremadura","y":2019,"s":"bilipan","t":"biliar","q":"Ante un colangiocarcinoma intrahepático que obstruye el árbol biliar, ¿qué signos y síntomas NO aparecen?","o":["Heces de color blanco.","Pigmentación amarilla de la piel y mucosas.","Dolor en hipocondrio derecho.","Ninguna es correcta."],"e":"Al obstruir el árbol biliar, la bilis no llega al intestino y pasa a la sangre: heces acólicas (blancas), ictericia, coluria, prurito y dolor en hipocondrio derecho. Todas las manifestaciones pueden aparecer, por eso «ninguna es correcta».","a":3,"ns":1},{"id":141,"ex":"Extremadura TL y disc · 2019","org":"Extremadura","y":2019,"s":"ostom","t":"heces_ostomia","q":"Después de realizar una colostomía, ya sea temporal o permanente, la consistencia del material drenado dependerá de la ubicación de la misma. ¿Cómo son las heces en la colostomía sigmoidea?","o":["Sólidas.","Semiblandas.","Blandas.","Líquidas."],"e":"En la colostomía sigmoidea el colon ha absorbido casi toda el agua, por lo que las heces son SÓLIDAS y la evacuación se puede regular (incluso con irrigación). Secuencia: ciego líquidas → ascendente semilíquidas → transverso blandas → descendente semiblandas → sigma sólidas.","tr":"distal","a":0,"po":["","Semiblandas: descendente.","Blandas: transverso.","Líquidas: ciego o ileostomía."]},{"id":142,"ex":"Extremadura TL y disc · 2019","org":"Extremadura","y":2019,"s":"agudo","t":"apendic","q":"En una apendicitis aguda, ¿qué signo clínico NO se da?","o":["Signo de Aarón.","Signo de Cope.","Signo de Dunphy.","Signo de Lasègue."],"e":"Aaron, Cope (psoas y obturador) y Dunphy son signos de apendicitis. El signo de Lasègue (dolor al elevar la pierna extendida) indica irritación radicular lumbosacra, como en la ciática por hernia discal; no es un signo de apendicitis.","a":3},{"id":143,"ex":"Extremadura (2º llamamiento) · 2019","org":"Extremadura","y":2019,"s":"boca","t":"disfagia","q":"En relación al riesgo de aspiración, señala la respuesta incorrecta:","o":["Recordar a los pacientes con demencia que mastiquen y traguen cada bocado.","Valorar los reflejos faríngeos.","En pacientes con hemiplejia, inclinar la cabeza del paciente hacia el lado afectado.","Controlar la ingestión de alimentos. Documentar la consistencia y cantidad de alimento que ingiere el paciente."],"e":"En la hemiplejia, la cabeza se ROTA (gira) hacia el lado afectado, no se inclina: al girarla se cierra el seno piriforme de ese lado y el bolo pasa por el lado sano. También se recuerda a los pacientes con demencia que mastiquen y traguen, se valoran los reflejos y se registra la ingesta.","tr":"disfagia","a":2,"po":["Es correcto: recordar masticar y tragar.","Es correcto: valorar los reflejos.","","Es correcto: documentar la ingesta."]},{"id":144,"ex":"Extremadura (2º llamamiento) · 2019","org":"Extremadura","y":2019,"s":"ostom","t":"heces_ostomia","q":"En relación a la localización de las colostomías su contenido varía, señala la respuesta correcta:","o":["Colostomía derecha o ascendente: Heces semilíquidas e irritantes - eliminación frecuente.","Colostomía transversa a derecha o izquierda del abdomen: Heces ya formadas, no irritantes. Eliminación similar a la expulsión por el ano.","Colostomía izquierda: Heces líquidas e irritantes. Eliminación menos frecuente.","Ninguna es correcta."],"e":"La colostomía ascendente (derecha) produce heces semilíquidas, irritantes y de eliminación frecuente. La transversa produce heces blandas (no formadas) y la izquierda (descendente o sigma), heces semiblandas o sólidas y poco irritantes, al revés de lo que dice la opción c.","tr":"distal","a":0,"ns":1,"po":["","La transversa da heces BLANDAS, no formadas.","La izquierda da heces semiblandas o sólidas, no líquidas.","Sí hay una correcta: la a)."]},{"id":145,"ex":"Extremadura (2º llamamiento) · 2019","org":"Extremadura","y":2019,"s":"ostom","t":"ostomias","q":"En una colostomía, ya sea temporal o permanente, ¿Cuánto tiempo tarda en funcionar después del postoperatorio?","o":["12 horas.","24 horas.","48 horas.","De 3 a 6 días."],"e":"La colostomía empieza a funcionar entre el 3.º y el 6.º día tras la cirugía, cuando se recupera el peristaltismo. Al principio puede emitir solo gases y moco. La ileostomía suele funcionar antes (24-72 h) y con débito alto.","a":3},{"id":146,"ex":"Extremadura (2º llamamiento) · 2019","org":"Extremadura","y":2019,"s":"ostom","t":"ostomias","q":"Tras el cierre de una ileostomía de descarga temporal para la reconstrucción del tránsito intestinal, ¿Qué complicación puede presentar el postoperatorio?","o":["Disfagia.","Rectorragias.","PVC positivas por encima de 8.","Hemoptisis."],"e":"Al cerrar una ileostomía de protección se restablece el tránsito y se crea una anastomosis: pueden aparecer rectorragia (sangrado de la anastomosis o del recto desfuncionalizado), diarrea, íleo o fuga anastomótica. La disfagia y la hemoptisis no tienen relación con esta cirugía.","a":1},{"id":147,"ex":"Extremadura (2º llamamiento) · 2019","org":"Extremadura","y":2019,"s":"anat","t":"obstruccion","q":"El intestino delgado está formado por el duodeno, el yeyuno y el íleon. En él se realiza la absorción de los productos de la digestión. ¿Qué longitud tiene?","o":["De tres a cinco metros.","De cuatro a seis metros.","De cinco a ocho metros.","De seis a nueve metros."],"e":"El intestino delgado mide unos 6 metros (según la fuente, entre 4 y 7) y 2,5 cm de diámetro: duodeno (unos 25 cm), yeyuno e íleon. La opción que mejor recoge esa longitud es «de 4 a 6 metros». El intestino grueso mide alrededor de 1,5 m.","a":1},{"id":148,"ex":"Galicia · 2019","org":"Galicia","y":2019,"s":"intestino","t":"eliminacion","q":"Según la Escala de Bristol, heces de tipo 3 y 4 se consideran:","o":["Heces duras, estreñimiento/constipación.","Heces blandas, tránsito regular.","Heces líquidas, diarrea.","La escala de Bristol no está relacionada con la forma de las heces."],"e":"Escala de Bristol: tipos 1-2 = estreñimiento; 3-4 = heces ideales (el 4, «salchicha lisa y blanda», es el ideal); 5 = falta de fibra; 6-7 = diarrea. Los tipos 3 y 4 corresponden a un tránsito regular.","a":1},{"id":149,"ex":"Galicia · 2019","org":"Galicia","y":2019,"s":"intestino","t":"eliminacion","q":"La dieta de una persona con diverticulosis intestinal debe ser:","o":["Rica en proteínas.","Rica en fibra.","Baja en sodio.","Hipercalórica."],"e":"En la diverticulosis (sin inflamación) se recomienda una dieta RICA EN FIBRA y abundante agua: aumenta el volumen fecal, baja la presión intracolónica y previene el estreñimiento. En la diverticulitis aguda, en cambio, se pauta dieta absoluta o sin residuos.","a":1},{"id":150,"ex":"Galicia · 2019","org":"Galicia","y":2019,"s":"estom","t":"ulcera","q":"Tomás es un paciente diagnosticado de úlcera péptica. ¿Qué recomendaciones incluirías en su educación sanitaria?","o":["Lavar las manos con frecuencia, preparación higiénica de los alimentos y beber agua segura.","Mantener el tratamiento indicado hasta la mejoría de los síntomas.","Tomar antiinflamatorios no esteroideos, AINES con leche.","Realizar 3 comidas y beber antes para evitar el dolor."],"e":"H. pylori se transmite de persona a persona por vía fecal-oral y oral-oral, por lo que la higiene de manos y alimentos y el agua segura son medidas preventivas. El tratamiento se completa aunque mejoren los síntomas, se evitan los AINE y se reparten 4-5 comidas al día.","a":0},{"id":151,"ex":"Galicia · 2019","org":"Galicia","y":2019,"s":"sondas","t":"sondas_tipos","q":"Tras colocar una sonda nasogástrica tipo Levin para alimentación, de los siguientes, ¿cuál sería el método más fiable de comprobación?","o":["Medir la distancia desde la punta de la nariz del paciente a la oreja y desde ahí hasta el apéndice xifoides.","Inyectar 30 ml de aire y escuchar el sonido con el fonendoscopio situado en el epigastrio.","Introducir el extremo en un vaso de agua.","Aspirar y comprobar el pH del líquido extraído."],"e":"El método más fiable a pie de cama es aspirar contenido y comprobar el pH (≤ 4 = estómago). Medir nariz-oreja-xifoides sirve para calcular la longitud, no para comprobar la posición. Auscultar aire o sumergir el extremo en agua no son métodos fiables.","tr":"verificacion","a":3,"po":["Eso calcula la longitud, no comprueba la posición.","La auscultación no es fiable.","Las burbujas en agua no son fiables.",""]},{"id":152,"ex":"Cantabria · 2019","org":"Cantabria","y":2019,"s":"intestino","t":"eliminacion","q":"¿Cuál es la vía de contagio principal de las infecciones por Campylobacter?","o":["Contacto con fluidos corporales.","Transmisión aérea.","Transmisión hidro-fecal.","Contacto sexual."],"e":"Campylobacter es una de las principales causas de gastroenteritis bacteriana. Se transmite por vía fecal-oral: agua y alimentos contaminados (sobre todo carne de pollo poco cocinada y leche sin pasteurizar).","a":2},{"id":153,"ex":"Cantabria · 2019","org":"Cantabria","y":2019,"s":"intestino","t":"ccr","q":"¿En qué año se implanta el programa de cribado de cáncer de colon en la Comunidad Autónoma de Cantabria?","o":["2006.","2008.","2010.","2012."],"e":"Dato autonómico (la clave señala 2008 para Cantabria). Lo que se pregunta en cualquier OPE: cribado de 50 a 69 años (con ampliación a 74), test inmunoquímico fecal cada 2 años y colonoscopia si es positivo.","a":1,"f":"Dato de calendario autonómico: poco valor didáctico fuera de Cantabria."},{"id":154,"ex":"Cantabria · 2019","org":"Cantabria","y":2019,"s":"sondas","t":"sng_verif","q":"Respecto a los cuidados de enfermería en la administración de nutrición enteral por sonda; señale la respuesta INCORRECTA:","o":["Antes de administrar la nutrición se colocará al paciente en posición sentado o semisentado a unos 45º.","Se debe comprobar la correcta ubicación de la sonda mediante aspiración de contenido gástrico o auscultando epigastrio mientras introducimos aire con una jeringa.","Cuando existe sonda nasogástrica y está fijada a nariz, se debe cambiar el punto de fijación cada 72 h con cuidado de no mover mucho para evitar náuseas al paciente.","Para conservar el preparado nutricional, se pondrá fecha y hora de apertura, conservándose en nevera un máximo de 24 h."],"e":"La fijación de la SNG a la nariz se cambia a DIARIO (y si está sucia o despegada), aprovechando para movilizar ligeramente la sonda y prevenir lesiones por presión. Cada 72 h es demasiado tiempo. Ten en cuenta que hoy la auscultación con aire tampoco se acepta como comprobación.","tr":"verificacion","a":2,"po":["Es correcto: 45° durante la nutrición.","Según la clave se acepta, aunque hoy la auscultación no se considera fiable.","","Es correcto: rotular y conservar 24 h en nevera."],"f":"La opción 2 incluye la auscultación, que hoy NO se considera un método fiable: la pregunta tiene dos opciones problemáticas."},{"id":155,"ex":"Cantabria · 2019","org":"Cantabria","y":2019,"s":"intestino","t":"eii","q":"Respecto a las características de la «colitis ulcerosa», señale la respuesta INCORRECTA:","o":["Predominio de colon izquierdo.","Puede evolucionar a megacolon tóxico.","Distribución discontinua de las lesiones.","La inflamación afecta a mucosa y submucosa."],"e":"La colitis ulcerosa tiene una distribución CONTINUA: empieza en el recto y avanza sin dejar zonas sanas. La distribución discontinua o «en parches» es propia del Crohn. La CU afecta a mucosa y submucosa, predomina en el colon izquierdo y puede complicarse con megacolon tóxico.","tr":"cucrohn","a":2,"po":["Es correcto: predomina en el colon izquierdo, desde el recto.","Es correcto: el megacolon tóxico es su complicación grave.","","Es correcto: afecta a mucosa y submucosa."]},{"id":156,"ex":"Cantabria · 2019","org":"Cantabria","y":2019,"s":"valor","t":"biliar","q":"¿Con qué se relaciona la aparición de heces «hipocólicas» o «acólicas»?","o":["Sangrado gástrico.","Déficit de fibra en la dieta.","Patología biliar.","Deshidratación."],"e":"Las heces hipocólicas o acólicas (pálidas, color masilla) indican que no llega bilis al intestino: obstrucción de la vía biliar (coledocolitiasis, tumores) o fase aguda de una hepatitis. Suelen acompañarse de ictericia y coluria.","a":2},{"id":157,"ex":"Cantabria · 2019","org":"Cantabria","y":2019,"s":"estom","t":"dumping","q":"¿Qué déficit vitamínico se relaciona con los pacientes gastrectomizados?","o":["Vitamina E.","Vitamina B3.","Vitamina B12.","Vitamina K."],"e":"La gastrectomía elimina las células parietales que producen el factor intrínseco, necesario para absorber la vitamina B12 en el íleon. El déficit causa anemia megaloblástica y se trata con B12 intramuscular de por vida.","tr":"b12","a":2,"po":["La vitamina E no depende del factor intrínseco.","La B3 no depende del factor intrínseco.","","La vitamina K depende de las sales biliares."]},{"id":158,"ex":"Madrid · 2019","org":"Madrid","y":2019,"s":"estom","t":"ulcera","q":"La complicación más común en el paciente con úlcera péptica es:","o":["Una perforación.","Una hemorragia.","Desnutrición por cambios en la dieta.","Obstrucción pilórica."],"e":"La hemorragia es la complicación MÁS FRECUENTE de la úlcera péptica; la perforación es la MÁS GRAVE. Otras son la penetración (sobre todo al páncreas) y la estenosis u obstrucción pilórica.","a":1},{"id":159,"ex":"Madrid · 2019","org":"Madrid","y":2019,"s":"valor","t":"hemorragia","q":"Tras un sangrado gástrico, la hemorragia puede hacer que las heces sean de un color:","o":["Negro alquitranado (Melenas).","Posos de café.","Bilioso.","Blanquecino."],"e":"La sangre procedente del estómago se digiere durante el tránsito y las heces salen negras y alquitranadas: melenas. Los «posos de café» describen el VÓMITO con sangre digerida, no las heces.","a":0},{"id":160,"ex":"Islas Baleares · 2019","org":"Islas Baleares","y":2019,"s":"agudo","t":"obstruccion","q":"En la valoración abdominal de un paciente que ha sufrido un traumatismo, se pueden presentar los siguientes signos de irritación peritoneal EXCEPTO:","o":["Ausencia de ruidos intestinales y rigidez muscular.","Distensión abdominal y defensa involuntaria.","Hiperestesia o hipoestesia.","Dolor a la palpación o dolor de rebote a la palpación."],"e":"Los signos de irritación peritoneal son defensa o rigidez muscular («abdomen en tabla»), dolor a la palpación y a la descompresión (Blumberg), distensión y disminución o ausencia de ruidos. La hipoestesia cutánea no es un signo de irritación peritoneal.","a":2},{"id":161,"ex":"Islas Baleares · 2019","org":"Islas Baleares","y":2019,"s":"ostom","t":"ostomias","q":"¿Cuál de las siguientes NO es una ostomía de eliminación?","o":["Ileostomía.","Yeyunostomía.","Colostomía ascendente.","Ureterostomía."],"e":"La yeyunostomía es de ALIMENTACIÓN. Ileostomía y colostomía son ostomías de eliminación digestiva y la ureterostomía, de eliminación urinaria.","tr":"alimentacion","a":1,"po":["La ileostomía es de eliminación.","","La colostomía ascendente es de eliminación.","La ureterostomía es de eliminación urinaria."]},{"id":162,"ex":"Islas Baleares · 2019","org":"Islas Baleares","y":2019,"s":"sondas","t":"peg","q":"Para reducir el riesgo de aspiración en un paciente portador de sonda de alimentación, indique la CORRECTA:","o":["Un paciente con sonda de alimentación no presenta riesgo de aspiración.","La administración de alimentos y medicamentos a través de una sonda se debe realizar con el paciente en posición semi-Fowler.","La alimentación de los pacientes a través de sonda colocada a nivel del estómago disminuye la frecuencia de regurgitación y aspiración.","Los pacientes con sonda de alimentación mediante bomba de infusión continua no deben mantener la posición semi-Fowler."],"e":"La nutrición y la medicación por sonda se administran con el paciente semiincorporado (semi-Fowler o Fowler), que se mantiene durante la infusión continua y después de cada bolo. Una sonda gástrica no elimina el riesgo de regurgitación; la posición pospilórica lo reduce.","tr":"posiciones","a":1,"po":["Falso: con sonda persiste el riesgo de aspiración.","","Falso: la sonda pospilórica (no la gástrica) es la que reduce la regurgitación.","Falso: el semi-Fowler se mantiene también en la infusión continua."]},{"id":164,"ex":"Canarias 2º llamamiento · 2019","org":"Canarias","y":2019,"s":"agudo","t":"obstruccion","q":"La obstrucción parcial o total del intestino produce:","o":["Íleo mecánico.","Íleo paralítico.","Acortamiento y engrosamiento del colon.","Hemorragia en forma de melenas."],"e":"Si existe un obstáculo físico que ocluye total o parcialmente la luz intestinal (bridas, hernia, tumor, vólvulo, fecaloma...), hablamos de íleo MECÁNICO. El íleo paralítico es funcional: la luz está libre, pero no hay peristaltismo.","a":0},{"id":165,"ex":"Canarias 2º llamamiento · 2019","org":"Canarias","y":2019,"s":"intestino","t":"ccr","q":"¿Por qué es importante la eliminación de los pólipos de colon?","o":["Porque sirve para identificar las posibles alteraciones genéticas.","Para prevenir desarrollo de cáncer de colon.","Para facilitar un mejor examen del intestino.","Para aminorar los futuros problemas de estreñimiento."],"e":"La mayoría de los cánceres colorrectales se desarrollan a partir de pólipos adenomatosos (secuencia adenoma-carcinoma). Extirparlos durante la colonoscopia (polipectomía) previene el cáncer. Los adenomas vellosos y los mayores de 1 cm son los de más riesgo.","a":1},{"id":166,"ex":"Canarias 2º llamamiento · 2019","org":"Canarias","y":2019,"s":"intestino","t":"ccr","q":"Un paciente notifica al personal de enfermería que tanto su padre como su abuelo murieron de cáncer colorrectal y él teme fallecer de la misma enfermedad. ¿Cuál de los siguientes puntos debe incluir el personal de enfermería entre sus recomendaciones?","o":["No hay relación genética entre las personas afectadas de cáncer de colon.","El paciente debe someterse a una exploración de sangre oculta en heces y colonoscopia al año.","Todas las respuestas son correctas.","El paciente debe cambiar su dieta de inmediato."],"e":"Los antecedentes familiares de primer grado son el principal factor de riesgo hereditario de CCR. Estas personas no entran en el cribado poblacional: siguen un programa de alto riesgo con colonoscopia (además de valorar la sangre oculta) y consejo genético si procede.","a":1,"ns":1},{"id":167,"ex":"Madrid 2º Llamamiento · 2019","org":"Madrid","y":2019,"s":"estom","t":"pancreas","q":"Señale una de las causas de aparición de la hipoglucemia reactiva:","o":["Alteración de la motilidad gastrointestinal después de una cirugía gástrica.","Uso de esteroides y anabolizantes.","Pancreatitis asociada a excesiva ingesta de alcohol.","Traumatismo de huesos largos."],"e":"El síndrome de dumping TARDÍO (90-180 min tras comer) es una hipoglucemia reactiva: tras la cirugía gástrica, los hidratos de carbono pasan rápido al intestino, se absorben de golpe y provocan un pico de insulina que acaba en hipoglucemia (sudoración, confusión, mareo).","a":0},{"id":168,"ex":"Murcia · 2019","org":"Murcia","y":2019,"s":"sondas","t":"sng","q":"La finalidad del sondaje nasogástrico es:","o":["Preventiva.","Diagnóstica.","Terapéutica.","Todas las respuestas son correctas."],"e":"El sondaje nasogástrico tiene finalidad preventiva (descompresión para evitar vómitos y aspiración), diagnóstica (obtener muestras de contenido gástrico) y terapéutica (alimentación, medicación, lavado gástrico, drenaje).","a":3,"ns":1},{"id":170,"ex":"Murcia 2º llamamiento · 2019","org":"Murcia","y":2019,"s":"estom","t":"ulcera","q":"El síndrome de ZOLLINGER-ELLISON es la úlcera péptica causada por un:","o":["Glucagonoma.","Gastrinoma.","Insulinoma.","Vipoma."],"e":"El Zollinger-Ellison se debe a un gastrinoma: el exceso de gastrina estimula una hipersecreción ácida masiva, con úlceras múltiples, refractarias y de localización atípica. Insulinoma = hipoglucemias; glucagonoma = hiperglucemia y eritema; vipoma = diarrea acuosa.","a":1},{"id":171,"ex":"Murcia 2º llamamiento · 2019","org":"Murcia","y":2019,"s":"valor","t":"valoracion","q":"¿En qué posición debe de estar el paciente durante la realización de una colonoscopia?","o":["En decúbito lateral derecho con las piernas elevadas hacia el tórax.","En decúbito lateral izquierdo con las piernas elevadas hacia el tórax.","En decúbito prono.","En decúbito supino y con las piernas flexionadas."],"e":"La colonoscopia se realiza en decúbito lateral izquierdo con las rodillas flexionadas hacia el pecho: así se sigue la anatomía del sigma y el recto. Es la misma postura que para administrar un enema.","tr":"posiciones","a":1,"po":["Es el lado izquierdo, no el derecho.","","Prono no permite la exploración.","Supino no sigue la anatomía del sigma."]},{"id":172,"ex":"Murcia 2º llamamiento · 2019","org":"Murcia","y":2019,"s":"valor","t":"cirrosis","q":"El test de Guayaco se emplea:","o":["Para el control de la fertilidad.","Para detectar sangre en las heces.","En las pruebas de Alergia.","En las pruebas Hepáticas."],"e":"El test del guayaco detectaba sangre oculta en heces por la actividad peroxidasa de la hemoglobina. Requería dieta previa (sin carne roja ni vitamina C) y daba muchos falsos positivos. Hoy está en desuso y ha sido sustituido por el test inmunoquímico fecal (FIT).","a":1},{"id":173,"ex":"Murcia 2º llamamiento · 2019","org":"Murcia","y":2019,"s":"ostom","t":"ostomias","q":"Las ostomías se pueden dividir en dos grandes grupos: nutricionales y de eliminación. Señale cuál de estas ostomías se considera únicamente de eliminación:","o":["Faringostomía.","Gastrostomía.","Yeyunostomía.","Ileostomía."],"e":"La ileostomía es exclusivamente de eliminación (el íleon se aboca a la piel). La faringostomía, la gastrostomía y la yeyunostomía son ostomías de nutrición.","tr":"alimentacion","a":3,"po":["Faringostomía: de alimentación.","Gastrostomía: de alimentación.","Yeyunostomía: de alimentación.",""]},{"id":174,"ex":"Murcia 2º llamamiento · 2019","org":"Murcia","y":2019,"s":"estom","t":"ulcera","q":"La erosión de la mucosa gástrica o duodenal que alcanza o sobrepasa la muscularis mucosae se denomina:","o":["Gastritis aguda.","Gastritis crónica.","Úlcera péptica.","Colitis ulcerosa."],"e":"La úlcera péptica es la lesión gástrica o duodenal que alcanza o sobrepasa la muscularis mucosae. Si es más superficial y no llega a esa capa, hablamos de erosión.","a":2},{"id":175,"ex":"Galicia EFyC · 2020","org":"Galicia","y":2020,"s":"valor","t":"ulcera","q":"En un domicilio al que acudimos a realizar la cura de una úlcera a un paciente encamado de 84 años, totalmente dependiente para las actividades de la vida diaria, el cuidador nos indica que está preocupado porque las tres últimas deposiciones son de color negro, brillante y maloliente. ¿Qué tipo de deposiciones está teniendo el paciente?","o":["Hematoquecia.","Melenas.","Rectorragia.","Ninguna es correcta."],"e":"Heces negras, brillantes, pegajosas y malolientes son MELENAS: sangre digerida, generalmente de origen digestivo alto. En un anciano dependiente obliga a valorar una HDA (úlcera, AINE, anticoagulantes). La hematoquecia y la rectorragia son sangre roja.","a":1,"ns":1},{"id":176,"ex":"Galicia EFyC · 2020","org":"Galicia","y":2020,"s":"sondas","t":"sng_verif","q":"Acudimos al domicilio de una paciente para colocar una sonda nasogástrica (SNG). Según el Procedimiento de colocación y cuidados de la SNG, del portal FEMORA, del Servicio Gallego de Salud, ¿Cuál es la prueba de primera línea para comprobar la colocación?","o":["El control radiológico.","La utilización de papel tornasol o papel pH para medir la concentración de iones hidrógeno en el contenido gástrico.","La medición del pH gástrico con tiras reactivas.","La auscultación en el epigastrio de aire insuflado por la SNG."],"e":"Según el procedimiento del SERGAS, la primera línea es medir el pH del aspirado con tiras reactivas de pH (escala graduada), que discriminan valores ≤ 5,5. El papel tornasol solo indica ácido o básico, no es suficiente. La radiografía es la prueba de referencia, pero no la de primera línea en domicilio.","tr":"verificacion","a":2,"po":["La radiografía es la prueba de referencia, pero no la de primera línea en domicilio.","El papel tornasol solo dice ácido o básico, no el valor de pH.","","La auscultación no es fiable."]},{"id":177,"ex":"Galicia EFyC · 2020","org":"Galicia","y":2020,"s":"ostom","t":"ostomias","q":"Un hombre de 59 años, portador de una colostomía tras ser intervenido de un cáncer de colon, viene a la consulta solicitando información sobre muchos aspectos relacionados con sus hábitos de vida, la colostomía, la vuelta a su puesto de trabajo como bedel en un colegio de educación primaria y la práctica de su deporte favorito (va a jugar al pádel con sus amigos tres días a la semana). Indicará al paciente que puede:","o":["Bañarse en el mar o piscina.","Reincorporarse a su puesto de trabajo.","Practicar el deporte que hacía con anterioridad a la intervención.","Todas son correctas."],"e":"Una colostomía no impide una vida normal: puede bañarse en el mar o la piscina (con bolsa o tapón, o colector pequeño), volver al trabajo y hacer deporte. Solo se evitan los deportes de contacto violento y los grandes esfuerzos en los primeros meses (riesgo de hernia), con faja adaptada si hace falta.","a":3,"ns":1},{"id":178,"ex":"Galicia EFyC · 2020","org":"Galicia","y":2020,"s":"intestino","t":"ccr","q":"Acude a nuestra consulta un paciente de 54 años que en un control de salud en su empresa le detectaron una cifra de glucemia de 115 mg/dl y sobrepeso. Le recomiendan acudir a su centro de salud para realizar nuevos controles. Durante la entrevista nos dice que no es fumador, solo toma una copa de vino al mediodía y se considera una persona sana, por lo que no suele acudir al médico; tampoco tiene antecedentes familiares relevantes. Cree que el problema está en que lleva un año sin realizar nada de ejercicio y, por este motivo, lleva unos meses estreñido, sus hemorroides han empeorado y a veces tiene pequeños sangrados. ¿Qué recomendación no tendríamos que dar a este paciente?","o":["Realizar nuevos controles entre los que se incluya la prueba de sangre oculta en heces.","Aumentar el consumo de fruta y verdura. Hacer ejercicio físico regularmente.","Limitar el consumo de hidratos de carbono y grasas de origen animal.","Explicar al paciente que no debe preocuparse ya que el sangrado se produce porque la hemorroide se abre con el esfuerzo de la defecación."],"e":"No se debe atribuir un sangrado rectal a las hemorroides sin descartar antes otras causas, sobre todo un cáncer colorrectal en un paciente de 54 años, en edad de cribado. Por eso es incorrecto tranquilizarle sin más. Sí procede indicar sangre oculta en heces, fibra, ejercicio y control del peso y la glucemia.","a":3},{"id":179,"ex":"Galicia EFyC · 2020","org":"Galicia","y":2020,"s":"valor","t":"ccr","q":"Tomás de 56 años recibe en su domicilio el resultado de la prueba de detección de sangre oculta en heces. En ella se le informa que se encontraron indicios de sangre, por lo que será necesaria la realización de una colonoscopia. ¿Cuál de estas indicaciones no debemos dar al paciente?","o":["No es necesario que vaya acompañado a realizar la prueba.","Se le darán instrucciones precisas sobre la dieta en los días previos.","Se entregarán el producto farmacológico y las instrucciones de cómo deberá tomarlo para una correcta preparación del intestino.","La importancia de no comer y beber nada en las cuatro horas previas a la realización de la prueba."],"e":"La colonoscopia suele hacerse con sedación, por lo que el paciente DEBE ir acompañado y no puede conducir después. Sí se le dan instrucciones de dieta (pobre en residuos 48 h antes y líquidos claros 24 h antes), la solución evacuante y el ayuno previo.","a":0},{"id":180,"ex":"Andalucía · 2021","org":"Andalucía","y":2021,"s":"sondas","t":"sng_verif","q":"Dada la disminución del nivel de conciencia que presenta Antonio, la enfermera le ha colocado una sonda nasogástrica; señale el método NO aconsejado para verificar la localización de la sonda:","o":["Auscultación por debajo del apéndice xifoides del gorgoteo del aire insuflado por la SNG (prueba «whoosh»).","Solicitud de radiografía y visualización de colocación de la SNG.","Medición del pH del contenido aspirado por la SNG.","Todos son correctos."],"e":"La auscultación del aire insuflado (prueba «whoosh») NO es un método fiable para verificar la posición de la sonda y no se recomienda. En pacientes con disminución del nivel de consciencia se recomienda confirmar con radiografía; a pie de cama, con el pH del aspirado.","tr":"verificacion","a":0,"po":["","Es aconsejable: la radiografía es la referencia, sobre todo con bajo nivel de conciencia.","Es aconsejable: el pH del aspirado.","No todos son correctos: la auscultación está desaconsejada."]},{"id":181,"ex":"Castilla y León SS · 2021","org":"Castilla y León","y":2021,"s":"boca","t":"disfagia","q":"Indique la afirmación correcta respecto a la escala EAT-10:","o":["La puntuación máxima total es de 50 puntos.","Es un cuestionario de 10 preguntas.","Incluye una fórmula para el cálculo de la puntuación final.","Contiene subescalas."],"e":"El EAT-10 es un cuestionario autoadministrado de 10 preguntas con escala Likert de 0 a 4: la puntuación va de 0 a 40 y un valor ≥ 3 indica posible disfagia. Es una simple suma, sin fórmula ni subescalas, y se usa como cribado en pacientes con nivel cognitivo conservado.","a":1},{"id":182,"ex":"Castilla y León SS · 2021","org":"Castilla y León","y":2021,"s":"intestino","t":"eii","q":"La Clasificación de Montreal de la Enfermedad de Crohn, define el patrón de la enfermedad según:","o":["La edad de comienzo, localización y comportamiento.","El tratamiento de mantenimiento y su duración.","El número de brotes leves o moderados.","Las terapias de rescate."],"e":"La clasificación de Montreal para el Crohn usa la edad al diagnóstico (A1 ≤ 16, A2 17-40, A3 > 40), la localización (L1 ileal, L2 cólica, L3 ileocólica, L4 tracto alto) y el comportamiento (B1 inflamatorio, B2 estenosante, B3 fistulizante; «p» si hay afectación perianal).","a":0},{"id":183,"ex":"Castilla y León SS · 2021","org":"Castilla y León","y":2021,"s":"boca","t":"erge","q":"Respecto a las medidas higiénico-dietéticas en relación con el reflujo gastroesofágico, señale la respuesta incorrecta:","o":["Evitar dormir hasta 2-4 horas después de las comidas.","Elevar el cabecero de la cama a 15º.","Realizar comidas poco copiosas y bajas en grasa.","Evitar tabaco, teína y cafeína."],"e":"El cabecero se eleva 15-20 CENTÍMETROS con tacos bajo las patas, no 15 grados, y sin usar varias almohadas (flexionan el abdomen y aumentan la presión). También se aconseja no acostarse tras comer, hacer comidas poco copiosas y bajas en grasa y evitar el tabaco, el té y el café.","tr":"cabecero","a":1,"po":["Es correcto: no acostarse tras comer.","","Es correcto: comidas poco copiosas y bajas en grasa.","Es correcto: evitar tabaco, teína y cafeína."]},{"id":184,"ex":"INGESA · 2021","org":"INGESA","y":2021,"s":"ostom","t":"ostomias","q":"Todas las ostomías que se citan a continuación son de eliminación excepto una que es de alimentación, ¿cuál es?","o":["Colostomía.","Yeyunostomía.","Ileostomía.","Ureterostomía."],"e":"La yeyunostomía es una ostomía de alimentación. Colostomía e ileostomía son de eliminación intestinal y la ureterostomía, de eliminación urinaria.","tr":"alimentacion","a":1,"po":["La colostomía es de eliminación.","","La ileostomía es de eliminación.","La ureterostomía es de eliminación urinaria."]},{"id":185,"ex":"INGESA · 2021","org":"INGESA","y":2021,"s":"estom","t":"ulcera","q":"De los siguientes factores de riesgo, ¿cuál NO está relacionado con la úlcera gastroduodenal?","o":["Infección crónica por Helicobacter pylori.","Uso de antiinflamatorios no esteroideos.","Tabaquismo.","Intolerancia a la lactosa."],"e":"Los factores de la úlcera gastroduodenal son H. pylori (1.º), AINE (2.º) y, como cofactores, el tabaco, el estrés grave y los estados de hipersecreción ácida. La intolerancia a la lactosa produce diarrea y flatulencia, pero no úlcera.","a":3},{"id":186,"ex":"INGESA · 2021","org":"INGESA","y":2021,"s":"valor","t":"ccr","q":"Al realizar una prueba de sangre oculta en heces, ¿cuál de los siguientes productos puede dar como resultado un falso negativo si es ingerido en los días previos a la realización de la prueba?","o":["Hierro.","Yodo.","Vitamina C.","Colchicina."],"e":"La vitamina C (> 250 mg/día) es un antioxidante que interfiere con la reacción del guayaco y produce FALSOS NEGATIVOS. La carne roja, ciertos vegetales y los AINE daban falsos positivos. El FIT actual no tiene estas interferencias.","a":2},{"id":187,"ex":"INGESA · 2021","org":"INGESA","y":2021,"s":"ostom","t":"heces_ostomia","q":"Cuando el paciente ya pueda ingerir alimentos con normalidad, ¿cómo serán las heces que expulsará por el estoma?","o":["Líquidas.","Formadas.","Semilíquidas.","Blandas."],"e":"En el supuesto original, el estoma era una colostomía distal (descendente o sigmoidea). Cuando el paciente come con normalidad, el colon absorbe agua y las heces salen FORMADAS. Recuerda: cuanto más distal el estoma, más sólidas y menos irritantes las heces.","tr":"distal","a":1,"po":["Líquidas: ciego o ileostomía.","","Semilíquidas: colostomía ascendente.","Blandas: colostomía transversa."],"f":"Pregunta de supuesto práctico: depende del caso original (estoma en colon descendente o sigmoide). Conviene añadir el contexto o retirarla."},{"id":188,"ex":"La Rioja · 2021","org":"La Rioja","y":2021,"s":"estom","t":"dumping","q":"Entre las siguientes recomendaciones dietéticas en un paciente con Síndrome de Dumping, ¿cuál de ellas no incluiremos?","o":["Repartir la dieta en seis o más tomas de pequeño tamaño.","Tomar alimentos con hidratos de carbono simples.","Los líquidos deben tomarse separados de las comidas, entre 30 y 60 minutos antes o después.","Evitar el consumo de refrescos y zumos."],"e":"En el síndrome de dumping se RESTRINGEN los hidratos de carbono simples (azúcares, dulces, zumos), que aceleran el vaciamiento y provocan hipoglucemia reactiva. Se reparten 6 o más tomas pequeñas, los líquidos se toman 30-60 min antes o después de comer y se aumentan las proteínas y la fibra.","a":1},{"id":189,"ex":"La Rioja · 2021","org":"La Rioja","y":2021,"s":"higado","t":"cirrosis","q":"Ante un paciente con cirrosis descompensada y ascitis, ¿cuál de los siguientes cuidados de enfermería no realizaría?","o":["Reposición de la volemia con albúmina.","Control de electrolitos.","Administrar AINES.","Suspender los líquidos según la respuesta diurética."],"e":"En el cirrótico están contraindicados los AINE: reducen las prostaglandinas renales, favorecen la
