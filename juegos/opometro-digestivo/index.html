<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpoMetro · Digestivo | OpoLab</title>
<meta name="description" content="Recorre el aparato digestivo como una red de metro y repasa 376 preguntas reales de OPE con explicación.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#082b5c;--navy2:#0d3a75;--cyan:#0aa8e5;--mint:#16a37a;--violet:#6b5ce7;--amber:#f2a33a;
  --ink:#0f2440;--muted:#5b6f8a;--line:#dbe5ef;--bg:#f5f8fc;--card:#ffffff;
  --ok:#14936c;--okbg:#e8f8f1;--ko:#d0435a;--kobg:#fff0f2;
  --lc:var(--cyan);
  --r:18px;--shadow:0 1px 2px rgba(8,43,92,.06),0 8px 24px rgba(8,43,92,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",Inter,"Segoe UI",system-ui,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(8,43,92,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(8,43,92,.035) 1px,transparent 1px);background-size:28px 28px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #8fd8f5;outline-offset:2px}
.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:22px 0 30px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.back{color:var(--navy);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px}
.brand{color:var(--cyan);font-weight:800;font-size:14px;letter-spacing:.01em}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .08s ease,box-shadow .2s ease,background .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.line{background:var(--lc);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.ghost:hover{border-color:#9fd9f2}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.small{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:#eef4fa;color:var(--navy)}

/* HERO */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:stretch;margin-bottom:18px}
.heroTxt{background:var(--navy);color:#fff;border-radius:24px;padding:28px 30px;position:relative;overflow:hidden}
.heroTxt:after{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;border:28px solid rgba(10,168,229,.18)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#7fd3f5}
.hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.04;margin:10px 0 10px;letter-spacing:-.02em}
.hero h1 span{color:#5fd0f7}
.hero p{margin:0;color:#c9d9ee;font-size:16px;max-width:560px;position:relative;z-index:1}
.lines{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}
.lpill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.lpill i{width:18px;height:6px;border-radius:9px;display:inline-block}
.ticket{background:#fff;border-radius:24px;padding:22px 22px 18px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;display:flex;flex-direction:column}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:22px;height:22px;background:var(--bg);border-radius:50%;transform:translateY(-50%)}
.ticket:before{left:-11px}.ticket:after{right:-11px}
.tkHead{display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:12px;margin-bottom:12px}
.tkHead b{font-size:13px;letter-spacing:.1em;color:var(--muted)}
.tkHead span{font-weight:800;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f6f9fd;border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:24px;color:var(--navy);line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:10px;background:#e7eef6;border-radius:99px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mint));border-radius:99px;transition:width .5s}
.tkFoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}

/* MODES */
.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:22px 0 10px;gap:10px}
.sectionTitle h2{font-size:22px;margin:0;letter-spacing:-.01em}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mode{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--shadow);transition:border-color .2s,transform .15s;position:relative}
.mode:hover{border-color:#9fd9f2;transform:translateY(-2px)}
.mode .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;margin-bottom:10px}
.mode h3{margin:0 0 4px;font-size:17px}
.mode p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.mode .badge{position:absolute;top:12px;right:12px;background:var(--ko);color:#fff;border-radius:99px;font-size:12px;font-weight:800;padding:2px 9px}

/* MAP */
.mapCard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:14px 14px 6px;box-shadow:var(--shadow)}
.mapCard svg{width:100%;height:auto;display:block}
.mapCard .st{cursor:pointer}
.mapCard .st:hover circle.node,.mapCard .st:focus circle.node{r:21}
.mapCard text{font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:4px 8px 8px;font-size:12px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:6px;border-radius:9px;margin-right:6px;vertical-align:middle}
.stations{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.stCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;border-top:5px solid var(--lc);transition:transform .15s}
.stCard:hover{transform:translateY(-2px)}
.stCard b{display:block;font-size:14px;line-height:1.25}
.stCard span{display:block;font-size:12px;color:var(--muted);margin:3px 0 8px;min-height:32px;line-height:1.35}
.mini{height:6px;background:#e9eff6;border-radius:9px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--lc)}
.stCard small{display:block;margin-top:5px;font-size:11px;color:var(--muted);font-weight:700}

/* STATION */
.stHero{border-radius:24px;padding:24px 26px;color:#fff;background:var(--lc);position:relative;overflow:hidden;margin-bottom:14px}
.stHero:after{content:"";position:absolute;inset:auto -40px -70px auto;width:220px;height:220px;border-radius:50%;border:26px solid rgba(255,255,255,.16)}
.stHero .eyebrow{color:rgba(255,255,255,.85)}
.stHero h1{margin:6px 0 4px;font-size:clamp(28px,4vw,42px);letter-spacing:-.02em}
.stHero p{margin:0;opacity:.92}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:17px}
.claves{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.claves li{position:relative;padding:10px 12px 10px 38px;background:#f7fafd;border-radius:12px;font-size:14px;line-height:1.45}
.claves li:before{content:attr(data-n);position:absolute;left:10px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--lc);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.claves b{color:var(--navy)}
.actions{display:grid;gap:9px}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-of-type{border-bottom:0}
.kv b{color:var(--navy)}

/* QUIZ */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.qtitle{font-weight:800;color:var(--navy);font-size:15px;text-align:center;flex:1}
.qcount{font-weight:800;color:var(--muted);font-size:14px;min-width:60px;text-align:right}
.track{display:flex;align-items:center;margin:4px 0 14px;padding:0 4px}
.track .dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #c9d6e4;flex:none;transition:all .25s}
.track .seg{height:4px;background:#c9d6e4;flex:1;min-width:2px}
.track .dot.ok{background:var(--ok);border-color:var(--ok)}
.track .dot.ko{background:var(--ko);border-color:var(--ko)}
.track .dot.ans{background:var(--navy);border-color:var(--navy)}
.track .dot.cur{border-color:var(--lc);box-shadow:0 0 0 5px color-mix(in srgb,var(--lc) 25%,transparent);transform:scale(1.15)}
.track .seg.done{background:var(--lc)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);max-width:900px;margin:0 auto}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip.src{background:#fff6e8;color:#8a5a12}
.chip.stn{background:color-mix(in srgb,var(--lc) 14%,#fff);color:var(--navy)}
.qtext{font-size:clamp(18px,2.2vw,22px);line-height:1.38;margin:0 0 16px;font-weight:700;white-space:pre-line}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4;font-weight:500;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:color-mix(in srgb,var(--lc) 60%,#fff);background:#fbfdff}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:#eef4fa;color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:14px;text-transform:lowercase}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--navy);background:#f3f7fc}
.opt.sel .k{background:var(--navy);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt.ko .k{background:var(--ko);color:#fff}
.opt.dim{opacity:.6}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;display:none;animation:pop .25s ease}
.fb.show{display:block}
.fb.ok{background:var(--okbg);border:1px solid #bfe8d6}
.fb.ko{background:var(--kobg);border:1px solid #f3c4cc}
.fb.neutral{background:#f3f7fc;border:1px solid var(--line)}
.fbHead{font-weight:800;font-size:16px;margin-bottom:6px}
.fb.ok .fbHead{color:var(--ok)}.fb.ko .fbHead{color:var(--ko)}
.why{margin:0;font-size:15px;line-height:1.55}
.why b{color:var(--navy)}
.flag{margin-top:10px;background:#fff8e6;border:1px dashed #e5b552;border-radius:12px;padding:9px 12px;font-size:13px;color:#7a5410}
.fbAct{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.fbAct .hint{font-size:12px;color:var(--muted);margin-left:auto}
.qfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;max-width:900px;margin-left:auto;margin-right:auto}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* RESULT */
.res{max-width:900px;margin:0 auto}
.resTop{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{width:150px;height:150px}
.resTop h2{margin:0 0 6px;font-size:28px}
.resGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.revItem{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:#fff}
.revItem summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;gap:10px;align-items:flex-start}
.revItem summary::-webkit-details-marker{display:none}
.revItem summary .st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;margin-top:1px}
.revItem .body{margin-top:10px;font-size:14px}
.revItem .body p{margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* SETUP / ESCALAS / ARCHIVO */
.seg3{display:flex;gap:8px;flex-wrap:wrap}
.seg3 button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:700}
.seg3 button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.filters button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.flash{max-width:760px;margin:0 auto}
.flash .term{font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--navy);margin:4px 0 14px;line-height:1.2}
.arch .opt{cursor:default}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin-left:6px}
.tag.N{background:#fde7ea;color:#a3283b}.tag.O{background:#fff1d6;color:#8a5a12}.tag.H{background:var(--okbg);color:var(--ok)}

/* FOOTER */
.foot{text-align:center;color:var(--cyan);font-weight:800;margin-top:30px}
.foot em{display:block;color:#6c7e93;font-family:"Segoe Print","Comic Sans MS",cursive;font-weight:400;margin-top:4px}
.copy{display:block;color:#8a99ab;font-size:12px;font-weight:500;margin-top:6px}
.reset{background:none;border:0;color:#8a99ab;font-size:12px;text-decoration:underline;margin-top:8px}

@media (max-width:980px){
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stations{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero,.grid2{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{width:calc(100% - 32px);padding-top:14px}
  .heroTxt{padding:22px}
  .modes{grid-template-columns:1fr 1fr;gap:8px}
  .mode{padding:12px}.mode p{display:none}
  .mapCard{display:none}
  .qcard{padding:16px}
  .opt{font-size:14px;padding:10px 12px}
  .resTop{grid-template-columns:1fr;justify-items:center;text-align:center}
  .resGrid{grid-template-columns:1fr 1fr 1fr}
  .stats b{font-size:20px}
}
body.embedded .wrap{width:100%;max-width:none;padding:10px 12px}
body.embedded .brand{display:none}
body.embedded .heroTxt{padding:18px 20px}
body.embedded .hero h1{font-size:34px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const Q=[{"id":1,"ex":"Andalucía · 2008","s":"boca","q":"De los cuatro factores determinantes de la salud bucodental señale cual es el factor más influyente:","o":["El medio ambiente.","El estilo de vida.","El sistema de asistencia sanitaria.","La biología."],"a":1,"e":"Según el modelo de Lalonde, el estilo de vida es el determinante que más influye en la salud, también en la bucodental: dieta rica en azúcares, higiene oral deficiente, tabaco y alcohol. La biología, el medio ambiente y el sistema sanitario pesan menos (aunque el sistema sanitario es el que más presupuesto recibe)."},{"id":2,"ex":"Castilla - La Mancha · 2008","s":"valor","q":"La hemorragia digestiva puede manifestarse por:","o":["Hematemesis, melenas, sangre oculta en heces. rectorragias y hematoquecia.","Hematemesis, hemoptisis, rectorragias, sangre oculta en heces y hematoquecia.","Hemoptisis, melenas, hematoquecia y rectorragias.","Hematemesis, epistaxis, sangre oculta en heces. rectorragias y melenas."],"a":0,"e":"La hemorragia digestiva puede manifestarse como hematemesis, melenas, hematoquecia, rectorragia o sangre oculta en heces. La hemoptisis procede de la vía respiratoria y la epistaxis de las fosas nasales: no son formas de hemorragia digestiva."},{"id":3,"ex":"Castilla - La Mancha · 2008","s":"agudo","q":"Indique de las siguientes situaciones ¿cuál puede ser causa de producir íleo-paralítico?:","o":["Trombosis mesentérica.","Manipulación de vísceras abdominales durante la intervención quirúrgica.","Invaginación intestinal.","Impactación fecal."],"a":1,"e":"El íleo paralítico es una obstrucción funcional: el intestino deja de propulsar por alteración de su motilidad, típicamente tras manipular las vísceras durante la cirugía (es temporal). La invaginación y la impactación fecal producen íleo mecánico, y la trombosis mesentérica, un abdomen agudo isquémico."},{"id":4,"ex":"Castilla y León · 2008","s":"intestino","q":"La enfermedad inflamatoria intestinal incluye dos entidades patológicas - enfermedad de Crohn y colitis ulcerosa - con muchas similitudes, pero también con importantes diferencias. De las siguientes características, seleccione la que es cierta:","o":["Ambas patologías se manifiestan con cólicos tras las comidas.","La colitis ulcerosa es más frecuente en hombres que en mujeres.","La colitis ulcerosa afecta exclusivamente a la mucosa intestinal.","La enfermedad de Crohn afecta exclusivamente al intestino grueso."],"a":2,"e":"La colitis ulcerosa es una inflamación superficial (mucosa, como mucho submucosa), continua y que empieza siempre en el recto. La enfermedad de Crohn es transmural, segmentaria y puede afectar a cualquier tramo desde la boca hasta el ano (sobre todo íleon terminal), por lo que la opción 4 es falsa.","ns":1},{"id":5,"ex":"Castilla y León · 2008","s":"sondas","q":"En el enema de limpieza de colon alto (lavativa de Harris), la finalidad es:","o":["Preparar el intestino para pruebas diagnósticas.","Administrar medicamentos por vía rectal.","Reblandecer las heces para su evacuación.","Favorecer la expulsión de gases."],"a":3,"e":"La lavativa de Harris es un enema de reducción de la distensión: se introducen 100-200 ml y se sube y baja el irrigador 5-6 veces para que el líquido entre y salga arrastrando los gases. No busca limpiar el colon para pruebas ni administrar fármacos."},{"id":6,"ex":"Castilla y León · 2008","s":"ostom","q":"¿Cuál de las sondas que se nombran a continuación se introduce por un procedimiento quirúrgico a través de la pared abdominal hasta el estómago?:","o":["Sonda de gastrostomía.","Sonda de yeyunostomía.","Sonda nasoentérica.","Ninguna de las respuestas anteriores es correcta."],"a":0,"e":"La gastrostomía es un estoma quirúrgico (o endoscópico, PEG) que comunica el estómago con la pared abdominal para alimentar. La yeyunostomía llega al yeyuno, no al estómago, y la sonda nasoentérica entra por la nariz, sin cirugía.","ns":1},{"id":7,"ex":"Navarra · 2008","s":"ostom","q":"En la colostomía transversa las heces son:","o":["Sólidas.","Semiblandas.","Blandas.","Líquidas."],"a":2,"e":"Regla de oro: cuanto más proximal es el estoma, más líquidas e irritantes son las heces. Ciego: líquidas; colon ascendente: semilíquidas; transverso: BLANDAS; descendente: semiblandas; sigma: sólidas."},{"id":8,"ex":"Navarra · 2008","s":"estom","q":"En la úlcera gástrica:","o":["El vómito no es común.","La hemorragia es más probable que en la úlcera duodenal.","La melena es más frecuente que la hematemesis.","La perforación es más probable que en la úlcera duodenal."],"a":1,"e":"Según el manual, las úlceras gástricas sangran con más frecuencia, aunque la úlcera duodenal sea la causa más frecuente de HDA por ser mucho más prevalente. En la úlcera gástrica el vómito es habitual y la perforación es más frecuente en la duodenal (aunque la gástrica perforada tiene más mortalidad)."},{"id":9,"ex":"Comunitat Valenciana · 2008","s":"intestino","q":"La celiaquía es una enfermedad intestinal crónica que se caracteriza por:","o":["Intolerancia a las proteínas de la leche de vaca o de soja.","Intolerancia a la lactosa.","Intolerancia al gluten.","Intolerancia al pescado."],"a":2,"e":"La enfermedad celíaca es una intolerancia permanente al gluten (trigo, cebada, centeno, avena contaminada) que atrofia las vellosidades del intestino delgado y produce malabsorción y diarrea esteatorreica. La intolerancia a la lactosa y la alergia a las proteínas de leche de vaca son entidades distintas."},{"id":10,"ex":"Comunitat Valenciana · 2008","s":"sondas","q":"Señale cuál de las siguientes es una sonda nasoenteral de una sola luz:","o":["Sonda de Salem.","Sonda de Miller-Abbot.","Sonda de Levin","Sonda de Foley."],"a":2,"e":"La sonda de Levin tiene una sola luz (con orificio distal y varios laterales). Salem tiene doble luz (una con válvula atmosférica), Miller-Abbott tiene dos luces con globo, y Foley es una sonda vesical, no digestiva."},{"id":11,"ex":"Extremadura TL2 · 2008","s":"estom","q":"La erosión de la mucosa gástrica o duodenal que alcanza o sobrepasa la muscularis mucosae se denomina:","o":["Gastritis aguda.","Gastritis crónica.","Ulcera péptica.","Colitis ulcerosa."],"a":2,"e":"Lo que diferencia la úlcera péptica de la erosión es la profundidad: la úlcera alcanza o atraviesa la muscularis mucosae; la erosión se queda en la mucosa. La gastritis es inflamación de la mucosa y la colitis ulcerosa afecta al colon, no al estómago."},{"id":12,"ex":"Extremadura TL1 · 2008","s":"ostom","q":"En los cuidados de enfermería a pacientes con ostomías, indique cual de las siguientes afirmaciones no es correcta:","o":["Deben evitarse compuestos químicos en la limpieza del estoma.","Para limpiar y secar la piel circundante, hay que frotar.","La bolsa debe cambiarse cada vez que sea necesario, sin abusar, ya que la piel sufre en cada cambio.","El secado de la misma debe ser cuidadoso y estricto."],"a":1,"e":"La piel periestomal se limpia con agua tibia, jabón neutro y esponja suave, con movimientos circulares de fuera hacia dentro, y se seca con suavidad, a toques, sin frotar. Frotar lesiona la piel y facilita la dermatitis. Las demás afirmaciones son correctas."},{"id":13,"ex":"Madrid · 2009","s":"boca","q":"Uno de los consejos higiénico-dietéticos recomendados al paciente con reflujo gastroesofágico es:","o":["Acostarse inmediatamente después de comer.","Ingesta habitual de café, te, y chocolate.","Elevar los pies de la cama 15 a 20 cm.","Reducción del peso corporal."],"a":3,"e":"En la ERGE se recomienda perder peso si hay obesidad, porque reduce la presión intraabdominal. Hay que elevar el CABECERO (no los pies) 15-20 cm, evitar café, té y chocolate (relajan el EEI) y no acostarse en las 3 horas siguientes a comer."},{"id":14,"ex":"Andalucía · 2009","s":"boca","q":"Uno de los consejos higiénico-dietéticos recomendados al paciente con reflujo gastroesofágico es:","o":["Acostarse inmediatamente después de comer.","Ingesta habitual de café, te y chocolate.","Elevar los pies de la cama 15 o 20 cms.","Reducción de peso corporal."],"a":3,"e":"La reducción de peso disminuye la presión intraabdominal y el reflujo. Las trampas: se eleva el cabecero de la cama, no los pies; café, té y chocolate relajan el EEI; tras comer hay que reposar sin tumbarse (no acostarse en las 3 horas siguientes)."},{"id":15,"ex":"Aragón · 2009","s":"boca","q":"De los cuatro factores determinantes de la salud bucodental señale cual es el factor mas influyentes:","o":["El medio ambiente.","El estilo de vida.","El sistema de asistencia sanitaria.","La biología."],"a":1,"e":"El modelo de Lalonde sitúa al estilo de vida como el determinante con mayor peso sobre la salud. En salud bucodental se traduce en el consumo de azúcares, la higiene oral, el tabaco y el alcohol: factores modificables con educación sanitaria."},{"id":16,"ex":"Aragón · 2009","s":"boca","q":"Al elaborar una dieta con un enfermo que padece una hernia de hiato, ¿qué alimentos se deben excluir?:","o":["Carne de ternera.","Huevo.","Aceite crudo.","Te y café."],"a":3,"e":"El té y el café disminuyen la presión del esfínter esofágico inferior y favorecen el reflujo; también la menta, el chocolate, las grasas y el alcohol. Los alimentos proteicos (huevo, carne) AUMENTAN el tono del EEI, por lo que están recomendados."},{"id":17,"ex":"Aragón · 2009","s":"intestino","q":"La aplicación de enemas en adulto mayores, habitualmente es para tratar:","o":["Parálisis abdominal.","Abdomen agudo.","Poliposis colorrectal.","Estreñimiento."],"a":3,"e":"En las personas mayores el uso más habitual del enema es tratar el estreñimiento y la impactación fecal (más frecuentes por inmovilidad, dieta pobre en fibra y fármacos). En el abdomen agudo está contraindicado por el riesgo de perforación."},{"id":18,"ex":"Aragón · 2009","s":"sondas","q":"Uno de los aspectos a valorar en un paciente que recibe alimentación por sonda nasogástrica es:","o":["Los edemas.","Las pupilas.","La distensión abdominal.","La ingurgitación yugular."],"a":2,"e":"La distensión abdominal es un signo de intolerancia a la nutrición enteral (residuo gástrico elevado, vaciamiento lento) y aumenta el riesgo de vómito y broncoaspiración. También se vigila el residuo, las náuseas, la diarrea y la posición de la sonda."},{"id":19,"ex":"Aragón · 2009","s":"estom","q":"¿cuál de las siguientes respuestas asociarías a una úlcera duodenal?:","o":["En general, aparece en personas mayores de 60 años.","El vómito es común.","Hay hiposecreción de ácido gástrico.","El consumo de alimentos alivia el dolor."],"a":3,"e":"El dolor de la úlcera duodenal aparece entre 1,5 y 3 horas después de comer, CEDE con la ingesta o los antiácidos y despierta por la noche. Se asocia a hipersecreción ácida y a población general joven-adulta; el vómito y la edad avanzada son más propios de la úlcera gástrica."},{"id":20,"ex":"Aragón · 2009","s":"valor","q":"La valoración de la necesidad de eliminación debe incluir:","o":["Color, consistencia y componentes de las heces.","Horario habitual y frecuencia.","Cambios recientes en el patrón.","Todas son correctas."],"a":3,"e":"Valorar la eliminación intestinal incluye las características de las heces (color, consistencia, componentes anómalos como sangre, moco o grasa), el patrón habitual (horario y frecuencia) y los cambios recientes, que pueden alertar de patología orgánica.","ns":1},{"id":21,"ex":"Galicia · 2009","s":"ostom","q":"En la colostomía descendente las heces son:","o":["Sólidas.","Semi blanda.","Blandas.","Líquidas."],"a":1,"e":"En la colostomía descendente el colon ya ha absorbido gran parte del agua: las heces son SEMIBLANDAS. Recuerda la secuencia: ciego líquidas → ascendente semilíquidas → transverso blandas → descendente semiblandas → sigma sólidas."},{"id":22,"ex":"Galicia · 2009","s":"ostom","q":"Cuando se realiza una ileostomía, el estoma estará colocado en la parte abdominal del lado:","o":["Izquierdo.","Derecho.","Es indiferente.","Ninguna respuesta es correcta."],"a":1,"e":"La ileostomía aboca el íleon terminal, que se sitúa en la fosa iliaca derecha, por lo que el estoma suele quedar en el lado derecho del abdomen. Las colostomías descendentes y sigmoideas se sitúan en el lado izquierdo.","ns":1},{"id":23,"ex":"Galicia · 2009","s":"valor","q":"¿Cuál de los siguientes alimentos debe evitarse antes de hacer un análisis de sangre oculta en heces?:","o":["Verduras y frutas crudas.","Los hidratos de carbono.","Los lácteos.","Las pastas y los arroces."],"a":null,"e":"Pregunta OBSOLETA. Con el antiguo test del guayaco había que hacer dieta 3 días antes: sin carne cruda o poco hecha, sin vitamina C > 250 mg/día y sin AINE, para evitar falsos resultados. Hoy el método de elección es el test inmunoquímico fecal (FIT), que detecta globina humana y no requiere restricción dietética ni farmacológica.","st":"O"},{"id":24,"ex":"Galicia · 2009","s":"higado","q":"En las primeras horas, después de una paracentesis mediante punción de la pared abdominal, se ha de vigilar especialmente:","o":["La temperatura.","La glucemia.","La tensión arterial.","Ninguna respuesta es correcta."],"a":2,"e":"La paracentesis evacuadora extrae gran volumen de líquido y puede provocar hipotensión por redistribución de la volemia. Por eso se vigila la tensión arterial en las primeras horas y se repone albúmina (10 g por cada 1,5 l extraídos a partir del 5.º litro).","ns":1},{"id":25,"ex":"Galicia · 2009","s":"sondas","q":"A la hora de retirar una sonda nasogástrica se debe:","o":["Dejar al enfermo unas horas a dieta absoluta.","Colocar al enfermo en posición de decúbito supino.","Despinzar la sonda.","Informar al enfermo y solicitar su colaboración."],"a":3,"e":"Como en toda técnica, primero se informa al paciente y se pide su colaboración. Después: posición de Fowler, lavar la sonda, PINZARLA (no despinzarla, para que no gotee contenido al retirarla) y retirarla mientras el paciente inspira profundamente y mantiene el aire (cierra la glotis)."},{"id":26,"ex":"Euskadi · 2009","s":"sondas","q":"La sonda de Levin se usa con mucha frecuencia, teniendo distinto calibre y presentando múltiples orificios en su extremo distal, ¿cuántas vías tiene este tipo de sondas?:","o":["Una sola vía.","Dos vías.","Tres vías.","Dos vías y una de drenaje."],"a":0,"e":"La sonda de Levin es de una sola vía (una luz), de PVC, con un orificio distal y varios laterales. Se usa para aspirar, descomprimir, lavar, alimentar y recoger muestras. La de doble luz es la Salem."},{"id":27,"ex":"Euskadi · 2009","s":"anat","q":"Las vitaminas liposolubles (K, E, D, A), se absorben unidas a la grasa. ¿En qué porción del intestino delgado se realiza este proceso?:","o":["Duodeno.","Yeyuno.","Íleon.","En todo el intestino delgado."],"a":2,"e":"En el íleon se absorben las vitaminas liposolubles (A, D, E, K), la vitamina B12 (unida al factor intrínseco), las sales biliares, la B6 y el ácido fólico. El duodeno absorbe sobre todo hierro y calcio y el yeyuno la mayoría de los principios inmediatos."},{"id":28,"ex":"Euskadi · 2009","s":"boca","q":"¿Cuál de los enunciados se ajusta a la siguiente definición?, presencia de dolor al deglutir:","o":["Pirosis.","Odinofagia.","Sialorrea.","Disfagia."],"a":1,"e":"Odinofagia = dolor al tragar. Disfagia = dificultad para tragar (generalmente indolora). Pirosis = ardor retroesternal por reflujo ácido. Sialorrea = exceso de salivación."},{"id":29,"ex":"Euskadi · 2009","s":"bilipan","q":"¿Qué patología le sugieren los siguientes signos y síntomas?: Amilasa elevada en sangre y orina. Dolor intenso epigástrico irradiado en cinturón. Vómitos, fiebre e hipotensión.","o":["Cirrosis hepática.","Pancreatitis aguda.","Úlcera péptica.","Colitis ulcerosa."],"a":1,"e":"Dolor epigástrico intenso irradiado en cinturón, vómitos, fiebre, hipotensión y amilasa elevada (> 3 veces el límite) son el cuadro típico de la pancreatitis aguda. La lipasa es aún más sensible y específica. La causa más frecuente es la litiasis biliar, seguida del alcohol."},{"id":30,"ex":"Euskadi · 2009","s":"valor","q":"En la valoración de pacientes con problemas gastrointestinales, debemos, entre otras actividades, estudiar las heces. ¿Qué sugieren unas heces pálidas?:","o":["Sospecha de sangrado del tracto superior gastrointestinal.","Dieta pobre en carnes.","Sospecha de infección intestinal.","Sospecha de deshidratación o falta de fibra en la dieta."],"a":1,"e":"El color pardo de las heces se debe a los pigmentos biliares (estercobilina) y en parte a la dieta: una dieta pobre en carne (o láctea) da heces más claras, que es lo que acepta la clave. Recuerda que unas heces muy pálidas, color masilla (acólicas), indican obstrucción de la vía biliar o hepatitis aguda, y que el sangrado alto produce heces negras (melenas).","f":"Clave dudosa: unas heces pálidas o acólicas orientan sobre todo a obstrucción biliar o hepatitis, opción que no aparece. La clave oficial elige la dieta pobre en carnes. Conviene revisarla."},{"id":31,"ex":"Baleares · 2009","s":"intestino","q":"La enfermedad de Crohn suele afectar particularmente...:","o":["...al yeyuno.","...al apéndice.","...al íleo.","...al páncreas."],"a":null,"e":"Pregunta ANULADA (probablemente por la errata «íleo», un cuadro clínico, en lugar de «íleon», el tramo intestinal). El concepto sí es de examen: la enfermedad de Crohn afecta sobre todo al íleon terminal y al colon derecho, de forma segmentaria y transmural.","st":"N"},{"id":32,"ex":"Baleares · 2009","s":"agudo","q":"¿Cuál es la causa más frecuente de la oclusión vascular mesentérica?:","o":["Una lesión en el hígado.","Lesiones en el bazo.","Una trombosis.","Una alteración en el tubo digestivo."],"a":2,"e":"La oclusión vascular mesentérica produce un abdomen agudo isquémico. Su mecanismo es la obstrucción de la arteria (o vena) mesentérica por un trombo o émbolo; de las opciones, la trombosis es la única causa vascular. Clínicamente destaca un dolor desproporcionado respecto a la exploración."},{"id":33,"ex":"Cantabria · 2010","s":"anat","q":"Entre el esófago y estómago se encuentra el/la:","o":["Cardias.","Píloro.","Válvula cecal.","Carúncula mayor."],"a":0,"e":"El cardias (esfínter esofágico inferior) separa el esófago del estómago. El píloro separa el estómago del duodeno y la válvula ileocecal (de Bauhin), el íleon del ciego. La carúncula mayor es la ampolla de Vater, en el duodeno."},{"id":34,"ex":"Cantabria · 2010","s":"bilipan","q":"¿Cuál de los siguientes signos, de ser positivo, sugiere el diagnóstico de una colecistitis?:","o":["Signo de Blumberg.","Signo de Murphy.","Signo de Rovsing.","Signo de Psoas."],"a":1,"e":"Signo de Murphy: al palpar el hipocondrio derecho, el paciente detiene la inspiración profunda por dolor. Es típico de la colecistitis aguda. Blumberg (rebote), Rovsing y psoas son signos de apendicitis o irritación peritoneal."},{"id":35,"ex":"Cantabria · 2010","s":"boca","q":"Al elaborar una dieta para un enfermo que padece una hernia de hiato ¿Qué alimentos se deben excluir?:","o":["Aceite crudo.","Te y café.","Huevo.","Carne de ternera."],"a":1,"e":"En la hernia de hiato se excluyen el té y el café porque relajan el esfínter esofágico inferior y favorecen el reflujo. Huevo y carne (proteínas) aumentan su tono. El aceite crudo en cantidad moderada es aceptable; lo que se evita son las comidas grasas y copiosas."},{"id":36,"ex":"Cantabria · 2010","s":"sondas","q":"Para una adecuada realización de la técnica del sondaje nasogástrico, la enfermera debe conocer una serie de pautas. Señale la respuesta correcta:","o":["La posición del paciente más apropiada para realizar el sondaje nasogástrico es en semifowler.","En una técnica estéril.","La longitud de sonda a introducir se debe calcular midiendo distancia desde la punta de la nariz al epigastrio del paciente.","Una vez introducida la sonda nasogástrica, comprobaremos su correcta colocación introduciendo 50cc de agua a través de ella."],"a":0,"e":"La sonda nasogástrica se coloca con el paciente semiincorporado (Fowler o semi-Fowler, cabecero a 45° o más) y el cuello ligeramente flexionado. NO es una técnica estéril (guantes no estériles), la longitud se mide nariz-lóbulo-xifoides (NEX) y nunca se comprueba la posición introduciendo agua."},{"id":37,"ex":"La Rioja · 2010","s":"sondas","q":"La Nutrición enteral en duodeno será de:","o":["300 ml en 6 a 7 tomas.","500 ml en 3 tomas.","300 ml cada dos horas.","Hasta 600 ml en 3 tomas."],"a":2,"e":"El intestino no tiene función de reservorio como el estómago: si se infunden bolos grandes en el duodeno aparecen distensión, diarrea y síndrome de dumping. Por eso se administran volúmenes pequeños y frecuentes (300 ml cada 2 horas, según la clave). En la práctica actual, la nutrición pospilórica se administra preferentemente en infusión continua.","f":"Pregunta antigua (2010). Hoy, en posición pospilórica se prefiere la infusión continua con bomba; conviene que el docente valore si mantenerla."},{"id":38,"ex":"La Rioja · 2010","s":"estom","q":"La infección por Helycobacter pylori:","o":["Es la causa fundamental de la enfermedad ulcerosa gastroduodenal.","Constituye un cofactor primordial en el desarrollo de adenocarcinoma y linfoma gástrico.","Su tratamiento erradicador permite la curación definitiva de la úlcera.","Todas son correctas."],"a":3,"e":"Todas son ciertas: H. pylori es la primera causa de úlcera gastroduodenal (95% de las duodenales y 75% de las gástricas), es el factor etiológico más importante del adenocarcinoma gástrico y del linfoma MALT, y su erradicación cura la úlcera y evita las recidivas.","ns":1},{"id":39,"ex":"La Rioja · 2010","s":"higado","q":"Signos precoces del inicio de la cirrosis. Indicar la respuesta incorrecta:","o":["El hígado puede estar aumentado de tamaño y puede ser doloroso.","Pérdida de peso.","Diarrea o estreñimiento.","Varices esofágicas."],"a":3,"e":"Las varices esofágicas son una complicación de la hipertensión portal en fases avanzadas (cirrosis descompensada), no un signo precoz. Al inicio la cirrosis puede ser asintomática o dar hepatomegalia, astenia, pérdida de peso y alteraciones del ritmo intestinal."},{"id":40,"ex":"La Rioja · 2010","s":"valor","q":"¿Qué es la esteatorrea?:","o":["Sangre brillante en heces.","Heces grasas, espumosas y malolientes.","Sangre roja tras las heces.","Heces negras."],"a":1,"e":"La esteatorrea es el exceso de grasa en las heces por maldigestión o malabsorción: heces pálidas o amarillentas, voluminosas, espumosas, brillantes, malolientes y que flotan. Se cuantifica con el test de Van de Kamer. La sangre roja es rectorragia y las heces negras, melenas."},{"id":41,"ex":"La Rioja · 2010","s":"valor","q":"¿Cuál de las siguientes medidas no está encaminada a inhibir el reflejo del hipo?:","o":["Apnea forzada.","Estimulación faríngea.","Masaje del paladar blando.","Mantener la ingesta oral."],"a":3,"e":"Las maniobras para cortar el hipo actúan sobre el arco reflejo vagal-frénico: apnea forzada, estimulación faríngea (tragar azúcar, agua fría), masaje del paladar blando, maniobra de Valsalva. Mantener la ingesta oral no inhibe el reflejo; de hecho, la distensión gástrica puede desencadenarlo."},{"id":42,"ex":"Castilla - La Mancha · 2010","s":"valor","q":"Señale cuál de las siguientes afirmaciones acerca de la hemorragia digestiva alta es falsa:","o":["El origen de la hemorragia digestiva alta se encuentra situado entre el esfínter esofágico superior y el ángulo de Treitz.","El origen de la hemorragia digestiva alta se encuentra situado por debajo del ángulo duodeno-yeyunal.","La hemorragia digestiva alta se puede manifestar en forma de hematemesis.","La hemorragia digestiva alta se puede manifestar en forma de melenas."],"a":1,"e":"La HDA se origina por ENCIMA del ángulo de Treitz (esófago, estómago y duodeno); la HDB, por debajo. La HDA se manifiesta como hematemesis y como la mayoría de las melenas. Por eso la opción 2 es la falsa."},{"id":43,"ex":"Castilla - La Mancha · 2010","s":"agudo","q":"¿Cuál de las siguientes patologías no suele cursar con un cuadro de abdomen agudo?:","o":["Apendicitis aguda.","Perforación de un divertículo de Meckel.","Reflujo gastroduodenal.","Rotura de aneurisma de aorta abdominal"],"a":2,"e":"El abdomen agudo es un dolor abdominal de instauración aguda que suele requerir actuación urgente: inflamatorio (apendicitis), perforativo (divertículo de Meckel perforado) o vascular (rotura de aneurisma). El reflujo gastroduodenal produce molestias dispépticas, no un abdomen agudo."},{"id":44,"ex":"La Rioja · 2011","s":"estom","q":"Señale cuál de estos síndromes post- gastrectomía se manifiesta esencialmente en periodo pospandrial inmediato (5 o 10 minutos después de la comida) produce astenia importante psíquica y física con sensación de malestar, estado lipotímico, angustia, disnea, obligando al enfermo a acostarse:","o":["Síndrome del estomago pequeño.","Síndrome del asa eferente.","Síndrome dumping.","Ninguno."],"a":2,"e":"El síndrome de dumping precoz aparece en los primeros minutos (hasta 30-60 min) tras comer, cuando un quimo hipertónico pasa rápido al intestino y arrastra líquido: plenitud, sudoración, palpitaciones, lipotimia y diarrea. Mejora tumbándose y fraccionando las comidas sin líquidos."},{"id":45,"ex":"La Rioja · 2011","s":"sondas","q":"No es una sonda nasoentérica:","o":["Sonda de Harris.","Sonda de Levin.","Sonda de Cantor.","Sonda de Miller- Abbott."],"a":1,"e":"La de Levin es una sonda NASOGÁSTRICA de una luz. Harris, Cantor y Miller-Abbott son sondas nasoentéricas largas (unos 3 m) para descompresión intestinal, hoy prácticamente en desuso."},{"id":46,"ex":"Extremadura · 2011","s":"valor","q":"Un vómito con sangre procedente del aparato digestivo se denomina:","o":["Melenas.","Hemoptisis.","Hematemesis.","Hematoquecia."],"a":2,"e":"Hematemesis = vómito de sangre (roja si el sangrado es activo; en «posos de café» si está digerida). Hemoptisis = sangre expulsada con la tos desde la vía respiratoria. Melena = heces negras por sangre digerida. Hematoquecia = sangre roja mezclada con las heces."},{"id":47,"ex":"Extremadura · 2011","s":"sondas","q":"¿Qué objetivo se persigue al administrar un enema carminativo a un paciente?:","o":["Limpiar la mayor cantidad posible de colon.","Facilitar la expulsión de gases.","Distender el recto y el colon sigmoideo.","Limpiar el recto y el colon sigmoideo."],"a":1,"e":"El enema carminativo estimula el peristaltismo y facilita la expulsión de gases retenidos (suele llevar glicerina o magnesio). Limpiar el colon es función del enema de limpieza."},{"id":48,"ex":"Euskadi · 2012","s":"boca","q":"Uno de los consejos higiénico-dietéticos recomendados al paciente con reflujo gastroesofágico es…:","o":["Acostarse inmediatamente después de comer, para hacer bien la digestión.","Ingesta habitual de café, te y chocolate para cerrar el esfínter.","Elevar los pies de la cama 15 a 20 cm., para mejorar la circulación.","No comer y beber 2 horas antes de acostarse."],"a":3,"e":"Para reducir el reflujo nocturno no se debe comer ni beber en las horas previas a acostarse (el manual recomienda no ingerir alimento en las 3 horas previas). Las demás opciones son trampas clásicas: tumbarse tras comer, café/té/chocolate y elevar los pies favorecen el reflujo."},{"id":49,"ex":"Euskadi · 2012","s":"higado","q":"El señor Sanz se encuentra ingresado desde ayer en el hospital a consecuencia de una cirrosis. ¿cuál de las siguientes manifestaciones le haría sospechar de un nuevo episodio de ascitis?:","o":["Amonio elevado, aumento de peso.","Amilasa sérica elevada, disminución de la diuresis.","Distensión abdominal, disminución de la diuresis, aumento del peso.","Hiperglucemia, distensión abdominal."],"a":2,"e":"La ascitis acumula líquido en el peritoneo: aumentan el perímetro abdominal y el peso, y disminuye la diuresis por la retención hidrosalina. Por eso se registran a diario el peso y el perímetro abdominal. El amonio elevado orienta a encefalopatía y la amilasa, a pancreatitis."},{"id":50,"ex":"Euskadi · 2012","s":"higado","q":"El señor Ruiz diagnosticado de cirrosis hepática se encuentra ingresado desde ayer en el hospital a consecuencia de una encefalopatía grado I. ¿cuál de las siguientes manifestaciones le haría sospechar encefalopatía grado II?:","o":["Somnolencia, confusión, letárgica, asterexis.","Disminución del tiempo de respuesta, cambio del patrón del sueño.","Cambio del patrón del sueño habla incoherente, hiperventilación.","Confusión, letárgica, dificultad para despertar fétor hepático."],"a":0,"e":"Según West Haven, el grado I cursa con alteraciones leves de la atención, euforia o ansiedad y alteración del ritmo del sueño. En el grado II aparecen letargia, desorientación, cambios de personalidad y asterixis (flapping) evidente. El grado III es somnolencia o estupor y el IV, coma."},{"id":51,"ex":"Aragón · 2012","s":"sondas","q":"con respecto a las sondas no es cierto:","o":["La sonda Salem es radiopaca con doble luz.","La sonda Foley está indicada en el sondaje vesical.","La sonda Ewald es de calibre muy pequeño y se introduce por la nariz.","La sonda Salem se utiliza para lavados gástricos en intoxicaciones medicamentosas."],"a":2,"e":"La sonda de Ewald es de GRAN calibre y se introduce por la BOCA (orogástrica) para lavados gástricos y extraer restos o coágulos. La Salem es radiopaca y de doble luz, y la Foley es vesical."},{"id":52,"ex":"Aragón · 2012","s":"ostom","q":"Con respecto a los cuidados de enfermería en el paciente ostomizado, señale la respuesta incorrecta:","o":["Lavado del estoma con agua tibia y jabón, secándolo a continuación de forma suave y exhaustiva.","Aportar al paciente y familia todo el apoyo necesario.","Las primeras semanas elegiremos un colector pequeño, para ir aumentando a uno de mayor tamaño.","Control del estoma."],"a":2,"e":"En el postoperatorio el estoma está edematoso y se va reduciendo durante las primeras 6-8 semanas: hay que medirlo en cada cambio e ir ajustando el orificio del colector (unos 3 mm mayor que el estoma). No se empieza con un colector pequeño para ir aumentando: se hace al revés."},{"id":53,"ex":"Aragón · 2012","s":"sondas","q":"La sonda de Sengstaken-Blakemore es:","o":["La menos usada para intentar controlar la hemorragia digestiva alta por varices esofágicas.","Una sonda de tres vías.","Una sonda de dos vías.","Una sonda con la cual no se debe hacer lavado gástrico."],"a":1,"e":"La Sengstaken-Blakemore tiene 3 vías y 2 balones: aspiración gástrica, balón gástrico (200-250 ml) y balón esofágico (inflado con aire a presión controlada). Se usa en la hemorragia por varices esofágicas que no se controla con fármacos ni endoscopia. La Minnesota añade una 4.ª vía de aspiración esofágica."},{"id":54,"ex":"Aragón · 2012","s":"sondas","q":"Si queremos realizar un lavado gástrico, ¿qué tipo de sonda utilizaremos?:","o":["Levin.","Salem.","Foucher.","Miller."],"a":2,"e":"Para el lavado gástrico se usan sondas orogástricas de gran calibre y una luz: Foucher (Faucher) o Ewald, que permiten extraer restos de tóxicos y coágulos. Levin y Salem son nasogástricas de menor calibre y Miller-Abbott es nasoentérica."},{"id":55,"ex":"Navarra · 2012","s":"higado","q":"El tipo de dieta más adecuada para un paciente con encefalopatía hepática es:","o":["Rica en hidratos de carbono y pobre en proteínas.","Pobre en hidratos de carbono e hiperproteica.","Rica en hidratos de carbono e hiperproteica.","Con abundantes líquidos e hipoproteica."],"a":null,"e":"Pregunta OBSOLETA. Antes se restringían las proteínas en la encefalopatía hepática, pero la ESPEN recomienda NO restringirlas: la restricción aumenta el catabolismo muscular y el amonio. Hoy la dieta indicada es hipercalórica e hiperproteica, individualizada (solo se aplaza el aporte proteico en casos hiperagudos graves).","st":"O","now":2},{"id":56,"ex":"Navarra · 2012","s":"bilipan","q":"La atención de enfermería en pacientes con pancreatitis aguda incluye la vigilancia y control precoz de posibles complicaciones, entre ellas la hipocalcemia. ¿Qué manifestación es un signo claro de la misma?:","o":["Disminución de los reflejos.","La hipocalcemia no es una complicación de la pancreatitis aguda.","Acortamiento del segmento ST.","Signo de Trousseau positivo."],"a":3,"e":"La hipocalcemia es una complicación frecuente de la pancreatitis aguda (el calcio precipita con los ácidos grasos de la necrosis grasa: saponificación). Los signos de tetania latente son Trousseau (espasmo carpal con el manguito) y Chvostek. En el ECG alarga el QT (no acorta el ST) y los reflejos aumentan."},{"id":57,"ex":"Asturias · 2013","s":"estom","q":"En un paciente al que se le ha practicado una gastrectomía, de cuál de la siguientes vitaminas se puede tener un déficit, varios años después de la intervención:","o":["Vitamina B12.","Vitamina B3.","Vitamina K.","Vitamina E."],"a":0,"e":"Tras una gastrectomía se pierden las células parietales que producen el factor intrínseco, imprescindible para absorber la vitamina B12 en el íleon. Las reservas hepáticas duran años, por eso la anemia megaloblástica aparece tardíamente. Se previene con B12 intramuscular de por vida."},{"id":58,"ex":"Asturias · 2013","s":"estom","q":"Cuando un pH gástrico es alcalino favorece:","o":["La destrucción de los organismos ingeridos.","El funcionamiento correcto del estómago pues el pH gástrico normal es el alcalino.","El pH gástrico alcalino es aquel que está por debajo de 1,5 y su aparición es inocua al funcionamiento del sistema digestivo.","La proliferación bacteriana y puede aumentar el riesgo de infección nosocomial."],"a":3,"e":"El pH ácido del estómago es bacteriostático y destruye los gérmenes ingeridos. Si se alcaliniza (IBP, antiácidos, nutrición enteral continua), las bacterias proliferan: aumenta el riesgo de sobrecrecimiento bacteriano y de neumonía nosocomial por aspiración. El pH gástrico normal es ácido (1,5-3,5)."},{"id":59,"ex":"Comunitat Valenciana A · 2013","s":"ostom","q":"Es una contraindicación absoluta para la colocación de una PEG (gastrostomía endoscópica percutánea) en un paciente de hospitalización domiciliaria:","o":["La cirugía gástrica o abdominal previas.","La obesidad.","La estenosis faringoesofágica dilatable.","Las alteraciones de la coagulación."],"a":3,"e":"Las alteraciones graves de la coagulación no corregibles contraindican de forma absoluta la PEG, por el riesgo de sangrado al puncionar el estómago. La cirugía previa, la obesidad o una estenosis que permite pasar el endoscopio son, como mucho, contraindicaciones relativas."},{"id":60,"ex":"Comunitat Valenciana A · 2013","s":"ostom","q":"Como norma general, la ubicación del estoma en las colostomías sigmoideas de Milles o Hartmann se sitúa en:","o":["El cuadrante inferior derecho abdominal.","El cuadrante inferior izquierdo abdominal.","El cuadrante anterosuperior de la cresta ilíaca derecha.","El cuadrante supra-umbilical izquierdo."],"a":1,"e":"El colon sigmoide está en la fosa iliaca izquierda, por lo que las colostomías sigmoideas (terminal o tipo Hartmann) se sitúan en el cuadrante inferior izquierdo. Las ileostomías suelen ir en el cuadrante inferior derecho."},{"id":61,"ex":"Comunitat Valenciana B · 2013","s":"boca","q":"La aparición de placas de color rojo brillante en el dorso de la lengua se denomina:","o":["Lengua escrotal.","Lengua geográfica.","Lengua nigra.","Lengua pilosa."],"a":1,"e":"La lengua geográfica (glositis migratoria benigna) muestra placas rojas lisas por pérdida de papilas, rodeadas de un borde blanquecino, que cambian de lugar como un mapa. La lengua escrotal presenta surcos profundos y la lengua nigra o pilosa, papilas alargadas oscuras."},{"id":62,"ex":"Comunitat Valenciana B · 2013","s":"ostom","q":"Normalmente, el estomatoterapeuta se encarga de marcar el sitio apropiado para realizar la ostomía antes de la intervención quirúrgica. ¿Cuál es la ubicación más apropiada?:","o":["Músculo recto abdominal.","Músculo oblicuo mayor.","Músculo transverso.","Músculo cremáster."],"a":0,"e":"El estoma debe situarse sobre el músculo recto anterior del abdomen: es la zona mejor protegida muscularmente y reduce hernias paraestomales y prolapsos. Se marca antes de la cirugía (es tarea de enfermería), evitando cicatrices, pliegues, prominencias óseas y la línea de la cintura."},{"id":63,"ex":"Aragón · 2014","s":"sondas","q":"Respecto al lavado gástrico es cierto que:","o":["Utilizaremos lubricante liposoluble.","Colocaremos al paciente en decúbito lateral derecho.","La hipotermia es una complicación en los niños.","Está indicado en la ingesta de sustancias cáusticas."],"a":2,"e":"En el lavado gástrico de los niños se usa suero templado y volúmenes ajustados al peso: el riesgo de hipotermia (y de alteraciones electrolíticas) es mayor. Se lubrica con producto hidrosoluble, se coloca al paciente en decúbito lateral IZQUIERDO y está contraindicado en la ingesta de cáusticos."},{"id":64,"ex":"Aragón · 2014","s":"sondas","q":"¿Cómo puede estimarse la longitud adecuada para la colocación de una sonda nasogástrica?:","o":["Desde la punta de la nariz del paciente hasta el cuadrante superior del abdomen.","Desde la punta de la nariz del paciente hasta el apéndice xifoides y desde ahí hasta el lóbulo de la oreja.","Desde la punta de la nariz del paciente hasta el lóbulo de la oreja y desde ahí hasta el apéndice xifoides.","Desde la punta de la nariz del paciente hasta el hipocondrio derecho."],"a":2,"e":"Método NEX (Hansen): se mide desde la punta de la NARIZ hasta el lóbulo de la OREJA y desde ahí hasta el apéndice XIFOIDES. El orden importa: la opción que mide primero hasta el xifoides es una trampa."},{"id":65,"ex":"Aragón · 2014","s":"bilipan","q":"Un paciente con dolor abdominal, ictericia y fiebre, presenta:","o":["Colelitiasis.","Colecistitis.","Coledocolitiasis.","Colangitis."],"a":3,"e":"Dolor, fiebre e ictericia forman la tríada de Charcot, característica de la colangitis aguda (infección de la vía biliar por obstrucción del colédoco). Si además hay shock y confusión mental, es la pentada de Reynolds."},{"id":66,"ex":"Aragón · 2014","s":"ostom","q":"La irrigación a través de un estoma, para promover una evacuación intestinal de forma regular estaría indicada en:","o":["Ileostomía.","Colostomía ascendente.","Colostomía sigmoidea.","Colostomía transversa."],"a":2,"e":"La irrigación solo está indicada en colostomías descendentes o sigmoideas: las heces son formes y el colon distal se puede «educar» para evacuar a horas fijas. No sirve en ileostomías ni en colostomías ascendentes o transversas, cuyo efluente es líquido y continuo."},{"id":67,"ex":"Extremadura · 2014","s":"valor","q":"El diagnóstico de enfermería “Motilidad gastrointestinal disfuncional (00196)” tiene una serie de características definitorias; señale la incorrecta:","o":["Dolor abdominal.","Presencia de ventosidades.","Diarrea.","Vómitos."],"a":1,"e":"Entre las características definitorias de la etiqueta NANDA «Motilidad gastrointestinal disfuncional» figuran la AUSENCIA de flatos, la diarrea, el dolor abdominal, los vómitos, la distensión, el residuo gástrico aumentado y los ruidos intestinales alterados. La presencia de ventosidades indica motilidad conservada."},{"id":68,"ex":"Extremadura · 2014","s":"estom","q":"Las úlceras pépticas pueden desarrollar complicaciones potencialmente mortales como son; señale la incorrecta:","o":["Penetración.","Diarrea.","Perforación.","Hemorragia."],"a":1,"e":"Las complicaciones graves de la úlcera péptica son la hemorragia (la más frecuente), la perforación (la más grave), la penetración en órganos vecinos (sobre todo el páncreas) y la estenosis pilórica. La diarrea no es una complicación de la úlcera."},{"id":69,"ex":"Madrid · 2014","s":"intestino","q":"Si utilizamos la Clasificación de Astler-Coller modificada por Gunderson-Sosin (1978) sobre el estadiaje del cáncer colorrectal, decimos que un tumor es de estadio B3 cuando:","o":["El tumor invade la muscular sin sobrepasarla y existen ganglios afectados.","El tumor invade microscópicamente toda la pared intestinal incluyendo serosas o grasa perirrectal y adhiere o invade otros órganos o estructuras adyacentes.","El tumor invade la muscular sin sobrepasarla y no existen ganglios afectados.","El tumor está limitado a la mucosa."],"a":1,"e":"Astler-Coller modificada: A = limitado a la mucosa; B1 = invade la muscular sin sobrepasarla; B2 = atraviesa toda la pared; B3 = invade o se adhiere a órganos adyacentes. Todos los B son sin ganglios; los estadios C son los mismos con ganglios afectados (la opción 1 sería C1)."},{"id":70,"ex":"Madrid · 2014","s":"ostom","q":"De las siguientes respuestas, indique cuál no es cierta en pacientes con ostomías recientes:","o":["Las heces de la sigmoidostomía son de consistencia normal o formada y se puede regular la frecuencia de la descarga.","La ileostomía produce un drenaje blanco y maloliente.","El drenaje de la ileostomía contiene algunas enzimas digestivas que dañan la piel.","La colostomía ascendente produce drenaje líquido y contiene enzimas digestivas."],"a":1,"e":"El efluente de la ileostomía es líquido o pastoso, verdoso-amarillento, continuo, poco maloliente y rico en enzimas que irritan la piel. Por eso la afirmación de que es «blanco y maloliente» es falsa. La sigmoidostomía da heces formes y regulables."},{"id":71,"ex":"Euskadi · 2015","s":"bilipan","q":"De las siguientes manifestaciones clínicas de la pancreatitis aguda, todas se presentan comúnmente excepto una. Señale la incorrecta:","o":["Dolor en el epigastrio medio.","Defensa abdominal.","Hipertensión.","Insuficiencia respiratoria."],"a":2,"e":"La pancreatitis aguda cursa con dolor epigástrico en cinturón, defensa abdominal, fiebre, taquicardia e HIPOtensión (por paso de líquido al tercer espacio). En las formas graves aparecen insuficiencia respiratoria (SDRA) y fallo multiorgánico. La hipertensión no es típica."},{"id":72,"ex":"Euskadi · 2015","s":"sondas","q":"¿Qué método debe emplearse para confirmar la colocación de una sonda nasogástrica?:","o":["Insuflación de aire en la sonda nasogástrica y auscultación.","Determinación del pH del contenido gástrico.","Observación de síntomas respiratorios (tos, incapacidad para hablar).","Cualquiera de los anteriores métodos puede emplearse y son fiables."],"a":null,"e":"Pregunta ANULADA. El método más fiable para comprobar la posición de la SNG es la radiografía; a pie de cama, el más fiable es medir el pH del aspirado (≤ 4 indica estómago). Insuflar aire y auscultar, observar si hay tos o sumergir el extremo en agua NO son métodos fiables y no deben usarse.","st":"N","ns":1},{"id":73,"ex":"Euskadi · 2015","s":"boca","q":"En la etiología de la caries dental se encuentran implicados diversos factores alimentarios. de los siguientes factores señale el correcto:","o":["Los nutrientes implicados siempre están mediatizados por otros factores.","La sacarosa aparece como el principal agente productor de caries.","Los edulcorantes xilitol y sorbitol están directamente implicados en el origen de la caries.","La fluoración del agua potable es una medida poco eficaz, ya que la mayoría de las aguas de riego y tierras cultivables poseen altas concentraciones de este elemento."],"a":1,"e":"La sacarosa es el azúcar más cariogénico: las bacterias de la placa la fermentan a ácidos que desmineralizan el esmalte. El xilitol y el sorbitol no son cariogénicos (el xilitol incluso protege) y la fluoración del agua es una medida eficaz de salud pública."},{"id":74,"ex":"Euskadi · 2015","s":"intestino","q":"¿Cuál de los siguientes diagnósticos de enfermería no es aplicable en el manejo del paciente con enfermedad intestinal inflamatoria crónica?:","o":["Desequilibrio en la nutrición, por debajo de los requerimientos corporales, relacionado con restricciones dietéticas, náusea y malabsorción.","Intolerancia a la actividad, relacionada con debilidad generalizada.","Estreñimiento, relacionado con el proceso inflamatorio.","Dolor agudo, relacionado con la inflamación gastrointestinal."],"a":2,"e":"La enfermedad inflamatoria intestinal cursa típicamente con diarrea (sanguinolenta en la colitis ulcerosa), dolor, malnutrición y astenia. El estreñimiento por el proceso inflamatorio no es un diagnóstico aplicable a su manejo habitual."},{"id":75,"ex":"La Rioja · 2016","s":"valor","q":"La determinación de grasa en heces se realiza mediante un test llamado:","o":["Test de Graham.","Test de Guayaco.","Test de Van de Kamer.","Todas son falsas."],"a":2,"e":"El test de Van de Kamer cuantifica la grasa fecal (se recogen heces de 72 h con una dieta de 100 g de grasa/día) y confirma la esteatorrea. El test del guayaco detectaba sangre oculta en heces.","ns":1},{"id":76,"ex":"La Rioja · 2016","s":"bilipan","q":"La triada de Charcot es característica de:","o":["Colangitis.","Colecistitis.","Colelitiasis.","Todas son ciertas."],"a":0,"e":"La tríada de Charcot (dolor abdominal tipo cólico + fiebre + ictericia) es característica de la colangitis aguda. La tríada de la colecistitis aguda es dolor en hipocondrio derecho + fiebre + leucocitosis.","ns":1},{"id":77,"ex":"Castilla y León · 2016","s":"boca","q":"Referido al índice CAO, señale la respuesta correcta:","o":["Es un indicador epidemiológico utilizado en dentición temporal.","Es un índice referido al primer molar permanente.","Es un indicador epidemiológico utilizado en dentición permanente.","Se obtiene sumando el número de niños que presentan una o más piezas definitivas cariadas, obturadas o ausentes por caries y dividiéndolo después entre el número total de niños examinados."],"a":2,"e":"El índice CAOD (cariados, ausentes y obturados) es un indicador epidemiológico de la dentición PERMANENTE, que se suele medir a los 12 años: suma de piezas C+A+O dividida entre el número de individuos (no entre el número de niños afectados). Para la dentición temporal se usa el índice cod (sin ausentes)."},{"id":78,"ex":"Galicia · 2016","s":"ostom","q":"¿Cuáles de las siguientes son complicaciones tardías de las ostomías?:","o":["Estenosis, sangrado, necrosis y hundimiento.","Estenosis, necrosis, prolapso y hernia paraestomal.","Estenosis, dehiscencia, malposición y alteraciones cutáneas.","Estenosis, complicaciones cutáneas, prolapso y hernia paraestomal."],"a":3,"e":"Complicaciones TARDÍAS: estenosis, retracción, prolapso, hernia paraestomal, granulomas y complicaciones cutáneas. Las PRECOCES (postoperatorio inmediato) son el sangrado, el edema, la isquemia o necrosis y la dehiscencia mucocutánea."},{"id":79,"ex":"Castilla y León · 2016","s":"ostom","q":"Las recomendaciones en la fase postoperatoria para el cuidado del paciente ostomizado son todas menos una, indique cuál:","o":["Evaluar el estoma inmediatamente después de la operación, así como el estado del estoma y de la piel periestomal con cada cambio del dispositivo.","Se puede emplear una irrigación por colostomía como un procedimiento seguro y eficaz para el manejo de colostomías descendentes o sigmoides en determinados pacientes adultos.","Introducir en la colostomía un supositorio de glicerina para ayudar a la evacuación de los residuos.","Formar al paciente y a sus familiares para que puedan reconocer las complicaciones que afectan al estoma y a la piel periestomal."],"a":2,"e":"La guía RNAO recomienda EVITAR introducir supositorios de glicerina en la colostomía. Sí se recomienda evaluar el estoma y la piel en cada cambio, enseñar a reconocer complicaciones y la irrigación en colostomías descendentes o sigmoideas seleccionadas."},{"id":80,"ex":"Extremadura · 2016","s":"sondas","q":"De las siguientes sondas nasogástricas, ¿Cuál consta de 4 luces?:","o":["Miller-Abbott.","Moss.","Minesota.","Sengstaken-blakemore."],"a":2,"e":"La sonda de Minnesota es una Sengstaken-Blakemore modificada con una 4.ª luz para aspirar el contenido esofágico: 4 vías y 2 balones. La Sengstaken tiene 3 vías, la Linton-Nachlas 3 vías y un balón, y la Miller-Abbott 2 luces."},{"id":81,"ex":"Galicia · 2016","s":"agudo","q":"¿Cuál de las siguientes no es una posible causa del íleo paralítico?:","o":["Infarto agudo de miocardio.","Bezoar.","Retención aguda de orina.","Todas son posibles causas."],"a":1,"e":"El bezoar (masa de material no digerible) obstruye la luz intestinal: produce un íleo MECÁNICO intraluminal, no paralítico. El íleo paralítico puede ser reflejo a procesos extraabdominales o retroperitoneales, como el IAM, la retención urinaria, el cólico renal o la cirugía.","ns":1},{"id":82,"ex":"Galicia · 2016","s":"sondas","q":"Se le ha colocado a un paciente una SNG (sonda nasogástrica) de silicona. Señale la respuesta incorrecta sobre este tipo de sondas:","o":["No se endurece en presencia de jugos digestivos.","Es un material biocompatible y no tóxico.","Requiere recambio mensual.","Son bien toleradas por el paciente porque no irritan el tramo nasofaríngeo."],"a":2,"e":"Las sondas de silicona (y poliuretano) son biocompatibles, blandas, no se endurecen con los jugos digestivos y se toleran bien, por lo que pueden permanecer varios meses. Las que necesitan recambio frecuente (cada 7-15 días) son las de PVC, que se endurecen. Por eso la opción 3 es la incorrecta."},{"id":83,"ex":"Galicia · 2016","s":"ostom","q":"Tras la colocación de una PEG a un paciente, los cuidados de enfermería en planta serán:","o":["No utilizar la sonda durante 24 horas.","No utilizar la sonda durante aproximadamente 8 horas, después se podrá pasar medicación por la misma.","Mantener al paciente en decúbito supino.","Cada 2-3 días debe girarse la sonda al menos una vuelta."],"a":1,"e":"Tras colocar una PEG se suele esperar unas horas (en torno a 6-8 h, según el protocolo) antes de usarla, empezando con agua y medicación y después con nutrición. Se mantiene el cabecero elevado y la sonda se gira a diario, una vez cicatrizado el trayecto, para evitar adherencias."},{"id":84,"ex":"Canarias · 2016","s":"estom","q":"De los siguientes enunciados, no supone una complicación de la úlcera péptica:","o":["Perforación de estómago.","Hemorragia digestiva.","Obstrucción pilórica.","Shock Neurogénico."],"a":3,"e":"Las complicaciones de la úlcera péptica son la hemorragia, la perforación, la penetración y la obstrucción pilórica. La hemorragia masiva puede llevar a un shock HIPOVOLÉMICO, pero no a un shock neurogénico, que se debe a la pérdida del tono simpático (lesión medular)."},{"id":85,"ex":"Canarias · 2016","s":"sondas","q":"Señale la respuesta incorrecta, en relación con el sondaje nasogástrico.","o":["Previene la broncoaspiración en pacientes intubados.","Sirve para drenar el contenido gástrico.","Se utilizará cuando exista perforación de esófago.","Se puede utilizar para administrar fármacos."],"a":2,"e":"La perforación esofágica contraindica de forma absoluta el sondaje nasogástrico, igual que la estenosis u obstrucción esofágica o la ingesta de cáusticos. La SNG sirve para drenar o descomprimir, alimentar, administrar fármacos y reducir el riesgo de aspiración en pacientes intubados."},{"id":86,"ex":"Canarias · 2016","s":"higado","q":"¿Qué tipo de dieta está indicada en un enfermo cirrótico con encefalopatía hepática?:","o":["Dieta hipoproteica.","Dieta hipersódica.","Dieta hiperproteica.","Dieta hipocalórica"],"a":null,"e":"Pregunta OBSOLETA. La dieta hipoproteica ya no se recomienda en la encefalopatía hepática: según la ESPEN, restringir proteínas aumenta el catabolismo muscular y el amonio. Se recomienda una dieta hipercalórica e hiperproteica individualizada, sin sal si hay ascitis.","st":"O","now":2},{"id":87,"ex":"Andalucía TL · 2016","s":"ostom","q":"En los cuidados a pacientes con colostomías hay que tener presente que :","o":["Se debe dar una alimentación variada.","Restringir el uso de alimentos como: cebollas, guisantes, nueces, coco.","El yogur y la mantequilla ayudan a eliminar el mal olor y las heces fluidas.","Todas son recomendaciones apropiadas."],"a":3,"e":"En el colostomizado se aconseja una dieta variada, introduciendo los alimentos poco a poco. Se limitan los flatulentos o de difícil digestión (cebolla, legumbres, coles, frutos secos, coco) y se aprovechan los que reducen el olor y espesan las heces (yogur, mantequilla, perejil).","ns":1},{"id":88,"ex":"Cantabria · 2017","s":"intestino","q":"¿En qué año se implanta el programa de cribado de cáncer de colon en la Comunidad Autónoma de Cantabria?:","o":["2006.","2008.","2010.","2012."],"a":1,"e":"Es un dato autonómico (Cantabria inició el programa en 2008 según la clave). Lo que debes dominar para cualquier OPE: población diana de 50-69 años (ampliándose a 74), test inmunoquímico fecal (FIT) bienal y colonoscopia si es positivo.","f":"Dato de calendario autonómico: poco valor didáctico fuera de Cantabria."},{"id":89,"ex":"Cantabria · 2017","s":"boca","q":"La enfermera, para fomentar la salud bucodental, debe informar a la población con los siguientes:","o":["Es recomendable cambiar el cepillo de dientes una vez al año.","La pasta de dientes tiene que contener flúor.","Hay que iniciar al cepillado cuando salgan los primeros dientes incisivos.","Los cepillos eléctricos son igual de recomendables que los manuales."],"a":0,"e":"El cepillo de dientes debe cambiarse cada 3 meses o cuando las cerdas estén deformadas, no una vez al año: esa es la afirmación errónea. Sí son correctas la pasta fluorada, la higiene desde la erupción del primer diente y que el cepillo eléctrico es tan válido como el manual si se usa bien.","f":"El enunciado parece incompleto: la clave señala la afirmación FALSA, como si la pregunta pidiera la incorrecta."},{"id":90,"ex":"Cantabria · 2017","s":"sondas","q":"Se le ha colocado a un niño una SNG (sonda nasogástrica) de silicona. Señale la respuesta incorrecta sobre este tipo de sondas:","o":["No se endurece en presencia de jugos digestivos.","Es un material biocompatible y no tóxico.","Requiere recambio mensual.","Son bien toleradas por el niño porque no irritan el tramo nasofaríngeo."],"a":2,"e":"Las sondas de silicona son biocompatibles, blandas y no se endurecen con los jugos digestivos, por eso se toleran bien y duran meses. El recambio frecuente es propio de las de PVC. La afirmación incorrecta es que requieren recambio mensual."},{"id":91,"ex":"Cantabria · 2017","s":"sondas","q":"¿En qué posición se debe poner a un paciente para colocarle una sonda nasogástrica?:","o":["Posición de Sims.","Posición de Fowler.","Decúbito lateral derecho.","Decúbito lateral izquierdo."],"a":1,"e":"Para colocar una SNG, el paciente debe estar en Fowler (sentado, cabecero a 45° o más) con el cuello ligeramente flexionado: facilita el paso al esófago y reduce el riesgo de aspiración. En niños pequeños o en inconscientes se prefiere la posición de Sims."},{"id":92,"ex":"Cantabria · 2017","s":"intestino","q":"La enfermedad de Crohn suele afectar particularmente:","o":["Al yeyuno.","Al apéndice.","Al íleon.","Al páncreas."],"a":2,"e":"La enfermedad de Crohn puede afectar a cualquier tramo, de la boca al ano, pero predomina en el ÍLEON terminal y el colon derecho, con afectación segmentaria («en parches») y transmural. Las fístulas y la afectación perianal son características."},{"id":93,"ex":"Cantabria · 2017","s":"valor","q":"Dentro de los cuidados a un paciente que se le ha realizado un tránsito baritado (papilla de bario) para el estudio del esófago, no se encuentra:","o":["Vigilar la aparición de diarrea producida por la irritación del bario.","Vigilar la distensión abdominal.","Vigilar que las heces vuelvan a ser de color marrón normal.","Vigilar la aparición o disminución de ruidos intestinales."],"a":0,"e":"El bario no irrita: tiende a ESTREÑIR y deja las heces blanquecinas. Tras el tránsito baritado se recomiendan abundantes líquidos, vigilar que las heces recuperen el color normal y controlar la distensión y los ruidos intestinales (riesgo de impactación). Vigilar la «diarrea por irritación» no forma parte de los cuidados."},{"id":94,"ex":"La Rioja · 2017","s":"agudo","q":"La complicación más grave de la apendicitis es:","o":["Absceso intraabdominal.","Pileflebitis.","Oclusión intestinal.","Peritonitis difusa aguda."],"a":3,"e":"La complicación más grave de la apendicitis es la peritonitis difusa por perforación del apéndice, con riesgo de shock séptico. La complicación más FRECUENTE es la infección de la herida quirúrgica. El absceso y la pileflebitis son posibles, pero menos graves o más raras."},{"id":95,"ex":"La Rioja · 2017","s":"boca","q":"La enfermedad de Reflujo Gastro-Esofágico (ERGE) puede desencadenar en una metaplasia conocida como:","o":["Acalasia.","Esófago de Barret.","Mallory-Weiss.","Enfermedad de Chagas."],"a":1,"e":"El esófago de Barrett es una metaplasia: el epitelio escamoso del esófago distal se sustituye por epitelio cilíndrico de tipo intestinal por la agresión ácida crónica. Es una lesión premaligna (adenocarcinoma de esófago). La acalasia es un trastorno motor y el Mallory-Weiss, un desgarro por vómitos."},{"id":96,"ex":"La Rioja · 2017","s":"valor","q":"Ante una sospecha de hemorragia digestiva aguda (HDA), haremos la siguiente prueba para su confirmación. Señala la correcta:","o":["Determinación de sangre en heces mediante tira reactiva.","Reacción de las heces con agua oxigenada.","Detección de sangre en aspirado nasogástrico con tira reactiva.","Ninguna es correcta."],"a":3,"e":"Ninguna de las pruebas propuestas confirma una HDA: las tiras reactivas en heces o en el aspirado y el agua oxigenada dan falsos positivos y negativos. El diagnóstico, que además permite tratar el punto sangrante, es la endoscopia digestiva alta, una vez estabilizado el paciente.","ns":1},{"id":97,"ex":"Extremadura · 2017","s":"ostom","q":"A un paciente al que se le ha practicado una ostomía de eliminación podremos recomendarle ciertos alimentos que harán disminuir el olor de sus heces. Señale cuál de los siguientes es uno de ellos:","o":["Mantequilla.","Espárragos.","Huevos.","Carne de cerdo."],"a":0,"e":"Entre los alimentos que reducen el olor de las heces están el yogur, la mantequilla, el queso fresco, el perejil y el zumo de limón. Los espárragos, los huevos, las coles, la cebolla, el ajo y el pescado azul AUMENTAN el olor."},{"id":98,"ex":"Extremadura · 2017","s":"valor","q":"Ante un paciente con hemorragia digestiva alta no varicosa tendremos en cuenta ciertas recomendaciones para el manejo y estabilización de su situación. Señale la respuesta incorrecta:","o":["Canalizaremos al menos dos accesos venosos de grueso calibre para una infusión rápida de líquidos.","No será necesaria la transfusión de unidades de concentrado de hematíes para reponer la volemia.","La volemia será repuesta en exceso para evitar la recidiva hemorrágica.","La volemia será repuesta con cristaloides o coloides a un ritmo adecuado para evitar la hipoperfusión."],"a":2,"e":"En la HDA no varicosa la volemia se repone con cautela: reponer en exceso aumenta la presión venosa y favorece que la lesión vuelva a sangrar. Se canalizan dos vías gruesas, se infunden cristaloides a ritmo adecuado y se transfunde con criterio restrictivo cuando la hemoglobina es < 7 g/dl.","f":"La opción 2 también es discutible: la transfusión SÍ puede ser necesaria (estrategia restrictiva, con Hb < 7 g/dl)."},{"id":99,"ex":"Extremadura · 2017","s":"anat","q":"Judit es una niña que está ingresada en la unidad de rehabilitación intestinal porque tiene un fracaso intestinal por una resección duodenal. Indique cuál de los siguientes signos puede presentar:","o":["Diarrea osmótica severa.","Malabsorción de hierro.","Sobrecrecimiento bacteriano.","Déficit de vitamina B12."],"a":1,"e":"El duodeno es el lugar principal de absorción del hierro (y del calcio). Si se reseca, la consecuencia característica es la ferropenia. La B12 se absorbe en el íleon y el sobrecrecimiento bacteriano no es un efecto específico de la resección duodenal."},{"id":100,"ex":"Murcia · 2018","s":"valor","q":"Un paciente que presenta unas heces de un color negro, de consistencia pegajosa y con mal olor, se denomina:","o":["Melenas.","Sangre oculta en heces.","Vómitos.","He auscultación de aire, la observación de tos o las burbujas en agua NO son fiables."},{"id":104,"ex":"Euskadi · 2018","s":"higado","q":"Indique cuál de las siguientes complicaciones no es característica en una cirrosis con hipertensión portal:","o":["Hidronefrosis.","Ascitis.","Encefalopatía.","Hemorragias."],"a":0,"e":"La hipertensión portal produce ascitis, varices con hemorragia, esplenomegalia y contribuye a la encefalopatía. La hidronefrosis (dilatación de la vía urinaria por obstrucción) no es una complicación de la cirrosis; el riñón se afecta como síndrome hepatorrenal."},{"id":105,"ex":"Andalucía · 2018","s":"boca","q":"CASO II: Juan de 74 años que vive con María su mujer de 72 años (cuidadora principal), 2 hijas que viven fuera de Andalucía y no tiene ayuda de cuidadores formales. Vive en una casa de dos alturas, con dormitorio y salón en diferente\nplanta. Enfermedad de Alzheimer desde hace 4 años, Diabetes Mellitus tipo 2 e hipertensión arterial desde hace 15 años. Camina por la casa solo con marcha insegura acompañado por su mujer. No utiliza dispositivos de ayuda para desplazarse. Come a veces solo, alimentación triturada con escaso contenido proteico y rico en hidratos de carbono de absorción rápida. Toma líquidos escasos cuando le obligan. IMC (Índice de Masa Corporal) de 18. Dependencia para higiene personal y vestirse, con incontinencia urinaria total, interrupciones del sueño frecuentes, con alguna crisis de agitación esporádica nocturna. Tratamiento farmacológico: Metformina, Glicazida, Lorazepam, rivastigmina, memantina 20 mgr y enalapril 10 mgr. Hace 10 días ingresó en hospital por fiebre y disnea, diagnosticado de neumonía de posible causa aspirativa. Al alta presenta dificultad para la deambulación con marcha inestable y falta de fuerza para la bipedestación, con gran agitación por las noches, UPP (Ulceras Por Presión) grado 1 en ambos talones por fricción. Continua con el tratamiento farmacológico anterior mas tratamiento antibiótico y Haloperidol gotas, protección de talones y agentes espesantes para la toma de líquidos. Al alta en la visita domiciliaria la cuidadora refiere que esta noche ha estado muy agitado y con sueño interrumpido, teniendo que permanecer a su lado toda la noche. El paciente ahora, esta encamado, porque no pueden levantarlo al sillón, le ha dado de comer en la cama, refiere que sigue tosiendo después de tragar el agua, todavía no ha usado el espesante, se comprueba que no puede tragar el tratamiento oral en pastillas. La mujer afirma que tiene dificultad para manejar la nueva situación de salud de su marido, quiere seguir cuidándolo y está muy preocupada por los nuevos cuidados que necesita.\nPregunta: ¿Cuál de las siguientes intervenciones no sería correcta si durante el ingreso se ha detectado un deterioro de la deglución?:","o":["Aconsejar a la cuidadora el uso de pajitas para la deglución de líquidos.","Utilizar agentes espesantes.","Ayudar al paciente a colocar la cabeza flexionada hacia delante, en preparación para la deglución.","Evitar líquidos."],"a":0,"e":"En la disfagia se desaconsejan pajitas y jeringas: dan menos control del bolo y aumentan el riesgo de aspiración. Se usan espesantes, el paciente se sienta erguido, flexiona el cuello hacia delante al tragar (protege la vía aérea) y se evitan los líquidos finos sin espesar."},{"id":106,"ex":"Andalucía · 2018","s":"boca","q":"¿Cuándo utilizaría espesantes o bebidas de textura modificada para la hidratación del paciente?:","o":["Cuando el paciente tiene estreñimiento.","Cuando el paciente tiene disfagia.","Cuando el paciente tiene una colostomía.","Cuando el paciente no puede utilizar la prótesis dental."],"a":1,"e":"Los espesantes y las texturas modificadas (néctar, miel, pudin, según la IDDSI) se usan en la disfagia orofaríngea: el líquido espeso avanza más despacio y permite cerrar la vía aérea a tiempo, reduciendo la broncoaspiración. El volumen y la viscosidad adecuados se determinan con el MECV-V."},{"id":107,"ex":
