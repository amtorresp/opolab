a":2,"ns":1,"po":["Líquidas e irritativas: ileostomía o ciego.","Semiformadas: descendente.","","Hay una verdadera: la c)."]},{"id":297,"ex":"Comunidad de Madrid · 2025","org":"Madrid","y":2025,"s":"estom","t":"eii","q":"La inflamación de la mucosa del estómago de aparición aguda y rápida y cuyo diagnóstico se realiza con una biopsia es:","o":["Gastritis.","Cáncer de estómago.","Colitis ulcerosa.","Enfermedad de Crohn."],"e":"La gastritis aguda es una inflamación de la mucosa gástrica de aparición rápida (AINE, alcohol, H. pylori, estrés). Su diagnóstico definitivo es la biopsia obtenida por endoscopia, y el tratamiento se basa en reducir la acidez con IBP.","a":0},{"id":298,"ex":"Comunidad de Madrid · 2025","org":"Madrid","y":2025,"s":"estom","t":"dumping","q":"En las dietas tras una resección gástrica debemos, seleccione una:","o":["Beber los líquidos separados de la comida.","Suplementar con Vitamina B12.","Evitar temperaturas extremas en los alimentos.","Todas las opciones son correctas."],"e":"Tras una gastrectomía: líquidos separados de las comidas (prevenir el dumping), suplemento de B12 (por falta de factor intrínseco) y evitar temperaturas extremas, además de comidas pequeñas y frecuentes, masticar bien y limitar los azúcares simples. Todas son correctas.","a":3,"ns":1},{"id":299,"ex":"Enfermería Defensa · 2025","org":"Defensa","y":2025,"s":"bilipan","t":"biliar","q":"La colangiopancreatografía retrógrada endoscópica (CPRE) es una prueba invasiva que se utiliza en endoscopia y radioscopia para:","o":["Diagnóstico y tratamiento de enfermedades del árbol biliar.","Diagnóstico y tratamiento de enfermedades del parénquima hepático.","Diagnóstico y tratamiento de metástasis extra biliares.","Para toma de muestras de bilis para su estudio microbiológico."],"e":"La CPRE (colangiopancreatografía retrógrada endoscópica) introduce contraste en la vía biliar y el conducto pancreático a través de la papila de Vater. Es diagnóstica y TERAPÉUTICA: extrae cálculos del colédoco (esfinterotomía), coloca prótesis, dilata estenosis y toma biopsias.","a":0},{"id":300,"ex":"Enfermería Defensa · 2025","org":"Defensa","y":2025,"s":"intestino","t":"eii","q":"Respecto a la enfermedad inflamatoria intestinal, es cierto que:","o":["La enfermedad de Crohn afecta fundamentalmente a la mucosa del colon y casi constantemente al recto.","Las fisuras anales son la manifestación perianal menos frecuente en la enfermedad de Crohn.","La colitis ulcerosa se caracteriza por una inflamación transmural y segmentaria que puede afectar a cualquier porción del tracto gastrointestinal.","Las principales manifestaciones de la colitis ulcerosa son la diarrea con sangre y moco, la urgencia defecatoria y el dolor abdominal."],"e":"La colitis ulcerosa se manifiesta con diarrea con sangre y moco, urgencia defecatoria, tenesmo y dolor abdominal. Las opciones a y c intercambian rasgos con el Crohn (que es el transmural y segmentario) y en el Crohn las fisuras anales son de hecho la manifestación perianal MÁS frecuente.","tr":"cucrohn","a":3,"ns":1,"po":["Eso describe la colitis ulcerosa, no el Crohn.","Falso: las fisuras son la manifestación perianal MÁS frecuente.","Eso describe el Crohn.",""]},{"id":301,"ex":"Enfermería Defensa · 2025","org":"Defensa","y":2025,"s":"ostom","t":"heces_ostomia","q":"Un estoma de eliminación tipo ileostomía se caracteriza por:","o":["Está localizado en el cuadrante inferior derecho del abdomen.","Evalúa heces pastosas o semiformadas.","La frecuencia de evacuación es de 1 o 2 veces al día.","Está indicada en caso de prolapso rectal irreparable."],"e":"La ileostomía se suele situar en el cuadrante inferior derecho (íleon terminal), con heces líquidas o pastosas y continuas (no 1-2 veces al día). Se indica en la colitis ulcerosa, el Crohn, la poliposis o como protección de anastomosis; el prolapso rectal irreparable se trata con colostomía.","a":0},{"id":302,"ex":"Enfermería Defensa · 2025","org":"Defensa","y":2025,"s":"anat","t":"anatomia","q":"La arteria esplénica es rama de:","o":["La arteria mesentérica inferior.","La arteria cólica media.","El tronco celíaco.","Es una rama de la arteria esofágica inferior."],"e":"La arteria esplénica es una de las tres ramas del tronco celíaco, junto con la gástrica izquierda y la hepática común. Irriga el bazo y parte del páncreas y del estómago (vasos cortos y gastroepiploica izquierda).","a":2},{"id":303,"ex":"SAS Generalistas · 2025","org":"Andalucía","y":2025,"s":"ostom","t":"heces_ostomia","q":"¿En qué tipo de ostomía fluyen heces sólidas?","o":["En colostomía descendente.","En colostomía derecha.","En colostomía transversa.","En todos los tipos de colostomías."],"e":"Cuanto más distal es la colostomía, más sólidas son las heces. Entre las opciones, la descendente es la más distal y la única que da heces de consistencia formada (semiblandas a sólidas; la sigmoidea, plenamente sólidas). La derecha (ascendente) da heces semilíquidas y la transversa, blandas.","tr":"distal","a":0,"po":["","Derecha (ascendente): semilíquidas.","Transversa: blandas.","No: depende del tramo."]},{"id":304,"ex":"SAS Generalistas · 2025","org":"Andalucía","y":2025,"s":"sondas","t":"sng_verif","q":"En el transcurso de los cuidados de la paciente, en una de las movilizaciones para el aseo diario, parece que se ha movilizado la sonda nasogástrica que tenía colocada y la enfermera decide volver a comprobar la correcta colocación de la misma en estómago para evitar complicaciones. Para ello, podría utilizar cualquiera de estos métodos de verificación de colocación de sonda nasogástrica, excepto uno que está claramente desaconsejado. Señale cuál NO está indicado:","o":["Auscultación del gorgoteo debajo del apéndice xifoides tras insuflación de aire.","Radiografía de abdomen superior / tórax inferior.","Capnografía.","Medición de pH del contenido gástrico, si el paciente no está en tratamiento con inhibidores de la bomba de protones."],"e":"La auscultación del aire insuflado («whoosh») está claramente desaconsejada: no distingue estómago, esófago, pulmón o intestino. Son válidas la radiografía (método de referencia), el pH del aspirado (si no toma IBP) y la capnografía (detecta CO₂ si la sonda está en la vía aérea).","tr":"verificacion","a":0,"po":["","Está indicada: la radiografía es la referencia.","Está indicada: el CO₂ detecta la vía aérea.","Está indicada si no toma IBP."]},{"id":305,"ex":"Hospital General Universitario de Valencia · 2025","org":"C. Valenciana","y":2025,"s":"intestino","t":"ccr","q":"La prueba de confirmación diagnóstica recomendada en el Programa de prevención del cáncer colorrectal de la Comunitat Valenciana es:","o":["El test de sangre oculta en heces.","La rectoscopia.","Marcadores tumorales.","La colonoscopia."],"e":"El test de sangre oculta en heces es la prueba de CRIBADO; si es positivo, la prueba de CONFIRMACIÓN diagnóstica es la colonoscopia, que visualiza todo el colon, permite biopsiar y extirpar pólipos en el mismo acto.","a":3},{"id":306,"ex":"Hospital General Universitario de Valencia · 2025","org":"C. Valenciana","y":2025,"s":"boca","t":"disfagia","q":"Ante un paciente con sospecha de disfagia, se debe observar si durante las comidas ocurre alguno de los siguientes síntomas en mayor o menor intensidad:","o":["Dificultad en la masticación.","Después de comer o beber tiene que carraspear la garganta para aclararla.","Tos nocturna.","Todas las respuestas son verdaderas."],"e":"Son signos de alarma de disfagia la dificultad para masticar o formar el bolo, carraspear o toser al comer o beber (y después), cambios en la voz, el babeo, comer muy despacio, la tos nocturna por microaspiraciones, la pérdida de peso y las neumonías de repetición. Todas son correctas.","a":3,"ns":1},{"id":307,"ex":"Hospital General Universitario de Valencia · 2025","org":"C. Valenciana","y":2025,"s":"sondas","t":"sng","q":"De los siguientes usos en una sonda de alimentación y para prevenir la obstrucción de la misma, se debe infundir 30-60 ml de agua tibia directamente. Indique la respuesta incorrecta:","o":["Administración intermitente, antes y después de la infusión.","Administración continua, al cambiar el frasco.","Si la sonda no se utiliza, no es necesario.","En administración de fármacos antes y después de cada fármaco."],"e":"Aunque la sonda NO se use, hay que lavarla periódicamente con agua (al menos una vez al día o cada 8 h, según el protocolo) para mantenerla permeable. También se lava antes y después de cada toma intermitente, al cambiar el frasco en la continua y antes y después de cada fármaco.","a":2},{"id":308,"ex":"Navarra · 2025","org":"Navarra","y":2025,"s":"boca","t":"erge","q":"Entre las recomendaciones para evitar el reflujo gastroesofágico (RGE) señale la respuesta correcta:","o":["Aumentar la cantidad de líquidos con las comidas.","Son recomendables situaciones que aumenten la presión intraabdominal.","Recomendaremos el consumo de alimentos que aumenten la presión del esfínter esofágico inferior (EEI).","Recomendaremos el consumo de alimentos que disminuyan la presión del EEI."],"e":"En el RGE se recomiendan alimentos que AUMENTAN la presión del esfínter esofágico inferior: los proteicos (carne magra, pescado, huevo). Se evitan los que la reducen (grasas, chocolate, menta, café, alcohol), el exceso de líquido con las comidas y lo que sube la presión intraabdominal (fajas, obesidad, estreñimiento).","tr":"cabecero","a":2,"po":["Más líquido con las comidas distiende el estómago y favorece el reflujo.","Lo que sube la presión intraabdominal empeora el reflujo.","","Lo que baja la presión del EEI empeora el reflujo."]},{"id":309,"ex":"Navarra · 2025","org":"Navarra","y":2025,"s":"bilipan","t":"biliar","q":"¿Cuál es el mecanismo fisiopatológico subyacente en la colecistitis aguda?","o":["Inflamación del hígado debido a infecciones virales.","Obstrucción del conducto cístico por cálculos biliares, causando inflamación e infección.","Producción excesiva de bilis sin obstrucción del conducto biliar.","Degeneración del tejido pancreático por consumo excesivo de alcohol."],"e":"La colecistitis aguda se produce casi siempre porque un cálculo obstruye el conducto CÍSTICO: la vesícula se distiende, se inflama y puede sobreinfectarse. Si el cálculo obstruye el colédoco, hablamos de coledocolitiasis, que puede complicarse con colangitis o pancreatitis.","a":1},{"id":310,"ex":"Navarra · 2025","org":"Navarra","y":2025,"s":"intestino","t":"ccr","q":"El Programa de Prevención de Cáncer Colorrectal de Navarra está dirigido a:","o":["Mujeres y hombres residentes en Navarra, asintomáticos, con edades comprendidas entre 50 y 69 años.","Mujeres y hombres residentes en Navarra, asintomáticos, con edades comprendidas entre 45 y 70 años.","Mujeres y hombres residentes en Navarra, asintomáticos, con factores de riesgo o factores genéticos.","Mujeres y hombres residentes en Navarra, asintomáticos, con edades comprendidas entre 45 y 65 años."],"e":"El programa navarro, como el resto, se dirige a hombres y mujeres asintomáticos de 50 a 69 años residentes en la comunidad. Las personas con factores de riesgo o genéticos se derivan a programas de alto riesgo con colonoscopia.","a":0},{"id":311,"ex":"Cantabria · 2025","org":"Cantabria","y":2025,"s":"estom","t":"ulcera","q":"¿Cuál de los siguientes fármacos NO es utilizado en la erradicación del Helicobacter pylori?","o":["Amoxicilina.","Metronidazol.","Claritromicina.","Estreptomicina."],"e":"Para erradicar H. pylori se usa la cuádruple terapia concomitante sin bismuto (OCAM: omeprazol + claritromicina + amoxicilina + metronidazol, 10-14 días) o, como alternativa, la cuádruple con bismuto (con tetraciclina) o la pauta con levofloxacino. La estreptomicina se usa en la tuberculosis, no en H. pylori.","a":3},{"id":312,"ex":"Cantabria · 2025","org":"Cantabria","y":2025,"s":"sondas","t":"sondas_tipos","q":"Tras estabilizar a un paciente politraumatizado en el Área de Urgencias, le indican que inserte una sonda nasogástrica de doble luz para aspiración de contenido gástrico. Este tipo de sonda se denomina:","o":["Salem.","Levin.","Foley.","Sengstaken-Blakemore."],"e":"La Salem es la sonda nasogástrica de DOBLE luz: una luz para aspirar y otra de ventilación (con entrada de aire) que impide que la mucosa gástrica quede succionada. Es la de elección para la aspiración continua. La Levin tiene una sola luz.","a":0},{"id":313,"ex":"Cantabria · 2025","org":"Cantabria","y":2025,"s":"bilipan","t":"charcot","q":"La Triada de Charcot, se corresponde con la clínica de una patología de las vías biliares, ¿Con cuál?","o":["Colecistitis aguda.","Colangitis aguda.","Colelitiasis.","Apendicitis aguda."],"e":"La tríada de Charcot (dolor, fiebre e ictericia) corresponde a la colangitis aguda, la infección de la vía biliar por obstrucción del colédoco. La colecistitis se caracteriza por dolor en hipocondrio derecho, fiebre, leucocitosis y signo de Murphy.","tr":"charcot","a":1,"po":["Colecistitis = Murphy, sin la tríada.","","La colelitiasis no complicada no da fiebre ni ictericia.","La apendicitis no es una patología biliar."]},{"id":314,"ex":"Cantabria - Aplazado · 2025","org":"Cantabria","y":2025,"s":"sondas","t":"sondas_tipos","q":"¿Cuál de las siguientes NO es un tipo de sonda para la administración de la alimentación enteral?","o":["La sonda Levin.","La sonda tipo Freka.","La sonda Faucher.","La sonda de gastrostomía endoscópica percutánea."],"e":"La Faucher es una sonda orogástrica gruesa para el LAVADO gástrico, no para nutrir. Levin, Freka (fina, de poliuretano, para nutrición enteral prolongada) y la PEG sí sirven para administrar alimentación enteral.","tr":"lavado","a":2,"po":["La Levin sí sirve para nutrir.","La Freka es específica de nutrición enteral.","","La PEG es una vía de nutrición prolongada."]},{"id":315,"ex":"Cantabria - Aplazado · 2025","org":"Cantabria","y":2025,"s":"intestino","t":"eii","q":"La enfermedad de Crohn es un proceso inflamatorio que se caracteriza porque:","o":["La afectación es uniforme, produciendo lesiones continuas.","Afecta a cualquier tramo del tubo gastrointestinal.","Afecta únicamente a la mucosa superficial del colon.","Cursa generalmente con hemorragia rectal."],"e":"La enfermedad de Crohn puede afectar a cualquier tramo del tubo digestivo, de la boca al ano, con lesiones segmentarias (no continuas) y transmurales. La afectación exclusiva de la mucosa del colon y la rectorragia habitual son propias de la colitis ulcerosa.","tr":"cucrohn","a":1,"po":["Falso: es segmentaria, en parches.","","Falso: es transmural y de cualquier tramo.","La rectorragia es típica de la CU."]},{"id":316,"ex":"Cantabria - Aplazado · 2025","org":"Cantabria","y":2025,"s":"estom","t":"ulcera","q":"¿Cuál de las siguientes afirmaciones NO se corresponde con la úlcera duodenal?","o":["Es una de las causas más frecuentes de hemorragia digestiva alta.","Se relaciona con el Helicobacter pylori.","Produce dolor epigástrico quemante.","El dolor no cede con la ingesta de alimentos."],"e":"En la úlcera duodenal el dolor SÍ cede con la ingesta (y con los antiácidos): aparece 1,5-3 h después de comer y por la noche. Las demás son correctas: es causa frecuente de HDA, se relaciona con H. pylori (95%) y produce dolor epigástrico urente.","tr":"ulceradolor","a":3,"po":["Es cierto: es causa frecuente de HDA.","Es cierto: se relaciona con H. pylori en el 95%.","Es cierto: el dolor es epigástrico y urente.",""]},{"id":317,"ex":"Cantabria - Aplazado · 2025","org":"Cantabria","y":2025,"s":"sondas","t":"sondas_tipos","q":"De los siguientes tipos de sondas, ¿cuál es la indicada para la compresión de las varices esofágicas sangrantes?","o":["Sengstaken-Blakemore.","Levin.","Miller-Abbott.","Salem."],"e":"La Sengstaken-Blakemore comprime las varices esofágicas sangrantes con dos balones: el gástrico la ancla en el cardias y el esofágico comprime las varices. Es una medida temporal (máximo 24-48 h) mientras se realiza un tratamiento definitivo.","tr":"balones","a":0,"po":["","Levin: sin balones.","Miller-Abbott: descompresión intestinal.","Salem: aspiración."]},{"id":318,"ex":"SAS EFyC - Aplazado · 2025","org":"Andalucía","y":2025,"s":"ostom","t":"peg","q":"Explica a la hija de Juan los resultados obtenidos en la valoración de la piel y los cuidados a realizar. Una vez terminado, usted se centra en mostrarle los cuidados que deberá adoptar con la sonda de gastrostomía. ¿Cuál de los siguientes cuidados NO le recomendaría?","o":["Mantener la sonda limpia y seca.","Medir la longitud externa de la sonda para detectar posibles migraciones.","Girar la sonda a diario para evitar la fijación a la piel.","Comprobar el inflado del globo a diario y, en caso de pérdida, inflarlo con 7-10 ml de suero salino."],"e":"El balón de la sonda de gastrostomía se comprueba cada 1-2 semanas (no a diario), aspirando su contenido, y se rellena con AGUA DESTILADA (5-10 ml), no con suero salino, que cristaliza y puede dañar la válvula. Mantener la sonda limpia y seca, medir la longitud externa y girarla a diario son cuidados correctos.","a":3},{"id":319,"ex":"SAS EFyC - Aplazado · 2025","org":"Andalucía","y":2025,"s":"ostom","t":"peg","q":"La hija de Juan está muy preocupada porque no sabe si va a ser capaz de administrar la nutrición por la sonda con jeringa en bolos. Le explica detalladamente como se realiza la administración y le alerta que una de las principales complicaciones puede ser la obstrucción de la sonda. ¿Qué le recomendaría hacer para evitar una obstrucción?","o":["Recomendaría el uso de una solución de bicarbonato sódico al 8,4% una vez al día.","Recomendaría la infusión con bebidas carbonatadas que contienen cola o enzimas pancreáticos al menos cada 2-3 días.","Recomendaría lavar con al menos 30 ml de agua potable antes de empezar y después de terminar la nutrición.","Recomendaría lavar con 100 ml de agua una vez al día después de la toma más abundante."],"e":"La mejor prevención de la obstrucción es lavar con al menos 30 ml de agua antes y después de cada toma y de cada fármaco (y periódicamente si no se usa). Las bebidas de cola, el bicarbonato o las enzimas pancreáticas se reservan para intentar desobstruir, no se usan como rutina.","a":2},{"id":320,"ex":"SAS EFyC - Aplazado · 2025","org":"Andalucía","y":2025,"s":"ostom","t":"peg","q":"Por último, usted explica que otra posible complicación es que la sonda se salga en algún momento de forma accidental. ¿Qué debería hacer en ese caso la cuidadora?","o":["Si la salida ocurre en las 2-3 primeras semanas tras la colocación puede reintroducirse la sonda o una sonda tipo Foley del mismo calibre, fijándola con cinta adhesiva al abdomen, hasta que se coloque una nueva.","Si la salida ocurre en las 2-3 primeras semanas tras la colocación es necesario el traslado al hospital, ya que el trayecto fistuloso no habrá cicatrizado y puede crearse una falsa vía.","Introducir nuevamente la sonda independientemente del tiempo transcurrido desde su colocación. Lo importante es que no se cierre el estoma.","No puede hacer nada ya que se deberá realizar una nueva gastrostomía endoscópica."],"e":"Si la sonda sale en las 2-3 primeras semanas, el trayecto fistuloso entre estómago y piel aún no ha madurado: reintroducirla puede crear una falsa vía hacia el peritoneo. Hay que acudir al hospital. Con el estoma ya maduro, se puede colocar una sonda (o una Foley) para que no se cierre hasta el recambio.","a":1},{"id":321,"ex":"La Rioja EFyC · 2025","org":"La Rioja","y":2025,"s":"ostom","t":"ostomias","q":"¿Cuál de las siguientes respuestas se pueden considerar que son complicaciones del estoma?","o":["Estoma congestivo, necrosado o pálido.","Enrojecimiento periestomal.","Prolapso del estoma.","Las respuestas a y c son correctas."],"e":"Las alteraciones del propio estoma (congestivo, necrosado o pálido por isquemia, y el prolapso) son complicaciones del estoma. El enrojecimiento de la piel periestomal es una complicación CUTÁNEA, no del estoma en sí. Por eso la respuesta es «a y c».","a":3,"ns":1},{"id":322,"ex":"SES Urgencias AP · 2025","org":"Extremadura","y":2025,"s":"sondas","t":"sng","q":"¿Cuál NO es una contraindicación absoluta para la colocación de una sonda nasogástrica?","o":["Disminución del nivel de conciencia.","Sospecha de rotura esofágica.","Fractura de huesos faciales.","Coagulopatía grave no controlada."],"e":"La disminución del nivel de conciencia no contraindica de forma absoluta la SNG: lo que se hace es proteger primero la vía aérea (intubación) y después sondar. Sí son contraindicaciones la sospecha de rotura esofágica, las fracturas faciales (o de la base del cráneo, en las que se usa la vía oral) y la coagulopatía grave no controlada.","tr":"contraindica","a":0,"po":["","La sospecha de rotura esofágica sí contraindica de forma absoluta.","La fractura facial sí contraindica la vía nasal.","La coagulopatía grave no controlada sí la contraindica."]},{"id":323,"ex":"SES Urgencias AP · 2025","org":"Extremadura","y":2025,"s":"sondas","t":"sondas_tipos","q":"Atendemos a un paciente que presenta sangrado activo por varices esofágicas. ¿Qué sonda estaría indicada en este caso?","o":["Sonda Nelaton modificada.","Sonda Sengstaken-Blakemore.","Sonda Ewald o Edlich.","Sonda Foucher."],"e":"En el sangrado activo por varices esofágicas que no se controla con fármacos ni endoscopia se usa la sonda de Sengstaken-Blakemore (o la Minnesota) para el taponamiento con balón. Ewald y Foucher son para el lavado gástrico y la Nelaton es vesical.","tr":"balones","a":1,"po":["La Nelaton es vesical.","","Ewald/Edlich: lavado gástrico.","Foucher: lavado gástrico."]},{"id":324,"ex":"SES Urgencias AP · 2025","org":"Extremadura","y":2025,"s":"agudo","t":"cirrosis","q":"¿Qué indica el signo de Blumberg cuando es positivo?","o":["Irritación peritoneal.","Inflamación hepática.","Derrame peritoneal.","Distensión vesical."],"e":"El signo de Blumberg es el dolor a la descompresión brusca del abdomen (dolor de rebote): indica irritación PERITONEAL. En la fosa iliaca derecha es típico de la apendicitis aguda.","a":0},{"id":325,"ex":"SES Urgencias AP · 2025","org":"Extremadura","y":2025,"s":"valor","t":"lavado","q":"Durante la anamnesis, un paciente refiere realizar deposiciones de color negro, sin brillo y de consistencia no pegajosa. ¿Qué nos indica este hallazgo?","o":["Melenas debido a un sangrado digestivo alto.","Melenas debido a un sangrado digestivo bajo.","Deposiciones secundarias a la toma de hierro, carbón activado o alimentos oscuros.","Deposiciones secundarias a un cuadro de ictericia obstructiva."],"e":"Unas heces negras pero sin brillo, no pegajosas y sin el olor fétido característico no son melenas: suelen deberse al hierro oral, el bismuto, el carbón activado o alimentos oscuros (morcilla, regaliz, arándanos). La melena verdadera es brillante, pegajosa («alquitrán») y maloliente.","a":2},{"id":326,"ex":"SES Urgencias AP · 2025","org":"Extremadura","y":2025,"s":"valor","t":"hemorragia","q":"Una hemorragia digestiva localizada en el estómago, ¿cómo se clasifica?","o":["Hemorragia digestiva alta.","Hemorragia digestiva media.","Hemorragia digestiva baja.","No se utiliza esa clasificación en las hemorragias digestivas."],"e":"La hemorragia digestiva se clasifica en ALTA (por encima del ángulo de Treitz: esófago, estómago y duodeno) y BAJA (por debajo). Un sangrado gástrico es, por tanto, una HDA. Algunos autores hablan de hemorragia «media» para el intestino delgado, pero no es la clasificación clásica.","a":0},{"id":327,"ex":"SES Urgencias AP · 2025","org":"Extremadura","y":2025,"s":"valor","t":"cirrosis","q":"De las opciones que se nombran a continuación, ¿cuál es la principal causa de hemorragia digestiva baja?","o":["Síndrome de Mallory-Weiss.","Varices esofágicas.","Hemorroides.","Gangrena de Fournier."],"e":"De las opciones, las hemorroides son la causa más frecuente de sangrado bajo (son la primera causa de rectorragia, aunque si se excluye la patología anorrectal la primera causa de HDB es la diverticulosis). El Mallory-Weiss y las varices esofágicas producen HDA y la gangrena de Fournier es una infección perineal.","a":2},{"id":328,"ex":"SES EFyC · 2025","org":"Extremadura","y":2025,"s":"ostom","t":"ostomias","q":"Con relación al protocolo de ostomías, en un primer momento, NO es criterio de derivación al médico de referencia:","o":["Granulomas.","Lesiones pseudoverrugosas.","Varices periostomales.","Irritación grave de la piel o úlceras."],"e":"Los granulomas periestomales son benignos y los trata enfermería (nitrato de plata, ajustar el dispositivo para evitar el roce): no requieren derivación inicial. Sí se derivan las lesiones pseudoverrugosas, las varices periestomales (hipertensión portal, riesgo de sangrado) y la irritación grave o las úlceras.","a":0},{"id":329,"ex":"Aragón DGA · 2024","org":"Aragón","y":2024,"s":"ostom","t":"ostomias","q":"La apertura artificial del intestino delgado a la pared abdominal, desembocando en un estoma o ano artificial, se denomina:","o":["Colostomía.","Ileostomía.","Urostomía.","Estoma urinario."],"e":"La ileostomía aboca el ÍLEON (intestino delgado) a la pared abdominal. La colostomía aboca el colon y la urostomía, la vía urinaria.","tr":"alimentacion","a":1,"po":["Colostomía = colon.","","Urostomía = vía urinaria.","Estoma urinario = derivación urinaria."]},{"id":330,"ex":"Aragón DGA · 2024","org":"Aragón","y":2024,"s":"boca","t":"disfagia","q":"En el cuidado de un paciente con problemas de deglución, NO está indicado:","o":["Usar pajitas para la ingestión de líquidos.","Vigilar que no acumule la comida en los laterales de la boca.","Mantener al paciente sentado como mínimo 15 minutos después de comer.","Crear un entorno tranquilo a la hora de la comida."],"e":"Las pajitas están desaconsejadas en la disfagia: aumentan la velocidad y el volumen del bolo y se pierde el control, con más riesgo de aspiración. Sí se recomienda vigilar los restos en los laterales de la boca, mantenerle sentado al menos 15-30 minutos después de comer y un ambiente tranquilo, sin distracciones.","tr":"disfagia","a":0,"po":["","Correcto: vigilar los restos en la boca.","Correcto: mantenerle sentado después de comer.","Correcto: un entorno tranquilo."]},{"id":331,"ex":"Aragón DGA - Llamamiento extraordinario · 2024","org":"Aragón","y":2024,"s":"ostom","t":"ostomias","q":"Entre las indicaciones para una colostomía, señale la respuesta INCORRECTA:","o":["Cáncer rectal.","Estreñimiento.","Lesiones de médula espinal.","Lesiones traumáticas anales."],"e":"El estreñimiento no es indicación de colostomía (se trata con medidas higiénico-dietéticas y laxantes). Sí lo son el cáncer rectal, las lesiones traumáticas anales o perineales y algunas lesiones medulares con incontinencia o problemas de evacuación graves.","a":1},{"id":332,"ex":"Aragón DGA - Llamamiento extraordinario · 2024","org":"Aragón","y":2024,"s":"ostom","t":"ostomias","q":"Entre las indicaciones para una ileostomía NO se encuentra:","o":["Colitis ulcerosa.","Enfermedad de Crohn.","Cáncer de colon.","Diarrea."],"e":"Indicaciones de ileostomía: colitis ulcerosa (proctocolectomía), Crohn, poliposis familiar, cáncer de colon (como protección de la anastomosis) y traumatismos. La diarrea no es una indicación; de hecho, es una complicación de la ileostomía (riesgo de deshidratación).","a":3},{"id":333,"ex":"La Rioja · 2025","org":"La Rioja","y":2025,"s":"sondas","t":"sondas_tipos","q":"De las siguientes opciones, ¿cuál NO corresponde a una sonda digestiva?","o":["De Moss.","Bomba aspiración de Salem.","Plummer.","De Bénique."],"e":"La sonda de Bénique es un dilatador UROLÓGICO (uretral), no una sonda digestiva. La Moss es una sonda gastroduodenal de 3 luces, la Salem es nasogástrica de doble luz y la Plummer es digestiva, para dilatar estenosis esofágicas.","a":3},{"id":334,"ex":"La Rioja · 2025","org":"La Rioja","y":2025,"s":"sondas","t":"sng","q":"En cuanto a la técnica de colocación de la sonda nasogástrica, previo a su introducción debemos:","o":["Colocar al paciente, si está consciente, en posición trendelemburg.","Mediante la técnica de Hansen determinaremos la cantidad de sonda a introducir: mediremos desde la punta de la nariz al lóbulo de la oreja y desde este hasta hipogastrio.","Comprobar que las fosas nasales son permeables, eligiendo el orificio por el que respire mejor.","Todas las respuestas anteriores son incorrectas."],"e":"Antes de introducir la sonda se comprueba la permeabilidad de las fosas nasales (tapando una y expulsando aire por la otra) y se elige la más permeable. El paciente se coloca en Fowler (no Trendelenburg) y la medida NEX llega hasta el apéndice XIFOIDES, no hasta el hipogastrio.","tr":"posiciones","a":2,"ns":1,"po":["La posición es Fowler, no Trendelenburg.","La medida llega hasta el XIFOIDES, no al hipogastrio.","","No todas son incorrectas: la c) es correcta."]},{"id":335,"ex":"Aragón · 2026","org":"Aragón","y":2026,"s":"agudo","t":"sng","q":"Entre las medidas generales en la atención al paciente con abdomen agudo se encuentran todas menos una. Indique la INCORRECTA:","o":["Sueroterapia y vigilancia de alteraciones electrolíticas.","Capnografía y control del dióxido de carbono.","Sondaje vesical y control estricto de la diuresis.","Colocación de sonda nasogástrica."],"e":"Medidas generales en el abdomen agudo: dieta absoluta, vía venosa con sueroterapia y control electrolítico, SNG para descomprimir si hay vómitos u obstrucción, sondaje vesical con control de diuresis, analgesia pautada y preparación para cirugía. La capnografía no es una medida general en este cuadro.","a":1},{"id":336,"ex":"Aragón · 2026","org":"Aragón","y":2026,"s":"ostom","t":"ostomias","q":"Según la forma de exteriorización de la ostomía (doble boca), elija la técnica quirúrgica correcta:","o":["Cañón de escopeta o Paul Mikulicz.","En asa con barra de soporte.","Terminal simple.","Anastomosis en Y de Roux."],"e":"La ostomía de doble boca (Paul-Mikulicz) secciona el intestino por completo y exterioriza los dos cabos juntos, en paralelo, por la misma incisión: el aspecto de «cañón de escopeta». En la ostomía en asa con varilla el intestino no se secciona por completo.","a":0},{"id":337,"ex":"Aragón · 2026","org":"Aragón","y":2026,"s":"intestino","t":"ccr","q":"¿En qué consiste el Programa de detección precoz de cáncer colorrectal del Servicio Aragonés de Salud?","o":["Este programa se basa en la realización de un test de sangre oculta en heces (TSOH) cada 2 años y se dirige a las personas residentes en Aragón con edades comprendidas entre los 50 y 69 años.","Este programa se basa en la realización de un test de sangre oculta en heces (TSOH) cada 3 años y se dirige a las personas residentes en Aragón con edades comprendidas entre los 50 y 69 años.","Este programa se basa en la realización de un test de sangre oculta en heces (TSOH) cada 2 años y se dirige a las personas residentes en Aragón con edades comprendidas entre los 55 y 75 años.","Este programa se basa en la realización de un test de sangre oculta en heces (TSOH) cada 3 años y se dirige a las personas residentes en Aragón con edades comprendidas entre los 55 y 75 años."],"e":"El programa aragonés, como el estatal, ofrece un test de sangre oculta en heces cada 2 AÑOS a las personas de 50 a 69 años; si es positivo, se hace una colonoscopia.","a":0},{"id":338,"ex":"SES · 2026","org":"Extremadura","y":2026,"s":"ostom","t":"ostomias","q":"Las complicaciones más frecuentes que las enfermeras pueden abordar con los medicamentos que se incluyen en el protocolo para la indicación uso y dispensación de medicamentos sujetos a prescripción médica para ostomías, son todas EXCEPTO:","o":["Alteraciones del tránsito intestinal.","Obstrucción o estenosis.","Granulomas.","Infecciones y otras dermatitis de etiología no infecciosa."],"e":"El protocolo de indicación enfermera para ostomías permite tratar alteraciones del tránsito, granulomas, infecciones y dermatitis periestomales. La obstrucción o estenosis del estoma requiere valoración médica o quirúrgica, por lo que queda fuera de la indicación enfermera.","a":1},{"id":339,"ex":"SES · 2026","org":"Extremadura","y":2026,"s":"boca","t":"disfagia","q":"Sara es enfermera de la planta de medicina interna. Tiene a su cargo un paciente con disfagia, sin alteraciones cognitivas ni de lenguaje y con actividad muscular conservada. Si le indica «que ponga la lengua entre los dientes, trague y note un tirón en el cuello mientras lo hace sin tener alimento en la boca», ¿qué maniobra deglutoria le estaría explicando al paciente?","o":["Maniobra de Masako.","Deglución forzada.","Maniobra de Mendelsohn.","Deglución supersupraglótica."],"e":"Maniobra de Masako: sacar la lengua, sujetarla suavemente entre los dientes y tragar saliva (sin alimento). Fortalece la pared posterior de la faringe y su contacto con la base de la lengua. Mendelsohn = mantener la laringe elevada al tragar; supersupraglótica = apnea, tragar y toser.","a":0},{"id":340,"ex":"SES · 2026","org":"Extremadura","y":2026,"s":"boca","t":"disfagia","q":"¿Qué nivel de consistencia en alimentos sólidos es el más seguro para una persona que sufre un problema de disfagia grave?","o":["Consistencia tipo néctar.","Consistencia tipo pudin.","Consistencia tipo miel.","Consistencia tipo fibrosa."],"e":"En la disfagia grave, la textura más segura es la tipo PUDIN: homogénea, cohesiva, se toma con cuchara y no se dispersa en la boca, con lo que se reduce el riesgo de aspiración. Las texturas fibrosas, mixtas o que se fragmentan son peligrosas. El néctar y la miel son niveles de espesor para líquidos.","a":1},{"id":341,"ex":"SESCAM · 2026","org":"Castilla-La Mancha","y":2026,"s":"intestino","t":"ccr","q":"La población diana del programa de Detección Precoz del Cáncer Colorrectal de Castilla-La Mancha se encuentra comprendida entre los:","o":["40 y 79 años de edad.","50 y 79 años de edad.","50 y 69 años de edad.","45 y 69 años de edad."],"e":"La población diana del cribado de cáncer colorrectal en Castilla-La Mancha es de 50 a 69 años (como en el marco estatal, en proceso de ampliación hasta 74), con FIT bienal.","a":2},{"id":342,"ex":"SESCAM · 2026","org":"Castilla-La Mancha","y":2026,"s":"intestino","t":"eii","q":"¿Cuál de las siguientes combinaciones describe correctamente las diferencias entre la enfermedad de Crohn y la colitis ulcerosa?","o":["La enfermedad de Crohn afecta únicamente al colon y cursa con afectación continua; la colitis ulcerosa afecta todo el tubo digestivo y es transmural.","La enfermedad de Crohn presenta afectación transmural y discontinua, empeora con el tabaco y no mejora con la defecación; la colitis ulcerosa afecta la mucosa de forma continua y mejora con la defecación.","La enfermedad de Crohn tiene alto riesgo de malignización y la cirugía es curativa; la colitis ulcerosa rara vez maligniza y la cirugía es paliativa.","La enfermedad de Crohn se asocia más frecuentemente a megacolon tóxico y la colitis ulcerosa a fístulas y obstrucciones."],"e":"Crohn: transmural, discontinuo, de cualquier tramo, EMPEORA con el tabaco y el dolor no se calma con la defecación. Colitis ulcerosa: mucosa, continua desde el recto, el tabaco «protege» y el dolor mejora al defecar. Las demás opciones intercambian rasgos (malignización, cirugía curativa y megacolon son más propios de la CU).","tr":"cucrohn","a":1,"po":["Al revés: describe la CU como transmural.","","Al revés: la cirugía es curativa en la CU.","Al revés: el megacolon tóxico es de la CU y las fístulas, del Crohn."]},{"id":343,"ex":"SESCAM · 2026","org":"Castilla-La Mancha","y":2026,"s":"agudo","t":"apendic","q":"Un paciente presenta dolor abdominal tras un traumatismo en hipocondrio izquierdo. Durante la exploración, se palpa dolor en el cuadrante superior izquierdo que se irradia al hombro izquierdo. Desde su labor como profesional de enfermería, ¿qué signo indica esta situación, típica de rotura esplénica?","o":["Signo de Murphy.","Signo de Blumberg.","Signo de Kehr.","Signo de Rovsing."],"e":"El signo de Kehr es el dolor referido al hombro izquierdo por irritación del diafragma (nervio frénico) debida a la sangre en una rotura esplénica. No confundir con el tubo de Kehr del drenaje biliar. Murphy = colecistitis; Blumberg = irritación peritoneal; Rovsing = apendicitis.","a":2},{"id":344,"ex":"INGESA · 2024","org":"INGESA","y":2024,"s":"sondas","t":"sng_verif","q":"En los pacientes con alimentación por sonda enteral que se necesita administrar medicamentos directamente al tubo digestivo, pero dichos pacientes no pueden ingerirlos, y esta es la vía de administración indicada, hay que tener en cuenta los siguientes aspectos (Señale la respuesta FALSA):","o":["Comprobar la ubicación de la sonda y su permeabilidad.","Está contraindicada la administración de comprimidos con revestimiento entérico o líquidos oleosos.","Hay que tener especial precaución ante el riesgo de obstrucción en las sondas de poco calibre.","Está indicada cuando hay intolerancia oral."],"e":"Antes de dar fármacos por sonda hay que comprobar su posición y permeabilidad, evitar las formas con cubierta entérica, de liberación retardada y los líquidos oleosos, y extremar la precaución en las sondas finas por el riesgo de obstrucción. Según la clave, la afirmación sobre la «intolerancia oral» como indicación es la falsa.","a":3,"f":"La opción marcada como falsa (indicación por intolerancia oral) es discutible: en la práctica sí es una indicación. Revisar la clave."},{"id":345,"ex":"INGESA · 2026","org":"INGESA","y":2026,"s":"anat","t":"dumping","q":"En un paciente con gastrectomía total o resección ileal, la suplementación de B12 es crítica. ¿En qué lugar anatómico exacto se absorbe el complejo B12-factor intrínseco?","o":["Duodeno proximal.","Yeyuno medio.","Íleon terminal.","Colon ascendente."],"e":"El complejo vitamina B12-factor intrínseco se absorbe en el ÍLEON TERMINAL. Por eso tanto la gastrectomía (falta de factor intrínseco) como la resección ileal o el Crohn ileal producen déficit de B12 y obligan a suplementarla por vía parenteral.","tr":"b12","a":2,"po":["El duodeno absorbe hierro y calcio.","El yeyuno absorbe la mayoría de los principios inmediatos.","","El colon absorbe agua y electrolitos."]},{"id":346,"ex":"INGESA · 2026","org":"INGESA","y":2026,"s":"estom","t":"ulcera","q":"Cuál de los siguientes enunciados NO está considerado como factor de riesgo de la úlcera gastroduodenal:","o":["Infección por Helicobacter pylori.","Dieta hiperproteica.","Tabaquismo.","El ácido acetilsalicílico."],"e":"La dieta hiperproteica no es un factor de riesgo de úlcera. Sí lo son H. pylori (el principal), los AINE (incluido el AAS, por inhibir las prostaglandinas protectoras) y el tabaco (más recidivas y peor cicatrización).","a":1},{"id":347,"ex":"INGESA · 2026","org":"INGESA","y":2026,"s":"bilipan","t":"biliar","q":"En la consulta de enfermería, un paciente nos informa que tiene una obstrucción de la vía biliar y está pendiente de intervención quirúrgica. ¿Cómo serán las heces?","o":["Heces negras y alquitranadas.","Heces grisáceas o blanquecinas.","Heces amarillentas y espumosas.","Heces líquidas y diarreicas."],"e":"Si la vía biliar está obstruida, la bilis no llega al intestino y faltan los pigmentos que dan el color marrón: las heces son grisáceas o blanquecinas (acólicas), con ictericia, coluria y prurito. Las heces negras alquitranadas son melenas y las amarillentas espumosas sugieren esteatorrea.","a":1},{"id":348,"ex":"INGESA · 2026","org":"INGESA","y":2026,"s":"higado","t":"encefalo","q":"¿Qué dieta debe administrarse a los pacientes con una encefalopatía hepática crónica?","o":["Hipoproteica e hiposódica.","Hiperproteica e hiposódica.","Hiperproteica e hipercalórica.","Hipercalórica y suplementos de vitamina C."],"e":"ANTES: el tribunal (INGESA 2026) aún dio por buena la dieta hipoproteica, y por eso esta pregunta es obsoleta. HOY: la ESPEN recomienda NO restringir las proteínas en la encefalopatía hepática, porque empeora la sarcopenia y el amoniaco. Lo indicado es una dieta hipercalórica e hiperproteica, individualizada, en varias tomas y con un tentempié nocturno.","st":"O","a":2,"orig":0},{"id":349,"ex":"INGESA · 2026","org":"INGESA","y":2026,"s":"sondas","t":"peg","q":"Está administrando Fenitoína en suspensión por sonda nasogástrica a un paciente con nutrición enteral continua. ¿Cuál es el procedimiento correcto para evitar el fallo terapéutico por interacción?","o":["Mezclar el fármaco directamente con la fórmula de nutrición para facilitar la absorción.","Detener la nutrición 1-2 horas antes y 1-2 horas después de la administración del fármaco.","Administrar el fármaco sin detener la nutrición, pero aumentar la dosis de fenitoína un 50%.","Cambiar la fenitoína por diazepam, ya que la fenitoína no se absorbe con proteínas."],"e":"La fenitoína se une a las proteínas de la fórmula y a la sonda, y su absorción cae. Por eso se detiene la nutrición enteral 1-2 h antes y 1-2 h después de cada dosis, lavando la sonda con agua. Nunca se mezcla un fármaco con la nutrición.","a":1},{"id":350,"ex":"Aragón Aplazado · 2026","org":"Aragón","y":2026,"s":"intestino","t":"eii","q":"Entre las manifestaciones extraintestinales en la colitis ulcerosa y en la enfermedad de Crohn se encuentran todas, EXCEPTO:","o":["Artritis periférica.","Eritema nodoso.","Uveítis.","Esplenomegalia."],"e":"Manifestaciones extraintestinales de la EII: articulares (artritis periférica, sacroileítis), cutáneas (eritema nodoso, más en el Crohn; pioderma gangrenoso, más en la CU), oculares (uveítis, epiescleritis) y hepatobiliares (colangitis esclerosante). La esplenomegalia no es típica.","a":3},{"id":351,"ex":"SESCAM Aplazado · 2026","org":"Castilla-La Mancha","y":2026,"s":"sondas","t":"sondas_tipos","q":"Como profesional de enfermería, en la atención y cuidado de una sonda digestiva, ¿cuál de las siguientes afirmaciones sobre sus características y funcionamiento es correcta?","o":["La sonda de Levin es de doble luz y se utiliza principalmente para lavados en intoxicaciones severas.","La sonda de Salem permite la entrada de aire por una de sus luces para evitar la adherencia a la pared gástrica.","La sonda Freka es de gran calibre y se usa para lavados orogástricos en intoxicaciones por cáusticos.","La sonda Sengstaken-Blakemore tiene un único balón y se utiliza para descompresión intestinal."],"e":"La Salem tiene doble luz: por la luz de ventilación entra aire, lo que evita que la sonda se adhiera y succione la mucosa durante la aspiración. La Levin tiene una sola luz, la Freka es fina (para nutrición) y la Sengstaken tiene dos balones y se usa en varices.","a":1},{"id":352,"ex":"SESCAM Aplazado · 2026","org":"Castilla-La Mancha","y":2026,"s":"valor","t":"hemorragia","q":"¿Cuál de las siguientes opciones define correctamente la melena?","o":["Emisión de sangre roja por el ano, generalmente procedente de la parte baja del tubo digestivo.","Presencia de sangre roja en las heces, sin alteración por los jugos digestivos.","Eliminación por el ano de sangre digerida, en forma de heces negras, pegajosas y de olor característico o fétido, típicamente originadas en el tracto digestivo superior.","Expulsión mediante el vómito de sangre o coágulos procedentes de la parte alta del tubo digestivo."],"e":"Melena = salida por el ano de sangre digerida: heces negras, pegajosas, brillantes y fétidas, típicas de un sangrado alto (con al menos 50-100 ml de sangre en el tubo digestivo). La opción a es rectorragia, la b hematoquecia y la d hematemesis.","a":2,"ns":1},{"id":353,"ex":"SERGAS · 2026","org":"Galicia","y":2026,"s":"boca","t":"erge","q":"¿Cuál de los siguientes enunciados sobre la acalasia esofágica es falso?","o":["La acidez gástrica es el segundo síntoma más frecuente.","La prueba diagnóstica de referencia actualmente es la manometría de alta resolución.","La clasificación de Chicago versión 4.0, establece 3 subtipos manométricos diferentes de acalasia.","En la terapia oral farmacológica, los fármacos más utilizados son los bloqueadores de los canales de calcio y los nitratos."],"e":"En la acalasia el síntoma principal es la disfagia para sólidos Y líquidos, seguida de la regurgitación de alimento no digerido; la pirosis no es el segundo síntoma. La prueba de referencia es la manometría de alta resolución (Chicago v4.0: tipos I, II y III) y, en el tratamiento oral, se usan antagonistas del calcio y nitratos.","a":0},{"id":354,"ex":"SERGAS · 2026","org":"Galicia","y":2026,"s":"higado","t":"cirrosis","q":"Señale la afirmación incorrecta respecto a la bilirrubina indirecta o no conjugada:","o":["Es liposoluble y circula unida a la albúmina.","La causa más importante de aumento de la bilirrubina indirecta es la hemólisis.","La bilirrubina indirecta puede atravesar la membrana glomerular, por lo que se elimina en la orina.","Es captada por los hepatocitos, donde es conjugada por acción de la enzima glucuroniltransferasa."],"e":"La bilirrubina indirecta (no conjugada) es liposoluble y viaja unida a la albúmina, por lo que NO atraviesa el glomérulo ni aparece en la orina. Se eleva sobre todo por hemólisis y el hepatocito la conjuga (glucuroniltransferasa). La bilirrubina directa (conjugada) es hidrosoluble y sí se elimina por la orina (coluria).","a":2},{"id":355,"ex":"SERGAS · 2026","org":"Galicia","y":2026,"s":"boca","t":"erge","q":"¿Cuál de los siguientes no es un factor de riesgo para el desarrollo del Esófago de Barrett?","o":["Reflujo gastroesofágico.","Obesidad troncular.","Edad mayor de 50 años.","Raza negra."],"e":"Factores de riesgo del esófago de Barrett: ERGE crónica, obesidad central, edad > 50 años, sexo masculino, raza BLANCA, tabaco y antecedentes familiares. La raza negra no es un factor de riesgo (de hecho, es menos frecuente en ella).","a":3},{"id":356,"ex":"SERGAS · 2026","org":"Galicia","y":2026,"s":"higado","t":"cirrosis","q":"Señale la respuesta falsa en relación a los estigmas de la hepatopatía crónica:","o":["Contractura de Dupuytren.","Arañas vasculares.","Hipertrofia parotídea.","Adipomastia."],"e":"Estigmas de hepatopatía crónica: arañas vasculares, eritema palmar, ginecomastia (por hiperestrogenismo), hipertrofia parotídea y contractura de Dupuytren (sobre todo de origen alcohólico), circulación colateral... La adipomastia (acúmulo de grasa sin tejido glandular) no es un estigma hepático; lo es la ginecomastia verdadera.","a":3},{"id":357,"ex":"SERGAS Aplazado · 2026","org":"Galicia","y":2026,"s":"bilipan","t":"biliar","q":"En relación con el signo de Courvoisier-Terrier, señale la respuesta correcta:","o":["Dolor en la fosa iliaca derecha con la hiperextensión pasiva o la flexión activa de la cadera derecha.","Dolor a la descompresión abdominal; es un signo de irritación peritoneal.","Presión en el punto máximo de dolor abdominal con un dedo mientras el paciente flexiona la cadera o levanta el tronco; si el dolor empeora, el signo es positivo.","Vesícula biliar palpable y no dolorosa en un paciente con ictericia obstructiva."],"e":"Signo de Courvoisier-Terrier: vesícula biliar palpable y NO dolorosa en un paciente con ictericia obstructiva. Sugiere un tumor periampular o de la cabeza del páncreas. La opción a describe el signo del psoas, la b el de Blumberg y la c el de Carnett.","a":3,"ns":1},{"id":358,"ex":"SERGAS Aplazado · 2026","org":"Galicia","y":2026,"s":"agudo","t":"obstruccion","q":"¿Qué término define la torsión de un asa intestinal sobre su propio eje mesentérico que genera una obstrucción mecánica estrangulante?","o":["Invaginación o intususpección.","Íleo paralítico.","Vólvulo.","Diverticulitis."],"e":"El vólvulo es la torsión de un asa intestinal sobre su eje mesentérico: produce una obstrucción mecánica con estrangulación vascular (riesgo de isquemia y perforación). Es más frecuente en el sigma (en ancianos) y el ciego. La invaginación es la introducción de un segmento dentro del siguiente.","a":2},{"id":359,"ex":"SERGAS Aplazado · 2026","org":"Galicia","y":2026,"s":"bilipan","t":"pancreas","q":"¿Cuál de los siguientes parámetros analíticos no forma parte de la escala de Ranson para la valoración pronóstica de la pancreatitis aguda?","o":["Lactato deshidrogenasa LDH.","Aspartato aminotransferasa AST.","Amilasa sérica.","Glucemia."],"e":"Criterios de Ranson al ingreso: edad > 55, leucocitos > 16.000, glucemia > 200, LDH > 350 y AST > 250. A las 48 h: descenso del hematocrito, aumento de la urea, calcio < 8, PaO₂ < 60, déficit de bases y secuestro de líquidos. La amilasa sirve para el diagnóstico, pero no tiene valor pronóstico.","a":2},{"id":360,"ex":"SERGAS EFyC · 2026","org":"Galicia","y":2026,"s":"intestino","t":"eii","q":"De acuerdo con el «Protocolo de Cribado Poblacional de Cáncer Colorrectal» del Servizo Galego de Saúde, ¿cuál de las siguientes situaciones constituye un criterio de exclusión DEFINITIVA del programa de cribado mediante test de sangre oculta en heces TSOHi??","o":["Haberse realizado una colonoscopia total con resultado de normalidad hace 10 años.","Presentar un antecedente familiar de primer grado diagnosticado de cáncer colorrectal a los 64 años.","Estar diagnosticado de enfermedad inflamatoria intestinal crónica (colitis ulcerosa o enfermedad de Crohn)","Presentar dos o más familiares de segundo grado diagnosticados de cáncer colorrectal a cualquier edad."],"e":"Tener enfermedad inflamatoria intestinal (CU o Crohn) es criterio de exclusión DEFINITIVA del cribado poblacional: son pacientes de alto riesgo que se siguen con colonoscopias en la consulta especializada. Una colonoscopia normal o ciertos antecedentes familiares pueden ser exclusiones temporales o derivaciones, según el caso.","a":2},{"id":361,"ex":"SERGAS EFyC · 2026","org":"Galicia","y":2026,"s":"ostom","t":"peg","q":"Paciente con PEG colocada hace 4 meses. En revisión domiciliaria se observa eritema leve periestomal, tejido de hipergranulación y disco externo firmemente ajustado a la piel. No presenta fiebre ni intolerancia a la nutrición enteral. Según los procedimientos de cuidados de gastrostomía en atención primaria, ¿cuál es la actuación más adecuada?","o":["Aflojar el disco externo dejando ligera holgura, realizar higiene con agua y jabón neutro, secado cuidadoso y valorar tratamiento del granuloma según protocolo, manteniendo la nutrición y vigilancia de signos de infección.","Mantener el disco firmemente ajustado para evitar fugas y aplicar povidona yodada diaria hasta resolución del eritema.","Suspender la nutrición enteral y derivar para retirada de la PEG por sospecha de infección local.","Aplicar antibiótico tópico profiláctico y girar la sonda varias veces al día sin modificar el disco externo."],"e":"Un disco externo demasiado ajustado causa isquemia, hipergranulación e incluso el «buried bumper» (el disco interno se entierra en la pared gástrica). Lo correcto es dejar una ligera holgura (unos 0,5 cm), mantener la higiene con agua y jabón neutro, tratar el granuloma según el protocolo (nitrato de plata) y continuar la nutrición vigilando signos de infección.","a":0},{"id":362,"ex":"SERGAS EFyC · 2026","org":"Galicia","y":2026,"s":"intestino","t":"ccr","q":"En relación con el procedimiento de recogida de muestra para el Test de Sangre Oculta en Heces inmunológico TSOHi dentro del Programa Gallego de Detección Precoz del Cáncer Colorrectal, señale la respuesta CORRECTA:","o":["El paciente debe seguir una dieta exenta de carnes rojas y vitamina C durante las 48 horas previas a la recogida.","Si el paciente presenta hemorroides sangrantes o está en periodo menstrual, debe demorar la realización de la prueba hasta que hayan pasado al menos 3 días seguidos sin sangrado.","Tras la recogida, la muestra debe conservarse a temperatura ambiente y entregarse en el centro de salud en un plazo máximo de 24 horas.","Un antecedente familiar de primer grado diagnosticado de cáncer colorrectal a los 65 años es un criterio de exclusión definitiva del programa de cribado poblacional."],"e":"Con el test inmunológico (TSOHi) no hace falta dieta. Pero si hay sangrado por hemorroides o menstruación, se espera a tener 3 días seguidos sin sangrado para evitar falsos positivos. La muestra se conserva refrigerada y se entrega cuanto antes. Un familiar de primer grado con CCR deriva a un programa de alto riesgo, no es una exclusión definitiva.","a":1},{"id":363,"ex":"SERGAS EFyC · 2026","org":"Galicia","y":2026,"s":"ostom","t":"ostomias","q":"Un paciente con ileostomía acude a consulta de Atención Primaria por mal control de su patología crónica. Al revisar su tratamiento, ¿cuál de las siguientes formas farmacéuticas debería evitarse o supervisarse estrechamente por riesgo de falta de absorción?","o":["Jarabes y soluciones orales.","Comprimidos de liberación sostenida retard.","Cápsulas de gelatina blanda.","Comprimidos efervescentes."],"e":"En la ileostomía el tránsito es rápido y no hay colon: los comprimidos de liberación sostenida (retard) o con cubierta entérica pueden salir enteros por el estoma sin liberar el fármaco. Se prefieren formas de liberación inmediata, líquidas o solubles, y se vigila si aparecen comprimidos en la bolsa.","a":1},{"id":364,"ex":"SERGAS EFyC · 2026","org":"Galicia","y":2026,"s":"bilipan","t":"charcot","q":"¿Con qué patología se corresponde la triada de Charcot?","o":["Colecistitis aguda.","Colangitis aguda.","Colelitiasis.","Apendicitis aguda."],"e":"La tríada de Charcot (fiebre con escalofríos, ictericia y dolor en hipocondrio derecho) es la presentación clásica de la COLANGITIS aguda. Recuerda también la pentada de Reynolds (Charcot + shock + confusión), que indica colangitis supurada grave.","tr":"charcot","a":1,"po":["Colecistitis = Murphy.","","La colelitiasis no complicada no cumple la tríada.","La apendicitis no es biliar."]},{"id":365,"ex":"Defensa · 2026","org":"Defensa","y":2026,"s":"sondas","t":"sng","q":"¿En qué posición deberá poner a un paciente para la colocación de una sonda nasogástrica?","o":["Decúbito lateral derecho.","Sims.","Decúbito lateral izquierdo.","Fowler."],"e":"La SNG se coloca en Fowler (sentado o semisentado, 45° o más) con la cabeza ligeramente flexionada hacia delante al avanzar la sonda. La posición de Sims (decúbito lateral) se reserva para el paciente inconsciente o el niño pequeño.","tr":"posiciones","a":3,"po":["El lateral derecho no es la posición de inserción.","Sims solo en inconscientes o niños.","El lateral izquierdo es para el enema.",""]},{"id":366,"ex":"Defensa · 2026","org":"Defensa","y":2026,"s":"higado","t":"encefalo","q":"La encefalopatía hepática incluye entre otros, los siguientes signos clínicos, EXCEPTO:","o":["Alteración del ciclo sueño/vigilia.","Reducción de la capacidad intelectual.","Asterixis o temblor de aleteo.","Estreñimiento."],"e":"La encefalopatía hepática se manifiesta con alteraciones del ciclo sueño-vigilia, deterioro intelectual y de la atención, cambios de conducta y asterixis (flapping). El estreñimiento no es un signo de la encefalopatía, sino un factor DESENCADENANTE (por eso se usa lactulosa).","tr":"encefalo","a":3,"po":["Es un signo: alteración del ritmo sueño-vigilia.","Es un signo: deterioro intelectual.","Es un signo: asterixis.",""]},{"id":367,"ex":"Defensa · 2026","org":"Defensa","y":2026,"s":"ostom","t":"ostomias","q":"¿Cuáles de las siguientes son complicaciones propias del estoma?","o":["Prolapso.","Pioderma gangrenoso.","Estenosis.","a y c son correctas."],"e":"El prolapso y la estenosis son complicaciones del propio estoma. El pioderma gangrenoso periestomal es una complicación CUTÁNEA de la zona periestomal (asociada a la EII), no del estoma en sí. Por eso la respuesta es la que agrupa prolapso y estenosis.","a":3,"ns":1},{"id":368,"ex":"SERMAS · 2026","org":"Madrid","y":2026,"s":"ostom","t":"heces_ostomia","q":"La irrigación de un estoma no está indicada en:","o":["Colostomías ascendentes.","Colostomías descendentes.","En pacientes con heces formadas y ritmo intestinal regular.","Colostomías sigmoideas."],"e":"La irrigación NO está indicada en colostomías ascendentes (ni en transversas o ileostomías): el efluente es líquido y continuo y el colon restante no se puede «educar». Se indica en colostomías descendentes o sigmoideas con heces formadas y ritmo intestinal regular.","a":0},{"id":369,"ex":"SERMAS · 2026","org":"Madrid","y":2026,"s":"intestino","t":"eliminacion","q":"¿Cuál de las siguientes opciones no es considerada como un factor de riesgo de estreñimiento?","o":["Estrés.","Tratamiento con fármacos antiarrítmicos.","Sedentarismo.","Dieta baja en proteínas y en grasas de origen animal."],"e":"Factores de riesgo de estreñimiento: dieta pobre en FIBRA y en líquidos, sedentarismo, estrés, ignorar el reflejo defecatorio y fármacos (opioides, antiarrítmicos como el verapamilo, anticolinérgicos, hierro). Una dieta baja en proteínas y grasas animales no es un factor de riesgo reconocido.","a":3},{"id":370,"ex":"Osakidetza · 2026","org":"País Vasco","y":2026,"s":"sondas","t":"sng_verif","q":"Tras la inserción de una sonda nasogástrica destinada a aspiración gástrica en un paciente adulto, ¿cuál de las siguientes actuaciones es la opción VERDADERA para identificar de forma correcta su colocación antes de utilizarla?","o":["Insuflar aire con una jeringa y auscultar el epigastrio en busca de borborigmos, como se ha hecho tradicionalmente.","Comprobar que el paciente no presenta tos, disnea ni cambios en la saturación de oxígeno tras la inserción.","Aspirar contenido a través de la sonda y valorar sus características junto con la medición del pH.","Verificar que la longitud externa de la sonda coincide con la medida estimada previamente."],"e":"La opción verdadera es aspirar contenido, valorar su aspecto (gástrico: claro, verdoso o con moco) y medir el pH (≤ 4, o hasta 5,5 según el protocolo). La auscultación y la ausencia de tos no son fiables, y la longitud externa solo sirve para detectar desplazamientos. Si hay dudas: radiografía.","tr":"verificacion","a":2,"po":["La auscultación no es fiable.","La ausencia de tos no descarta una sonda en la vía aérea.","","La longitud externa detecta desplazamientos, pero no confirma la posición."]},{"id":371,"ex":"Osakidetza · 2026","org":"País Vasco","y":2026,"s":"intestino","t":"biliar","q":"¿Cuál de las siguientes complicaciones sistémicas se asocia con MAYOR frecuencia a la colitis ulcerosa que a la enfermedad de Crohn?","o":["Obstrucción del intestino delgado.","Megacolon tóxico.","Colelitiasis.","Hidronefrosis derecha."],"e":"El megacolon tóxico (dilatación aguda del colon > 6 cm con toxicidad sistémica) es más frecuente en la colitis ulcerosa. La obstrucción del intestino delgado, la colelitiasis (por malabsorción de sales biliares en el íleon) y la hidronefrosis derecha son más propias del Crohn.","tr":"cucrohn","a":1,"po":["La obstrucción del delgado es más propia del Crohn.","","La colelitiasis es más propia del Crohn ileal (sales biliares).","La hidronefrosis derecha es más propia del Crohn (íleon y uréter derecho)."]},{"id":372,"ex":"SERMAS 2º Llamamiento · 2026","org":"Madrid","y":2026,"s":"agudo","t":"apendic","q":"En la exploración abdominal es importante una adecuada palpación, así como la verificación de signos específicos. No se considera un signo de exploración abdominal:","o":["Murphy.","Blumberg.","Rovsing.","Steinmann."],"e":"Murphy (colecistitis), Blumberg (irritación peritoneal) y Rovsing (apendicitis) son signos de la exploración abdominal. El signo de Steinmann es una maniobra de la rodilla para explorar lesiones meniscales.","a":3},{"id":373,"ex":"SERMAS 2º Llamamiento · 2026","org":"Madrid","y":2026,"s":"agudo","t":"sng","q":"Entre los cuidados de Enfermería en pacientes que padecen una obstrucción intestinal no se encuentra:","o":["Control de diuresis y balance hídrico.","Administración de líquidos intravenosos y corrección de electrolitos.","Dieta blanda rica en fibra.","Colocación de sonda nasogástrica."],"e":"En la obstrucción intestinal se pauta DIETA ABSOLUTA, con SNG para descomprimir, sueroterapia con corrección de electrolitos y control de diuresis y balance. Una dieta rica en fibra empeoraría la obstrucción.","a":2},{"id":374,"ex":"Castilla y León Estabilización · 2024","org":"Castilla y León","y":2024,"s":"sondas","t":"sondas_tipos","q":"¿Cuál de las siguientes no es una vía de administración de la alimentación enteral?","o":["Por sonda Levin.","Por sonda Salem.","Por sonda Faucher."],"e":"La sonda de Faucher es orogástrica, de gran calibre, y se usa para el lavado gástrico, no para nutrir. Levin y Salem (nasogástricas) sí pueden emplearse para la nutrición enteral.","tr":"lavado","a":2,"po":["La Levin sí sirve para nutrir.","La Salem también puede usarse.",""]},{"id":375,"ex":"Castilla y León Estabilización · 2024","org":"Castilla y León","y":2024,"s":"sondas","t":"sng","q":"¿En cuál de las siguientes situaciones está indicado colocar una sonda nasogástrica?","o":["Traumatismo facial grave.","Obstrucción esofágica.","Nutrición en pacientes con ventilación mecánica."],"e":"El paciente con ventilación mecánica que no puede comer necesita nutrición enteral por sonda: es una indicación clara de SNG. El traumatismo facial grave y la obstrucción esofágica son contraindicaciones.","tr":"contraindica","a":2,"po":["El traumatismo facial grave contraindica la vía nasal.","La obstrucción esofágica contraindica la SNG.",""]},{"id":376,"ex":"Castilla y León Estabilización · 2024","org":"Castilla y León","y":2024,"s":"sondas","t":"sondas_tipos","q":"No es un tipo de sonda nasogástrica:","o":["Salem.","Levin.","Robinson."],"e":"La Robinson es una sonda recta de uso vesical o rectal, no nasogástrica. Salem (doble luz) y Levin (una luz) son las sondas nasogástricas clásicas.","a":2},{"id":377,"ex":"Navarra · 2026","org":"Navarra","y":2026,"s":"intestino","t":"ccr","q":"El Programa de Detección Precoz de Cáncer de Colon del Gobierno de Navarra está destinado a personas que cumplan los siguientes requisitos (señale la incorrecta):","o":["Hombres y mujeres residentes en Navarra.","Asintomáticos.","Entre 50 y 69 años.","Personas con factores genéticos o de alto riesgo."],"e":"El cribado POBLACIONAL se dirige a personas de riesgo medio: residentes, asintomáticas y de 50 a 69 años. Quien tiene factores genéticos o de alto riesgo (antecedentes familiares, EII, síndromes hereditarios) no entra en este programa: se deriva a un seguimiento específico con colonoscopia.","a":3,"po":["Es un requisito: residir en Navarra.","Es un requisito: no tener síntomas.","Es un requisito: es la población diana.",""]},{"id":378,"ex":"Navarra · 2026","org":"Navarra","y":2026,"s":"agudo","t":"apendic","q":"¿En qué consiste el signo de rebote positivo en la exploración abdominal?","o":["Mayor dolor al soltar que al apretar el abdomen.","Misma intensidad de dolor al apretar que al soltar el abdomen.","Menor dolor al soltar que al apretar el abdomen.","El dolor no es una característica de este signo."],"e":"El rebote (signo de Blumberg) es positivo cuando el dolor es MAYOR al soltar bruscamente la presión que al apretar: indica irritación peritoneal. En la fosa iliaca derecha orienta a apendicitis aguda.","a":0,"po":["","Si el dolor es igual al apretar y al soltar, el rebote es negativo.","Menos dolor al soltar es lo esperable sin irritación peritoneal.","Falso: el signo se define precisamente por el dolor."]},{"id":379,"ex":"Navarra · 2026","org":"Navarra","y":2026,"s":"valor","t":"hemorragia","q":"Estamos trabajando en nuestro puesto de trabajo y nos llama una cuidadora para decirnos que Alicia, una usuaria que se había quejado de dolor abdominal, ahora presenta unas deposiciones que huelen muy mal, oscuras y que brillan. Sospecharemos:","o":["Hematoquecia por hemorragia digestiva alta.","Melenas por hemorragia digestiva baja.","Rectorragia por hemorragia digestiva alta.","Melenas por hemorragia digestiva alta."],"e":"Heces negras, brillantes, pegajosas y fétidas son melenas: sangre digerida durante el tránsito, por lo que suelen proceder del tracto digestivo ALTO (por encima del ángulo de Treitz).","a":3,"po":["La hematoquecia es sangre roja mezclada con las heces.","Las melenas indican, por lo general, un origen alto: la sangre necesita tiempo para digerirse.","La rectorragia es sangre roja y fresca, de origen bajo.",""]},{"id":380,"ex":"Navarra · 2026","org":"Navarra","y":2026,"s":"sondas","t":"enemas","q":"Tenemos que colocar un enema a un usuario. Elige la opción correcta:","o":["Le pediré que se coloque del lado que le resulte más cómodo y antes retiraré los fecalomas que pueda tener.","Le pondré en decúbito lateral derecho para extraer los fecalomas y, seguido, el enema.","Extraer los fecalomas en decúbito lateral derecho con la rodilla derecha ligeramente flexionada y el enema en decúbito lateral izquierdo con la pierna izquierda flexionada hacia el tórax y la derecha recta (posición de Sims).","Extraer los fecalomas en decúbito lateral derecho con la rodilla izquierda ligeramente flexionada y el enema en decúbito lateral izquierdo con la pierna derecha flexionada hacia el tórax y la izquierda recta (posición de Sims)."],"e":"El fecaloma se extrae preferentemente en decúbito lateral DERECHO (la gravedad ayuda), con la pierna de arriba (la izquierda) ligeramente flexionada. El enema se pone en posición de Sims: decúbito lateral IZQUIERDO con la pierna DERECHA (la de arriba) flexionada hacia el tórax y la izquierda extendida.","tr":"posiciones","a":3,"ns":1,"po":["La posición no es indiferente: el enema necesita el decúbito lateral izquierdo.","El enema no se pone en decúbito lateral derecho.","En la posición de Sims se flexiona la pierna de ARRIBA (la derecha), no la izquierda.",""]},{"id":381,"ex":"Navarra Parte 3 · 2026","org":"Navarra","y":2026,"s":"boca","t":"disfagia","q":"Manuel presenta apraxia deglutoria fluctuante derivada de su cuadro confusional y tose tras beber agua. ¿Cuál es el plan de cuidados que hay que realizar inmediatamente después de este episodio?","o":["Administrar los líquidos solo con pajita para dirigir el bolo hacia la orofaringe.","Mantener al paciente en decúbito supino con el cuello en hiperextensión durante la ingesta.","Modificar la consistencia de los líquidos a néctar o gelatina y aplicar la maniobra de flexión cervical anterior.","Modificar la consistencia de los líquidos a néctar o gelatina y aplicar la maniobra de flexión cervical posterior."],"e":"La tos tras beber es un signo de alteración de la seguridad: se espesan los líquidos (néctar o gelatina) y se aplica la flexión cervical ANTERIOR («barbilla al pecho»), que estrecha la entrada de la vía aérea y protege de la aspiración.","tr":"disfagia","a":2,"po":["Las pajitas están desaconsejadas: aceleran el bolo y se pierde el control.","El decúbito supino con hiperextensión facilita la aspiración.","","La flexión cervical POSTERIOR (extensión) abre la vía aérea: aumenta el riesgo de aspiración."]}];
const C={"fichas":{"anat":["<b>Cuadrantes:<\/b> FID = ciego y apéndice · HD = hígado y vesícula · epigastrio = estómago, duodeno y páncreas.","<b>Esfínteres:<\/b> EES (cricofaríngeo) y EEI (cardias) en el esófago; píloro entre estómago y duodeno; válvula ileocecal (Bauhin).","<b>Absorción:<\/b> duodeno → hierro y calcio · yeyuno → la mayoría de nutrientes · íleon → B12 (con factor intrínseco), vitaminas A-D-E-K y sales biliares · colon → agua, Na y K.","<b>Vasos:<\/b> el tronco celíaco da la gástrica izquierda, la esplénica y la hepática común. Porta = mesentérica superior + esplénica.","<b>Páncreas:<\/b> jugo ALCALINO (bicarbonato) con lipasa, amilasa y tripsina. La CCK contrae la vesícula y relaja el esfínter de Oddi.","<b>Ángulo de Treitz:<\/b> por encima, hemorragia digestiva alta; por debajo, baja."],"boca":["<b>Odinofagia<\/b> = dolor al tragar · <b>afagia<\/b> = imposibilidad · disfagia <b>orofaríngea<\/b> (neurológica, empieza con líquidos) vs <b>esofágica<\/b> (mecánica: de sólidos a líquidos; motora: ambos).","<b>MECV-V:<\/b> 5 → 10 → 20 ml; néctar → líquido → pudin. Seguridad: tos, cambio de voz, desaturación ≥ 3 %. Eficacia: sello labial, residuo, deglución fraccionada.","<b>EAT-10:<\/b> 10 ítems, 0-40 puntos, ≥ 3 = riesgo. Evitar pajitas y dobles texturas; barbilla al pecho; en hemiplejia, GIRAR la cabeza hacia el lado afectado.","<b>ERGE:<\/b> elevar el cabecero 15-20 cm, no acostarse en las 3 h tras comer, evitar grasas, café, chocolate y menta; las proteínas suben el tono del EEI. No dormir sobre el lado derecho.","<b>Barrett<\/b> = metaplasia premaligna. <b>Acalasia:<\/b> el EEI no se relaja; «pico de pájaro»; manometría; miotomía de Heller.","<b>Salivales:<\/b> parótida → Stenon · submandibular → Wharton · sublingual → Rivinus. <b>CAOD<\/b> = dentición permanente; <b>cod<\/b> = temporal."],"estom":["<b>Úlcera<\/b> = sobrepasa la muscularis mucosae. Causas: <b>H. pylori<\/b> (1.ª) y <b>AINE<\/b> (2.ª).","Complicación más <b>frecuente<\/b>: hemorragia · más <b>grave<\/b>: perforación · también penetración y estenosis pilórica.","<b>Duodenal:<\/b> dolor 1,5-3 h tras comer, CEDE con la comida, nocturno. <b>Gástrica:<\/b> 20-30 min, no cede, más vómitos y más riesgo de malignidad.","<b>H. pylori:<\/b> test del aliento con C13 de elección; suspender IBP 2 semanas y antibióticos/bismuto 4 semanas (los antiácidos no interfieren). Tratamiento OCAM 10-14 días.","<b>Dumping precoz<\/b> (30-60 min, vasomotor) y <b>tardío<\/b> (90-180 min, hipoglucemia): 5-6 tomas, líquidos separados de las comidas, menos azúcares simples.","<b>Gastrectomía<\/b> → sin factor intrínseco → B12 intramuscular de por vida. <b>Zollinger-Ellison<\/b> = gastrinoma."],"agudo":["<b>Apendicitis:<\/b> dolor periumbilical que migra a FID (McBurney) + anorexia. Signos: Blumberg, Rovsing, Dunphy, Aaron; psoas y obturador si es retrocecal.","<b>Alvarado:<\/b> 10 puntos (2 por dolor en FID y 2 por leucocitosis); ≥ 7 = probable. Complicación más grave: peritonitis; más frecuente: infección de la herida.","<b>Obstrucción mecánica:<\/b> adherencias (1.ª en operados), hernias (1.ª en no operados); en el colon, el cáncer. <b>Íleo paralítico:<\/b> funcional, típico del postoperatorio.","<b>Manejo:<\/b> dieta absoluta, SNG para descomprimir, sueroterapia, control de diuresis y analgesia.","<b>Peritonitis:<\/b> abdomen en tabla, ruidos disminuidos, fiebre y riesgo de shock.","<b>Vólvulo<\/b> = torsión con estrangulación · ángulo esplénico = zona frontera de isquemia · <b>Kehr<\/b> = dolor en el hombro izquierdo en la rotura esplénica."],"intestino":["<b>Colitis ulcerosa:<\/b> recto, continua, mucosa, rectorragia, el tabaco protege, megacolon tóxico, cirugía curativa.","<b>Crohn:<\/b> de la boca al ano (íleon terminal), transmural, segmentaria, fístulas y afectación perianal, granulomas, el tabaco empeora.","<b>Montreal:<\/b> CU por extensión (E1-E3) y gravedad (S0-S3) · Crohn por edad (A), localización (L) y comportamiento (B).","<b>Bristol:<\/b> 1-2 estreñimiento · 3-4 ideal · 5 falta de fibra · 6-7 diarrea. Estreñimiento = menos de 3 deposiciones/semana.","<b>Diarrea secretora<\/b> (no cede con el ayuno, osmolaridad normal) vs <b>osmótica<\/b> (cede con el ayuno, pH ácido).","<b>Cribado del CCR:<\/b> 50-69 años (ampliándose a 74), FIT cada 2 años, colonoscopia si es positivo = prevención SECUNDARIA. Diverticulosis → fibra; diverticulitis → dieta absoluta, sin colonoscopia en fase aguda."],"higado":["<b>Cirrosis:<\/b> VHC y alcohol (80 %). Hipertensión portal → varices, ascitis, esplenomegalia y circulación colateral.","<b>Encefalopatía:<\/b> West Haven 0-4; asterixis. Desencadenantes: hemorragia, estreñimiento, infecciones, sedantes. Lactulosa. Dieta hipercalórica e HIPERproteica (la hipoproteica está obsoleta).","<b>Ascitis:<\/b> dieta sin sal, espironolactona + furosemida, peso y perímetro diarios. <b>Paracentesis:<\/b> vaciar la vejiga, punción en el lado izquierdo, vigilar la TA, albúmina desde el 5.º litro.","<b>Varices sangrantes:<\/b> estabilizar, somatostatina o terlipresina + ligadura endoscópica; Sengstaken como puente.","<b>Child-Pugh<\/b> (bilirrubina, albúmina, TP, ascitis, encefalopatía) · <b>MELD<\/b> (creatinina, bilirrubina, INR).","<b>Bilirrubina indirecta:<\/b> liposoluble, por hemólisis, no pasa a la orina. <b>Directa:<\/b> hidrosoluble, coluria. AINE contraindicados en la cirrosis."],"bilipan":["<b>Colelitiasis:<\/b> cálculos de colesterol (75 %); cólico irradiado al hombro derecho; la ecografía es la prueba de elección.","<b>Colecistitis:<\/b> cálculo en el cístico; dolor + fiebre + leucocitosis; signo de <b>Murphy<\/b>.","<b>Colangitis:<\/b> tríada de <b>Charcot<\/b> (dolor, fiebre, ictericia) → con shock y confusión, pentada de <b>Reynolds<\/b>.","<b>Tubo de Kehr:<\/b> bolsa por DEBAJO del punto de inserción, registrar el débito, pinzar antes y después de las comidas.","<b>Pancreatitis aguda:<\/b> litiasis (1.ª), alcohol (2.ª); dolor en cinturón que mejora inclinándose hacia delante; amilasa ×3, la lipasa es más específica; Cullen y Grey-Turner = gravedad.","<b>Atlanta<\/b> (gravedad) · <b>Ranson<\/b> (pronóstico, sin amilasa) · <b>Courvoisier-Terrier<\/b>: vesícula palpable indolora + ictericia → cabeza de páncreas (Whipple)."],"valor":["<b>Exploración:<\/b> inspección → auscultación → percusión → palpación (auscultar ANTES de palpar). Ausencia de ruidos = nada en 3-5 min.","<b>Melena<\/b> (negra, pegajosa, fétida; origen alto) · <b>hematoquecia<\/b> (roja con las heces) · <b>rectorragia<\/b> (sangre fresca) · <b>hematemesis<\/b> (vómito; «posos de café» = sangre digerida).","<b>Heces acólicas<\/b> → obstrucción biliar o hepatitis · <b>esteatorrea<\/b> → test de Van de Kamer.","<b>Sangre oculta:<\/b> hoy FIT (inmunoquímico), sin dieta; esperar 3 días sin sangrado si hay regla o hemorroides. Guayaco = obsoleto (la vitamina C daba falsos negativos).","<b>Colonoscopia:<\/b> dieta pobre en residuos 48 h, líquidos claros 24 h, decúbito lateral izquierdo con las rodillas flexionadas; con sedación debe ir acompañado.","<b>HDA:<\/b> primera causa la úlcera péptica; estabilizar antes de la endoscopia. <b>Vómito central<\/b> «en escopetazo»: sin náuseas ni esfuerzo."],"sondas":["<b>Levin<\/b> 1 luz · <b>Salem<\/b> 2 luces (aspiración) · <b>Foucher/Ewald<\/b> orogástricas gruesas (lavado) · <b>Sengstaken<\/b> 3 vías y 2 balones · <b>Minnesota<\/b> 4 vías · <b>Linton<\/b> 1 balón.","<b>Inserción:<\/b> Fowler, medida NEX (nariz → lóbulo de la oreja → xifoides), técnica limpia (no estéril), flexionar el cuello al avanzar.","<b>Verificación:<\/b> radiografía (referencia) y pH ≤ 4 a pie de cama. NUNCA auscultación de aire ni burbujas en agua.","<b>Contraindicaciones:<\/b> cáusticos, perforación u obstrucción esofágica, fractura facial o de la base del cráneo (→ vía oral).","<b>Retirada:<\/b> Fowler, lavar, PINZAR y retirar en inspiración mantenida. Fijación: cambiarla a diario.","<b>Enema:<\/b> Sims (decúbito lateral izquierdo), unos 40 °C, irrigador a 30-45 cm, sonda 7,5-10 cm en el adulto. Harris = gases. <b>Lavado gástrico:<\/b> decúbito lateral izquierdo + Trendelenburg."],"ostom":["<b>Heces:<\/b> ciego líquidas → ascendente semilíquidas → transverso blandas → descendente semiblandas → sigma SÓLIDAS.","<b>Marcaje<\/b> preoperatorio sobre el músculo recto anterior; ileostomía en FID y sigmoidea en FII. La colostomía empieza a funcionar a los 3-6 días.","<b>Cuidados:<\/b> agua tibia y jabón neutro, sin frotar, secar sin secador; orificio unos 3 mm mayor que el estoma; medirlo en cada cambio las primeras semanas; vaciar la bolsa a 1/3-1/2.","<b>Complicaciones precoces<\/b> (sangrado, edema, necrosis, dehiscencia) vs <b>tardías<\/b> (estenosis, retracción, prolapso, hernia, granuloma).","<b>Irrigación:<\/b> solo en descendentes o sigmoideas, agua a 37 °C, 500-1500 ml. <b>Kock<\/b> = ileostomía continente · <b>Paul-Mikulicz<\/b> = doble boca «en cañón de escopeta».","<b>PEG:<\/b> si la nutrición enteral va a durar más de 4-6 semanas; girarla a diario; balón con agua destilada (5-10 ml) cada 1-2 semanas; si sale antes de 2-3 semanas → hospital; lavar con 30 ml de agua."]},"escalas":[["Jorge-Wexner","Escalas y test","Valora la severidad de la incontinencia fecal (la más usada).","Puntúa la frecuencia de escapes de gas, líquido o sólido, el uso de compresas y la afectación de la vida diaria."],["FIQL","Escalas y test","Valora la calidad de vida del paciente con incontinencia fecal.","Fecal Incontinence Quality of Life Scale."],["RAFIS","Escalas y test","Evalúa rápidamente la gravedad de la incontinencia fecal.","Rapid Assessment Faecal Incontinence Score: propuesta por un grupo español de cirugía colorrectal."],["LARS","Escalas y test","Evalúa la función intestinal tras una resección rectal anterior.","Low Anterior Resection Score (Emmertsen, 2012), validada en español."],["Cuestionario de Montreux","Escalas y test","Valora la calidad de vida del paciente ostomizado.","Junto con Estoma QoL y SF-36, es una encuesta de calidad de vida del ostomizado."],["CVE-20","Escalas y test","Valora la calidad de vida en el estreñimiento.","20 ítems y 4 dimensiones (emocional, física general, física rectal y social). Cada ítem va de 0 (siempre) a 4 (nunca): 0 = peor calidad de vida."],["Escala de Bristol","Escalas y test","Valora la consistencia de las heces (tipos 1 a 7).","1-2 estreñimiento · 3-4 ideales (la 4 es la mejor) · 5 falta de fibra · 6-7 diarrea."],["Escala de Alvarado","Escalas y test","Estima la probabilidad de apendicitis aguda (0-10 puntos).","El dolor en FID y la leucocitosis puntúan 2. 0-4 negativa · 5-6 posible · 7-8 probable · 9-10 apendicitis."],["MECV-V","Escalas y test","Detecta la disfagia orofaríngea valorando la seguridad y la eficacia.","Bolos de 5, 10 y 20 ml: néctar → líquido → pudin. Seguridad: tos, cambio de voz, desaturación ≥ 3 %."],["EAT-10","Escalas y test","Cribado autoadministrado de la disfagia.","10 preguntas, Likert 0-4, total 0-40; ≥ 3 = posible disfagia. Requiere cognición conservada."],["IDDSI","Escalas y test","Estándar internacional de texturas para personas con disfagia.","8 niveles (0-7) en 2 pirámides que se cruzan: líquidos y alimentos."],["Test de Van de Kamer","Escalas y test","Cuantifica la grasa en las heces (esteatorrea).","Recogida de heces de 72 h con dieta controlada en grasas."],["Índice CAOD","Escalas y test","Mide la caries en la dentición permanente.","(Cariados + Ausentes + Obturados) / n.º de individuos; se suele medir a los 12 años."],["Índice cod","Escalas y test","Mide la caries en la dentición temporal.","No cuenta las ausencias, que pueden deberse a la exfoliación fisiológica."],["Child-Pugh","Escalas y test","Valora la gravedad y el pronóstico de la cirrosis.","Bilirrubina, albúmina, tiempo de protrombina, ascitis y encefalopatía → clases A, B y C."],["MELD","Escalas y test","Prioriza a los pacientes para el trasplante hepático.","Usa la creatinina, la bilirrubina y el INR."],["West Haven","Escalas y test","Gradúa la encefalopatía hepática (0-4).
