que la fenitoína no se absorbe con proteínas."],"a":1,"e":"La fenitoína se une a las proteínas de la fórmula y a la sonda, y su absorción cae. Por eso se detiene la nutrición enteral 1-2 h antes y 1-2 h después de cada dosis, lavando la sonda con agua. Nunca se mezcla un fármaco con la nutrición."},{"id":350,"ex":"Aragón Aplazado · 2026","s":"intestino","q":"Entre las manifestaciones extraintestinales en la colitis ulcerosa y en la enfermedad de Crohn se encuentran todas, EXCEPTO:","o":["Artritis periférica.","Eritema nodoso.","Uveítis.","Esplenomegalia."],"a":3,"e":"Manifestaciones extraintestinales de la EII: articulares (artritis periférica, sacroileítis), cutáneas (eritema nodoso, más en el Crohn; pioderma gangrenoso, más en la CU), oculares (uveítis, epiescleritis) y hepatobiliares (colangitis esclerosante). La esplenomegalia no es típica."},{"id":351,"ex":"SESCAM Aplazado · 2026","s":"sondas","q":"Como profesional de enfermería, en la atención y cuidado de una sonda digestiva, ¿cuál de las siguientes afirmaciones sobre sus características y funcionamiento es correcta?:","o":["La sonda de Levin es de doble luz y se utiliza principalmente para lavados en intoxicaciones severas.","La sonda de Salem permite la entrada de aire por una de sus luces para evitar la adherencia a la pared gástrica.","La sonda Freka es de gran calibre y se usa para lavados orogástricos en intoxicaciones por cáusticos.","La sonda Sengstaken-Blakemore tiene un único balón y se utiliza para descompresión intestinal."],"a":1,"e":"La Salem tiene doble luz: por la luz de ventilación entra aire, lo que evita que la sonda se adhiera y succione la mucosa durante la aspiración. La Levin tiene una sola luz, la Freka es fina (para nutrición) y la Sengstaken tiene dos balones y se usa en varices."},{"id":352,"ex":"SESCAM Aplazado · 2026","s":"valor","q":"¿Cuál de las siguientes opciones define correctamente la melena?:","o":["Emisión de sangre roja por el ano, generalmente procedente de la parte baja del tubo digestivo.","Presencia de sangre roja en las heces, sin alteración por los jugos digestivos.","Eliminación por el ano de sangre digerida, en forma de heces negras, pegajosas y de olor característico o fétido, típicamente originadas en el tracto digestivo superior.","Expulsión mediante el vómito de sangre o coágulos procedentes de la parte alta del tubo digestivo."],"a":2,"e":"Melena = salida por el ano de sangre digerida: heces negras, pegajosas, brillantes y fétidas, típicas de un sangrado alto (con al menos 50-100 ml de sangre en el tubo digestivo). La opción 1 es rectorragia, la 2 hematoquecia y la 4 hematemesis."},{"id":353,"ex":"SERGAS · 2026","s":"boca","q":"¿Cuál de los siguientes enunciados sobre la Acalasia Esofágica es falso?:","o":["La acidez gástrica es el segundo síntoma más frecuente.","La prueba diagnóstica de referencia actualmente es la manometría de alta resolución.","La clasificación de Chicago versión 4.0, establece 3 subtipos manométricos diferentes de acalasia.","En la terapia oral farmacológica, los fármacos más utilizados son los bloqueadores de los canales de calcio y los nitratos."],"a":0,"e":"En la acalasia el síntoma principal es la disfagia para sólidos Y líquidos, seguida de la regurgitación de alimento no digerido; la pirosis no es el segundo síntoma. La prueba de referencia es la manometría de alta resolución (Chicago v4.0: tipos I, II y III) y, en el tratamiento oral, se usan antagonistas del calcio y nitratos."},{"id":354,"ex":"SERGAS · 2026","s":"higado","q":"Señale la afirmación incorrecta respecto a la bilirrubina indirecta o no conjugada:","o":["Es liposoluble y circula unida a la albúmina.","La causa más importante de aumento de la bilirrubina indirecta es la hemólisis.","La bilirrubina indirecta puede atravesar la membrana glomerular, por lo que se elimina en la orina.","Es captada por los hepatocitos, donde es conjugada por acción de la enzima glucuroniltransferasa."],"a":2,"e":"La bilirrubina indirecta (no conjugada) es liposoluble y viaja unida a la albúmina, por lo que NO atraviesa el glomérulo ni aparece en la orina. Se eleva sobre todo por hemólisis y el hepatocito la conjuga (glucuroniltransferasa). La bilirrubina directa (conjugada) es hidrosoluble y sí se elimina por la orina (coluria)."},{"id":355,"ex":"SERGAS · 2026","s":"boca","q":"¿Cuál de los siguientes no es un factor de riesgo para el desarrollo del Esófago de Barrett?:","o":["Reflujo gastroesofágico.","Obesidad troncular.","Edad mayor de 50 años.","Raza negra."],"a":3,"e":"Factores de riesgo del esófago de Barrett: ERGE crónica, obesidad central, edad > 50 años, sexo masculino, raza BLANCA, tabaco y antecedentes familiares. La raza negra no es un factor de riesgo (de hecho, es menos frecuente en ella)."},{"id":356,"ex":"SERGAS · 2026","s":"higado","q":"Señale la respuesta falsa en relación a los estigmas de la hepatopatía crónica:","o":["Contractura de Dupuytren.","Arañas vasculares.","Hipertrofia parotídea.","Adipomastia."],"a":3,"e":"Estigmas de hepatopatía crónica: arañas vasculares, eritema palmar, ginecomastia (por hiperestrogenismo), hipertrofia parotídea y contractura de Dupuytren (sobre todo de origen alcohólico), circulación colateral... La adipomastia (acúmulo de grasa sin tejido glandular) no es un estigma hepático; lo es la ginecomastia verdadera."},{"id":357,"ex":"SERGAS Aplazado · 2026","s":"bilipan","q":"En relación con el signo de Courvoisier-Terrier, señale la respuesta correcta:","o":["Dolor en la fosa iliaca derecha con la hiperextensión pasiva o la flexión activa de la cadera derecha.","Dolor a la descompresión abdominal; es un signo de irritación peritoneal.","Presión en el punto máximo de dolor abdominal con un dedo mientras el paciente flexiona la cadera o levanta el tronco; si el dolor empeora, el signo es positivo.","Vesícula biliar palpable y no dolorosa en un paciente con ictericia obstructiva."],"a":3,"e":"Signo de Courvoisier-Terrier: vesícula biliar palpable y NO dolorosa en un paciente con ictericia obstructiva. Sugiere un tumor periampular o de la cabeza del páncreas. La opción 1 describe el signo del psoas, la 2 el de Blumberg y la 3 el de Carnett."},{"id":358,"ex":"SERGAS Aplazado · 2026","s":"agudo","q":"¿Qué término define la torsión de un asa intestinal sobre su propio eje mesentérico que genera una obstrucción mecánica estrangulante?:","o":["Invaginación o intususpección.","Íleo paralítico.","Vólvulo.","Diverticulitis."],"a":2,"e":"El vólvulo es la torsión de un asa intestinal sobre su eje mesentérico: produce una obstrucción mecánica con estrangulación vascular (riesgo de isquemia y perforación). Es más frecuente en el sigma (en ancianos) y el ciego. La invaginación es la introducción de un segmento dentro del siguiente."},{"id":359,"ex":"SERGAS Aplazado · 2026","s":"bilipan","q":"¿Cuál de los siguientes parámetros analíticos no forma parte de la escala de Ranson para la valoración pronóstica de la pancreatitis aguda?:","o":["Lactato deshidrogenasa LDH.","Aspartato aminotransferasa AST.","Amilasa sérica.","Glucemia."],"a":2,"e":"Criterios de Ranson al ingreso: edad > 55, leucocitos > 16.000, glucemia > 200, LDH > 350 y AST > 250. A las 48 h: descenso del hematocrito, aumento de la urea, calcio < 8, PaO₂ < 60, déficit de bases y secuestro de líquidos. La amilasa sirve para el diagnóstico, pero no tiene valor pronóstico."},{"id":360,"ex":"SERGAS EFyC · 2026","s":"intestino","q":"De acuerdo con el \"Protocolo de Cribado Poblacional de Cáncer Colorrectal\" del Servizo Galego de Saúde, ¿cuál de las siguientes situaciones constituye un criterio de exclusión DEFINITIVA del programa de cribado mediante test de sangre oculta en heces TSOHi:","o":["Haberse realizado una colonoscopia total con resultado de normalidad hace 10 años","Presentar un antecedente familiar de primer grado diagnosticado de cáncer colorrectal a los 64 años","Estar diagnosticado de enfermedad inflamatoria intestinal crónica Colitis Ulcerosa o Enfermedad de Crohn","Presentar dos o más familiares de segundo grado diagnosticados de cáncer colorrectal a cualquier edad"],"a":2,"e":"Tener enfermedad inflamatoria intestinal (CU o Crohn) es criterio de exclusión DEFINITIVA del cribado poblacional: son pacientes de alto riesgo que se siguen con colonoscopias en la consulta especializada. Una colonoscopia normal o ciertos antecedentes familiares pueden ser exclusiones temporales o derivaciones, según el caso."},{"id":361,"ex":"SERGAS EFyC · 2026","s":"ostom","q":"Paciente con PEG colocada hace 4 meses. En revisión domiciliaria se observa eritema leve periestomal, tejido de hipergranulación y disco externo firmemente ajustado a la piel. No presenta fiebre ni intolerancia a la nutrición enteral. Según los procedimientos de cuidados de gastrostomía en atención primaria, ¿cuál es la actuación más adecuada?:","o":["Aflojar el disco externo dejando ligera holgura, realizar higiene con agua y jabón neutro, secado cuidadoso y valorar tratamiento del granuloma según protocolo, manteniendo la nutrición y vigilancia de signos de infección.","Mantener el disco firmemente ajustado para evitar fugas y aplicar povidona yodada diaria hasta resolución del eritema.","Suspender la nutrición enteral y derivar para retirada de la PEG por sospecha de infección local.","Aplicar antibiótico tópico profiláctico y girar la sonda varias veces al día sin modificar el disco externo."],"a":0,"e":"Un disco externo demasiado ajustado causa isquemia, hipergranulación e incluso el «buried bumper» (el disco interno se entierra en la pared gástrica). Lo correcto es dejar una ligera holgura (unos 0,5 cm), mantener la higiene con agua y jabón neutro, tratar el granuloma según el protocolo (nitrato de plata) y continuar la nutrición vigilando signos de infección."},{"id":362,"ex":"SERGAS EFyC · 2026","s":"intestino","q":"En relación con el procedimiento de recogida de muestra para el Test de Sangre Oculta en Heces inmunológico TSOHi dentro del Programa Gallego de Detección Precoz del Cáncer Colorrectal, señale la respuesta CORRECTA:","o":["El paciente debe seguir una dieta exenta de carnes rojas y vitamina C durante las 48 horas previas a la recogida.","Si el paciente presenta hemorroides sangrantes o está en periodo menstrual, debe demorar la realización de la prueba hasta que hayan pasado al menos 3 días seguidos sin sangrado.","Tras la recogida, la muestra debe conservarse a temperatura ambiente y entregarse en el centro de salud en un plazo máximo de 24 horas.","Un antecedente familiar de primer grado diagnosticado de cáncer colorrectal a los 65 años es un criterio de exclusión definitiva del programa de cribado poblacional."],"a":1,"e":"Con el test inmunológico (TSOHi) no hace falta dieta. Pero si hay sangrado por hemorroides o menstruación, se espera a tener 3 días seguidos sin sangrado para evitar falsos positivos. La muestra se conserva refrigerada y se entrega cuanto antes. Un familiar de primer grado con CCR deriva a un programa de alto riesgo, no es una exclusión definitiva."},{"id":363,"ex":"SERGAS EFyC · 2026","s":"ostom","q":"Un paciente con ileostomía acude a consulta de Atención Primaria por mal control de su patología crónica. Al revisar su tratamiento, ¿cuál de las siguientes formas farmacéuticas debería evitarse o supervisarse estrechamente por riesgo de falta de absorción?:","o":["Jarabes y soluciones orales.","Comprimidos de liberación sostenida retard.","Cápsulas de gelatina blanda.","Comprimidos efervescentes."],"a":1,"e":"En la ileostomía el tránsito es rápido y no hay colon: los comprimidos de liberación sostenida (retard) o con cubierta entérica pueden salir enteros por el estoma sin liberar el fármaco. Se prefieren formas de liberación inmediata, líquidas o solubles, y se vigila si aparecen comprimidos en la bolsa."},{"id":364,"ex":"SERGAS EFyC · 2026","s":"bilipan","q":"¿Con qué patología se corresponde la triada de Charcot?:","o":["Colecistitis aguda.","Colangitis aguda.","Colelitiasis.","Apendicitis aguda."],"a":1,"e":"La tríada de Charcot (fiebre con escalofríos, ictericia y dolor en hipocondrio derecho) es la presentación clásica de la COLANGITIS aguda. Recuerda también la pentada de Reynolds (Charcot + shock + confusión), que indica colangitis supurada grave."},{"id":365,"ex":"Defensa · 2026","s":"sondas","q":"¿En qué posición deberá poner a un paciente para la colocación de una sonda nasogástrica?:","o":["Decúbito Lateral Derecho.","Sims.","Decúbito Lateral Izquierdo.","Fowler."],"a":3,"e":"La SNG se coloca en Fowler (sentado o semisentado, 45° o más) con la cabeza ligeramente flexionada hacia delante al avanzar la sonda. La posición de Sims (decúbito lateral) se reserva para el paciente inconsciente o el niño pequeño."},{"id":366,"ex":"Defensa · 2026","s":"higado","q":"La encefalopatía hepática incluye entre otros, los siguientes signos clínicos, EXCEPTO:","o":["Alteración del ciclo sueño/vigilia.","Reducción de la capacidad intelectual.","Asterixis o temblor de aleteo.","Estreñimiento."],"a":3,"e":"La encefalopatía hepática se manifiesta con alteraciones del ciclo sueño-vigilia, deterioro intelectual y de la atención, cambios de conducta y asterixis (flapping). El estreñimiento no es un signo de la encefalopatía, sino un factor DESENCADENANTE (por eso se usa lactulosa)."},{"id":367,"ex":"Defensa · 2026","s":"ostom","q":"¿Cuáles de las siguientes son complicaciones propias del estoma?:","o":["Prolapso.","Pioderma gangrenoso.","Estenosis.","a y c son correctas."],"a":3,"e":"El prolapso y la estenosis son complicaciones del propio estoma. El pioderma gangrenoso periestomal es una complicación CUTÁNEA de la zona periestomal (asociada a la EII), no del estoma en sí. Por eso la respuesta es la que agrupa prolapso y estenosis.","ns":1},{"id":368,"ex":"SERMAS · 2026","s":"ostom","q":"La irrigación de un estoma no está indicada en:","o":["Colostomías ascendentes.","Colostomías descendentes.","En pacientes con heces formadas y ritmo intestinal regular.","Colostomías sigmoideas."],"a":0,"e":"La irrigación NO está indicada en colostomías ascendentes (ni en transversas o ileostomías): el efluente es líquido y continuo y el colon restante no se puede «educar». Se indica en colostomías descendentes o sigmoideas con heces formadas y ritmo intestinal regular."},{"id":369,"ex":"SERMAS · 2026","s":"intestino","q":"¿Cuál de las siguientes opciones no es considerada como un factor de riesgo de estreñimiento?:","o":["Estrés.","Tratamiento con fármacos antiarrítmicos.","Sedentarismo.","Dieta baja en proteínas y en grasas de origen animal."],"a":3,"e":"Factores de riesgo de estreñimiento: dieta pobre en FIBRA y en líquidos, sedentarismo, estrés, ignorar el reflejo defecatorio y fármacos (opioides, antiarrítmicos como el verapamilo, anticolinérgicos, hierro). Una dieta baja en proteínas y grasas animales no es un factor de riesgo reconocido."},{"id":370,"ex":"Osakidetza · 2026","s":"sondas","q":"Tras la inserción de una sonda nasogástrica destinada a aspiración gástrica en un paciente adulto, ¿cuál de las siguientes actuaciones es la opción VERDADERA para identificar de forma correcta su colocación antes de utilizarla?:","o":["Insuflar aire con una jeringa y auscultar el epigastrio en busca de borborigmos, como se ha hecho tradicionalmente.","Comprobar que el paciente no presenta tos, disnea ni cambios en la saturación de oxígeno tras la inserción.","Aspirar contenido a través de la sonda y valorar sus características junto con la medición del pH.","Verificar que la longitud externa de la sonda coincide con la medida estimada previamente."],"a":2,"e":"La opción verdadera es aspirar contenido, valorar su aspecto (gástrico: claro, verdoso o con moco) y medir el pH (≤ 4, o hasta 5,5 según el protocolo). La auscultación y la ausencia de tos no son fiables, y la longitud externa solo sirve para detectar desplazamientos. Si hay dudas: radiografía."},{"id":371,"ex":"Osakidetza · 2026","s":"intestino","q":"¿Cuál de las siguientes complicaciones sistémicas se asocia con MAYOR frecuencia a la colitis ulcerosa que a la enfermedad de Crohn?:","o":["Obstrucción del intestino delgado.","Megacolon tóxico.","Colelitiasis.","Hidronefrosis derecha."],"a":1,"e":"El megacolon tóxico (dilatación aguda del colon > 6 cm con toxicidad sistémica) es más frecuente en la colitis ulcerosa. La obstrucción del intestino delgado, la colelitiasis (por malabsorción de sales biliares en el íleon) y la hidronefrosis derecha son más propias del Crohn."},{"id":372,"ex":"SERMAS 2º Llamamiento · 2026","s":"agudo","q":"En la exploración abdominal es importante una adecuada palpación, así como la verificación de signos específicos. No se considera un signo de exploración abdominal:","o":["Murphy.","Blumberg.","Rovsing.","Steinmann."],"a":3,"e":"Murphy (colecistitis), Blumberg (irritación peritoneal) y Rovsing (apendicitis) son signos de la exploración abdominal. El signo de Steinmann es una maniobra de la rodilla para explorar lesiones meniscales."},{"id":373,"ex":"SERMAS 2º Llamamiento · 2026","s":"agudo","q":"Entre los cuidados de Enfermería en pacientes que padecen una obstrucción intestinal no se encuentra:","o":["Control de diuresis y balance hídrico.","Administración de líquidos intravenosos y corrección de electrolitos.","Dieta blanda rica en fibra.","Colocación de sonda nasogástrica."],"a":2,"e":"En la obstrucción intestinal se pauta DIETA ABSOLUTA, con SNG para descomprimir, sueroterapia con corrección de electrolitos y control de diuresis y balance. Una dieta rica en fibra empeoraría la obstrucción."},{"id":374,"ex":"Castilla y León Estabilización · 2024","s":"sondas","q":"¿Cuál de las siguientes no es una vía de administración de la alimentación enteral?:","o":["Por sonda Levin.","Por sonda Salem.","Por sonda Faucher."],"a":2,"e":"La sonda de Faucher es orogástrica, de gran calibre, y se usa para el lavado gástrico, no para nutrir. Levin y Salem (nasogástricas) sí pueden emplearse para la nutrición enteral."},{"id":375,"ex":"Castilla y León Estabilización · 2024","s":"sondas","q":"¿En cuál de las siguientes situaciones está indicado colocar una sonda nasogástrica?:","o":["Traumatismo facial grave.","Obstrucción esofágica.","Nutrición en pacientes con ventilación mecánica."],"a":2,"e":"El paciente con ventilación mecánica que no puede comer necesita nutrición enteral por sonda: es una indicación clara de SNG. El traumatismo facial grave y la obstrucción esofágica son contraindicaciones."},{"id":376,"ex":"Castilla y León Estabilización · 2024","s":"sondas","q":"No es un tipo de sonda nasogástrica:","o":["Salem.","Levin.","Robinson."],"a":2,"e":"La Robinson es una sonda recta de uso vesical o rectal, no nasogástrica. Salem (doble luz) y Levin (una luz) son las sondas nasogástricas clásicas."}];
const FICHAS={"anat":["<b>Cuadrantes:<\/b> FID = ciego y apéndice · HD = hígado y vesícula · epigastrio = estómago, duodeno y páncreas.","<b>Esfínteres:<\/b> EES (cricofaríngeo) y EEI (cardias) en el esófago; píloro entre estómago y duodeno; válvula ileocecal (Bauhin).","<b>Absorción:<\/b> duodeno → hierro y calcio · yeyuno → la mayoría de nutrientes · íleon → B12 (con factor intrínseco), vitaminas A-D-E-K y sales biliares · colon → agua, Na y K.","<b>Vasos:<\/b> el tronco celíaco da la gástrica izquierda, la esplénica y la hepática común. Porta = mesentérica superior + esplénica.","<b>Páncreas:<\/b> jugo ALCALINO (bicarbonato) con lipasa, amilasa y tripsina. La CCK contrae la vesícula y relaja el esfínter de Oddi.","<b>Ángulo de Treitz:<\/b> por encima, hemorragia digestiva alta; por debajo, baja."],"boca":["<b>Odinofagia<\/b> = dolor al tragar · <b>afagia<\/b> = imposibilidad · disfagia <b>orofaríngea<\/b> (neurológica, empieza con líquidos) vs <b>esofágica<\/b> (mecánica: de sólidos a líquidos; motora: ambos).","<b>MECV-V:<\/b> 5 → 10 → 20 ml; néctar → líquido → pudin. Seguridad: tos, cambio de voz, desaturación ≥ 3 %. Eficacia: sello labial, residuo, deglución fraccionada.","<b>EAT-10:<\/b> 10 ítems, 0-40 puntos, ≥ 3 = riesgo. Evitar pajitas y dobles texturas; barbilla al pecho; en hemiplejia, GIRAR la cabeza hacia el lado afectado.","<b>ERGE:<\/b> elevar el cabecero 15-20 cm, no acostarse en las 3 h tras comer, evitar grasas, café, chocolate y menta; las proteínas suben el tono del EEI. No dormir sobre el lado derecho.","<b>Barrett<\/b> = metaplasia premaligna. <b>Acalasia:<\/b> el EEI no se relaja; «pico de pájaro»; manometría; miotomía de Heller.","<b>Salivales:<\/b> parótida → Stenon · submandibular → Wharton · sublingual → Rivinus. <b>CAOD<\/b> = dentición permanente; <b>cod<\/b> = temporal."],"estom":["<b>Úlcera<\/b> = sobrepasa la muscularis mucosae. Causas: <b>H. pylori<\/b> (1.ª) y <b>AINE<\/b> (2.ª).","Complicación más <b>frecuente<\/b>: hemorragia · más <b>grave<\/b>: perforación · también penetración y estenosis pilórica.","<b>Duodenal:<\/b> dolor 1,5-3 h tras comer, CEDE con la comida, nocturno. <b>Gástrica:<\/b> 20-30 min, no cede, más vómitos y más riesgo de malignidad.","<b>H. pylori:<\/b> test del aliento con C13 de elección; suspender IBP 2 semanas y antibióticos/bismuto 4 semanas (los antiácidos no interfieren). Tratamiento OCAM 10-14 días.","<b>Dumping precoz<\/b> (30-60 min, vasomotor) y <b>tardío<\/b> (90-180 min, hipoglucemia): 5-6 tomas, líquidos separados de las comidas, menos azúcares simples.","<b>Gastrectomía<\/b> → sin factor intrínseco → B12 intramuscular de por vida. <b>Zollinger-Ellison<\/b> = gastrinoma."],"agudo":["<b>Apendicitis:<\/b> dolor periumbilical que migra a FID (McBurney) + anorexia. Signos: Blumberg, Rovsing, Dunphy, Aaron; psoas y obturador si es retrocecal.","<b>Alvarado:<\/b> 10 puntos (2 por dolor en FID y 2 por leucocitosis); ≥ 7 = probable. Complicación más grave: peritonitis; más frecuente: infección de la herida.","<b>Obstrucción mecánica:<\/b> adherencias (1.ª en operados), hernias (1.ª en no operados); en el colon, el cáncer. <b>Íleo paralítico:<\/b> funcional, típico del postoperatorio.","<b>Manejo:<\/b> dieta absoluta, SNG para descomprimir, sueroterapia, control de diuresis y analgesia.","<b>Peritonitis:<\/b> abdomen en tabla, ruidos disminuidos, fiebre y riesgo de shock.","<b>Vólvulo<\/b> = torsión con estrangulación · ángulo esplénico = zona frontera de isquemia · <b>Kehr<\/b> = dolor en el hombro izquierdo en la rotura esplénica."],"intestino":["<b>Colitis ulcerosa:<\/b> recto, continua, mucosa, rectorragia, el tabaco protege, megacolon tóxico, cirugía curativa.","<b>Crohn:<\/b> de la boca al ano (íleon terminal), transmural, segmentaria, fístulas y afectación perianal, granulomas, el tabaco empeora.","<b>Montreal:<\/b> CU por extensión (E1-E3) y gravedad (S0-S3) · Crohn por edad (A), localización (L) y comportamiento (B).","<b>Bristol:<\/b> 1-2 estreñimiento · 3-4 ideal · 5 falta de fibra · 6-7 diarrea. Estreñimiento = menos de 3 deposiciones/semana.","<b>Diarrea secretora<\/b> (no cede con el ayuno, osmolaridad normal) vs <b>osmótica<\/b> (cede con el ayuno, pH ácido).","<b>Cribado del CCR:<\/b> 50-69 años (ampliándose a 74), FIT cada 2 años, colonoscopia si es positivo = prevención SECUNDARIA. Diverticulosis → fibra; diverticulitis → dieta absoluta, sin colonoscopia en fase aguda."],"higado":["<b>Cirrosis:<\/b> VHC y alcohol (80 %). Hipertensión portal → varices, ascitis, esplenomegalia y circulación colateral.","<b>Encefalopatía:<\/b> West Haven 0-4; asterixis. Desencadenantes: hemorragia, estreñimiento, infecciones, sedantes. Lactulosa. Dieta hipercalórica e HIPERproteica (la hipoproteica está obsoleta).","<b>Ascitis:<\/b> dieta sin sal, espironolactona + furosemida, peso y perímetro diarios. <b>Paracentesis:<\/b> vaciar la vejiga, punción en el lado izquierdo, vigilar la TA, albúmina desde el 5.º litro.","<b>Varices sangrantes:<\/b> estabilizar, somatostatina o terlipresina + ligadura endoscópica; Sengstaken como puente.","<b>Child-Pugh<\/b> (bilirrubina, albúmina, TP, ascitis, encefalopatía) · <b>MELD<\/b> (creatinina, bilirrubina, INR).","<b>Bilirrubina indirecta:<\/b> liposoluble, por hemólisis, no pasa a la orina. <b>Directa:<\/b> hidrosoluble, coluria. AINE contraindicados en la cirrosis."],"bilipan":["<b>Colelitiasis:<\/b> cálculos de colesterol (75 %); cólico irradiado al hombro derecho; la ecografía es la prueba de elección.","<b>Colecistitis:<\/b> cálculo en el cístico; dolor + fiebre + leucocitosis; signo de <b>Murphy<\/b>.","<b>Colangitis:<\/b> tríada de <b>Charcot<\/b> (dolor, fiebre, ictericia) → con shock y confusión, pentada de <b>Reynolds<\/b>.","<b>Tubo de Kehr:<\/b> bolsa por DEBAJO del punto de inserción, registrar el débito, pinzar antes y después de las comidas.","<b>Pancreatitis aguda:<\/b> litiasis (1.ª), alcohol (2.ª); dolor en cinturón que mejora inclinándose hacia delante; amilasa ×3, la lipasa es más específica; Cullen y Grey-Turner = gravedad.","<b>Atlanta<\/b> (gravedad) · <b>Ranson<\/b> (pronóstico, sin amilasa) · <b>Courvoisier-Terrier<\/b>: vesícula palpable indolora + ictericia → cabeza de páncreas (Whipple)."],"valor":["<b>Exploración:<\/b> inspección → auscultación → percusión → palpación (auscultar ANTES de palpar). Ausencia de ruidos = nada en 3-5 min.","<b>Melena<\/b> (negra, pegajosa, fétida; origen alto) · <b>hematoquecia<\/b> (roja con las heces) · <b>rectorragia<\/b> (sangre fresca) · <b>hematemesis<\/b> (vómito; «posos de café» = sangre digerida).","<b>Heces acólicas<\/b> → obstrucción biliar o hepatitis · <b>esteatorrea<\/b> → test de Van de Kamer.","<b>Sangre oculta:<\/b> hoy FIT (inmunoquímico), sin dieta; esperar 3 días sin sangrado si hay regla o hemorroides. Guayaco = obsoleto (la vitamina C daba falsos negativos).","<b>Colonoscopia:<\/b> dieta pobre en residuos 48 h, líquidos claros 24 h, decúbito lateral izquierdo con las rodillas flexionadas; con sedación debe ir acompañado.","<b>HDA:<\/b> primera causa la úlcera péptica; estabilizar antes de la endoscopia. <b>Vómito central<\/b> «en escopetazo»: sin náuseas ni esfuerzo."],"sondas":["<b>Levin<\/b> 1 luz · <b>Salem<\/b> 2 luces (aspiración) · <b>Foucher/Ewald<\/b> orogástricas gruesas (lavado) · <b>Sengstaken<\/b> 3 vías y 2 balones · <b>Minnesota<\/b> 4 vías · <b>Linton<\/b> 1 balón.","<b>Inserción:<\/b> Fowler, medida NEX (nariz → lóbulo de la oreja → xifoides), técnica limpia (no estéril), flexionar el cuello al avanzar.","<b>Verificación:<\/b> radiografía (referencia) y pH ≤ 4 a pie de cama. NUNCA auscultación de aire ni burbujas en agua.","<b>Contraindicaciones:<\/b> cáusticos, perforación u obstrucción esofágica, fractura facial o de la base del cráneo (→ vía oral).","<b>Retirada:<\/b> Fowler, lavar, PINZAR y retirar en inspiración mantenida. Fijación: cambiarla a diario.","<b>Enema:<\/b> Sims (decúbito lateral izquierdo), unos 40 °C, irrigador a 30-45 cm, sonda 7,5-10 cm en el adulto. Harris = gases. <b>Lavado gástrico:<\/b> decúbito lateral izquierdo + Trendelenburg."],"ostom":["<b>Heces:<\/b> ciego líquidas → ascendente semilíquidas → transverso blandas → descendente semiblandas → sigma SÓLIDAS.","<b>Marcaje<\/b> preoperatorio sobre el músculo recto anterior; ileostomía en FID y sigmoidea en FII. La colostomía empieza a funcionar a los 3-6 días.","<b>Cuidados:<\/b> agua tibia y jabón neutro, sin frotar, secar sin secador; orificio unos 3 mm mayor que el estoma; medirlo en cada cambio las primeras semanas; vaciar la bolsa a 1/3-1/2.","<b>Complicaciones precoces<\/b> (sangrado, edema, necrosis, dehiscencia) vs <b>tardías<\/b> (estenosis, retracción, prolapso, hernia, granuloma).","<b>Irrigación:<\/b> solo en descendentes o sigmoideas, agua a 37 °C, 500-1500 ml. <b>Kock<\/b> = ileostomía continente · <b>Paul-Mikulicz<\/b> = doble boca «en cañón de escopeta».","<b>PEG:<\/b> si la nutrición enteral va a durar más de 4-6 semanas; girarla a diario; balón con agua destilada (5-10 ml) cada 1-2 semanas; si sale antes de 2-3 semanas → hospital; lavar con 30 ml de agua."]};
const ESCALAS=[["Jorge-Wexner","Escalas y test","Valora la severidad de la incontinencia fecal (la más usada).","Puntúa la frecuencia de escapes de gas, líquido o sólido, el uso de compresas y la afectación de la vida diaria."],["FIQL","Escalas y test","Valora la calidad de vida del paciente con incontinencia fecal.","Fecal Incontinence Quality of Life Scale."],["RAFIS","Escalas y test","Evalúa rápidamente la gravedad de la incontinencia fecal.","Rapid Assessment Faecal Incontinence Score: propuesta por un grupo español de cirugía colorrectal."],["LARS","Escalas y test","Evalúa la función intestinal tras una resección rectal anterior.","Low Anterior Resection Score (Emmertsen, 2012), validada en español."],["Cuestionario de Montreux","Escalas y test","Valora la calidad de vida del paciente ostomizado.","Junto con Estoma QoL y SF-36, es una encuesta de calidad de vida del ostomizado."],["CVE-20","Escalas y test","Valora la calidad de vida en el estreñimiento.","20 ítems y 4 dimensiones (emocional, física general, física rectal y social). Cada ítem va de 0 (siempre) a 4 (nunca): 0 = peor calidad de vida."],["Escala de Bristol","Escalas y test","Valora la consistencia de las heces (tipos 1 a 7).","1-2 estreñimiento · 3-4 ideales (la 4 es la mejor) · 5 falta de fibra · 6-7 diarrea."],["Escala de Alvarado","Escalas y test","Estima la probabilidad de apendicitis aguda (0-10 puntos).","El dolor en FID y la leucocitosis puntúan 2. 0-4 negativa · 5-6 posible · 7-8 probable · 9-10 apendicitis."],["MECV-V","Escalas y test","Detecta la disfagia orofaríngea valorando la seguridad y la eficacia.","Bolos de 5, 10 y 20 ml: néctar → líquido → pudin. Seguridad: tos, cambio de voz, desaturación ≥ 3 %."],["EAT-10","Escalas y test","Cribado autoadministrado de la disfagia.","10 preguntas, Likert 0-4, total 0-40; ≥ 3 = posible disfagia. Requiere cognición conservada."],["IDDSI","Escalas y test","Estándar internacional de texturas para personas con disfagia.","8 niveles (0-7) en 2 pirámides que se cruzan: líquidos y alimentos."],["Test de Van de Kamer","Escalas y test","Cuantifica la grasa en las heces (esteatorrea).","Recogida de heces de 72 h con dieta controlada en grasas."],["Índice CAOD","Escalas y test","Mide la caries en la dentición permanente.","(Cariados + Ausentes + Obturados) / n.º de individuos; se suele medir a los 12 años."],["Índice cod","Escalas y test","Mide la caries en la dentición temporal.","No cuenta las ausencias, que pueden deberse a la exfoliación fisiológica."],["Child-Pugh","Escalas y test","Valora la gravedad y el pronóstico de la cirrosis.","Bilirrubina, albúmina, tiempo de protrombina, ascitis y encefalopatía → clases A, B y C."],["MELD","Escalas y test","Prioriza a los pacientes para el trasplante hepático.","Usa la creatinina, la bilirrubina y el INR."],["West Haven","Escalas y test","Gradúa la encefalopatía hepática (0-4).","I: euforia, atención reducida · II: letargia, desorientación · III: estupor · IV: coma."],["Truelove-Witts","Escalas y test","Valora la actividad (gravedad del brote) de la colitis ulcerosa.","Grave: 6 o más deposiciones con sangre, fiebre, taquicardia, anemia y VSG elevada."],["CDAI","Escalas y test","Valora la actividad de la enfermedad de Crohn.","Crohn's Disease Activity Index."],["Criterios de Ranson","Escalas y test","Estiman el pronóstico de la pancreatitis aguda.","Al ingreso: edad, leucocitos, glucemia, LDH y AST. La amilasa NO puntúa."],["Arts y Sigstad","Escalas y test","Valoran los síntomas del síndrome de dumping.","Sistemas de puntuación del vaciamiento gástrico rápido tras la cirugía gástrica."],["Clasificación de Montreal (CU)","Clasificaciones","Clasifica la colitis ulcerosa por extensión y gravedad.","E1 proctitis · E2 colitis izquierda · E3 extensa; gravedad S0-S3."],["Clasificación de Montreal (Crohn)","Clasificaciones","Clasifica el Crohn por edad al diagnóstico, localización y comportamiento.","A1-A3 · L1-L4 · B1 inflamatorio, B2 estenosante, B3 fistulizante (+ «p» si es perianal)."],["Clasificación de Hinchey","Clasificaciones","Estadifica la diverticulitis y sus complicaciones (absceso, peritonitis).","Guía el tratamiento de la diverticulitis complicada y no complicada."],["Clasificación de Atlanta","Clasificaciones","Estratifica la gravedad de la pancreatitis aguda.","Leve, moderadamente grave o grave; por fases: temprana o tardía."],["Astler-Coller / Dukes","Clasificaciones","Estadiaje pronóstico del cáncer colorrectal.","A: mucosa · B: pared sin ganglios (B3 invade órganos vecinos) · C: con ganglios."],["Hernia de hiato tipo I","Clasificaciones","Hernia por deslizamiento: la más frecuente (> 90 %) y asociada al reflujo.","Tipo II paraesofágica (cirugía) · III mixta · IV con otras vísceras."],["Signo de Blumberg","Signos","Dolor a la descompresión brusca: irritación peritoneal.","En la FID orienta a apendicitis."],["Signo de Rovsing","Signos","Al presionar la FII aparece dolor en la FID: apendicitis.","Los gases se desplazan hacia el ciego y lo distienden."],["Signo de Dunphy","Signos","Aumenta el dolor en McBurney al toser: apendicitis.",""],["Signo de Aaron","Signos","Al presionar McBurney aparece dolor epigástrico o precordial: apendicitis.",""],["Signo del psoas (Cope)","Signos","Dolor en la FID con la extensión o flexión de la cadera derecha: apendicitis retrocecal.","Paciente en decúbito lateral izquierdo extendiendo la pierna derecha hacia atrás."],["Signo del obturador (Cope)","Signos","Dolor hipogástrico al flexionar y rotar hacia dentro la cadera derecha: apendicitis retrocecal o pélvica.",""],["Signo de Murphy","Signos","Se interrumpe la inspiración al palpar el hipocondrio derecho: colecistitis aguda.",""],["Signo de Cullen","Signos","Equimosis azulada periumbilical: pancreatitis necrotizante o hemorrágica.","Infrecuente, pero indica gravedad."],["Signo de Grey-Turner","Signos","Equimosis azulada en los flancos: pancreatitis necrotizante o hemorrágica.","Infrecuente, pero indica gravedad."],["Signo de Courvoisier-Terrier","Signos","Vesícula palpable e indolora con ictericia: tumor de la cabeza del páncreas o periampular.",""],["Signo de Kehr","Signos","Dolor referido al hombro izquierdo: rotura esplénica.","La sangre irrita el diafragma (nervio frénico)."],["Asterixis (flapping)","Signos","Temblor aleteante de las manos en extensión: encefalopatía hepática.","Gesto de «detener el tráfico»."],["Signo de Trousseau","Signos","Espasmo carpiano al inflar el manguito: hipocalcemia (por ejemplo, en la pancreatitis).",""],["Punto de McBurney","Signos","Unión del tercio externo con los dos tercios internos de la línea ombligo-EIAS derecha.","Proyección de la base del apéndice."],["Tríada de Charcot","Tríadas","Dolor cólico + fiebre + ictericia: colangitis aguda.",""],["Pentada de Reynolds","Tríadas","Charcot + shock + confusión mental: colangitis grave.","Más frecuente en ancianos."],["Tríada de la colecistitis","Tríadas","Dolor brusco en hipocondrio derecho + fiebre + leucocitosis.",""],["Maniobra de Masako","Maniobras de deglución","Tragar saliva con la lengua sujeta entre los dientes: fortalece la pared faríngea posterior.",""],["Maniobra de Mendelsohn","Maniobras de deglución","Mantener la laringe elevada 2-3 s al tragar: mejora la apertura del EES.",""],["Deglución supersupraglótica","Maniobras de deglución","Inspirar, retener el aire, tragar con fuerza y toser: protege la vía aérea.",""],["Deglución forzada","Maniobras de deglución","Tragar apretando fuerte todos los músculos: aumenta la propulsión del bolo.",""],["Sonda de Levin","Sondas","Nasogástrica de 1 luz: aspiración, lavado, nutrición y muestras.","14-18 Fr en adultos."],["Sonda de Salem","Sondas","Nasogástrica de 2 luces (una de aire): aspiración sin succionar la mucosa.",""],["Sonda de Foucher / Ewald","Sondas","Orogástrica de gran calibre: lavado gástrico.",""],["Sonda de Sengstaken-Blakemore","Sondas","3 vías y 2 balones: varices esofágicas sangrantes.","Balón gástrico 200-250 ml; esofágico con aire a presión controlada."],["Sonda de Minnesota","Sondas","4 vías y 2 balones: Sengstaken con aspiración esofágica.",""],["Sonda de Linton-Nachlas","Sondas","3 vías y un único balón gástrico: varices fúndicas.",""],["Sonda de Miller-Abbott","Sondas","Nasoentérica de 2 luces con globo: descompresión intestinal.",""],["Sonda de Cantor / Harris","Sondas","Nasoentérica de 1 luz con reservorio de mercurio (en desuso).",""],["Sonda Freka / Nutrisoft","Sondas","Finas y flexibles: nutrición enteral prolongada.",""],["Sonda de Plummer","Sondas","Dilata estenosis esofágicas (no sirve para alimentar).",""],["Tubo de Kehr (en T)","Sondas","Drenaje biliar tras explorar el colédoco.","Bolsa por debajo del punto de inserción; pinzar antes y después de las comidas."]];

const byId=Object.fromEntries(Q.map(q=>[q.id,q]));

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(a,b)=>b?Math.round(a*100/b):0;

/* ---------- progreso (localStorage, opcional) ---------- */
const KEY='opolab-digestivo-v1';
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&v.q?v:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||{q:{},sims:[],esc:{best:0}};
const rec=id=>S.q[id]||(S.q[id]={n:0,ok:0,st:0,r:0});
const isMastered=id=>!!(S.q[id]&&S.q[id].st>=2);
const isPending=id=>!!(S.q[id]&&S.q[id].r);
function register(id,ok,sure){
  const r=rec(id);r.n++;
  if(ok){r.ok++; if(sure){r.st++;r.r=0}else{r.r=1}}
  else{r.st=0;r.r=1}
  save();
}
function stationStats(sid){
  const qs=VALID.filter(q=>q.s===sid);
  return {total:qs.length,mastered:qs.filter(q=>isMastered(q.id)).length,pending:qs.filter(q=>isPending(q.id)).length,seen:qs.filter(q=>S.q[q.id]&&S.q[q.id].n).length};
}
function globalStats(){
  let n=0,ok=0;Object.values(S.q).forEach(r=>{n+=r.n;ok+=r.ok});
  return {mastered:VALID.filter(q=>isMastered(q.id)).length,pending:VALID.filter(q=>isPending(q.id)).length,acc:pct(ok,n),answered:n};
}

}
function mapSVG(){

  let h=`<svg viewBox="20 40 960 530" role="img" aria-label="Mapa de metro del aparato digestivo">`;
  for(const k of [3,2,1]) h+=`<path d="${paths[k]}" fill="none" stroke="${LINES[k].c}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`;
  h+=`<text x="60" y="95" font-size="14" font-weight="800" fill="${LINES[1].c}">BOCA ▸</text><text x="942" y="385" font-size="14" font-weight="800" fill="${LINES[1].c}">ANO</text>`;
  for(const s of ST){
    const t=stationStats(s.id),c=LINES[s.line].c,big=s.line==='C';
    const R=big?26:22,C=2*Math.PI*R,p=t.total?t.mastered/t.total:0;
    h+=`<g class="st" data-st="${s.id}" tabindex="0" role="button" aria-label="${esc(s.name)}: ${t.mastered} de ${t.total} dominadas">
      <circle cx="${s.x}" cy="${s.y}" r="${R}" fill="#fff" stroke="#e3ebf3" stroke-width="6"/>

      <circle class="node" cx="${s.x}" cy="${s.y}" r="${big?18:15}" fill="${big?'#082b5c':'#fff'}" stroke="${big?'#082b5c':c}" stroke-width="5"/>

function pickTrip(sid,n){
  let pool=VALID.filter(q=>q.s===sid);
  if(n==='pend') return shuffle(pool.filter(q=>isPending(q.id)));
  const rank=q=>isPending(q.id)?0:!S.q[q.id]?1:!isMastered(q.id)?2:3;
  pool=shuffle(pool).sort((a,b)=>rank(a)-rank(b));
  return n==='all'?pool:pool.slice(0,+n);
}

/* ---------- motor de preguntas ---------- */
let G=null;
function startQuiz(items,opt){
  if(!items.length){toastEmpty();return}
  G={items:items.map(q=>({q,order:q.ns?[0,1,2,3].slice(0,q.o.length):shuffle([...q.o.keys()]),pick:null,ok:null})),i:0,mode:opt.mode,title:opt.title,color:opt.color||'var(--cyan)',back:opt.back||'home',t0:Date.now()};
  drawQ();
}
function toastEmpty(){
  render(`<div class="card" style="max-width:640px;margin:20px auto;text-align:center"><div style="font-size:46px">🎉</div><h2 style="margin:6px 0">No hay nada pendiente</h2><p class="small">Cuando falles una pregunta o la aciertes dudando, aparecerá aquí para que la repases.</p><button class="btn primary" data-go="home">Volver al mapa</button></div>`);
}
function trackHTML(){
  return G.items.map((it,i)=>{
    let c='dot';if(i===G.i)c+=' cur';if(it.pick!==null){c+=G.mode==='sim'?' ans':(it.ok?' ok':' ko')}
    return (i?`<span class="seg${i<=G.i?' done':''}"></span>`:'')+`<span class="${c}"></span>`;
  }).join('');
}
function drawQ(){
  const it=G.items[G.i],q=it.q,s=stById[q.s];
  const opts=it.order.map((oi,pos)=>`<button class="opt" data-pos="${pos}"><span class="k">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`).join('');
  const many=G.items.length>30;
  render(`
  <div class="qtop"><button class="btn ghost" data-exit>✕ Salir</button><div class="qtitle">${esc(G.title)}</div><div class="qcount">${G.i+1}/${G.items.length}</div></div>
  ${many?`<div class="bar" style="margin:0 0 14px"><i style="width:${pct(G.i,G.items.length)}%;background:var(--lc)"></i></div>`:`<div class="track" aria-hidden="true">${trackHTML()}</div>`}
  <article class="qcard">
    <div class="qchips"><span class="chip src">📍 ${esc(q.ex)}</span><span class="chip stn" style="--lc:${colorOf(q.s)}">● ${esc(s.name)}</span></div>
    <h2 class="qtext">${esc(q.q)}</h2>
    <div class="opts" role="group" aria-label="Opciones de respuesta">${opts}</div>
    <div class="fb" aria-live="polite"></div>
  </article>
  ${G.mode==='sim'?`<div class="qfoot"><button class="btn ghost" data-prev ${G.i?'':'disabled'}>← Anterior</button><button class="btn primary" data-next ${it.pick===null?'disabled':''}>${G.i===G.items.length-1?'Entregar examen':'Siguiente →'}</button></div>`:''}
  `,G.color);
  if(G.mode==='sim'&&it.pick!==null) $$('.opt')[it.pick].classList.add('sel');
}
function answer(pos){
  const it=G.items[G.i],q=it.q;
  if(G.mode==='sim'){
    it.pick=pos;it.ok=it.order[pos]===q.a;
    $$('.opt').forEach((b,i)=>b.classList.toggle('sel',i===pos));
    $('[data-next]').disabled=false;$('.track')&&($('.track').innerHTML=trackHTML());
    return;
  }
  if(it.pick!==null) return;
  it.pick=pos;it.ok=it.order[pos]===q.a;
  const correctPos=it.order.indexOf(q.a);
  $$('.opt').forEach((b,i)=>{b.disabled=true;if(i===correctPos)b.classList.add('ok');else if(i===pos)b.classList.add('ko');else b.classList.add('dim')});
  const fb=$('.fb');
  fb.className='fb show '+(it.ok?'ok':'ko');
  const last=G.i===G.items.length-1;
  fb.innerHTML=`<div class="fbHead">${it.ok?'✓ ¡Correcto!':`✗ La correcta es la ${L[correctPos]})`}</div>
    <p class="why"><b>Por qué:</b> ${esc(q.e)}</p>
    ${DOCENTE&&q.f?`<div class="flag">🧑‍🏫 <b>Nota de revisión:</b> ${esc(q.f)}</div>`:''}
    <div class="fbAct">${it.ok?
      `<button class="btn primary" data-sure="1">💡 Lo sabía</button><button class="btn ghost" data-sure="0">🤔 He dudado</button><span class="hint">Teclas S / D</span>`:
      `<button class="btn primary" data-sure="0">${last?'Ver resultado':'Siguiente →'}</button><span class="hint">Enter</span>`}</div>`;
  $('.track')&&($('.track').innerHTML=trackHTML());
  fb.querySelector('button').focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function next(sure){
  const it=G.items[G.i];
  if(G.mode!=='sim') register(it.q.id,it.ok,!!sure);
  if(G.i<G.items.length-1){G.i++;drawQ()}else finish();
}
function finish(){
  if(G.mode==='sim') G.items.forEach(it=>{if(it.pick!==null)register(it.q.id,it.ok,true);else{const r=rec(it.q.id);r.n++;r.st=0;r.r=1;save()}});
  const n=G.items.length,ok=G.items.filter(i=>i.ok).length,ko=G.items.filter(i=>i.pick!==null&&!i.ok).length,blank=n-ok-ko;
  const net=Math.max(0,ok-ko/3),nota=(net*10/n);
  const mins=Math.round((Date.now()-G.t0)/60000);
  if(G.mode==='sim'){S.sims.unshift({d:Date.now(),n,ok,ko,nota:+nota.toFixed(2)});S.sims=S.sims.slice(0,10);save()}
  const p=pct(ok,n),R=62,C=2*Math.PI*R;
  const msg=p>=85?'¡Trayecto de matrícula!':p>=65?'Buen viaje: vas por la vía correcta.':p>=45?'Vas bien, pero hay estaciones que repasar.':'Toca volver a las claves y repasar.';
  const byS={};G.items.forEach(it=>{const k=it.q.s;byS[k]=byS[k]||{n:0,ok:0};byS[k].n++;if(it.ok)byS[k].ok++});
  const fails=G.items.filter(i=>!i.ok);
  const review=(G.mode==='sim'?G.items:fails).map(it=>{
    const q=it.q,cp=it.order.indexOf(q.a);
    const st=it.ok?['var(--ok)','✓']:it.pick===null?['#94a3b8','–']:['var(--ko)','✗'];
    return `<details class="revItem"><summary><span class="st" style="background:${st[0]}">${st[1]}</span><span>${esc(q.q.length>140?q.q.slice(0,140)+'…':q.q)}</span></summary><div class="body">
      ${it.pick!==null&&!it.ok?`<p>Tu respuesta: <b style="color:var(--ko)">${L[it.pick]}) ${esc(q.o[it.order[it.pick]])}</b></p>`:''}
      <p>Correcta: <b style="color:var(--ok)">${L[cp]}) ${esc(q.o[q.a])}</b></p>
      <p class="why"><b>Por qué:</b> ${esc(q.e)}</p><p class="small">📍 ${esc(q.ex)} · ${esc(stById[q.s].name)}</p></div></details>`}).join('');
  render(`
  <section class="res">
    <div class="card resTop">
      <svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="#e7eef6" stroke-width="14"/><circle cx="75" cy="75" r="${R}" fill="none" stroke="${p>=65?'#14936c':p>=45?'#f2a33a':'#d0435a'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 75 75)"/><text x="75" y="84" text-anchor="middle" font-size="30" font-weight="800" fill="#082b5c">${p}%</text></svg>
      <div><div class="eyebrow" style="color:var(--muted)">${esc(G.title).toUpperCase()}</div><h2>${msg}</h2>
        <p class="small" style="margin:0">${ok} aciertos de ${n}${G.mode==='sim'?` · ${ko} errores · ${blank} en blanco · ${mins} min`:''}</p></div>
    </div>
    ${G.mode==='sim'?`<div class="resGrid"><div class="stat"><b>${nota.toFixed(2)}</b><span>nota sobre 10 (−1/3 por error)</span></div><div class="stat"><b>${net.toFixed(2)}</b><span>aciertos netos</span></div><div class="stat"><b>${S.sims.length>1?S.sims[1].nota.toFixed(2):'—'}</b><span>nota del simulacro anterior</span></div></div>`:''}
    ${Object.keys(byS).length>1?`<div class="card" style="margin-top:12px"><h3>Por estaciones</h3>${Object.entries(byS).map(([k,v])=>`<div class="kv"><span><span style="color:${colorOf(k)}">●</span> ${stById[k].name}</span><b>${v.ok}/${v.n}</b></div>`).join('')}</div>`:''}
    <div class="row" style="margin:14px 0">
      ${fails.length?`<button class="btn primary" data-redo>🔁 Repetir mis fallos (${fails.length})</button>`:''}
      ${G.back!=='home'?`<button class="btn ghost" data-st="${G.back}">Volver a la estación</button>`:''}
      <button class="btn ghost" data-go="home">Ir al mapa</button>
    </div>
    ${review?`<div class="sectionTitle"><h2>${G.mode==='sim'?'Corrección completa':'Repasa tus fallos'}</h2></div>${review}`:''}
  </section>`,G.color);
  G.fails=fails.map(i=>i.q);
}

  <div class="card">
    <h3>Elige mazo</h3>
    <div class="filters" data-group="cat">${cats.map(c=>`<button class="${EX.cat===c?'on':''}" data-v="${c}">${c} (${c==='Todas'?ESCALAS.length:ESCALAS.filter(e=>e[1]===c).length})</button>`).join('')}</div>
    <div style="margin-top:16px" class="row"><button class="btn primary" data-exgo>Empezar ronda →</button></div>
    <details style="margin-top:16px"><summary class="small" style="cursor:pointer;font-weight:700">📖 Ver el mazo completo para estudiar</summary>
      <div style="margin-top:10px">${ESCALAS.filter(e=>EX.cat==='Todas'||e[1]===EX.cat).map(e=>`<div class="kv" style="display:block"><b>${esc(e[0])}</b> <span class="small">· ${esc(e[1])}</span><div style="font-size:14px">${esc(e[2])}${e[3]?` <span class="small">${esc(e[3])}</span>`:''}</div></div>`).join('')}</div></details>
  </div>`,'#16a37a');
}
function exStart(){
  const deck=ESCALAS.filter(e=>EX.cat==='Todas'||e[1]===EX.cat);
  const cards=shuffle(deck).slice(0,10).map(e=>{
    const rev=Math.random()<.5;
    let pool=deck.filter(x=>x!==e&&x[2]!==e[2]);
    if(pool.length<3) pool=ESCALAS.filter(x=>x!==e&&x[2]!==e[2]);
    const same=shuffle(pool.filter(x=>x[1]===e[1])),other=shuffle(pool.filter(x=>x[1]!==e[1]));
    const opts=shuffle([e,...[...same,...other].slice(0,3)]);
    return {e,rev,opts,pick:null};
  });
  EX.round={cards,i:0,ok:0};exDraw();
}
function exDraw(){
  const R=EX.round,c=R.cards[R.i];
  render(`
  <div class="qtop"><button class="btn ghost" data-go="escalas">✕ Salir</button><div class="qtitle">OpoEscalas · ${esc(EX.cat)}</div><div class="qcount">${R.i+1}/${R.cards.length}</div></div>
  <div class="track" aria-hidden="true">${R.cards.map((x,i)=>(i?`<span class="seg${i<=R.i?' done':''}"></span>`:'')+`<span class="dot${i===R.i?' cur':''}${x.pick!==null?(x.pick===x.opts.indexOf(x.e)?' ok':' ko'):''}"></span>`).join('')}</div>
  <article class="qcard flash">
    <div class="qchips"><span class="chip stn" style="--lc:#16a37a">${esc(c.e[1])}</span></div>
    <div class="small" style="font-weight:700">${c.rev?'¿A qué corresponde esta descripción?':'¿Qué es o qué valora…?'}</div>
    <div class="term">${esc(c.rev?c.e[2]:c.e[0])}</div>
    <div class="opts">${c.opts.map((o,i)=>`<button class="opt" data-ex="${i}"><span class="k">${L[i]}</span><span>${esc(c.rev?o[0]:o[2])}</span></button>`).join('')}</div>
    <div class="fb" aria-live="polite"></div>
  </article>`,'#16a37a');
}
function exAnswer(i){
  const R=EX.round,c=R.cards[R.i];if(c.pick!==null)return;
  c.pick=i;const k=c.opts.indexOf(c.e),ok=i===k;if(ok)R.ok++;
  $$('.opt').forEach((b,j)=>{b.disabled=true;b.classList.add(j===k?'ok':j===i?'ko':'dim')});
  const fb=$('.fb');fb.className='fb show '+(ok?'ok':'ko');
  fb.innerHTML=`<div class="fbHead">${ok?'✓ ¡Correcto!':'✗ Era la '+L[k]+')'}</div><p class="why"><b>${esc(c.e[0])}:</b> ${esc(c.e[2])} ${c.e[3]?esc(c.e[3]):''}</p><div class="fbAct"><button class="btn primary" data-exnext>${R.i===R.cards.length-1?'Ver resultado':'Siguiente →'}</button><span class="hint">Enter</span></div>`;
  $('.track').innerHTML=R.cards.map((x,j)=>(j?`<span class="seg${j<=R.i?' done':''}"></span>`:'')+`<span class="dot${j===R.i?' cur':''}${x.pick!==null?(x.pick===x.opts.indexOf(x.e)?' ok':' ko'):''}"></span>`).join('');
  fb.querySelector('button').focus({preventScroll:true});
}
function exNext(){
  const R=EX.round;
  if(R.i<R.cards.length-1){R.i++;exDraw();return}
  const rec10=Math.round(R.ok*10/R.cards.length);
  const best=rec10>(S.esc.best||0);if(best){S.esc.best=rec10;save()}
  const fails=R.cards.filter(c=>c.pick!==c.opts.indexOf(c.e));
  render(`<section class="res"><div class="card" style="text-align:center"><div style="font-size:50px">${R.ok>=8?'🏆':R.ok>=5?'👏':'📚'}</div><h2 style="margin:4px 0">${R.ok}/${R.cards.length} tarjetas</h2><p class="small">${best?'¡Nuevo récord!':'Récord: '+(S.esc.best||0)+'/10'}</p>
    <div class="row" style="justify-content:center"><button class="btn primary" data-exgo>Otra ronda</button><button class="btn ghost" data-go="escalas">Cambiar mazo</button><button class="btn ghost" data-go="home">Mapa</button></div></div>
    ${fails.length?`<div class="sectionTitle"><h2>Para fijar</h2></div>${fails.map(c=>`<div class="revItem"><b>${esc(c.e[0])}</b> <span class="small">· ${esc(c.e[1])}</span><div style="font-size:14px;margin-top:4px">${esc(c.e[2])} ${c.e[3]?`<span class="small">${esc(c.e[3])}</span>`:''}</div></div>`).join('')}`:''}</section>`,'#16a37a');
}

/* ---------- archivo crítico ---------- */
function archivo(){
  const list=Q.filter(q=>q.st);
  const flagged=DOCENTE?VALID.filter(q=>q.f):[];
  const card=q=>`<details class="revItem arch"><summary><span class="st" style="background:${q.st==='N'?'#a3283b':q.st==='O'?'#c58a1c':'#c58a1c'}">${q.st||'!'}</span><span>${esc(q.q.length>150?q.q.slice(0,150)+'…':q.q)} ${q.st?`<span class="tag ${q.st}">${q.st==='N'?'ANULADA':'OBSOLETA'}</span>`:''}</span></summary><div class="body">
    <p class="small">📍 ${esc(q.ex)} · ${esc(stById[q.s].name)}</p>
    <div class="opts">${q.o.map((o,i)=>`<div class="opt${q.now===i||(!q.st&&q.a===i)?' ok':''}"><span class="k">${L[i]}</span><span>${esc(o)}${q.now===i?'<span class="tag H">HOY CORRECTA</span>':''}</span></div>`).join('')}</div>
    <p class="why" style="margin-top:10px"><b>Por qué:</b> ${esc(q.e)}</p>${q.f?`<div class="flag">🧑‍🏫 ${esc(q.f)}</div>`:''}</div></details>`;
  render(`
  <div class="row" style="margin-bottom:10px"><button class="btn ghost" data-go="home">← Mapa</button></div>
  <section class="stHero" style="--lc:#b7791f"><div class="eyebrow">LABORATORIO CRÍTICO</div><h1>Archivo de anuladas y obsoletas</h1><p>Entender por qué una pregunta se anuló o quedó desfasada ayuda a no caer en trampas y a impugnar con criterio.</p></section>
  ${list.map(card).join('')}
  ${DOCENTE?`<div class="sectionTitle"><h2>🧑‍🏫 Claves discutidas (${flagged.length})</h2><span class="small">Visible solo en modo docente</span></div>${flagged.map(card).join('')}`:''}
  `,'#b7791f');
}

/* ---------- navegación y eventos ---------- */
function go(k){
  if(k==='home'||k==='mapa'){home();if(k==='mapa')setTimeout(()=>{const m=$('.mapCard');(m&&m.offsetParent?m:$('.stations')).scrollIntoView({behavior:'smooth'})},50);return}
  if(k==='sim') return simSetup();
  if(k==='escalas') return escalasHome();
  if(k==='archivo') return archivo();
  if(k==='repaso'){const items=shuffle(VALID.filter(q=>isPending(q.id))).slice(0,20);return startQuiz(items,{mode:'repaso',title:'Repaso inteligente',color:'#d0435a'})}
  if(k==='next'){const s=ST.slice().sort((a,b)=>{const A=stationStats(a.id),B=stationStats(b.id);return pct(A.mastered,A.total)-pct(B.mastered,B.total)})[0];return station(s.id)}
}
app.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-st]');if(!t)return;
  const d=t.dataset;
  if(d.go) return go(d.go);
  if(t.hasAttribute('data-reset')){if(confirm('¿Borrar todo tu progreso en este navegador?')){S={q:{},sims:[],esc:{best:0}};save();home()}return}
  if(d.st&&!d.trip) return station(d.st);
  if(d.trip){const s=stById[d.trip];return startQuiz(pickTrip(d.trip,d.n),{mode:'station',title:s.name,color:LINES[s.line].c,back:d.trip})}
  if(d.pos!==undefined) return answer(+d.pos);
  if(d.sure!==undefined) return next(d.sure==='1');
  if(t.hasAttribute('data-next')){if(G.i<G.items.length-1){G.i++;drawQ()}else{const blank=G.items.filter(i=>i.pick===null).length;if(!blank||confirm(`Tienes ${blank} sin responder (cuentan como en blanco). ¿Entregar?`))finish()}return}
  if(t.hasAttribute('data-prev')){G.i--;drawQ();return}
  if(t.hasAttribute('data-exit')){if(G.items.some(i=>i.pick!==null)&&G.mode==='sim'&&!confirm('¿Salir del simulacro? Se perderán las respuestas.'))return;return G.back!=='home'?station(G.back):home()}
  if(t.hasAttribute('data-redo')) return startQuiz(shuffle(G.fails),{mode:'repaso',title:'Repetir fallos',color:'#d0435a',back:G.back});
  const grp=t.parentElement&&t.parentElement.dataset.group;
  if(grp==='n'){SIM.n=+d.v;return simSetup()}
  if(grp==='s'){SIM.s=d.v;return simSetup()}
  if(grp==='cat'){EX.cat=d.v;return escalasHome()}
  if(t.hasAttribute('data-simgo')){const pool=VALID.filter(q=>SIM.s==='all'||q.s===SIM.s);return startQuiz(shuffle(pool).slice(0,SIM.n),{mode:'sim',title:'Simulacro OPE',color:'#3c3fb8'})}
  if(t.hasAttribute('data-exgo')) return exStart();
  if(d.ex!==undefined) return exAnswer(+d.ex);
  if(t.hasAttribute('data-exnext')) return exNext();
});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g.st')){e.preventDefault();station(e.target.dataset.st)}});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||/input|textarea/i.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  const opts=$$('.opt:not([disabled])',app);
  const idx='abcd'.indexOf(k)>=0?'abcd'.indexOf(k):'1234'.indexOf(k);
  if(idx>=0&&opts[idx]){opts[idx].click();e.preventDefault();return}
  if(k==='s'){const b=$('[data-sure="1"]',app);if(b){b.click();e.preventDefault()}}
  if(k==='d'){const b=$('[data-sure="0"]',app);if(b&&$('[data-sure="1"]',app)){b.click();e.preventDefault()}}
  if(k==='enter'&&e.target.tagName!=='BUTTON'){const b=$('.fbAct .btn.primary',app)||$('[data-next]:not([disabled])',app);if(b){b.click();e.preventDefault()}}
});
if(self!==top)document.body.classList.add('embedded');
home();
</script>
</body>
