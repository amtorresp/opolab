<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpoMetro · Digestivo | OpoLab by Oposalud</title>
<meta name="description" content="Recorre el aparato digestivo como una red de metro y repasa preguntas reales de OPE con explicación.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* OpoMetro · estilos (los colores de marca están en :root para poder adaptarlos a un maquetador) */
:root{
  --navy:#0b2a55;--navy2:#123a72;--cyan:#0aa8e5;--mint:#12a37a;--violet:#6a5ae0;--amber:#f2a33a;--coral:#e5484d;
  --ink:#0f2440;--muted:#5d7089;--line:#dde6ef;--bg:#f4f7fb;--card:#fff;
  --ok:#12936a;--okbg:#e9f8f1;--ko:#d23f57;--kobg:#fff1f3;--obs:#b7791f;--obsbg:#fff7e8;
  --lc:var(--cyan);
  --r:18px;--shadow:0 1px 2px rgba(11,42,85,.05),0 10px 30px -12px rgba(11,42,85,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",Inter,"Segoe UI",system-ui,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #8fd8f5;outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:18px 0 30px}

/* CABECERA */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;padding:8px 10px 8px 12px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:20}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);min-width:0}
.logo img{height:34px;width:auto;display:block}
.wm{display:flex;align-items:center;gap:8px}
.wm .mark{width:34px;height:34px;border-radius:10px;background:var(--navy);display:grid;place-items:center}
.wm .mark svg{width:20px;height:20px}
.wm b{font-size:18px;letter-spacing:-.01em}
.logo .sep{width:1px;height:24px;background:var(--line)}
.logo .lab{font-size:13px;font-weight:800;color:var(--cyan);letter-spacing:.02em;white-space:nowrap}
.tools{display:flex;gap:6px}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--navy);transition:background .15s,border-color .15s}
.ibtn:hover{background:#f2f7fc;border-color:#bfe3f5}
.ibtn.off{color:#9aa9ba}

/* BOTONES Y BÁSICOS */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .08s ease,background .2s,box-shadow .2s;text-decoration:none}
.btn svg.i{width:18px;height:18px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.line{background:var(--lc);color:#fff}
.btn.line:hover{filter:brightness(.95)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.ghost:hover{border-color:#9fd9f2}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.small{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:#eef4fa;color:var(--navy)}
.chip svg.i{width:14px;height:14px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:17px}
.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:26px 0 12px;gap:10px}
.sectionTitle h2{font-size:21px;margin:0;letter-spacing:-.01em}
.sectionTitle .eyebrow{color:var(--muted);display:block;margin-bottom:2px;font-size:11px}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--tc,var(--navy));background:color-mix(in srgb,var(--tc,var(--navy)) 12%,#fff)}
.tile svg.i{width:24px;height:24px}

/* PORTADA */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:stretch}
.heroTxt{background:var(--navy);color:#fff;border-radius:24px;padding:28px 30px;position:relative;overflow:hidden;isolation:isolate}
.heroTxt .eyebrow{color:#7fd3f5}
.hero h1{font-size:clamp(36px,4.8vw,56px);line-height:1.02;margin:10px 0 12px;letter-spacing:-.025em}
.hero h1 span{color:#5fd0f7}
.hero p{margin:0;color:#c9d9ee;font-size:16px;max-width:430px}
.heroArt{position:absolute;top:0;right:0;bottom:0;width:34%;height:100%;z-index:-1;opacity:.75}
.heroArt path{fill:none;stroke-linecap:round}
.lines{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.lpill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.lpill i{width:18px;height:6px;border-radius:9px;display:inline-block}
.ticket{background:#fff;border-radius:24px;padding:20px 22px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;display:flex;flex-direction:column;gap:12px}
.ticket:before,.ticket:after{content:"";position:absolute;top:58px;width:22px;height:22px;background:var(--bg);border-radius:50%;border:1px solid var(--line)}
.ticket:before{left:-12px;clip-path:inset(0 0 0 50%)}.ticket:after{right:-12px;clip-path:inset(0 50% 0 0)}
.tkHead{display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:14px}
.tkHead b{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.tkHead span{font-weight:800;color:var(--navy);font-size:14px}
.goal{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.goal svg.ring{width:84px;height:84px}
.goal h4{margin:0;font-size:16px}
.goal p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:#d9480f;font-size:13px;margin-top:6px}
.streak svg.i{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#f6f9fd;border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px;color:var(--navy);line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:8px;background:#e7eef6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mint));border-radius:99px;transition:width .6s}
.tkFoot{display:flex;gap:8px;margin-top:auto}
.tkFoot .btn{flex:1}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mode{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--shadow);transition:border-color .2s,transform .15s,box-shadow .2s;display:flex;flex-direction:column;gap:10px;position:relative}
.mode:hover{border-color:color-mix(in srgb,var(--tc) 45%,#fff);transform:translateY(-2px)}
.mode h3{margin:0;font-size:16px}
.mode p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.mode .meta{font-size:11px;font-weight:800;color:var(--tc);letter-spacing:.04em;text-transform:uppercase;margin-top:auto}
.mode .badge{position:absolute;top:12px;right:12px;background:var(--ko);color:#fff;border-radius:99px;font-size:12px;font-weight:800;padding:2px 9px}
.mode.wide{flex-direction:row;align-items:center;gap:14px}

/* MAPA */
.mapCard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:14px 14px 6px;box-shadow:var(--shadow)}
.mapCard svg{width:100%;height:auto;display:block}
.mapCard .st{cursor:pointer}
.mapCard .st:hover circle.node,.mapCard .st:focus circle.node{r:20}
.mapCard text{font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:4px 8px 8px;font-size:12px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:6px;border-radius:9px;margin-right:6px;vertical-align:middle}
.stations{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.stCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;border-top:5px solid var(--lc);transition:transform .15s}
.stCard:hover{transform:translateY(-2px)}
.stCard b{display:block;font-size:14px;line-height:1.25}
.stCard span{display:block;font-size:12px;color:var(--muted);margin:3px 0 8px;min-height:32px;line-height:1.35}
.mini{height:6px;background:#e9eff6;border-radius:9px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--lc)}
.stCard small{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--muted);font-weight:700}
.medal{display:inline-flex;align-items:center;gap:3px;color:#b7791f}
.medal svg.i{width:13px;height:13px}
.metroV{display:none}

/* ESTACIÓN Y CABECERAS DE MODO */
.stHero{border-radius:24px;padding:24px 26px;color:#fff;background:var(--lc);position:relative;overflow:hidden;margin-bottom:14px}
.stHero:after{content:"";position:absolute;inset:auto -40px -70px auto;width:220px;height:220px;border-radius:50%;border:26px solid rgba(255,255,255,.14)}
.stHero .eyebrow{color:rgba(255,255,255,.85)}
.stHero h1{margin:6px 0 4px;font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1.1}
.stHero p{margin:0;opacity:.92;max-width:760px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.claves{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.claves li{position:relative;padding:10px 12px 10px 40px;background:#f7fafd;border-radius:12px;font-size:14px;line-height:1.45}
.claves li:before{content:attr(data-n);position:absolute;left:11px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--lc);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.claves b{color:var(--navy)}
.actions{display:grid;gap:9px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-of-type{border-bottom:0}
.kv b{color:var(--navy);text-align:right}
.back{margin-bottom:12px}

/* PREGUNTA */
.qtop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:6px}
.qtitle{font-weight:800;color:var(--navy);font-size:15px;text-align:center}
.qright{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.qcount{font-weight:800;color:var(--muted);font-size:14px}
.combo{display:inline-flex;align-items:center;gap:4px;background:#fff1e6;color:#d9480f;border-radius:99px;padding:3px 10px 3px 7px;font-weight:800;font-size:13px}
.combo svg.i{width:15px;height:15px}
.combo.pop{animation:pop .35s ease}
.timer{font-weight:800;font-size:14px;color:var(--navy);background:#eef2ff;border-radius:99px;padding:3px 10px}
.timer.low{color:#fff;background:var(--ko)}
.trackWrap{position:relative;padding:22px 6px 6px;margin-bottom:10px}
.track{display:flex;align-items:center}
.track .dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #c9d6e4;flex:none;transition:all .25s;position:relative;z-index:1}
.track .seg{height:4px;background:#c9d6e4;flex:1;min-width:2px}
.track .dot.ok{background:var(--ok);border-color:var(--ok)}
.track .dot.ko{background:var(--ko);border-color:var(--ko)}
.track .dot.ans{background:var(--navy);border-color:var(--navy)}
.track .dot.cur{border-color:var(--lc)}
.track .seg.done{background:var(--lc)}
.train{position:absolute;top:0;width:34px;height:20px;margin-left:-11px;transition:left .55s cubic-bezier(.45,.05,.3,1);color:var(--lc);z-index:2}
.train svg{width:34px;height:20px;display:block}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);max-width:900px;margin:0 auto;animation:slide .3s ease}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip.src{background:#fff6e8;color:#8a5a12}
.chip.stn{background:color-mix(in srgb,var(--lc) 13%,#fff);color:var(--navy)}
.chip.obs{background:var(--obs);color:#fff}
.qtext{font-size:clamp(18px,2.2vw,22px);line-height:1.38;margin:0 0 16px;font-weight:700;white-space:pre-line}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4;font-weight:500;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:color-mix(in srgb,var(--lc) 55%,#fff);background:#fbfdff}
.opt:active:not([disabled]){transform:scale(.995)}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:#eef4fa;color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:14px}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--navy);background:#f3f7fc}.opt.sel .k{background:var(--navy);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--kobg);animation:shake .35s}.opt.ko .k{background:var(--ko);color:#fff}
.opt.dim{opacity:.55}
.opt .add{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:var(--obs);background:var(--obsbg);border-radius:6px;padding:1px 6px}
.obsNote{background:var(--obsbg);border:1px solid #f0d49b;border-radius:14px;padding:11px 14px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.obsNote svg.i{color:var(--obs);margin-top:1px}
.caseBox{background:#f2f8fd;border:1px solid #cfe5f5;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:15px;line-height:1.5;display:flex;gap:10px}
.caseBox svg.i{color:#0b7bc0;margin-top:2px}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;display:none;animation:pop .25s ease}
.fb.show{display:block}
.fb.ok{background:var(--okbg);border:1px solid #bfe8d6}
.fb.ko{background:var(--kobg);border:1px solid #f3c4cc}
.fbHead{font-weight:800;font-size:16px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.fb.ok .fbHead{color:var(--ok)}.fb.ko .fbHead{color:var(--ko)}
.why{margin:0;font-size:15px;line-height:1.6}
.why b{color:var(--navy)}
.why .tag2{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.why .antes{background:#fde7ea;color:#a3283b}.why .hoy{background:var(--okbg);color:var(--ok)}
.whyNot{margin:8px 0 0;font-size:14px;background:rgba(255,255,255,.75);border-radius:10px;padding:8px 10px}
.tribunal{margin:10px 0 0;font-size:14px;background:#fff;border:1px dashed #e8c27a;border-radius:10px;padding:8px 10px}
.flag{margin-top:10px;background:#fff8e6;border:1px dashed #e5b552;border-radius:12px;padding:9px 12px;font-size:13px;color:#7a5410}
.others{margin-top:10px}
.others summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--navy)}
.others ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:6px}
.others li{font-size:14px;background:rgba(255,255,255,.75);border-radius:10px;padding:7px 10px}
.fbAct{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.fbAct .hint{font-size:12px;color:var(--muted);margin-left:auto}
.qfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;max-width:900px;margin-left:auto;margin-right:auto}
.keys{max-width:900px;margin:10px auto 0;font-size:12px;color:var(--muted);text-align:center}
.keys kbd{font-family:inherit;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;background:#fff;color:var(--navy)}
.rule{background:#fff;border:2px dashed var(--ko);border-radius:18px;padding:14px 18px;margin-bottom:12px}
.rule .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ko)}
.rule p{margin:6px 0 0}
.rule.good{border-color:var(--ok)}.rule.good .lbl{color:var(--ok)}

/* RESULTADOS */
.res{max-width:900px;margin:0 auto;position:relative}
.resTop{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;position:relative;overflow:hidden}
.ring{width:150px;height:150px}
.resTop h2{margin:0 0 6px;font-size:26px;letter-spacing:-.01em}
.stamp{position:absolute;right:22px;top:18px;border:3px solid var(--ok);color:var(--ok);border-radius:12px;padding:6px 12px;font-weight:800;letter-spacing:.14em;font-size:13px;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both .3s;background:rgba(255,255,255,.85)}
.resGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.revItem{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:#fff}
.revItem summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;gap:10px;align-items:flex-start}
.revItem summary::-webkit-details-marker{display:none}
.revItem summary .st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-top:1px}
.revItem summary .st svg.i{width:13px;height:13px;stroke-width:2.6}
.revItem .body{margin-top:10px;font-size:14px}
.revItem .body p{margin:6px 0}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2.4s ease-in forwards}

/* AJUSTES, FILTROS, BUSCADOR */
.seg3{display:flex;gap:8px;flex-wrap:wrap}
.seg3 button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:700}
.seg3 button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.filters button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:12px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--navy)}
.searchBox{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 14px;box-shadow:var(--shadow)}
.searchBox:focus-within{border-color:var(--cyan)}
.searchBox input{flex:1;border:0;outline:0;font:inherit;font-size:17px;padding:8px 0;background:transparent;color:var(--ink)}
.hit{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.hit:hover{border-color:#9fd9f2}
.hit b{display:block;font-size:14.5px;line-height:1.4;font-weight:700}
.hit mark{background:#fff0b3;color:inherit;border-radius:3px;padding:0 1px}
.hit small{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}

/* RANKING Y TRAMPAS */
.rank{display:grid;gap:8px}
.rk{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;width:100%}
.rk:hover{border-color:#f0c98a}
.rk .pos{font-weight:800;color:var(--muted);font-size:15px;text-align:center}
.rk .pos.top{color:#fff;background:var(--amber);border-radius:10px;padding:4px 0}
.rk b{display:block;font-size:15px}
.rk .meta{font-size:12px;color:var(--muted)}
.rk .hbar{height:8px;background:#eef3f8;border-radius:99px;overflow:hidden;margin-top:6px;display:block}
.rk .hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f6c26b);border-radius:99px}
.rk .n{font-weight:800;color:var(--navy);font-size:20px;text-align:right;line-height:1}
.rk .n small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.traps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.trap{background:#fff;border:1px solid var(--line);border-left:6px solid var(--tc,var(--ko));border-radius:16px;padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:flex-start}
.trap:hover{border-color:#f3c4cc}
.trap h3{margin:0 0 4px;font-size:16px}
.trap p{margin:0;font-size:13px;color:var(--muted)}
.trap small{display:block;margin-top:8px;font-weight:700;font-size:12px;color:var(--navy)}

/* LABORATORIO */
.labGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.labWrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.colon svg{width:100%;max-width:420px;display:block;margin:auto}
.colon .seg{cursor:pointer;transition:stroke .2s}
.segInfo{display:grid;gap:8px}
.bristolPic{background:#fbf7f2;border-radius:16px;padding:14px;display:grid;place-items:center;margin-bottom:12px}
.bristolPic svg{width:100%;max-width:340px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.steps span{font-size:12px;font-weight:800;border-radius:8px;padding:4px 8px;background:#eef3f8;color:var(--muted)}
.steps span.ok{background:var(--okbg);color:var(--ok)}
.steps span.ko{background:var(--kobg);color:var(--ko)}
.steps span.cur{background:var(--navy);color:#fff}
.bolo{display:flex;gap:14px;align-items:center;background:#f6f9fd;border-radius:16px;padding:14px;margin-bottom:12px}
.bolo .cup{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.flash .term{font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--navy);margin:4px 0 14px;line-height:1.2}

/* INFORME */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tbl td.r{text-align:right;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:#fff}
.bdg .md{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;color:#fff}
.bdg .md svg.i{width:24px;height:24px}
.bdg b{display:block;font-size:13px}
.bdg span{font-size:11px;color:var(--muted)}
.bdg.off{opacity:.45;filter:grayscale(1)}
.lmsTag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ok);background:var(--okbg);border-radius:8px;padding:3px 8px;align-self:flex-start}
.lmsTag svg.i{width:14px;height:14px}

/* AVISOS */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;box-shadow:0 12px 30px rgba(11,42,85,.3);display:flex;gap:10px;align-items:center;opacity:0;transition:all .3s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg.i{color:#ffd166}

/* PIE */
.foot{text-align:center;color:var(--cyan);font-weight:800;margin-top:30px}
.foot em{display:block;color:#6c7e93;font-family:"Segoe Print","Comic Sans MS",cursive;font-weight:400;margin-top:4px}
.copy{display:block;color:#8a99ab;font-size:12px;font-weight:500;margin-top:6px}
.reset{background:none;border:0;color:#8a99ab;font-size:12px;text-decoration:underline;margin-top:14px}

@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(1.8)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
@keyframes dash{to{stroke-dashoffset:0}}

@media (max-width:980px){
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stations{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero,.grid2,.labWrap{grid-template-columns:1fr}
  .labGrid,.traps{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{width:calc(100% - 24px);padding-top:10px}
  .topbar{top:4px}
  .logo .lab,.logo .sep{display:none}
  .heroTxt{padding:22px}
  .heroArt{display:none}
  .modes{gap:8px}.mode{padding:12px}.mode p{display:none}
  .mapCard,.stations{display:none}
  .metroV{display:block;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 14px;box-shadow:var(--shadow)}
  .mv{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;padding:9px 0;text-align:left;position:relative}
  .mv:before{content:"";position:absolute;left:11px;top:0;bottom:0;width:4px;background:var(--lc)}
  .mv.first:before{top:50%}.mv.last:before{bottom:50%}
  .mv .d{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--lc);position:relative;z-index:1;margin-left:5px}
  .mv b{font-size:15px;display:block}
  .mv span{font-size:12px;color:var(--muted)}
  .mv em{font-style:normal;font-weight:800;font-size:13px;color:var(--navy)}
  .mvLine{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:10px 0 0}
  .qcard{padding:16px}
  .qtop{grid-template-columns:auto 1fr}.qtitle{display:none}
  .opt{font-size:14px;padding:10px 12px}
  .resTop{grid-template-columns:1fr;justify-items:center;text-align:center}
  .stamp{position:static;display:inline-block;margin-top:6px}
  .stats b{font-size:19px}
  .keys{display:none}
}
body.embedded .wrap{width:100%;max-width:none;padding:10px 12px}
body.embedded .topbar{top:0}
@media print{.topbar,.foot,.noPrint{display:none!important}body{background:#fff}.card{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* OpoMetro · motor del juego. Los datos llegan incrustados por herramientas/construir_opometro.py */
const Q=[{"id":1,"ex":"Andalucía · 2008","org":"Andalucía","y":2008,"s":"boca","t":"bucal","q":"De los cuatro factores determinantes de la salud bucodental señale cuál es el factor más influyente:","o":["El medio ambiente.","El estilo de vida.","El sistema de asistencia sanitaria.","La biología."],"e":"Según el modelo de Lalonde, el estilo de vida es el determinante que más influye en la salud, también en la bucodental: dieta rica en azúcares, higiene oral deficiente, tabaco y alcohol. La biología, el medio ambiente y el sistema sanitario pesan menos (aunque el sistema sanitario es el que más presupuesto recibe).","a":1},{"id":2,"ex":"Castilla - La Mancha · 2008","org":"Castilla-La Mancha","y":2008,"s":"valor","t":"ccr","q":"La hemorragia digestiva puede manifestarse por:","o":["Hematemesis, melenas, sangre oculta en heces. rectorragias y hematoquecia.","Hematemesis, hemoptisis, rectorragias, sangre oculta en heces y hematoquecia.","Hemoptisis, melenas, hematoquecia y rectorragias.","Hematemesis, epistaxis, sangre oculta en heces. rectorragias y melenas."],"e":"La hemorragia digestiva puede manifestarse como hematemesis, melenas, hematoquecia, rectorragia o sangre oculta en heces. La hemoptisis procede de la vía respiratoria y la epistaxis de las fosas nasales: no son formas de hemorragia digestiva.","a":0},{"id":3,"ex":"Castilla - La Mancha · 2008","org":"Castilla-La Mancha","y":2008,"s":"agudo","t":"obstruccion","q":"Indique de las siguientes situaciones ¿cuál puede ser causa de producir íleo-paralítico?","o":["Trombosis mesentérica.","Manipulación de vísceras abdominales durante la intervención quirúrgica.","Invaginación intestinal.","Impactación fecal."],"e":"El íleo paralítico es una obstrucción funcional: el intestino deja de propulsar por alteración de su motilidad, típicamente tras manipular las vísceras durante la cirugía (es temporal). La invaginación y la impactación fecal producen íleo mecánico, y la trombosis mesentérica, un abdomen agudo isquémico.","a":1},{"id":4,"ex":"Castilla y León · 2008","org":"Castilla y León","y":2008,"s":"intestino","t":"eii","q":"La enfermedad inflamatoria intestinal incluye dos entidades patológicas - enfermedad de Crohn y colitis ulcerosa - con muchas similitudes, pero también con importantes diferencias. De las siguientes características, seleccione la que es cierta:","o":["Ambas patologías se manifiestan con cólicos tras las comidas.","La colitis ulcerosa es más frecuente en hombres que en mujeres.","La colitis ulcerosa afecta exclusivamente a la mucosa intestinal.","La enfermedad de Crohn afecta exclusivamente al intestino grueso."],"e":"La colitis ulcerosa es una inflamación superficial (mucosa, como mucho submucosa), continua y que empieza siempre en el recto. La enfermedad de Crohn es transmural, segmentaria y puede afectar a cualquier tramo desde la boca hasta el ano (sobre todo íleon terminal), por lo que la opción d es falsa.","tr":"cucrohn","a":2,"ns":1,"po":["Los cólicos tras comer son más propios del Crohn con estenosis; no es común a ambas.","La CU no tiene un claro predominio por sexo.","","Falso: el Crohn puede afectar de la boca al ano, sobre todo al íleon terminal."]},{"id":5,"ex":"Castilla y León · 2008","org":"Castilla y León","y":2008,"s":"sondas","t":"enemas","q":"En el enema de limpieza de colon alto (lavativa de Harris), la finalidad es:","o":["Preparar el intestino para pruebas diagnósticas.","Administrar medicamentos por vía rectal.","Reblandecer las heces para su evacuación.","Favorecer la expulsión de gases."],"e":"La lavativa de Harris es un enema de reducción de la distensión: se introducen 100-200 ml y se sube y baja el irrigador 5-6 veces para que el líquido entre y salga arrastrando los gases. No busca limpiar el colon para pruebas ni administrar fármacos.","a":3},{"id":6,"ex":"Castilla y León · 2008","org":"Castilla y León","y":2008,"s":"ostom","t":"peg","q":"¿Cuál de las sondas que se nombran a continuación se introduce por un procedimiento quirúrgico a través de la pared abdominal hasta el estómago?","o":["Sonda de gastrostomía.","Sonda de yeyunostomía.","Sonda nasoentérica.","Ninguna de las respuestas anteriores es correcta."],"e":"La gastrostomía es un estoma quirúrgico (o endoscópico, PEG) que comunica el estómago con la pared abdominal para alimentar. La yeyunostomía llega al yeyuno, no al estómago, y la sonda nasoentérica entra por la nariz, sin cirugía.","a":0,"ns":1},{"id":7,"ex":"Navarra · 2008","org":"Navarra","y":2008,"s":"ostom","t":"heces_ostomia","q":"En la colostomía transversa las heces son:","o":["Sólidas.","Semiblandas.","Blandas.","Líquidas."],"e":"Regla de oro: cuanto más proximal es el estoma, más líquidas e irritantes son las heces. Ciego: líquidas; colon ascendente: semilíquidas; transverso: BLANDAS; descendente: semiblandas; sigma: sólidas.","tr":"distal","a":2,"po":["Sólidas: son las de la sigmoidostomía.","Semiblandas: son las de la colostomía descendente.","","Líquidas: son las del ciego o la ileostomía."]},{"id":8,"ex":"Navarra · 2008","org":"Navarra","y":2008,"s":"estom","t":"ulcera","q":"En la úlcera gástrica:","o":["El vómito no es común.","La hemorragia es más probable que en la úlcera duodenal.","La melena es más frecuente que la hematemesis.","La perforación es más probable que en la úlcera duodenal."],"e":"Según el manual, las úlceras gástricas sangran con más frecuencia, aunque la úlcera duodenal sea la causa más frecuente de HDA por ser mucho más prevalente. En la úlcera gástrica el vómito es habitual y la perforación es más frecuente en la duodenal (aunque la gástrica perforada tiene más mortalidad).","tr":"ulceradolor","a":1,"po":["Falso: en la úlcera gástrica el vómito sí es frecuente.","","La melena no predomina especialmente en la úlcera gástrica; es más típica de los sangrados duodenales.","Falso: se perforan más las duodenales (aunque las gástricas perforadas tengan más mortalidad)."]},{"id":9,"ex":"Comunitat Valenciana · 2008","org":"C. Valenciana","y":2008,"s":"intestino","t":"eliminacion","q":"La celiaquía es una enfermedad intestinal crónica que se caracteriza por:","o":["Intolerancia a las proteínas de la leche de vaca o de soja.","Intolerancia a la lactosa.","Intolerancia al gluten.","Intolerancia al pescado."],"e":"La enfermedad celíaca es una intolerancia permanente al gluten (trigo, cebada, centeno, avena contaminada) que atrofia las vellosidades del intestino delgado y produce malabsorción y diarrea esteatorreica. La intolerancia a la lactosa y la alergia a las proteínas de leche de vaca son entidades distintas.","a":2},{"id":10,"ex":"Comunitat Valenciana · 2008","org":"C. Valenciana","y":2008,"s":"sondas","t":"sondas_tipos","q":"Señale cuál de las siguientes es una sonda nasoenteral de una sola luz:","o":["Sonda de Salem.","Sonda de Miller-Abbott.","Sonda de Levin.","Sonda de Foley."],"e":"La sonda de Levin tiene una sola luz (con orificio distal y varios laterales). Salem tiene doble luz (una con válvula atmosférica), Miller-Abbott tiene dos luces con globo, y Foley es una sonda vesical, no digestiva.","a":2},{"id":11,"ex":"Extremadura TL2 · 2008","org":"Extremadura","y":2008,"s":"estom","t":"ulcera","q":"La erosión de la mucosa gástrica o duodenal que alcanza o sobrepasa la muscularis mucosae se denomina:","o":["Gastritis aguda.","Gastritis crónica.","Úlcera péptica.","Colitis ulcerosa."],"e":"Lo que diferencia la úlcera péptica de la erosión es la profundidad: la úlcera alcanza o atraviesa la muscularis mucosae; la erosión se queda en la mucosa. La gastritis es inflamación de la mucosa y la colitis ulcerosa afecta al colon, no al estómago.","a":2},{"id":12,"ex":"Extremadura TL1 · 2008","org":"Extremadura","y":2008,"s":"ostom","t":"ostomias","q":"En los cuidados de enfermería a pacientes con ostomías, indique cuál de las siguientes afirmaciones no es correcta:","o":["Deben evitarse compuestos químicos en la limpieza del estoma.","Para limpiar y secar la piel circundante, hay que frotar.","La bolsa debe cambiarse cada vez que sea necesario, sin abusar, ya que la piel sufre en cada cambio.","El secado de la misma debe ser cuidadoso y estricto."],"e":"La piel periestomal se limpia con agua tibia, jabón neutro y esponja suave, con movimientos circulares de fuera hacia dentro, y se seca con suavidad, a toques, sin frotar. Frotar lesiona la piel y facilita la dermatitis. Las demás afirmaciones son correctas.","a":1},{"id":13,"ex":"Madrid · 2009","org":"Madrid","y":2009,"s":"boca","t":"erge","q":"Uno de los consejos higiénico-dietéticos recomendados al paciente con reflujo gastroesofágico es:","o":["Acostarse inmediatamente después de comer.","Ingesta habitual de café, te, y chocolate.","Elevar los pies de la cama 15 a 20 cm.","Reducción del peso corporal."],"e":"En la ERGE se recomienda perder peso si hay obesidad, porque reduce la presión intraabdominal. Hay que elevar el CABECERO (no los pies) 15-20 cm, evitar café, té y chocolate (relajan el EEI) y no acostarse en las 3 horas siguientes a comer.","tr":"cabecero","a":3,"po":["Tumbarse tras comer favorece el reflujo: hay que esperar unas 3 horas.","Café, té y chocolate relajan el EEI.","Se eleva el CABECERO, no los pies.",""]},{"id":14,"ex":"Andalucía · 2009","org":"Andalucía","y":2009,"s":"boca","t":"erge","q":"Uno de los consejos higiénico-dietéticos recomendados al paciente con reflujo gastroesofágico es:","o":["Acostarse inmediatamente después de comer.","Ingesta habitual de café, te y chocolate.","Elevar los pies de la cama 15 o 20 cms.","Reducción de peso corporal."],"e":"La reducción de peso disminuye la presión intraabdominal y el reflujo. Las trampas: se eleva el cabecero de la cama, no los pies; café, té y chocolate relajan el EEI; tras comer hay que reposar sin tumbarse (no acostarse en las 3 horas siguientes).","tr":"cabecero","a":3,"po":["Tumbarse tras comer favorece el reflujo.","Café, té y chocolate relajan el EEI.","Trampa clásica: se eleva el cabecero, no los pies.",""]},{"id":15,"ex":"Aragón · 2009","org":"Aragón","y":2009,"s":"boca","t":"bucal","q":"De los cuatro factores determinantes de la salud bucodental señale cuál es el factor más influyente:","o":["El medio ambiente.","El estilo de vida.","El sistema de asistencia sanitaria.","La biología."],"e":"El modelo de Lalonde sitúa al estilo de vida como el determinante con mayor peso sobre la salud. En salud bucodental se traduce en el consumo de azúcares, la higiene oral, el tabaco y el alcohol: factores modificables con educación sanitaria.","a":1},{"id":16,"ex":"Aragón · 2009","org":"Aragón","y":2009,"s":"boca","t":"erge","q":"Al elaborar una dieta con un enfermo que padece una hernia de hiato, ¿qué alimentos se deben excluir?","o":["Carne de ternera.","Huevo.","Aceite crudo.","Te y café."],"e":"El té y el café disminuyen la presión del esfínter esofágico inferior y favorecen el reflujo; también la menta, el chocolate, las grasas y el alcohol. Los alimentos proteicos (huevo, carne) AUMENTAN el tono del EEI, por lo que están recomendados.","tr":"cabecero","a":3,"po":["La carne (proteína) aumenta el tono del EEI: está permitida.","El huevo es proteico: está recomendado.","El aceite crudo con moderación es aceptable; lo que se evita son las grasas abundantes.",""]},{"id":17,"ex":"Aragón · 2009","org":"Aragón","y":2009,"s":"intestino","t":"enemas","q":"La aplicación de enemas en adulto mayores, habitualmente es para tratar:","o":["Parálisis abdominal.","Abdomen agudo.","Poliposis colorrectal.","Estreñimiento."],"e":"En las personas mayores el uso más habitual del enema es tratar el estreñimiento y la impactación fecal (más frecuentes por inmovilidad, dieta pobre en fibra y fármacos). En el abdomen agudo está contraindicado por el riesgo de perforación.","a":3},{"id":18,"ex":"Aragón · 2009","org":"Aragón","y":2009,"s":"sondas","t":"sng","q":"Uno de los aspectos a valorar en un paciente que recibe alimentación por sonda nasogástrica es:","o":["Los edemas.","Las pupilas.","La distensión abdominal.","La ingurgitación yugular."],"e":"La distensión abdominal es un signo de intolerancia a la nutrición enteral (residuo gástrico elevado, vaciamiento lento) y aumenta el riesgo de vómito y broncoaspiración. También se vigila el residuo, las náuseas, la diarrea y la posición de la sonda.","a":2},{"id":19,"ex":"Aragón · 2009","org":"Aragón","y":2009,"s":"estom","t":"ulcera","q":"¿Cuál de las siguientes respuestas asociarías a una úlcera duodenal?","o":["En general, aparece en personas mayores de 60 años.","El vómito es común.","Hay hiposecreción de ácido gástrico.","El consumo de alimentos alivia el dolor."],"e":"El dolor de la úlcera duodenal aparece entre 1,5 y 3 horas después de comer, CEDE con la ingesta o los antiácidos y despierta por la noche. Se asocia a hipersecreción ácida y a población general joven-adulta; el vómito y la edad avanzada son más propios de la úlcera gástrica.","tr":"ulceradolor","a":3,"po":["La duodenal aparece en población más joven; la edad avanzada es más propia de la gástrica.","El vómito es más propio de la úlcera gástrica.","Al contrario: en la duodenal hay HIPERsecreción ácida.",""]},{"id":20,"ex":"Aragón · 2009","org":"Aragón","y":2009,"s":"valor","t":"eliminacion","q":"La valoración de la necesidad de eliminación debe incluir:","o":["Color, consistencia y componentes de las heces.","Horario habitual y frecuencia.","Cambios recientes en el patrón.","Todas son correctas."],"e":"Valorar la eliminación intestinal incluye las características de las heces (color, consistencia, componentes anómalos como sangre, moco o grasa), el patrón habitual (horario y frecuencia) y los cambios recientes, que pueden alertar de patología orgánica.","a":3,"ns":1},{"id":21,"ex":"Galicia · 2009","org":"Galicia","y":2009,"s":"ostom","t":"heces_ostomia","q":"En la colostomía descendente las heces son:","o":["Sólidas.","Semi blanda.","Blandas.","Líquidas."],"e":"En la colostomía descendente el colon ya ha absorbido gran parte del agua: las heces son SEMIBLANDAS. Recuerda la secuencia: ciego líquidas → ascendente semilíquidas → transverso blandas → descendente semiblandas → sigma sólidas.","tr":"distal","a":1,"po":["Sólidas: sigma.","","Blandas: transverso.","Líquidas: ciego o ileostomía."]},{"id":22,"ex":"Galicia · 2009","org":"Galicia","y":2009,"s":"ostom","t":"ostomias","q":"Cuando se realiza una ileostomía, el estoma estará colocado en la parte abdominal del lado:","o":["Izquierdo.","Derecho.","Es indiferente.","Ninguna respuesta es correcta."],"e":"La ileostomía aboca el íleon terminal, que se sitúa en la fosa iliaca derecha, por lo que el estoma suele quedar en el lado derecho del abdomen. Las colostomías descendentes y sigmoideas se sitúan en el lado izquierdo.","a":1,"ns":1},{"id":23,"ex":"Galicia · 2009","org":"Galicia","y":2009,"s":"valor","t":"ccr","q":"¿Cuál de los siguientes alimentos debe evitarse antes de hacer un análisis de sangre oculta en heces?","o":["Verduras y frutas crudas.","Los hidratos de carbono.","Los lácteos.","Las pastas y los arroces.","Ninguno: con el test inmunoquímico fecal (FIT) actual no hace falta restringir la dieta."],"e":"ANTES: con el test del guayaco había que hacer dieta 3 días antes (sin carne cruda o poco hecha, sin vitamina C > 250 mg/día y sin AINE), porque la reacción detectaba la actividad peroxidasa y daba falsos positivos y negativos. HOY: el cribado usa el test inmunoquímico fecal (FIT), que detecta la globina humana, así que NO hace falta ninguna restricción dietética. Solo se espera a tener 3 días sin sangrado si hay menstruación o hemorroides.","st":"O","a":4},{"id":24,"ex":"Galicia · 2009","org":"Galicia","y":2009,"s":"higado","t":"cirrosis","q":"En las primeras horas, después de una paracentesis mediante punción de la pared abdominal, se ha de vigilar especialmente:","o":["La temperatura.","La glucemia.","La tensión arterial.","Ninguna respuesta es correcta."],"e":"La paracentesis evacuadora extrae gran volumen de líquido y puede provocar hipotensión por redistribución de la volemia. Por eso se vigila la tensión arterial en las primeras horas y se repone albúmina (10 g por cada 1,5 l extraídos a partir del 5.º litro).","a":2,"ns":1},{"id":25,"ex":"Galicia · 2009","org":"Galicia","y":2009,"s":"sondas","t":"sng","q":"A la hora de retirar una sonda nasogástrica se debe:","o":["Dejar al enfermo unas horas a dieta absoluta.","Colocar al enfermo en posición de decúbito supino.","Despinzar la sonda.","Informar al enfermo y solicitar su colaboración."],"e":"Como en toda técnica, primero se informa al paciente y se pide su colaboración. Después: posición de Fowler, lavar la sonda, PINZARLA (no despinzarla, para que no gotee contenido al retirarla) y retirarla mientras el paciente inspira profundamente y mantiene el aire (cierra la glotis).","a":3},{"id":26,"ex":"Euskadi · 2009","org":"País Vasco","y":2009,"s":"sondas","t":"sondas_tipos","q":"La sonda de Levin se usa con mucha frecuencia, teniendo distinto calibre y presentando múltiples orificios en su extremo distal, ¿cuántas vías tiene este tipo de sondas?","o":["Una sola vía.","Dos vías.","Tres vías.","Dos vías y una de drenaje."],"e":"La sonda de Levin es de una sola vía (una luz), de PVC, con un orificio distal y varios laterales. Se usa para aspirar, descomprimir, lavar, alimentar y recoger muestras. La de doble luz es la Salem.","a":0},{"id":27,"ex":"Euskadi · 2009","org":"País Vasco","y":2009,"s":"anat","t":"obstruccion","q":"Las vitaminas liposolubles (K, E, D, A), se absorben unidas a la grasa. ¿En qué porción del intestino delgado se realiza este proceso?","o":["Duodeno.","Yeyuno.","Íleon.","En todo el intestino delgado."],"e":"En el íleon se absorben las vitaminas liposolubles (A, D, E, K), la vitamina B12 (unida al factor intrínseco), las sales biliares, la B6 y el ácido fólico. El duodeno absorbe sobre todo hierro y calcio y el yeyuno la mayoría de los principios inmediatos.","a":2},{"id":28,"ex":"Euskadi · 2009","org":"País Vasco","y":2009,"s":"boca","t":"disfagia","q":"¿Cuál de los enunciados se ajusta a la siguiente definición?, presencia de dolor al deglutir:","o":["Pirosis.","Odinofagia.","Sialorrea.","Disfagia."],"e":"Odinofagia = dolor al tragar. Disfagia = dificultad para tragar (generalmente indolora). Pirosis = ardor retroesternal por reflujo ácido. Sialorrea = exceso de salivación.","a":1},{"id":29,"ex":"Euskadi · 2009","org":"País Vasco","y":2009,"s":"bilipan","t":"pancreas","q":"¿Qué patología le sugieren los siguientes signos y síntomas? Amilasa elevada en sangre y orina. Dolor intenso epigástrico irradiado en cinturón. Vómitos, fiebre e hipotensión.","o":["Cirrosis hepática.","Pancreatitis aguda.","Úlcera péptica.","Colitis ulcerosa."],"e":"Dolor epigástrico intenso irradiado en cinturón, vómitos, fiebre, hipotensión y amilasa elevada (> 3 veces el límite) son el cuadro típico de la pancreatitis aguda. La lipasa es aún más sensible y específica. La causa más frecuente es la litiasis biliar, seguida del alcohol.","a":1},{"id":30,"ex":"Euskadi · 2009","org":"País Vasco","y":2009,"s":"valor","t":"hemorragia","q":"En la valoración de pacientes con problemas gastrointestinales, debemos, entre otras actividades, estudiar las heces. ¿Qué sugieren unas heces pálidas?","o":["Sospecha de sangrado del tracto superior gastrointestinal.","Dieta pobre en carnes.","Sospecha de infección intestinal.","Sospecha de deshidratación o falta de fibra en la dieta."],"e":"El color pardo de las heces se debe a los pigmentos biliares (estercobilina) y en parte a la dieta: una dieta pobre en carne (o láctea) da heces más claras, que es lo que acepta la clave. Recuerda que unas heces muy pálidas, color masilla (acólicas), indican obstrucción de la vía biliar o hepatitis aguda, y que el sangrado alto produce heces negras (melenas).","a":1,"f":"Clave dudosa: unas heces pálidas o acólicas orientan sobre todo a obstrucción biliar o hepatitis, opción que no aparece. La clave oficial elige la dieta pobre en carnes. Conviene revisarla."},{"id":32,"ex":"Baleares · 2009","org":"Islas Baleares","y":2009,"s":"agudo","t":"obstruccion","q":"¿Cuál es la causa más frecuente de la oclusión vascular mesentérica?","o":["Una lesión en el hígado.","Lesiones en el bazo.","Una trombosis.","Una alteración en el tubo digestivo."],"e":"La oclusión vascular mesentérica produce un abdomen agudo isquémico. Su mecanismo es la obstrucción de la arteria (o vena) mesentérica por un trombo o émbolo; de las opciones, la trombosis es la única causa vascular. Clínicamente destaca un dolor desproporcionado respecto a la exploración.","a":2},{"id":33,"ex":"Cantabria · 2010","org":"Cantabria","y":2010,"s":"anat","t":"anatomia","q":"Entre el esófago y estómago se encuentra el/la:","o":["Cardias.","Píloro.","Válvula cecal.","Carúncula mayor."],"e":"El cardias (esfínter esofágico inferior) separa el esófago del estómago. El píloro separa el estómago del duodeno y la válvula ileocecal (de Bauhin), el íleon del ciego. La carúncula mayor es la ampolla de Vater, en el duodeno.","a":0},{"id":34,"ex":"Cantabria · 2010","org":"Cantabria","y":2010,"s":"bilipan","t":"biliar","q":"¿Cuál de los siguientes signos, de ser positivo, sugiere el diagnóstico de una colecistitis?","o":["Signo de Blumberg.","Signo de Murphy.","Signo de Rovsing.","Signo de Psoas."],"e":"Signo de Murphy: al palpar el hipocondrio derecho, el paciente detiene la inspiración profunda por dolor. Es típico de la colecistitis aguda. Blumberg (rebote), Rovsing y psoas son signos de apendicitis o irritación peritoneal.","tr":"charcot","a":1,"po":["Blumberg = irritación peritoneal (apendicitis).","","Rovsing = apendicitis.","Psoas = apendicitis retrocecal."]},{"id":35,"ex":"Cantabria · 2010","org":"Cantabria","y":2010,"s":"boca","t":"erge","q":"Al elaborar una dieta para un enfermo que padece una hernia de hiato ¿Qué alimentos se deben excluir?","o":["Aceite crudo.","Te y café.","Huevo.","Carne de ternera."],"e":"En la hernia de hiato se excluyen el té y el café porque relajan el esfínter esofágico inferior y favorecen el reflujo. Huevo y carne (proteínas) aumentan su tono. El aceite crudo en cantidad moderada es aceptable; lo que se evita son las comidas grasas y copiosas.","tr":"cabecero","a":1,"po":["El aceite crudo con moderación es aceptable.","","El huevo aumenta el tono del EEI: se recomienda.","La carne magra se recomienda (proteínas)."]},{"id":36,"ex":"Cantabria · 2010","org":"Cantabria","y":2010,"s":"sondas","t":"sng_verif","q":"Para una adecuada realización de la técnica del sondaje nasogástrico, la enfermera debe conocer una serie de pautas. Señale la respuesta correcta:","o":["La posición del paciente más apropiada para realizar el sondaje nasogástrico es en semi-Fowler.","En una técnica estéril.","La longitud de sonda a introducir se debe calcular midiendo distancia desde la punta de la nariz al epigastrio del paciente.","Una vez introducida la sonda nasogástrica, comprobaremos su correcta colocación introduciendo 50cc de agua a través de ella."],"e":"La sonda nasogástrica se coloca con el paciente semiincorporado (Fowler o semi-Fowler, cabecero a 45° o más) y el cuello ligeramente flexionado. NO es una técnica estéril (guantes no estériles), la longitud se mide nariz-lóbulo-xifoides (NEX) y nunca se comprueba la posición introduciendo agua.","tr":"posiciones","a":0,"po":["","No es estéril: se usan guantes no estériles.","La medida es nariz → lóbulo de la oreja → xifoides (NEX).","Nunca se comprueba con agua: si estuviera en la vía aérea provocaría una aspiración."]},{"id":37,"ex":"La Rioja · 2010","org":"La Rioja","y":2010,"s":"sondas","t":"sng","q":"La Nutrición enteral en duodeno será de:","o":["300 ml en 6 a 7 tomas.","500 ml en 3 tomas.","300 ml cada dos horas.","Hasta 600 ml en 3 tomas."],"e":"El intestino no tiene función de reservorio como el estómago: si se infunden bolos grandes en el duodeno aparecen distensión, diarrea y síndrome de dumping. Por eso se administran volúmenes pequeños y frecuentes (300 ml cada 2 horas, según la clave). En la práctica actual, la nutrición pospilórica se administra preferentemente en infusión continua.","a":2,"f":"Pregunta antigua (2010). Hoy, en posición pospilórica se prefiere la infusión continua con bomba; conviene que el docente valore si mantenerla."},{"id":38,"ex":"La Rioja · 2010","org":"La Rioja","y":2010,"s":"estom","t":"ulcera","q":"La infección por Helicobacter pylori:","o":["Es la causa fundamental de la enfermedad ulcerosa gastroduodenal.","Constituye un cofactor primordial en el desarrollo de adenocarcinoma y linfoma gástrico.","Su tratamiento erradicador permite la curación definitiva de la úlcera.","Todas son correctas."],"e":"Todas son ciertas: H. pylori es la primera causa de úlcera gastroduodenal (95% de las duodenales y 75% de las gástricas), es el factor etiológico más importante del adenocarcinoma gástrico y del linfoma MALT, y su erradicación cura la úlcera y evita las recidivas.","a":3,"ns":1},{"id":39,"ex":"La Rioja · 2010","org":"La Rioja","y":2010,"s":"higado","t":"cirrosis","q":"Signos precoces del inicio de la cirrosis. Indicar la respuesta incorrecta:","o":["El hígado puede estar aumentado de tamaño y puede ser doloroso.","Pérdida de peso.","Diarrea o estreñimiento.","Varices esofágicas."],"e":"Las varices esofágicas son una complicación de la hipertensión portal en fases avanzadas (cirrosis descompensada), no un signo precoz. Al inicio la cirrosis puede ser asintomática o dar hepatomegalia, astenia, pérdida de peso y alteraciones del ritmo intestinal.","a":3},{"id":40,"ex":"La Rioja · 2010","org":"La Rioja","y":2010,"s":"valor","t":"eliminacion","q":"¿Qué es la esteatorrea?","o":["Sangre brillante en heces.","Heces grasas, espumosas y malolientes.","Sangre roja tras las heces.","Heces negras."],"e":"La esteatorrea es el exceso de grasa en las heces por maldigestión o malabsorción: heces pálidas o amarillentas, voluminosas, espumosas, brillantes, malolientes y que flotan. Se cuantifica con el test de Van de Kamer. La sangre roja es rectorragia y las heces negras, melenas.","a":1},{"id":41,"ex":"La Rioja · 2010","org":"La Rioja","y":2010,"s":"valor","t":"valoracion","q":"¿Cuál de las siguientes medidas no está encaminada a inhibir el reflejo del hipo?","o":["Apnea forzada.","Estimulación faríngea.","Masaje del paladar blando.","Mantener la ingesta oral."],"e":"Las maniobras para cortar el hipo actúan sobre el arco reflejo vagal-frénico: apnea forzada, estimulación faríngea (tragar azúcar, agua fría), masaje del paladar blando, maniobra de Valsalva. Mantener la ingesta oral no inhibe el reflejo; de hecho, la distensión gástrica puede desencadenarlo.","a":3},{"id":42,"ex":"Castilla - La Mancha · 2010","org":"Castilla-La Mancha","y":2010,"s":"valor","t":"hemorragia","q":"Señale cuál de las siguientes afirmaciones acerca de la hemorragia digestiva alta es falsa:","o":["El origen de la hemorragia digestiva alta se encuentra situado entre el esfínter esofágico superior y el ángulo de Treitz.","El origen de la hemorragia digestiva alta se encuentra situado por debajo del ángulo duodeno-yeyunal.","La hemorragia digestiva alta se puede manifestar en forma de hematemesis.","La hemorragia digestiva alta se puede manifestar en forma de melenas."],"e":"La HDA se origina por ENCIMA del ángulo de Treitz (esófago, estómago y duodeno); la HDB, por debajo. La HDA se manifiesta como hematemesis y como la mayoría de las melenas. Por eso la opción b es la falsa.","a":1,"ns":1},{"id":43,"ex":"Castilla - La Mancha · 2010","org":"Castilla-La Mancha","y":2010,"s":"agudo","t":"erge","q":"¿Cuál de las siguientes patologías no suele cursar con un cuadro de abdomen agudo?","o":["Apendicitis aguda.","Perforación de un divertículo de Meckel.","Reflujo gastroduodenal.","Rotura de aneurisma de aorta abdominal."],"e":"El abdomen agudo es un dolor abdominal de instauración aguda que suele requerir actuación urgente: inflamatorio (apendicitis), perforativo (divertículo de Meckel perforado) o vascular (rotura de aneurisma). El reflujo gastroduodenal produce molestias dispépticas, no un abdomen agudo.","a":2},{"id":44,"ex":"La Rioja · 2011","org":"La Rioja","y":2011,"s":"estom","t":"ostomias","q":"Señale cuál de estos síndromes posgastrectomía se manifiesta esencialmente en el periodo posprandial inmediato (5 o 10 minutos después de la comida) y produce astenia importante psíquica y física con sensación de malestar, estado lipotímico, angustia, disnea, obligando al enfermo a acostarse:","o":["Síndrome del estómago pequeño.","Síndrome del asa eferente.","Síndrome dumping.","Ninguno."],"e":"El síndrome de dumping precoz aparece en los primeros minutos (hasta 30-60 min) tras comer, cuando un quimo hipertónico pasa rápido al intestino y arrastra líquido: plenitud, sudoración, palpitaciones, lipotimia y diarrea. Mejora tumbándose y fraccionando las comidas sin líquidos.","a":2},{"id":45,"ex":"La Rioja · 2011","org":"La Rioja","y":2011,"s":"sondas","t":"sondas_tipos","q":"No es una sonda nasoentérica:","o":["Sonda de Harris.","Sonda de Levin.","Sonda de Cantor.","Sonda de Miller- Abbott."],"e":"La de Levin es una sonda NASOGÁSTRICA de una luz. Harris, Cantor y Miller-Abbott son sondas nasoentéricas largas (unos 3 m) para descompresión intestinal, hoy prácticamente en desuso.","a":1},{"id":46,"ex":"Extremadura · 2011","org":"Extremadura","y":2011,"s":"valor","t":"hemorragia","q":"Un vómito con sangre procedente del aparato digestivo se denomina:","o":["Melenas.","Hemoptisis.","Hematemesis.","Hematoquecia."],"e":"Hematemesis = vómito de sangre (roja si el sangrado es activo; en «posos de café» si está digerida). Hemoptisis = sangre expulsada con la tos desde la vía respiratoria. Melena = heces negras por sangre digerida. Hematoquecia = sangre roja mezclada con las heces.","a":2},{"id":47,"ex":"Extremadura · 2011","org":"Extremadura","y":2011,"s":"sondas","t":"enemas","q":"¿Qué objetivo se persigue al administrar un enema carminativo a un paciente?","o":["Limpiar la mayor cantidad posible de colon.","Facilitar la expulsión de gases.","Distender el recto y el colon sigmoideo.","Limpiar el recto y el colon sigmoideo."],"e":"El enema carminativo estimula el peristaltismo y facilita la expulsión de gases retenidos (suele llevar glicerina o magnesio). Limpiar el colon es función del enema de limpieza.","a":1},{"id":48,"ex":"Euskadi · 2012","org":"País Vasco","y":2012,"s":"boca","t":"erge","q":"Uno de los consejos higiénico-dietéticos recomendados al paciente con reflujo gastroesofágico es…:","o":["Acostarse inmediatamente después de comer, para hacer bien la digestión.","Ingesta habitual de café, te y chocolate para cerrar el esfínter.","Elevar los pies de la cama 15 a 20 cm., para mejorar la circulación.","No comer y beber 2 horas antes de acostarse."],"e":"Para reducir el reflujo nocturno no se debe comer ni beber en las horas previas a acostarse (el manual recomienda no ingerir alimento en las 3 horas previas). Las demás opciones son trampas clásicas: tumbarse tras comer, café/té/chocolate y elevar los pies favorecen el reflujo.","tr":"cabecero","a":3,"po":["Tumbarse tras comer favorece el reflujo.","El café, el té y el chocolate NO cierran el esfínter: lo relajan.","Se eleva el cabecero, no los pies.",""]},{"id":49,"ex":"Euskadi · 2012","org":"País Vasco","y":2012,"s":"higado","t":"cirrosis","q":"El señor Sanz se encuentra ingresado desde ayer en el hospital a consecuencia de una cirrosis. ¿cuál de las siguientes manifestaciones le haría sospechar de un nuevo episodio de ascitis?","o":["Amonio elevado, aumento de peso.","Amilasa sérica elevada, disminución de la diuresis.","Distensión abdominal, disminución de la diuresis, aumento del peso.","Hiperglucemia, distensión abdominal."],"e":"La ascitis acumula líquido en el peritoneo: aumentan el perímetro abdominal y el peso, y disminuye la diuresis por la retención hidrosalina. Por eso se registran a diario el peso y el perímetro abdominal. El amonio elevado orienta a encefalopatía y la amilasa, a pancreatitis.","a":2},{"id":50,"ex":"Euskadi · 2012","org":"País Vasco","y":2012,"s":"higado","t":"encefalo","q":"El señor Ruiz diagnosticado de cirrosis hepática se encuentra ingresado desde ayer en el hospital a consecuencia de una encefalopatía grado I. ¿cuál de las siguientes manifestaciones le haría sospechar encefalopatía grado II?","o":["Somnolencia, confusión, letargia, asterixis.","Disminución del tiempo de respuesta, cambio del patrón del sueño.","Cambio del patrón del sueño, habla incoherente, hiperventilación.","Confusión, letargia, dificultad para despertar, fétor hepático."],"e":"Según West Haven, el grado I cursa con alteraciones leves de la atención, euforia o ansiedad y alteración del ritmo del sueño. En el grado II aparecen letargia, desorientación, cambios de personalidad y asterixis (flapping) evidente. El grado III es somnolencia o estupor y el IV, coma.","tr":"encefalo","a":0,"po":["","Son signos del grado I (alteraciones leves del sueño y de la atención).","El habla incoherente y la hiperventilación no definen el grado II.","La dificultad para despertar corresponde al grado III (estupor)."]},{"id":51,"ex":"Aragón · 2012","org":"Aragón","y":2012,"s":"sondas","t":"sondas_tipos","q":"Con respecto a las sondas, no es cierto:","o":["La sonda Salem es radiopaca con doble luz.","La sonda Foley está indicada en el sondaje vesical.","La sonda Ewald es de calibre muy pequeño y se introduce por la nariz.","La sonda Salem se utiliza para lavados gástricos en intoxicaciones medicamentosas."],"e":"La sonda de Ewald es de GRAN calibre y se introduce por la BOCA (orogástrica) para lavados gástricos y extraer restos o coágulos. La Salem es radiopaca y de doble luz, y la Foley es vesical.","tr":"lavado","a":2,"po":["Es cierto: la Salem es radiopaca y de doble luz.","Es cierto: la Foley es una sonda vesical.","","Según la clave se admite su uso en lavados; lo falso es la Ewald fina y nasal."]},{"id":52,"ex":"Aragón · 2012","org":"Aragón","y":2012,"s":"ostom","t":"ostomias","q":"Con respecto a los cuidados de enfermería en el paciente ostomizado, señale la respuesta incorrecta:","o":["Lavado del estoma con agua tibia y jabón, secándolo a continuación de forma suave y exhaustiva.","Aportar al paciente y familia todo el apoyo necesario.","Las primeras semanas elegiremos un colector pequeño, para ir aumentando a uno de mayor tamaño.","Control del estoma."],"e":"En el postoperatorio el estoma está edematoso y se va reduciendo durante las primeras 6-8 semanas: hay que medirlo en cada cambio e ir ajustando el orificio del colector (unos 3 mm mayor que el estoma). No se empieza con un colector pequeño para ir aumentando: se hace al revés.","a":2},{"id":53,"ex":"Aragón · 2012","org":"Aragón","y":2012,"s":"sondas","t":"lavado","q":"La sonda de Sengstaken-Blakemore es:","o":["La menos usada para intentar controlar la hemorragia digestiva alta por varices esofágicas.","Una sonda de tres vías.","Una sonda de dos vías.","Una sonda con la cual no se debe hacer lavado gástrico."],"e":"La Sengstaken-Blakemore tiene 3 vías y 2 balones: aspiración gástrica, balón gástrico (200-250 ml) y balón esofágico (inflado con aire a presión controlada). Se usa en la hemorragia por varices esofágicas que no se controla con fármacos ni endoscopia. La Minnesota añade una 4.ª vía de aspiración esofágica.","tr":"balones","a":1,"po":["No es la menos usada: es la sonda de taponamiento de referencia.","","Tiene tres vías, no dos.","Sí permite aspirar o lavar por su vía gástrica."]},{"id":54,"ex":"Aragón · 2012","org":"Aragón","y":2012,"s":"sondas","t":"lavado","q":"Si queremos realizar un lavado gástrico, ¿qué tipo de sonda utilizaremos?","o":["Levin.","Salem.","Foucher.","Miller."],"e":"Para el lavado gástrico se usan sondas orogástricas de gran calibre y una luz: Foucher (Faucher) o Ewald, que permiten extraer restos de tóxicos y coágulos. Levin y Salem son nasogástricas de menor calibre y Miller-Abbott es nasoentérica.","tr":"lavado","a":2,"po":["La Levin sirve para lavados ligeros, pero para tóxicos se prefiere una sonda gruesa orogástrica.","La Salem es de aspiración, de calibre menor.","","La Miller-Abbott es nasoentérica, para descompresión intestinal."]},{"id":55,"ex":"Navarra · 2012","org":"Navarra","y":2012,"s":"higado","t":"encefalo","q":"El tipo de dieta más adecuada para un paciente con encefalopatía hepática es:","o":["Rica en hidratos de carbono y pobre en proteínas.","Pobre en hidratos de carbono e hiperproteica.","Rica en hidratos de carbono e hiperproteica.","Con abundantes líquidos e hipoproteica."],"e":"ANTES: se restringían las proteínas para que el intestino produjera menos amoniaco. HOY: la ESPEN recomienda NO restringirlas, porque la restricción aumenta el catabolismo muscular (sarcopenia) y, con él, el amoniaco. La dieta indicada es hipercalórica e hiperproteica, repartida en varias tomas y con un tentempié nocturno; solo se aplaza el aporte proteico en casos hiperagudos graves.","st":"O","a":2},{"id":56,"ex":"Navarra · 2012","org":"Navarra","y":2012,"s":"bilipan","t":"pancreas","q":"La atención de enfermería en pacientes con pancreatitis aguda incluye la vigilancia y control precoz de posibles complicaciones, entre ellas la hipocalcemia. ¿Qué manifestación es un signo claro de la misma?","o":["Disminución de los reflejos.","La hipocalcemia no es una complicación de la pancreatitis aguda.","Acortamiento del segmento ST.","Signo de Trousseau positivo."],"e":"La hipocalcemia es una complicación frecuente de la pancreatitis aguda (el calcio precipita con los ácidos grasos de la necrosis grasa: saponificación). Los signos de tetania latente son Trousseau (espasmo carpal con el manguito) y Chvostek. En el ECG alarga el QT (no acorta el ST) y los reflejos aumentan.","a":3},{"id":57,"ex":"Asturias · 2013","org":"Asturias","y":2013,"s":"estom","t":"dumping","q":"En un paciente al que se le ha practicado una gastrectomía, de cuál de la siguientes vitaminas se puede tener un déficit, varios años después de la intervención:","o":["Vitamina B12.","Vitamina B3.","Vitamina K.","Vitamina E."],"e":"Tras una gastrectomía se pierden las células parietales que producen el factor intrínseco, imprescindible para absorber la vitamina B12 en el íleon. Las reservas hepáticas duran años, por eso la anemia megaloblástica aparece tardíamente. Se previene con B12 intramuscular de por vida.","tr":"b12","a":0,"po":["","La B3 (niacina) no depende del factor intrínseco.","La vitamina K es liposoluble: depende de las sales biliares, no del estómago.","La vitamina E es liposoluble: no se relaciona con la gastrectomía."]},{"id":58,"ex":"Asturias · 2013","org":"Asturias","y":2013,"s":"estom","t":"anatomia","q":"Cuando un pH gástrico es alcalino favorece:","o":["La destrucción de los organismos ingeridos.","El funcionamiento correcto del estómago pues el pH gástrico normal es el alcalino.","El pH gástrico alcalino es aquel que está por debajo de 1,5 y su aparición es inocua al funcionamiento del sistema digestivo.","La proliferación bacteriana y puede aumentar el riesgo de infección nosocomial."],"e":"El pH ácido del estómago es bacteriostático y destruye los gérmenes ingeridos. Si se alcaliniza (IBP, antiácidos, nutrición enteral continua), las bacterias proliferan: aumenta el riesgo de sobrecrecimiento bacteriano y de neumonía nosocomial por aspiración. El pH gástrico normal es ácido (1,5-3,5).","a":3},{"id":59,"ex":"Comunitat Valenciana A · 2013","org":"C. Valenciana","y":2013,"s":"ostom","t":"peg","q":"Es una contraindicación absoluta para la colocación de una PEG (gastrostomía endoscópica percutánea) en un paciente de hospitalización domiciliaria:","o":["La cirugía gástrica o abdominal previas.","La obesidad.","La estenosis faringoesofágica dilatable.","Las alteraciones de la coagulación."],"e":"Las alteraciones graves de la coagulación no corregibles contraindican de forma absoluta la PEG, por el riesgo de sangrado al puncionar el estómago. La cirugía previa, la obesidad o una estenosis que permite pasar el endoscopio son, como mucho, contraindicaciones relativas.","a":3},{"id":60,"ex":"Comunitat Valenciana A · 2013","org":"C. Valenciana","y":2013,"s":"ostom","t":"ostomias","q":"Como norma general, la ubicación del estoma en las colostomías sigmoideas de Milles o Hartmann se sitúa en:","o":["El cuadrante inferior derecho abdominal.","El cuadrante inferior izquierdo abdominal.","El cuadrante anterosuperior de la cresta ilíaca derecha.","El cuadrante supra-umbilical izquierdo."],"e":"El colon sigmoide está en la fosa iliaca izquierda, por lo que las colostomías sigmoideas (terminal o tipo Hartmann) se sitúan en el cuadrante inferior izquierdo. Las ileostomías suelen ir en el cuadrante inferior derecho.","a":1},{"id":61,"ex":"Comunitat Valenciana B · 2013","org":"C. Valenciana","y":2013,"s":"boca","t":"bucal","q":"La aparición de placas de color rojo brillante en el dorso de la lengua se denomina:","o":["Lengua escrotal.","Lengua geográfica.","Lengua nigra.","Lengua pilosa."],"e":"La lengua geográfica (glositis migratoria benigna) muestra placas rojas lisas por pérdida de papilas, rodeadas de un borde blanquecino, que cambian de lugar como un mapa. La lengua escrotal presenta surcos profundos y la lengua nigra o pilosa, papilas alargadas oscuras.","a":1},{"id":62,"ex":"Comunitat Valenciana B · 2013","org":"C. Valenciana","y":2013,"s":"ostom","t":"ostomias","q":"Normalmente, el estomatoterapeuta se encarga de marcar el sitio apropiado para realizar la ostomía antes de la intervención quirúrgica. ¿Cuál es la ubicación más apropiada?","o":["Músculo recto abdominal.","Músculo oblicuo mayor.","Músculo transverso.","Músculo cremáster."],"e":"El estoma debe situarse sobre el músculo recto anterior del abdomen: es la zona mejor protegida muscularmente y reduce hernias paraestomales y prolapsos. Se marca antes de la cirugía (es tarea de enfermería), evitando cicatrices, pliegues, prominencias óseas y la línea de la cintura.","a":0},{"id":63,"ex":"Aragón · 2014","org":"Aragón","y":2014,"s":"sondas","t":"lavado","q":"Respecto al lavado gástrico es cierto que:","o":["Utilizaremos lubricante liposoluble.","Colocaremos al paciente en decúbito lateral derecho.","La hipotermia es una complicación en los niños.","Está indicado en la ingesta de sustancias cáusticas."],"e":"En el lavado gástrico de los niños se usa suero templado y volúmenes ajustados al peso: el riesgo de hipotermia (y de alteraciones electrolíticas) es mayor. Se lubrica con producto hidrosoluble, se coloca al paciente en decúbito lateral IZQUIERDO y está contraindicado en la ingesta de cáusticos.","a":2},{"id":64,"ex":"Aragón · 2014","org":"Aragón","y":2014,"s":"sondas","t":"sng","q":"¿Cómo puede estimarse la longitud adecuada para la colocación de una sonda nasogástrica?","o":["Desde la punta de la nariz del paciente hasta el cuadrante superior del abdomen.","Desde la punta de la nariz del paciente hasta el apéndice xifoides y desde ahí hasta el lóbulo de la oreja.","Desde la punta de la nariz del paciente hasta el lóbulo de la oreja y desde ahí hasta el apéndice xifoides.","Desde la punta de la nariz del paciente hasta el hipocondrio derecho."],"e":"Método NEX (Hansen): se mide desde la punta de la NARIZ hasta el lóbulo de la OREJA y desde ahí hasta el apéndice XIFOIDES. El orden importa: la opción que mide primero hasta el xifoides es una trampa.","a":2},{"id":65,"ex":"Aragón · 2014","org":"Aragón","y":2014,"s":"bilipan","t":"charcot","q":"Un paciente con dolor abdominal, ictericia y fiebre, presenta:","o":["Colelitiasis.","Colecistitis.","Coledocolitiasis.","Colangitis."],"e":"Dolor, fiebre e ictericia forman la tríada de Charcot, característica de la colangitis aguda (infección de la vía biliar por obstrucción del colédoco). Si además hay shock y confusión mental, es la pentada de Reynolds.","tr":"charcot","a":3,"po":["Colelitiasis = cálculos en la vesícula; suele ser asintomática o dar cólico sin ictericia.","Colecistitis = dolor + fiebre + leucocitosis, sin ictericia típica.","La coledocolitiasis da ictericia, pero la FIEBRE indica que ya se ha infectado (colangitis).",""]},{"id":66,"ex":"Aragón · 2014","org":"Aragón","y":2014,"s":"ostom","t":"irrigacion","q":"La irrigación a través de un estoma, para promover una evacuación intestinal de forma regular estaría indicada en:","o":["Ileostomía.","Colostomía ascendente.","Colostomía sigmoidea.","Colostomía transversa."],"e":"La irrigación solo está indicada en colostomías descendentes o sigmoideas: las heces son formes y el colon distal se puede «educar» para evacuar a horas fijas. No sirve en ileostomías ni en colostomías ascendentes o transversas, cuyo efluente es líquido y continuo.","a":2},{"id":67,"ex":"Extremadura · 2014","org":"Extremadura","y":2014,"s":"valor","t":"eliminacion","q":"El diagnóstico de enfermería «Motilidad gastrointestinal disfuncional (00196)» tiene una serie de características definitorias; señale la incorrecta:","o":["Dolor abdominal.","Presencia de ventosidades.","Diarrea.","Vómitos."],"e":"Entre las características definitorias de la etiqueta NANDA «Motilidad gastrointestinal disfuncional» figuran la AUSENCIA de flatos, la diarrea, el dolor abdominal, los vómitos, la distensión, el residuo gástrico aumentado y los ruidos intestinales alterados. La presencia de ventosidades indica motilidad conservada.","a":1},{"id":68,"ex":"Extremadura · 2014","org":"Extremadura","y":2014,"s":"estom","t":"ulcera","q":"Las úlceras pépticas pueden desarrollar complicaciones potencialmente mortales como son; señale la incorrecta:","o":["Penetración.","Diarrea.","Perforación.","Hemorragia."],"e":"Las complicaciones graves de la úlcera péptica son la hemorragia (la más frecuente), la perforación (la más grave), la penetración en órganos vecinos (sobre todo el páncreas) y la estenosis pilórica. La diarrea no es una complicación de la úlcera.","a":1},{"id":69,"ex":"Madrid · 2014","org":"Madrid","y":2014,"s":"intestino","t":"ccr","q":"Si utilizamos la Clasificación de Astler-Coller modificada por Gunderson-Sosin (1978) sobre el estadiaje del cáncer colorrectal, decimos que un tumor es de estadio B3 cuando:","o":["El tumor invade la muscular sin sobrepasarla y existen ganglios afectados.","El tumor invade microscópicamente toda la pared intestinal incluyendo serosas o grasa perirrectal y adhiere o invade otros órganos o estructuras adyacentes.","El tumor invade la muscular sin sobrepasarla y no existen ganglios afectados.","El tumor está limitado a la mucosa."],"e":"Astler-Coller modificada: A = limitado a la mucosa; B1 = invade la muscular sin sobrepasarla; B2 = atraviesa toda la pared; B3 = invade o se adhiere a órganos adyacentes. Todos los B son sin ganglios; los estadios C son los mismos con ganglios afectados (la opción a sería C1).","a":1,"ns":1},{"id":70,"ex":"Madrid · 2014","org":"Madrid","y":2014,"s":"ostom","t":"heces_ostomia","q":"De las siguientes respuestas, indique cuál no es cierta en pacientes con ostomías recientes:","o":["Las heces de la sigmoidostomía son de consistencia normal o formada y se puede regular la frecuencia de la descarga.","La ileostomía produce un drenaje blanco y maloliente.","El drenaje de la ileostomía contiene algunas enzimas digestivas que dañan la piel.","La colostomía ascendente produce drenaje líquido y contiene enzimas digestivas."],"e":"El efluente de la ileostomía es líquido o pastoso, verdoso-amarillento, continuo, poco maloliente y rico en enzimas que irritan la piel. Por eso la afirmación de que es «blanco y maloliente» es falsa. La sigmoidostomía da heces formes y regulables.","tr":"distal","a":1,"po":["Es cierto: la sigmoidostomía da heces formes y se puede regular.","","Es cierto: el efluente ileal lleva enzimas que irritan la piel.","Es cierto: la ascendente da drenaje líquido-semilíquido con enzimas."]},{"id":71,"ex":"Euskadi · 2015","org":"País Vasco","y":2015,"s":"bilipan","t":"pancreas","q":"De las siguientes manifestaciones clínicas de la pancreatitis aguda, todas se presentan comúnmente excepto una. Señale la incorrecta:","o":["Dolor en el epigastrio medio.","Defensa abdominal.","Hipertensión.","Insuficiencia respiratoria."],"e":"La pancreatitis aguda cursa con dolor epigástrico en cinturón, defensa abdominal, fiebre, taquicardia e HIPOtensión (por paso de líquido al tercer espacio). En las formas graves aparecen insuficiencia respiratoria (SDRA) y fallo multiorgánico. La hipertensión no es típica.","a":2},{"id":73,"ex":"Euskadi · 2015","org":"País Vasco","y":2015,"s":"boca","t":"bucal","q":"En la etiología de la caries dental se encuentran implicados diversos factores alimentarios. de los siguientes factores señale el correcto:","o":["Los nutrientes implicados siempre están mediatizados por otros factores.","La sacarosa aparece como el principal agente productor de caries.","Los edulcorantes xilitol y sorbitol están directamente implicados en el origen de la caries.","La fluoración del agua potable es una medida poco eficaz, ya que la mayoría de las aguas de riego y tierras cultivables poseen altas concentraciones de este elemento."],"e":"La sacarosa es el azúcar más cariogénico: las bacterias de la placa la fermentan a ácidos que desmineralizan el esmalte. El xilitol y el sorbitol no son cariogénicos (el xilitol incluso protege) y la fluoración del agua es una medida eficaz de salud pública.","a":1},{"id":74,"ex":"Euskadi · 2015","org":"País Vasco","y":2015,"s":"intestino","t":"eliminacion","q":"¿Cuál de los siguientes diagnósticos de enfermería no es aplicable en el manejo del paciente con enfermedad intestinal inflamatoria crónica?","o":["Desequilibrio en la nutrición, por debajo de los requerimientos corporales, relacionado con restricciones dietéticas, náusea y malabsorción.","Intolerancia a la actividad, relacionada con debilidad generalizada.","Estreñimiento, relacionado con el proceso inflamatorio.","Dolor agudo, relacionado con la inflamación gastrointestinal."],"e":"La enfermedad inflamatoria intestinal cursa típicamente con diarrea (sanguinolenta en la colitis ulcerosa), dolor, malnutrición y astenia. El estreñimiento por el proceso inflamatorio no es un diagnóstico aplicable a su manejo habitual.","a":2},{"id":75,"ex":"La Rioja · 2016","org":"La Rioja","y":2016,"s":"valor","t":"eliminacion","q":"La determinación de grasa en heces se realiza mediante un test llamado:","o":["Test de Graham.","Test de Guayaco.","Test de Van de Kamer.","Todas son falsas."],"e":"El test de Van de Kamer cuantifica la grasa fecal (se recogen heces de 72 h con una dieta de 100 g de grasa/día) y confirma la esteatorrea. El test del guayaco detectaba sangre oculta en heces.","a":2,"ns":1},{"id":76,"ex":"La Rioja · 2016","org":"La Rioja","y":2016,"s":"bilipan","t":"charcot","q":"La triada de Charcot es característica de:","o":["Colangitis.","Colecistitis.","Colelitiasis.","Todas son ciertas."],"e":"La tríada de Charcot (dolor abdominal tipo cólico + fiebre + ictericia) es característica de la colangitis aguda. La tríada de la colecistitis aguda es dolor en hipocondrio derecho + fiebre + leucocitosis.","tr":"charcot","a":0,"ns":1,"po":["","La colecistitis no cursa típicamente con ictericia.","La colelitiasis no complicada no da fiebre ni ictericia.","Solo la colangitis cumple la tríada."]},{"id":77,"ex":"Castilla y León · 2016","org":"Castilla y León","y":2016,"s":"boca","t":"bucal","q":"Referido al índice CAO, señale la respuesta correcta:","o":["Es un indicador epidemiológico utilizado en dentición temporal.","Es un índice referido al primer molar permanente.","Es un indicador epidemiológico utilizado en dentición permanente.","Se obtiene sumando el número de niños que presentan una o más piezas definitivas cariadas, obturadas o ausentes por caries y dividiéndolo después entre el número total de niños examinados."],"e":"El índice CAOD (cariados, ausentes y obturados) es un indicador epidemiológico de la dentición PERMANENTE, que se suele medir a los 12 años: suma de piezas C+A+O dividida entre el número de individuos (no entre el número de niños afectado
