,"e":"La vena porta se forma por la unión de la vena mesentérica superior y la vena esplénica, por detrás del cuello del páncreas. La mesentérica inferior suele desembocar en la esplénica o en la mesentérica superior. La porta lleva al hígado la sangre del bazo, el páncreas, la vesícula y el tubo digestivo."},{"id":234,"ex":"Defensa Examen - Extraordinario · 2023","s":"agudo","q":"La causa más frecuente de una apendicitis es:","o":["Adenitis mesentérica.","Invaginación intestinal.","Enfermedad intestinal inflamatoria.","Obstrucción luminal."],"a":3,"e":"La apendicitis se produce por obstrucción de la luz del apéndice (sobre todo por fecalitos o coprolitos; también por hiperplasia linfoide, parásitos, cuerpos extraños o tumores). La obstrucción aumenta la presión, compromete la irrigación y favorece la infección, la necrosis y la perforación."},{"id":235,"ex":"Defensa Examen - Extraordinario · 2023","s":"boca","q":"El divertículo de Zenker, es un divertículo:","o":["Cólico.","Yeyunal.","Duodenal.","Esofágico."],"a":3,"e":"El divertículo de Zenker es un divertículo esofágico (faringoesofágico): una herniación de la mucosa por encima del músculo cricofaríngeo (esfínter esofágico superior). Produce disfagia alta, regurgitación de alimento sin digerir, halitosis y riesgo de aspiración. El divertículo de Meckel está en el íleon."},{"id":236,"ex":"Defensa Examen - Extraordinario · 2023","s":"bilipan","q":"Cuando se práctica una pancreaticoduodenectomía, ¿qué estamos realizando?:","o":["Paracentesis.","Procedimiento de whipple.","Terapia de Douglas.","Cierre de Hartmann."],"a":1,"e":"La pancreaticoduodenectomía cefálica es la intervención de Whipple: se extirpan la cabeza del páncreas, el duodeno, la vía biliar distal, la vesícula y a veces parte del estómago. Es la cirugía de elección en los tumores resecables de la cabeza del páncreas y la región periampular."},{"id":237,"ex":"Defensa Examen - Extraordinario · 2023","s":"sondas","q":"Cuál NO es un tipo de sonda nasogástrica:","o":["Sonda de Levin.","Sonda de Salem.","Sonda Nelaton.","Sonda de Sengstaken-Blakemore."],"a":2,"e":"La sonda Nelaton es una sonda recta y semirrígida de uso vesical (sondaje intermitente) o rectal, no nasogástrica. Levin, Salem y Sengstaken-Blakemore sí se introducen por vía nasogástrica."},{"id":238,"ex":"Defensa Examen - Extraordinario · 2023","s":"ostom","q":"La técnica de colostomía temporal en la que se reseca un tramo intestinal y quedan dos estomas separados y distantes, se denomina:","o":["Colostomía de Paul Mikulicz.","Colostomía en asa.","Colostomía de Hartmann.","Colostomía tipo Devin."],"a":3,"e":"En la colostomía tipo Devine se reseca un tramo de colon y los dos cabos se exteriorizan como estomas SEPARADOS y distantes: uno funcional y otro mucoso. En la técnica de Paul-Mikulicz (doble boca) los dos cabos quedan juntos, «en cañón de escopeta». En la colostomía en asa no se secciona completamente el intestino."},{"id":239,"ex":"Comunidad Valenciana aplazado · 2023","s":"bilipan","q":"Se encuentra usted en un servicio hospitalario atendiendo a un paciente diagnosticado de pancreatitis necrotizante al que se le va a practicar un drenaje percutáneo radiológico (PCD). Usted sabe que la técnica utilizada para el drenaje de colecciones es:","o":["La PAAF.","La técnica de Seldinger.","La embolización.","La quimioembolización."],"a":1,"e":"El drenaje percutáneo de colecciones guiado por imagen se hace con la técnica de Seldinger: punción con aguja, paso de una guía metálica, retirada de la aguja y colocación del catéter de drenaje sobre la guía. La PAAF solo obtiene muestras y la embolización ocluye vasos."},{"id":240,"ex":"Comunidad Valenciana aplazado · 2023","s":"estom","q":"Se encuentra usted en la planta de Cirugía y tiene a su cuidado a Miguel Sánchez que ha sido intervenido de una gastrectomía, ¿Cuál de las siguientes recomendaciones dietéticas NO sería indicada para una persona que ha sido gastrectomizada?:","o":["Realizar comidas frecuentes (5-6) comidas al día.","Masticar muy bien los alimentos, comiendo despacio.","Acompañar la ingesta de alimentos con abundante líquido.","Realizar reposo postprandial."],"a":2,"e":"Tras una gastrectomía, los líquidos deben tomarse SEPARADOS de las comidas (30-60 min antes o después): acompañar la comida con mucho líquido acelera el vaciamiento y provoca dumping. Sí se recomiendan 5-6 comidas pequeñas, masticar bien y reposar tras comer."},{"id":241,"ex":"Euskadi · 2023","s":"intestino","q":"¿Cuál NO es correcta con respecto a la enfermedad inflamatoria intestinal?:","o":["Las fístulas y los abscesos perianales son comunes en la enfermedad de Crohn.","La colitis ulcerosa afecta de manera primordial al recto y hemicolon izquierdo.","La hemorragia rectal es rara en la enfermedad de Crohn.","La colitis ulcerosa se caracteriza por lesiones granulomatosas bien delimitadas."],"a":3,"e":"Los granulomas (no caseificantes) son característicos de la enfermedad de CROHN, no de la colitis ulcerosa. En la CU hay úlceras superficiales, abscesos crípticos e inflamación continua desde el recto. En el Crohn son frecuentes las fístulas y los abscesos perianales, y la rectorragia es menos habitual."},{"id":242,"ex":"Castilla y León 22 octubre · 2023","s":"sondas","q":"¿Cuál de las siguientes no es una vía de administración de la alimentación enteral?:","o":["Por sonda Levin.","Por sonda Salem.","Por sonda Faucher.","Por gastrostomía endoscópica percutánea."],"a":2,"e":"La sonda de Faucher (Foucher) es orogástrica, de gran calibre, y se usa para el lavado gástrico, no para alimentar. Levin, Salem y la gastrostomía (PEG) sí sirven para administrar nutrición enteral."},{"id":243,"ex":"Castilla y León 22 octubre · 2023","s":"sondas","q":"¿En cuál de las siguientes situaciones está indicado colocar una sonda nasogástrica?:","o":["Ingestión reciente de caústicos.","Traumatismo facial grave.","Obstrucción esofágica.","Nutrición en pacientes con ventilación mecánica."],"a":3,"e":"El paciente con ventilación mecánica que no puede comer es una indicación clara de SNG para nutrición enteral. La ingesta de cáusticos, el traumatismo facial grave (riesgo de vía intracraneal) y la obstrucción esofágica son contraindicaciones."},{"id":244,"ex":"Castilla y León 22 octubre · 2023","s":"sondas","q":"No es un tipo de sonda nasogástrica:","o":["Salem.","Levin.","Robinson.","Miller-Abbott."],"a":2,"e":"La sonda Robinson es una sonda recta de un solo uso, vesical o rectal. Salem y Levin son nasogástricas y la Miller-Abbott es nasoentérica (se introduce también por la nariz)."},{"id":245,"ex":"Andalucía · 2023","s":"agudo","q":"Tras un traumatismo abdominal que produce hemorragia interna, ¿qué signo NO nos vamos a encontrar?:","o":["Abdomen en tabla.","Hipotensión.","Hipersensibilidad abdominal.","Aumento de los ruidos intestinales."],"a":3,"e":"La sangre en la cavidad peritoneal (hemoperitoneo) irrita el peritoneo y produce defensa o «abdomen en tabla», hipersensibilidad y una DISMINUCIÓN de los ruidos intestinales (íleo reflejo), además de hipotensión y taquicardia por la hipovolemia. No hay aumento de los ruidos."},{"id":246,"ex":"Murcia CARM Salud pública · 2023","s":"sondas","q":"¿Cuál de las siguientes afirmaciones es correcta acerca de los cuidados de enfermería a pacientes con sonda nasogástrica?:","o":["Las sondas nasogástricas se utilizan exclusivamente para la administración de medicamentos.","No es necesario asegurarse de que la sonda esté colocada correctamente antes de su uso.","Es esencial verificar el posicionamiento de la sonda antes de administrar cualquier alimento o medicamento.","No es necesario realizar un lavado gástrico previo al uso de la sonda nasogástrica."],"a":2,"e":"Antes de administrar alimento o medicación hay que verificar siempre la posición de la sonda (marca externa, pH del aspirado, radiografía si hay dudas), porque puede haberse desplazado y una administración en la vía aérea es grave. La SNG no se usa solo para fármacos y no requiere lavado gástrico previo."},{"id":247,"ex":"Murcia Modelo B · 2023","s":"valor","q":"¿Cuál es el tratamiento inicial de elección en un paciente con una úlcera péptica sangrante que presenta signos de shock hipovolémico?:","o":["Endoscopia terapéutica.","Antibióticos de amplio espectro.","Infusión de solución salina.","Cirugía de emergencia."],"a":2,"e":"Ante una HDA con shock hipovolémico, la prioridad es la estabilización hemodinámica: dos vías gruesas y reposición de volumen con cristaloides (suero fisiológico), con transfusión si es preciso. Una vez estabilizado se hace la endoscopia terapéutica; la cirugía se reserva para cuando esta fracasa."},{"id":248,"ex":"Murcia Modelo B · 2023","s":"intestino","q":"En un paciente con enfermedad de Crohn, indique la opción correcta:","o":["Los cólicos abdominales mejoran tras la ingesta.","Pueden aparecer abscesos abdominales y anales.","Se recomienda una dieta rica en residuo.","Tiene alivio tras defecación."],"a":1,"e":"Por su afectación transmural, la enfermedad de Crohn puede complicarse con fístulas y ABSCESOS abdominales y perianales. Los cólicos empeoran tras la ingesta (no mejoran), y en los brotes se recomienda una dieta POBRE en residuos, sobre todo si hay estenosis."},{"id":249,"ex":"Murcia Modelo B · 2023","s":"bilipan","q":"Un paciente se encuentra ingresado a consecuencia de una pancreatitis aguda por litiasis biliar. ¿Cuál de las siguientes manifestaciones nos haría sospechar de un nuevo episodio de pancreatitis?:","o":["Dolor epigástrico irradiado a la espalda.","Hiperglucemia.","Esteatorrea y diarrea.","Distensión abdominal."],"a":0,"e":"El síntoma cardinal de la pancreatitis es el dolor epigástrico intenso irradiado en cinturón a la espalda. Si reaparece, debe sospecharse un nuevo brote (con elevación de amilasa y lipasa). La esteatorrea y la hiperglucemia son más propias de la insuficiencia pancreática crónica."},{"id":250,"ex":"Murcia Modelo B · 2023","s":"sondas","q":"Con respecto al sondaje nasogástrico, señale la opción incorrecta:","o":["Su uso está indicado para prevenir la broncoaspiración en pacientes intubados.","Está recomendada en pacientes con esófago obstruido o perforación esofágica.","Se usa para alimentar a un paciente cuando no puede por vía oral.","Está indicado su uso para aliviar y/o prevenir la distensión gástrica en caso de posible obstrucción intestinal."],"a":1,"e":"La obstrucción y la perforación esofágica CONTRAINDICAN la SNG, por riesgo de lesión o perforación. Son indicaciones correctas: descomprimir en la obstrucción intestinal, alimentar a quien no puede comer y proteger de la aspiración a pacientes intubados."},{"id":251,"ex":"Castilla y León aplazado · 2023","s":"ostom","q":"¿Qué zona elegiría para el marcaje de estoma de eliminación?:","o":["Hipocondrio derecho.","Músculo recto del abdomen.","Ángulo esplénico.","Hipocondrio izquierdo."],"a":1,"e":"El estoma de eliminación se marca sobre el músculo recto anterior del abdomen, en el punto central del triángulo formado por el ombligo, la espina iliaca y el pubis, y siempre comprobando con el paciente de pie, sentado y tumbado. Así se reduce el riesgo de hernia paraestomal y de prolapso."},{"id":252,"ex":"Castilla y León aplazado · 2023","s":"sondas","q":"Señale la respuesta falsa en relación con la sonda nasoyeyunal:","o":["Se pondrá mediante gastroscopia o mediante radiología intervencionista.","La luz proximal estará localizada en el estómago.","La luz distal se localizará en el yeyuno.","Cada una de las luces se inserta a través de una coana"],"a":3,"e":"La sonda nasoyeyunal de doble luz es UN solo tubo con dos luces que entra por una misma coana: la luz proximal queda en el estómago (aspiración o descompresión) y la distal en el yeyuno (nutrición). Se coloca por endoscopia o radiología intervencionista. La afirmación falsa es que cada luz entre por una coana."},{"id":253,"ex":"Islas Baleares · 2023","s":"higado","q":"Señale la afirmación incorrecta:","o":["Si un paciente con enfermedad hepática crónica no puede alcanzar sus necesidades energético-proteicas por la vía oral a causa de un nivel de consciencia bajo, la nutrición enteral debe ser la primera vía que debe considerarse.","Las ingestas de poco volumen y frecuentes son mejor toleradas en los casos de cirrosis.","No es importante la ingesta previa al descanso nocturno en pacientes con una enfermedad hepática.","La obesidad aumenta la morbilidad y la mortalidad."],"a":2,"e":"En la hepatopatía crónica SÍ es importante una ingesta antes de dormir (snack nocturno con hidratos de carbono complejos): el hígado cirrótico tiene poco glucógeno, y el ayuno nocturno activa el catabolismo muscular. Se prefieren tomas pequeñas y frecuentes, y si la vía oral no es suficiente, la nutrición enteral es la primera opción."},{"id":254,"ex":"Canarias batería preguntas B · 2023","s":"intestino","q":"¿Cuál es la principal medida higiénica para la prevención de la gastroenteritis?:","o":["Lavado de manos con agua y jabón.","Lactancia materna.","La vacunación contra el rotavirus.","Ninguna es correcta."],"a":0,"e":"La higiene de manos con agua y jabón es la principal medida para prevenir la gastroenteritis, que se transmite por vía fecal-oral. La lactancia materna y la vacuna del rotavirus son preventivas en lactantes, pero la medida higiénica principal y universal es el lavado de manos.","ns":1},{"id":255,"ex":"Canarias batería preguntas B · 2023","s":"sondas","q":"¿Cuándo está contraindicado el sondaje nasogástrico? Elige la opción INCORRECTA:","o":["Fractura facial o de la base del cráneo.","Estenosis esofágica o sospecha de perforación esofágica.","Ingestión o lesiones por cáusticos.","Cirugía maxilofacial."],"a":3,"e":"Las fracturas faciales o de la base del cráneo, la estenosis o perforación esofágica y la ingesta de cáusticos son contraindicaciones del sondaje nasogástrico. La cirugía maxilofacial en sí no es una contraindicación general (incluso se coloca SNG en el quirófano bajo visión directa)."},{"id":256,"ex":"Canarias batería preguntas B · 2023","s":"sondas","q":"¿Cuáles son la indicaciones del sondaje nasogástrico? Elige la opción INCORRECTA:","o":["Diarreas.","Incremento de los requerimientos nutricionales (sepsis, quemados, politraumatizados).","Pacientes tratados con ventilación mecánica.","Síndrome de intestino corto."],"a":0,"e":"La diarrea no es una indicación de sondaje nasogástrico (incluso puede ser una complicación de la nutrición enteral). Sí lo son los requerimientos nutricionales aumentados que no se cubren por boca (sepsis, quemados, politraumatizados), la ventilación mecánica y el síndrome de intestino corto."},{"id":257,"ex":"Canarias batería preguntas B · 2023","s":"sondas","q":"¿Cuáles son los cuidados de enfermería estandarizados al paciente portador de sonda nasogástrica? Elige la opción INCORRECTA:","o":["Habrá que limpiar diariamente la parte externa de la sonda, tras cada administración de nutrición y habrá que pasar siempre unos 20 ó 30 ml de agua.","Elevar el cabecero de la cama a unos 25 - 30 grados durante la administración de la alimentación.","En caso de tener que trasladar, mover o asear al paciente (habrá que mantenerlo en una postura inferior a 30 grados), hay que suspender la alimentación por sonda una hora antes.","Comprobar la existencia de residuos cada 4- 6 horas durante las primeras 24 horas y luego cada 8 horas."],"a":1,"e":"Durante la alimentación por sonda el cabecero debe elevarse a 30-45° (no 25-30°) y mantenerse así hasta 30-60 minutos después, para reducir el reflujo y la aspiración. La limpieza diaria, los lavados con 20-30 ml de agua y el control del residuo sí son cuidados correctos."},{"id":258,"ex":"Canarias batería preguntas B · 2023","s":"sondas","q":"¿Cuáles son las complicaciones del sondaje nasogástrico?:","o":["Mecánicas.","Infecciosas.","Gastrointestinales y metabólicas.","Todas las respuestas son ciertas."],"a":3,"e":"Las complicaciones del sondaje y la nutrición enteral se clasifican en mecánicas (obstrucción, desplazamiento, lesiones nasales), infecciosas (neumonía por aspiración, sinusitis), gastrointestinales (diarrea, distensión, vómitos) y metabólicas (hiperglucemia, alteraciones electrolíticas).","ns":1},{"id":259,"ex":"Canarias batería preguntas B · 2023","s":"sondas","q":"Elige la opción INCORRECTA en el procedimiento del lavado gástrico:","o":["Medir la porción de la sonda que es necesario implantar en el paciente.","Lubrificar bien la porción distal de la sonda con lubricante hidrosoluble y, si la sonda está autolubricada, humedecerlo con agua o suero.","Una vez introducida hasta la medida que hemos estimado oportuna, confirmar la correcta colocación de la sonda. Para ello podemos insuflar aire a la vez que auscultamos en el epigastrio o retirar una pequeña cantidad de contenido gástrico y medir su pH mediante tiras reactivas obteniendo un pH mayor 4 para la correcta colocación de la sonda en estómago.","Después de 2-3 minutos en el estómago, evacuar el líquido introducido mediante aspiración con la jeringa o bajando la sonda por debajo del estómago (método de sifón) permitiendo el drenaje del contenido por gravedad a una bolsa colectora. La cantidad evacuada debe ser aproximadamente igual a la instilada."],"a":2,"e":"La posición gástrica se confirma con un pH ÁCIDO, ≤ 4 (no «mayor de 4»), y la auscultación de aire no es un método fiable. El resto del procedimiento es correcto: medir la sonda, lubricar con lubricante hidrosoluble y evacuar por aspiración o sifón un volumen similar al instilado."},{"id":260,"ex":"Canarias batería preguntas B · 2023","s":"ostom","q":"Elige la opción INCORRECTA. Las patologías más frecuentes para la realización de una ostomía digestiva son:","o":["Paraplejias.","Enfermedad de Hirschprung.","Enfermedad de Crohn.","Colitis ulcerosa."],"a":0,"e":"Las causas más frecuentes de ostomía digestiva son el cáncer colorrectal, la enfermedad inflamatoria intestinal (Crohn, colitis ulcerosa), la diverticulitis complicada y, en niños, malformaciones como el Hirschsprung. La paraplejía no es una causa frecuente."},{"id":261,"ex":"Canarias batería preguntas B · 2023","s":"ostom","q":"En el cuidado del estoma, ¿ qué NO se debe hacer en el cambio de dispositivo?:","o":["La placa puede permanecer hasta 3-4 días adherida a la piel, dependiendo de las fugas y las necesidades del paciente.","Limpiar el estoma con gasas, toallitas o esponja con agua y jabón (no utilizar toallitas con cremas o alcohol) SIN FRICCIONAR.","Medir el diámetro del estoma con una plantilla que también nos indicará la forma. Es conveniente realizar la medición una vez al mes y si existe edema cada 24 horas ya que el estoma va modificándose.","Elección del dispositivo, en el postoperatorio lo ideal es un dispositivo de dos piezas transparente que permita visualizar y acceder al estoma cada vez que sea necesario."],"a":2,"e":"En las primeras semanas el estoma se reduce a medida que cede el edema, por eso hay que medirlo con la plantilla en CADA cambio durante las 6-8 primeras semanas, no una vez al mes. El resto es correcto: placa hasta 3-4 días, limpiar sin frotar y usar un dispositivo de dos piezas transparente en el postoperatorio."},{"id":262,"ex":"Canarias batería preguntas B · 2023","s":"valor","q":"Elige opción INCORRECTA. En la actuación inicial ante una hemorragia digestiva alta en pacientes con estabilidad hemodinámica: pérdidas del 10-20 % del volumen circulante (500-1000 ml), requiere terapéutica y vigilancia ordinarias:","o":["Sonda nasogátrica.","Determinación de la TA cada 2-4 h. al ingreso y cada 6-8 horas posteriormente.","Enema cada 12 horas (color heces).","2.000-2.500 ml/ días i.v. (mitad fisiológico y mitad glucosado al 5-10%). 20-50 meq/días de ClK."],"a":3,"e":"En la HDA con estabilidad hemodinámica se coloca SNG si procede, se controlan la TA y las heces y se mantiene una sueroterapia de mantenimiento. Según la clave, la pauta de líquidos propuesta (2.000-2.500 ml/día con ClK) es la incorrecta para este protocolo. La idea general: reponer con prudencia y vigilar los signos de resangrado.","f":"Pregunta basada en un protocolo concreto (Canarias): la opción considerada incorrecta (sueroterapia) es difícil de razonar sin ese documento. Conviene revisar."},{"id":263,"ex":"Canarias batería preguntas B · 2023","s":"sondas","q":"En el tratamiento de la hemorragias digestivas altas, ¿ Cuál es la sonda nasogástrica para realizar el taponamiento con balón?:","o":["Sonda de Sengstaken-Blakemore o de Minnesota.","Sonda Levin.","Sonda Andersen.","Sonda Salem."],"a":0,"e":"Las sondas de taponamiento con balón para la hemorragia por varices son la Sengstaken-Blakemore (3 vías, 2 balones) y la Minnesota (4 vías, 2 balones); para las varices fúndicas, la Linton-Nachlas (1 balón gástrico). Levin, Salem y Andersen no tienen balones de compresión."},{"id":264,"ex":"Canarias batería preguntas B · 2023","s":"valor","q":"Elige la opción INCORRECTA: ¿Cuál es la actuación ante un paciente con una hemorragia digestiva baja grave?:","o":["Colocación de 2 vías periféricas de calibre grueso que permitan una reposición rápida de la volemia o transfusión si es preciso.","Dieta absoluta las primeras 24 h; si el paciente se mantiene estable, puede iniciarse la solución evacuante para la colonoscopia.","Reposición de la volemia. Se utilizarán cristaloides (suero fisiológico). Se recomienda la administración de un bolo inicial de 250 a 500 ml en presencia de signos de hipovolemia.","Analítica urgente que incluya hemograma, coagulación, función renal y hepática."],"a":2,"e":"Ante una HDB grave: dos vías periféricas gruesas, analítica urgente (hemograma, coagulación, función renal y hepática), dieta absoluta y reposición de volumen con cristaloides. La clave considera incorrecta la pauta de reposición de la opción 3 según el protocolo de referencia; retén la secuencia general: estabilizar, analizar y localizar el sangrado con colonoscopia.","f":"Pregunta de protocolo (Canarias): lo que hace incorrecta la opción 3 no se deduce con claridad del temario general. Revisar."},{"id":265,"ex":"Canarias batería preguntas C · 2023","s":"boca","q":"¿De qué depende la eficacia de la higiene oral?:","o":["Del compuesto que se utilice.","De la concentración de flúor.","Del tiempo que la pasta permanece en la boca (debe ser superior a un minuto).","Todas son correctas."],"a":3,"e":"La eficacia de la higiene oral depende del compuesto de la pasta, de su concentración de flúor (1.000-1.450 ppm en adultos) y del tiempo de contacto: se recomienda cepillar unos 2 minutos y escupir sin enjuagar con abundante agua, para que el flúor actúe.","ns":1},{"id":266,"ex":"EFyC Galicia · 2024","s":"boca","q":"Acudes a realizar una visita domiciliaria a José de 88 años, con deterioro cognitivo moderado y limitación importante de la movilidad. Pasa la mayor parte del tiempo en la cama, levantándose unas dos horas al sofá, coincidiendo con las comidas principales. Vive con su hija Carmen, cuidadora principal. Durante la valoración del patrón nutricional-metabólico su hija te comenta que cuando le da de comer en ocasiones se atraganta debido a su disfagia. Para prevenir el riesgo de aspiración le recomiendas:","o":["Dar pequeñas tomas frecuentes de líquidos.","Uso de la flexión cervical anterior como estrategia postural.","Incluir en la dieta alimentos con texturas mixtas como la sopa con pasta.","El uso de alimentación enteral con sonda nasogástrica."],"a":1,"e":"La flexión cervical anterior («barbilla al pecho») estrecha la entrada de la vía aérea y protege frente a la aspiración: es la maniobra postural básica. Las texturas mixtas (sopa con pasta) están contraindicadas, los líquidos finos sin espesar aumentan el riesgo y la SNG no es la primera opción."},{"id":267,"ex":"EFyC Galicia · 2024","s":"intestino","q":"José, de 50 años, ha sido incluido en el Programa gallego de detección precoz del cáncer colorrectal. Tras dar un resultado anómalo en el test de sangre oculta en heces se le realizó una colonoscopia diagnóstica, siendo esta normal (no se observaron lesiones con sospecha de malignidad). ¿Cuándo se tendrá que repetir nuevamente el cribado a José?:","o":["El cribado se realizará mediante test de sangre oculta en heces a los 1O años.","El cribado se realizará cada dos años hasta que cumpla 70 años.","El cribado se realizará mediante colonoscopia a los 1O años, dados los antecedentes del paciente.","No precisa repetir el cribado ya que el resultado de la colonoscopia es normal."],"a":0,"e":"Si el FIT es positivo pero la colonoscopia es normal (sin lesiones), el riesgo es bajo. Según el programa gallego, la persona sale temporalmente del cribado y vuelve a ser invitada con test de sangre oculta pasados 10 años, si sigue en la edad diana. No se pasa a colonoscopias periódicas."},{"id":268,"ex":"EFyC Galicia · 2024","s":"ostom","q":"Juan es un paciente portador de una ileostomía. ¿Cuál de las siguientes recomendaciones sobre su cuidado es incorrecta?:","o":["Tomar la fruta pelada, madura y sin semillas.","Beber abundantes líquidos, preferentemente fuera de las comidas.","La bolsa recolectora debe vaciarse a los dos tercios de su capacidad.","Puede ducharse, con o sin bolsa."],"a":2,"e":"La bolsa de ileostomía se vacía cuando está a 1/3 o, como mucho, a la mitad de su capacidad (cada 4-6 horas). Si se deja llegar a 2/3, el peso puede despegar la placa y causar fugas e irritación. Las demás recomendaciones son correctas."},{"id":269,"ex":"EFyC Galicia · 2024","s":"ostom","q":"Carmen es una paciente inmovilizada, con deterioro cognitivo grave, que acaba de ser dada de alta del hospital tras colocarle una sonda tipo PEG. Durante la visita, explicas a su hija los cuidados y manejo de la sonda PEG. Respecto a la administración de medicación no está indicado:","o":["Lavar la sonda con 5cc de agua después de administrar cada fármaco.","Los fármacos triturados se diluirán en 10-15 cc de agua para su administración.","Los fármacos de liberación retardada se administrarán de primeros y siempre diluidos.","Evitar administrar los medicamentos mezclados con la alimentación."],"a":2,"e":"Los fármacos de liberación retardada (y los de cubierta entérica, sublinguales o efervescentes) NO deben triturarse ni administrarse por sonda: se pierde su efecto o se produce toxicidad. Se busca una presentación líquida o una alternativa. Los demás cuidados son correctos."},{"id":270,"ex":"EFyC Galicia · 2024","s":"estom","q":"Cristina lleva semanas  con dispepsia y epigastralgias. Su médico le ha solicitado una prueba de heces para analizar la presencia de la bacteria Helicobacter pylori. En relación a las recomendaciones para la recogida de heces y preparación previa, señale el enunciado correcto:","o":["No debe tomar inhibidores de la bomba de protones al menos 7 días antes de la prueba.","Debe evitar tomar antibióticos como mínimo 14 días antes de realizar la prueba.","Puede seguir tomando hidróxido de aluminio porque no interfiere en los resultados de la prueba.","Se debe recoger una muestra de heces del tamaño de una nuez y guardarla refrigerada en la nevera un máximo de 2 horas."],"a":2,"e":"Los antiácidos (hidróxido de aluminio o magnesio) no interfieren en las pruebas de H. pylori y pueden usarse para controlar los síntomas. En cambio, los IBP deben suspenderse al menos 2 semanas antes, y los antibióticos y el bismuto, 4 semanas antes."},{"id":271,"ex":"EFyC Galicia · 2024","s":"boca","q":"Luisa acude a su consulta a un control de salud. Refiere que en las últimas semanas sufre de pirosis asociada a episodios de regurgitación. ¿Cuál de las siguientes indicaciones no le daría a Luisa?:","o":["Realizar comidas ricas en proteínas .","Evitar el chocolate y la menta.","Dormir sobre el lado derecho.","Consumir chicles."],"a":2,"e":"En la ERGE se desaconseja dormir sobre el lado DERECHO, porque favorece el reflujo (el decúbito lateral izquierdo lo reduce). Sí se aconsejan comidas ricas en proteínas (aumentan el tono del EEI), evitar chocolate y menta, y el chicle, que aumenta la saliva y el aclaramiento esofágico."},{"id":272,"ex":"Islas Baleares - 2º llamamiento · 2023","s":"bilipan","q":"¿Cuál es la causa más frecuente de la pancreatitis aguda entre las mujeres?:","o":["Litiasis vesicular.","Alcoholismo.","Factores hereditarios.","Idiopática."],"a":0,"e":"La litiasis biliar es la primera causa de pancreatitis aguda en nuestro medio y es especialmente predominante en mujeres (los cálculos son más frecuentes en ellas). El alcohol, la segunda causa, es más frecuente en varones."},{"id":273,"ex":"La Rioja · 2024","s":"higado","q":"¿Cuáles son los síntomas que pueden ocasionar las varices esofágicas?:","o":["Vómitos en posos de café y hematemesis indolora masiva.","Melenas y dolor articular.","Vómitos en posos de café y migraña.","Hipertensión."],"a":0,"e":"Las varices esofágicas suelen ser asintomáticas hasta que se rompen: entonces causan una hemorragia digestiva alta masiva e indolora, con hematemesis (roja o en «posos de café») y melenas, con riesgo de shock. No se asocian a dolor articular ni a hipertensión arterial."},{"id":274,"ex":"La Rioja · 2024","s":"boca","q":"Las glándulas salivares drenan la saliva a través de distintos conductos, las glándulas parótidas lo hacen a través del conducto:","o":["Conducto de Stenon.","Conducto de Wharton.","Conducto de Rivinus.","Ninguna respuesta es correcta."],"a":0,"e":"Parótida → conducto de STENON (se abre frente al segundo molar superior). Submandibular → conducto de WHARTON (junto al frenillo lingual). Sublingual → conductos de RIVINUS.","ns":1},{"id":275,"ex":"La Rioja - 2º llamamiento · 2024","s":"boca","q":"La enfermedad más prevalente de la cavidad oral es:","o":["Gingivitis.","Periodontitis.","Caries.","Absceso peribucal."],"a":2,"e":"La caries es la enfermedad más prevalente de la cavidad oral (y una de las más prevalentes del mundo). Se debe a la fermentación bacteriana de los azúcares, que produce ácidos que desmineralizan el esmalte. Le siguen la gingivitis y la periodontitis."},{"id":276,"ex":"La Rioja - 2º llamamiento · 2024","s":"bilipan","q":"Definimos colecistitis aguda como:","o":["Presencia de litiasis en la vesícula biliar.","Es la inflamación aguda de la vesícula biliar.","Es la presencia de cálculos en la vía biliar principal.","Es la presencia de litiasis en el páncreas."],"a":1,"e":"La colecistitis aguda es la inflamación aguda de la pared de la vesícula biliar, casi siempre por un cálculo que obstruye el conducto cístico. La presencia de cálculos en la vesícula es colelitiasis y en el colédoco, coledocolitiasis."},{"id":277,"ex":"Navarra · 2024","s":"sondas","q":"De los siguientes tipos de sondas, ¿cuál es la indicada para la compresión de las varices esofágicas sangrantes?:","o":["Salem.","Sengstaken-Blakemore.","Miller-Abbot.","Levin."],"a":1,"e":"La Sengstaken-Blakemore es la sonda de taponamiento para las varices esofágicas sangrantes: el balón gástrico se ancla en el cardias y el esofágico comprime las varices. Salem y Levin son nasogástricas de aspiración o alimentación y la Miller-Abbott es nasoentérica."},{"id":278,"ex":"Navarra · 2024","s":"ostom","q":"Las heces que se expulsan por una cecostomía son:","o":["No se expulsan heces.","Semisólidas y escasas.","Líquidas y continuas.","Sólidas."],"a":2,"e":"La cecostomía aboca el ciego, el primer tramo del intestino grueso, antes de que el colon absorba el agua: las heces son LÍQUIDAS, continuas y muy irritantes para la piel."},{"id":279,"ex":"Hospital General de Valencia · 2024","s":"sondas","q":"¿De cuántas luces se compone la sonda Sengstaken-Blakemore?:","o":["De dos luces.","De cuatro luces.","De seis luces.","De ocho luces."],"a":1,"e":"Según el manual, la Sengstaken-Blakemore tiene 3 vías (aspiración gástrica, balón gástrico y balón esofágico) y la de Minnesota, 4 (añade la aspiración esofágica). El tribunal dio por buena «cuatro luces», probablemente contando la Sengstaken modificada. En tu examen: Sengstaken = 3 vías y 2 balones; Minnesota = 4 vías.","f":"Discrepancia con el manual: la Sengstaken-Blakemore tiene TRES vías; la de cuatro es la Minnesota. La opción correcta (3) no aparece entre las respuestas. Revisar o anular en el juego."},{"id":280,"ex":"SESPA · 2024","s":"higado","q":"En relación con la esteatosis hepática metabólica (Ehmet), señale la respuesta incorrecta:","o":["Es una enfermedad clínicamente heterogénea que cursa con la acumulación de grasa en el hígado.","Dentro de los factores de riesgo de mayor influencia para desarrollar una EHmet se encuentran la obesidad y el síndrome metabólico.","Las modificaciones en la dieta y el estilo de vida son el pilar del tratamiento fundamental de esta enfermedad.","Dentro de las recomendaciones dietéticas se encuentran elevar el consumo de grasas saturadas y el consumo moderado de alcohol."],"a":3,"e":"En la esteatosis hepática metabólica se recomienda REDUCIR las grasas saturadas, los azúcares y el alcohol (lo ideal es la abstinencia), con dieta mediterránea, ejercicio y pérdida de peso, que son el pilar del tratamiento. La obesidad y el síndrome metabólico son sus principales factores de riesgo."},{"id":281,"ex":"SESPA · 2024","s":"ostom","q":"En relación con los pasos a seguir para el cambio de dispositivo de ostomía, señale la opción incorrecta:","o":["Despegar el dispositivo con delicadeza, de arriba a abajo, sujetando la piel con la otra mano para evitar dermatitis traumáticas.","Lavado con agua tibia, jabón y esponja suave (no es necesario limpiar con suero). No usar alcohol ni desinfectantes sobre el estoma.","Secar con secador y rasurar si hay vello en la zona de colocación del dispositivo.","Se recomienda al paciente con colostomía o ileostomía que el cambio de dispositivo lo realice en ayunas o lo realice tras 1 hora y media desde la ingesta de comida."],"a":2,"e":"La piel periestomal se seca suavemente con toalla o pañuelo de papel, NO con secador, y el vello se corta (sin cuchilla) para no causar foliculitis. Se despega de arriba abajo, sujetando la piel, se lava con agua tibia y jabón neutro y el cambio se hace en ayunas o 1,5 h después de comer."},{"id":282,"ex":"SESPA · 2024","s":"bilipan","q":"En relación con la colangitis aguda, ¿cómo se denomina la triada que se caracteriza por las manifestaciones clínicas de dolor abdominal, ictericia y fiebre?:","o":["Triada de Virchow.","Triada de Charcot.","Triada de Beck.","Triada de Herbst."],"a":1,"e":"La tríada de Charcot (dolor, fiebre e ictericia) define la colangitis aguda; si se añaden shock y confusión es la pentada de Reynolds. La tríada de Virchow explica la trombosis y la de Beck, el taponamiento cardiaco."},{"id":283,"ex":"Castilla - La Mancha · 2024","s":"ostom","q":"Manuel es un paciente que acude a nuestra consulta de enfermería, al cual ha colocado recientemente un estoma de eliminación. En la educación al paciente, le informaremos que en función de la localización del estoma, no es previsible que las heces sean:","o":["Ileostomía: líquidas e irritativas.","Colon ascendente: líquidas e irritativas.","Cecostomía: líquidas no irritativas.","Sigmoidostomía: heces formadas y olorosas."],"a":2,"e":"La cecostomía produce heces líquidas y MUY irritantes, no «no irritativas»: es la más proximal del colon y el efluente aún lleva enzimas. Las demás son correctas: ileostomía y colon ascendente dan heces líquidas e irritantes; la sigmoidostomía, heces formadas y con olor."},{"id":284,"ex":"Castilla - La Mancha · 2024","s":"bilipan","q":"En un paciente que ingresa en planta después de una cirugía biliar con un drenaje en T o de Kehr, cual de estas intervenciones de Enfermería NO sería correcta:","o":["Valorar cantidad, color y consistencia del liquido drenado según pauta médica.","Conservar la bolsa de drenaje a nivel del Kehr.","Inspeccionar la piel alrededor del sitio de inserción de la sonda para buscar signos de inflamación, enrojecimiento, hinchazón o fuga de bilis","Identificar drenaje fétido y purulento que indique infección."],"a":1,"e":"La bolsa del drenaje de Kehr debe quedar POR DEBAJO del nivel de inserción (en declive), nunca a su altura o por encima: así se favorece el drenaje por gravedad y se evita el reflujo de bilis, que podría causar infección. Se registra el débito, se cuida la piel y se vigilan los signos de infección."},{"id":285,"ex":"Castilla - La Mancha - Llamamiento extraordinario · 2024","s":"bilipan","q":"¿Cuál de los siguientes signos o síntomas no aparecen en la Triada de Charcot, característica de la colangitis aguda?:","o":["Náuseas y vómitos.","Dolor abdominal.","Fiebre.","Ictericia."],"a":0,"e":"La tríada de Charcot de la colangitis es dolor abdominal (hipocondrio derecho, tipo cólico), fiebre (a menudo con escalofríos) e ictericia. Las náuseas y los vómitos pueden aparecer, pero no forman parte de la tríada."},{"id":286,"ex":"Castilla - La Mancha - Llamamiento extraordinario · 2024","s":"higado","q":"Entre las diferentes circunstancias que pueden precipitar un episodio de encefalopatía hepática y por lo tanto provocar una alteración mental en pacientes con insuficiencia hepatocelular no se encuentran:","o":["Estreñimiento o diarrea.","Insuficiencia renal.","Deshidratación.","Hemorragia digestiva."],"a":null,"e":"Pregunta ANULADA: todas las opciones SON desencadenantes de encefalopatía hepática, así que ninguna respuesta era válida. Precipitantes clásicos: hemorragia digestiva, estreñimiento, infecciones, deshidratación o diarrea, alteraciones electrolíticas, insuficiencia renal y sedantes (benzodiacepinas).","st":"N"},{"id":287,"ex":"Cataluña · 2024","s":"boca","q":"Una vez estabilizado, se decide que Enric inicie tolerancia oral. La enfermera le hace el test de disfagia, Método de Exploración Clínica Volumen-Viscosidad (MECV-V), para determinar el tipo de dieta que podrá ingerir. En cuanto a la disfagia orofaríngea, ¿cuáles son los signos clínicos relacionados con la alteración de la eficacia?:","o":["Cambio de voz, disminución de la saturación de oxígeno, tos.","Sello labial insuficiente, residuos orales, deglución fraccionada, residuos faríngeos.","Cambio de voz, sello labial insuficiente, deglución fraccionada, tos.","Sello labial insuficiente, disminución de la saturación de oxígeno, deglución fraccionada, tos."],"a":1,"e":"En el MECV-V se distinguen dos tipos de signos. EFICACIA: sello labial insuficiente, residuo oral o faríngeo y deglución fraccionada (comprometen la nutrición y la hidratación). SEGURIDAD: tos, cambio de voz y desaturación ≥ 3% (riesgo de aspiración)."},{"id":288,"ex":"Aragón · 2024","s":"intestino","q":"Según el vigente Programa de detección precoz de cáncer colorrectal del Gobierno de Aragón, es un criterio de indicación, de cribado poblacional:","o":["Hombres y mujeres entre 50 y 59 años con antecedentes familiares de la enfermedad.","Hombres y mujeres entre 50 y 69 años con historial previo de cáncer colorrectal.","Hombres y mujeres entre 45 y 59 años en los que no existen antecedentes de la enfermedad.","Hombres y mujeres entre 50 y 69 años en los que no existen antecedentes de la enfermedad."],"a":3,"e":"El cribado POBLACIONAL va dirigido a hombres y mujeres de 50 a 69 años SIN antecedentes ni síntomas (riesgo medio). Quien tiene antecedentes personales o familiares de CCR es de riesgo elevado y sigue otro circuito, con colonoscopias."},{"id":289,"ex":"Aragón · 2024","s":"sondas","q":"Indique cuál de las siguientes sondas NO está indicada en el lavado gástrico en un adulto:","o":["Sonda Levin.","Sonda Faucher.","Sonda Sengstaken-Blakemore.","Sonda Salem."],"a":2,"e":"La Sengstaken-Blakemore es una sonda de taponamiento con balones para la hemorragia por varices esofágicas, no para el lavado gástrico. Para lavar se usan Faucher/Ewald (orogástricas gruesas) o, según la clave, Levin y Salem."},{"id":290,"ex":"Andalucía Aplazado · 2024","s":"sondas","q":"¿Cuál de las siguientes afirmaciones NO ES CORRECTA si realizamos un lavado gástrico a un paciente por ingesta de sustancias tóxicas?:","o":["Invitar al paciente a colocarse en posición sentada para la inserción del catéter.","Colocar al paciente en posición de decúbito lateral izquierdo y Trendelemburg para realizar el lavado gástrico.","Está indicado realizar el lavado gástrico hasta 6-8 horas posterior a la ingesta de fármacos como AAS, anticolinérgicos o narcóticos.","Si se dispone de un antídoto para el tóxico, mezclarlo con carbón activado potencia el efecto."],"a":3,"e":"El carbón activado ADSORBE el antídoto oral y lo inactiva, así que no se mezclan: se elige uno u otro según el tóxico. Sí son correctos el decúbito lateral izquierdo con Trendelenburg durante el lavado y que con tóxicos que retrasan el vaciamiento (AAS, anticolinérgicos, opiáceos) se pueda lavar más tarde."},{"id":291,"ex":"Aragón - Llamamiento excepcional · 2024","s":"sondas","q":"Indique cuál de las siguientes sondas NO está indicada en el lavado gástrico en un adulto:","o":["Sonda Levin.","Sonda Faucher.","Sonda Sengstaken-Blakemore.","Sonda Salem."],"a":2,"e":"La Sengstaken-Blakemore tiene balones para comprimir varices esofágicas sangrantes; no está indicada para el lavado gástrico. Para el lavado se usan sondas de una o dos luces (Levin, Salem) o, mejor, orogástricas gruesas (Faucher)."},{"id":292,"ex":"Aragón - Llamamiento excepcional · 2024","s":"ostom","q":"Dentro de las recomendaciones generales a una persona con ostomía, indique la correcta:","o":["Tratar de hacer 3 comidas durante el día evitando las comidas copiosas y periodos prolongados sin ingesta.","Mantener horarios regulares creando una rutina.","Tomar de 8 a 10 vasos de líquidos al día (aproximadamente 2 litros), preferiblemente a la hora de las comidas.","Tomar bebidas carbonatadas."],"a":1,"e":"Mantener horarios regulares ayuda a regular el ritmo intestinal y la salida de heces por el estoma. Se aconsejan 5-6 comidas pequeñas (no 3), unos 2 litros de líquido preferentemente FUERA de las comidas, y evitar las bebidas con gas, que producen gases."},{"id":293,"ex":"Cantabria · 2024","s":"estom","q":"¿Cuál de las siguientes es una causa de déficit de vitamina B12?:","o":["Consumo insuficiente por dietas vegetarianas estrictas.","Déficit de absorción.","Ausencia de factor intrínseco.","Todas son causas de déficit de vitamina B12."],"a":3,"e":"Todas son causas de déficit de B12: falta de aporte (dieta vegana estricta, porque la B12 está en alimentos de origen animal), ausencia de factor intrínseco (anemia perniciosa, gastrectomía) y malabsorción (resección ileal, Crohn ileal, SIBO, metformina, IBP crónicos).","ns":1},{"id":294,"ex":"Aragón Comunitaria · 2025","s":"bilipan","q":"La triada de Charcot (fiebre, ictericia y dolor en hipocondrio derecho) es característica de:","o":["Colecistitis aguda.","Colangitis aguda.","Pancreatitis aguda.","Hepatitis aguda."],"a":1,"e":"Fiebre, ictericia y dolor en hipocondrio derecho = tríada de Charcot = colangitis aguda (infección de la vía biliar por obstrucción del colédoco). Si se añaden shock y confusión, es la pentada de Reynolds."},{"id":295,"ex":"Aragón Comunitaria · 2025","s":"ostom","q":"¿Cuál es el cuidado más importante en una ostomía?:","o":["Cambiar la bolsa frecuentemente.","Irrigar el estoma constantemente.","Aplicar polvos cicatrizantes.","Vigilar la piel periestomal."],"a":3,"e":"Vigilar y proteger la piel periestomal es el cuidado más importante: la dermatitis por contacto con el efluente es la complicación más frecuente y dificulta la adherencia del dispositivo. La bolsa se cambia solo cuando es necesario y la irrigación se reserva para colostomías distales seleccionadas."},{"id":296,"ex":"Comunidad de Madrid · 2025","s":"ostom","q":"Características de las heces en ostomías localizadas en colon sigmoideo:","o":["Líquidas e irritativas.","Semiformadas.","Sólidas y no irritativas.","Todas son falsas."],"a":2,"e":"En la colostomía sigmoidea el colon ya ha absorbido el agua: las heces son SÓLIDAS (formadas) y poco irritantes, y la evacuación es similar a la normal. Por eso estas colostomías admiten irrigación y bolsas cerradas.","ns":1},{"id":297,"ex":"Comunidad de Madrid · 2025","s":"estom","q":"La inflamación de la mucosa del estómago de aparición aguda y rápida y cuyo diagnóstico se realiza con una biopsia es:","o":["Gastritis.","Cáncer de estómago.","Colitis ulcerosa.","Enfermedad de Crohn."],"a":0,"e":"La gastritis aguda es una inflamación de la mucosa gástrica de aparición rápida (AINE, alcohol, H. pylori, estrés). Su diagnóstico definitivo es la biopsia obtenida por endoscopia, y el tratamiento se basa en reducir la acidez con IBP."},{"id":298,"ex":"Comunidad de Madrid · 2025","s":"estom","q":"En las dietas tras una resección gástrica debemos, seleccione una:","o":["Beber los líquidos separados de la comida.","Suplementar con Vitamina B12.","Evitar temperaturas extremas en los alimentos.","Todas las opciones son correctas."],"a":3,"e":"Tras una gastrectomía: líquidos separados de las comidas (prevenir el dumping), suplemento de B12 (por falta de factor intrínseco) y evitar temperaturas extremas, además de comidas pequeñas y frecuentes, masticar bien y limitar los azúcares simples. Todas son correctas.","ns":1},{"id":299,"ex":"Enfermería Defensa · 2025","s":"bilipan","q":"La colangiopancreatografía retrógrada endoscópica (CPRE) es una prueba invasiva que se utiliza en endoscopia y radioscopia para:","o":["Diagnóstico y tratamiento de enfermedades del árbol biliar.","Diagnóstico y tratamiento de enfermedades del parénquima hepático.","Diagnóstico y tratamiento de metástasis extra biliares.","Para toma de muestras de bilis para su estudio microbiológico."],"a":0,"e":"La CPRE (colangiopancreatografía retrógrada endoscópica) introduce contraste en la vía biliar y el conducto pancreático a través de la papila de Vater. Es diagnóstica y TERAPÉUTICA: extrae cálculos del colédoco (esfinterotomía), coloca prótesis, dilata estenosis y toma biopsias."},{"id":300,"ex":"Enfermería Defensa · 2025","s":"intestino","q":"Respecto a la enfermedad inflamatoria intestinal, es cierto que:","o":["La enfermedad de Crohn afecta fundamentalmente a la mucosa del colon y casi constantemente al recto.","Las fisuras anales son la manifestación perianal menos frecuente en la enfermedad de Crohn.","La colitis ulcerosa se caracteriza por una inflamación transmural y segmentaria que puede afectar a cualquier porción del tracto gastrointestinal.","Las principales manifestaciones de la colitis ulcerosa son la diarrea con sangre y moco, la urgencia defecatoria y el dolor abdominal."],"a":3,"e":"La colitis ulcerosa se manifiesta con diarrea con sangre y moco, urgencia defecatoria, tenesmo y dolor abdominal. Las opciones 1 y 3 intercambian rasgos con el Crohn (que es el transmural y segmentario) y en el Crohn las fisuras anales son de hecho la manifestación perianal MÁS frecuente."},{"id":301,"ex":"Enfermería Defensa · 2025","s":"ostom","q":"Un estoma de eliminación tipo ileostomía se caracteriza por:","o":["Está localizado en el cuadrante inferior derecho del abdomen.","Evalúa heces pastosas o semiformadas.","La frecuencia de evacuación es de 1 o 2 veces al día.","Está indicada en caso de prolapso rectal irreparable."],"a":0,"e":"La ileostomía se suele situar en el cuadrante inferior derecho (íleon terminal), con heces líquidas o pastosas y continuas (no 1-2 veces al día). Se indica en la colitis ulcerosa, el Crohn, la poliposis o como protección de anastomosis; el prolapso rectal irreparable se trata con colostomía."},{"id":302,"ex":"Enfermería Defensa · 2025","s":"anat","q":"La arteria esplénica es rama de:","o":["La arteria mesentérica inferior.","La arteria cólica media.","El tronco celíaco.","Es una rama de la arteria esofágica inferior."],"a":2,"e":"La arteria esplénica es una de las tres ramas del tronco celíaco, junto con la gástrica izquierda y la hepática común. Irriga el bazo y parte del páncreas y del estómago (vasos cortos y gastroepiploica izquierda)."},{"id":303,"ex":"SAS Generalistas · 2025","s":"ostom","q":"¿En qué tipo de ostomía fluyen heces sólidas?:","o":["En colostomía descendente.","En colostomía derecha.","En colostomía transversa.","En todos los tipos de colostomías."],"a":0,"e":"Cuanto más distal es la colostomía, más sólidas son las heces. Entre las opciones, la descendente es la más distal y la única que da heces de consistencia formada (semiblandas a sólidas; la sigmoidea, plenamente sólidas). La derecha (ascendente) da heces semilíquidas y la transversa, blandas."},{"id":304,"ex":"SAS Generalistas · 2025","s":"sondas","q":"En el transcurso de los cuidados de la paciente, en una de las movilizaciones para el aseo diario, parece que se ha movilizado la sonda nasogástrica que tenía colocada y la enfermera decide volver a comprobar la correcta colocación de la misma en estómago para evitar complicaciones. Para ello, podría utilizar cualquiera de estos métodos de verificación de colocación de sonda nasogástrica, excepto uno que está claramente desaconsejado. Señale cuál NO está indicado:","o":["Auscultación del gorgoteo debajo del apéndice xifoides tras insuflación de aire.","Radiografía de abdomen superior / tórax inferior.","Capnografía.","Medición de pH del contenido gástrico, si el paciente no está en tratamiento con inhibidores de la bomba de protones."],"a":0,"e":"La auscultación del aire insuflado («whoosh») está claramente desaconsejada: no distingue estómago, esófago, pulmón o intestino. Son válidas la radiografía (método de referencia), el pH del aspirado (si no toma IBP) y la capnografía (detecta CO₂ si la sonda está en la vía aérea)."},{"id":305,"ex":"Hospital General Universitario de Valencia · 2025","s":"intestino","q":"La prueba de confirmación diagnóstica recomendada en el Programa de prevención del cáncer colorrectal de la Comunitat Valenciana es:","o":["El test de sangre oculta en heces.","La rectoscopia.","Marcadores tumorales.","La colonoscopia."],"a":3,"e":"El test de sangre oculta en heces es la prueba de CRIBADO; si es positivo, la prueba de CONFIRMACIÓN diagnóstica es la colonoscopia, que visualiza todo el colon, permite biopsiar y extirpar pólipos en el mismo acto."},{"id":306,"ex":"Hospital General Universitario de Valencia · 2025","s":"boca","q":"Ante un paciente con sospecha de disfagia, se debe observar si durante las comidas ocurre alguno de los siguientes síntomas en mayor o menor intensidad:","o":["Dificultad en la masticación.","Después de comer o beber tiene que carraspear la garganta para aclararla.","Tos nocturna.","Todas las respuestas son verdaderas."],"a":3,"e":"Son signos de alarma de disfagia la dificultad para masticar o formar el bolo, carraspear o toser al comer o beber (y después), cambios en la voz, el babeo, comer muy despacio, la tos nocturna por microaspiraciones, la pérdida de peso y las neumonías de repetición. Todas son correctas.","ns":1},{"id":307,"ex":"Hospital General Universitario de Valencia · 2025","s":"sondas","q":"De los siguientes usos en una sonda de alimentación y para prevenir la obstrucción de la misma, se debe infundir 30-60 ml de agua tibia directamente. Indique la respuesta incorrecta:","o":["Administración intermitente, antes y después de la infusión.","Administración continua, al cambiar el frasco.","Si la sonda no se utiliza, no es necesario.","En administración de fármacos antes y después de cada fármaco."],"a":2,"e":"Aunque la sonda NO se use, hay que lavarla periódicamente con agua (al menos una vez al día o cada 8 h, según el protocolo) para mantenerla permeable. También se lava antes y después de cada toma intermitente, al cambiar el frasco en la continua y antes y después de cada fármaco."},{"id":308,"ex":"Navarra · 2025","s":"boca","q":"Entre las recomendaciones para evitar el reflujo gastroesofágico (RGE) señale la respuesta correcta:","o":["Aumentar la cantidad de líquidos con las comidas.","Son recomendables situaciones que aumenten la presión intraabdominal.","Recomendaremos el consumo de alimentos que aumente la presión del Esfínter Esofágico Inferior (EEI).","Recomendaremos el consumo de alimentos que disminuyan la presión del EEI."],"a":2,"e":"En el RGE se recomiendan alimentos que AUMENTAN la presión del esfínter esofágico inferior: los proteicos (carne magra, pescado, huevo). Se evitan los que la reducen (grasas, chocolate, menta, café, alcohol), el exceso de líquido con las comidas y lo que sube la presión intraabdominal (fajas, obesidad, estreñimiento)."},{"id":309,"ex":"Navarra · 2025","s":"bilipan","q":"¿Cuál es el mecanismo fisiopatológico subyacente en la colecistitis aguda?:","o":["Inflamación del hígado debido a infecciones virales.","Obstrucción del conducto cístico por cálculos biliares, causando inflamación e infección.","Producción excesiva de bilis sin obstrucción del conducto biliar.","Degeneración del tejido pancreático por consumo excesivo de alcohol."],"a":1,"e":"La colecistitis aguda se produce casi siempre porque un cálculo obstruye el conducto CÍSTICO: la vesícula se distiende, se inflama y puede sobreinfectarse. Si el cálculo obstruye el colédoco, hablamos de coledocolitiasis, que puede complicarse con colangitis o pancreatitis."},{"id":310,"ex":"Navarra · 2025","s":"intestino","q":"El Programa de Prevención de Cáncer Colorrectal de Navarra está dirigido a:","o":["Mujeres y hombres residentes en Navarra, asintomáticos, con edades comprendidas entre 50 y 69 años.","Mujeres y hombres residentes en Navarra, asintomáticos, con edades comprendidas entre 45 y 70 años.","Mujeres y hombres residentes en Navarra, asintomáticos, con factores de riesgo o factores genéticos.","Mujeres y hombres residentes en Navarra, asintomáticos, con edades comprendidas entre 45 y 65 años."],"a":0,"e":"El programa navarro, como el resto, se dirige a hombres y mujeres asintomáticos de 50 a 69 años residentes en la comunidad. Las personas con factores de riesgo o genéticos se derivan a programas de alto riesgo con colonoscopia."},{"id":311,"ex":"Cantabria · 2025","s":"estom","q":"¿Cuál de los siguientes fármacos NO es utilizado en la erradicación del Helicobacter Pylori?:","o":["Amoxicilina.","Metronidazol.","Claritromicina.","Estreptomicina."],"a":3,"e":"Para erradicar H. pylori se usa la cuádruple terapia concomitante sin bismuto (OCAM: omeprazol + claritromicina + amoxicilina + metronidazol, 10-14 días) o, como alternativa, la cuádruple con bismuto (con tetraciclina) o la pauta con levofloxacino. La estreptomicina se usa en la tuberculosis, no en H. pylori."},{"id":312,"ex":"Cantabria · 2025","s":"sondas","q":"Tras estabilizar a un paciente politraumatizado en el Área de Urgencias, le indican que inserte una sonda nasogástrica de doble luz para aspiración de contenido gástrico. Este tipo de sonda se denomina:","o":["Salem.","Levin.","Foley.","Sengstaken-Blakemore."],"a":0,"e":"La Salem es la sonda nasogástrica de DOBLE luz: una luz para aspirar y otra de ventilación (con entrada de aire) que impide que la mucosa gástrica quede succionada. Es la de elección para la aspiración continua. La Levin tiene una sola luz."},{"id":313,"ex":"Cantabria · 2025","s":"bilipan","q":"La Triada de Charcot, se corresponde con la clínica de una patología de las vías biliares, ¿Con cuál?:","o":["Colecistitis aguda.","Colangitis aguda.","Colelitiasis.","Apendicitis aguda."],"a":1,"e":"La tríada de Charcot (dolor, fiebre e ictericia) corresponde a la colangitis aguda, la infección de la vía biliar por obstrucción del colédoco. La colecistitis se caracteriza por dolor en hipocondrio derecho, fiebre, leucocitosis y signo de Murphy."},{"id":314,"ex":"Cantabria - Aplazado · 2025","s":"sondas","q":"¿Cuál de las siguientes NO es un tipo de sonda para la administración de la alimentación enteral?:","o":["La sonda Levin.","La sonda tipo Freka.","La sonda Faucher.","La sonda de gastrostomía endoscópica percutánea."],"a":2,"e":"La Faucher es una sonda orogástrica gruesa para el LAVADO gástrico, no para nutrir. Levin, Freka (fina, de poliuretano, para nutrición enteral prolongada) y la PEG sí sirven para administrar alimentación enteral."},{"id":315,"ex":"Cantabria - Aplazado · 2025","s":"intestino","q":"La enfermedad de Crohn es un proceso inflamatorio que se caracteriza porque:","o":["La afectación es uniforme, produciendo lesiones continuas.","Afecta a cualquier tramo del tubo gastrointestinal.","Afecta únicamente a la mucosa superficial del colón.","Cursa generalmente con hemorragia rectal."],"a":1,"e":"La enfermedad de Crohn puede afectar a cualquier tramo del tubo digestivo, de la boca al ano, con lesiones segmentarias (no continuas) y transmurales. La afectación exclusiva de la mucosa del colon y la rectorragia habitual son propias de la colitis ulcerosa."},{"id":316,"ex":"Cantabria - Aplazado · 2025","s":"estom","q":"¿Cuál de las siguientes afirmaciones NO se corresponde con la úlcera duodenal?:","o":["Es una de las causas más frecuentes de hemorragia digestiva alta.","Se relaciona con el Helicobacter pylori.","Produce dolor epigástrico quemante.","El dolor no cede con la ingesta de alimentos."],"a":3,"e":"En la úlcera duodenal el dolor SÍ cede con la ingesta (y con los antiácidos): aparece 1,5-3 h después de comer y por la noche. Las demás son correctas: es causa frecuente de HDA, se relaciona con H. pylori (95%) y produce dolor epigástrico urente."},{"id":317,"ex":"Cantabria - Aplazado · 2025","s":"sondas","q":"De los siguientes tipos de sondas, ¿cúal es la indicada para la compresión de las varices esofágicas sangrantes?:","o":["Sengstaken-Blakemore.","Levin.","Miller - Abbot.","Salem."],"a":0,"e":"La Sengstaken-Blakemore comprime las varices esofágicas sangrantes con dos balones: el gástrico la ancla en el cardias y el esofágico comprime las varices. Es una medida temporal (máximo 24-48 h) mientras se realiza un tratamiento definitivo."},{"id":318,"ex":"SAS EFyC - Aplazado · 2025","s":"ostom","q":"Explica a la hija de Juan los resultados obtenidos en la valoración de la piel y los cuidados a realizar. Una vez terminado, usted se centra en mostrarle los cuidados que deberá adoptar con la sonda de gastrostomía. ¿Cuál de los siguientes cuidados NO le recomendaría?:","o":["Mantener la sonda limpia y seca.","Medir la longitud externa de la sonda para detectar posibles migraciones.","Girar la sonda a diario para evitar la fijación a la piel.","Comprobar el inflado del globo a diario y, en caso de pérdida, inflarlo con 7-10 ml de suero salino."],"a":3,"e":"El balón de la sonda de gastrostomía se comprueba cada 1-2 semanas (no a diario), aspirando su contenido, y se rellena con AGUA DESTILADA (5-10 ml), no con suero salino, que cristaliza y puede dañar la válvula. Mantener la sonda limpia y seca, medir la longitud externa y girarla a diario son cuidados correctos."},{"id":319,"ex":"SAS EFyC - Aplazado · 2025","s":"ostom","q":"La hija de Juan está muy preocupada porque no sabe si va a ser capaz de administrar la nutrición por la sonda con jeringa en bolos. Le explica detalladamente como se realiza la administración y le alerta que una de las principales complicaciones puede ser la obstrucción de la sonda. ¿Qué le recomendaría hacer para evitar una obstrucción?:","o":["Recomendaría el uso de una solución de bicarbonato sódico al 8,4% una vez al día.","Recomendaría la infusión con bebidas carbonatadas que contienen cola o enzimas pancreáticos al menos cada 2-3 días.","Recomendaría lavar con al menos 30 ml de agua potable antes de empezar y después de terminar la nutrición.","Recomendaría lavar con 100 ml de agua una vez al día después de la toma más abundante."],"a":2,"e":"La mejor prevención de la obstrucción es lavar con al menos 30 ml de agua antes y después de cada toma y de cada fármaco (y periódicamente si no se usa). Las bebidas de cola, el bicarbonato o las enzimas pancreáticas se reservan para intentar desobstruir, no se usan como rutina."},{"id":320,"ex":"SAS EFyC - Aplazado · 2025","s":"ostom","q":"Por último, usted explica que otra posible complicación es que la sonda se salga en algún momento de forma accidental. ¿Qué debería hacer en ese caso la cuidadora?:","o":["Si la salida ocurre en las 2-3 primeras semanas tras la colocación puede reintroducirse la sonda o una sonda tipo Foley del mismo calibre, fijándola con cinta adhesiva al abdomen, hasta que se coloque una nueva.","Si la salida ocurre en las 2-3 primeras semanas tras la colocación es necesario el traslado al hospital, ya que el trayecto fistuloso no habrá cicatrizado y puede crearse una falsa vía.","Introducir nuevamente la sonda independientemente del tiempo transcurrido desde su colocación. Lo importante es que no se cierre el estoma.","No puede hacer nada ya que se deberá realizar una nueva gastrostomía endoscópica."],"a":1,"e":"Si la sonda sale en las 2-3 primeras semanas, el trayecto fistuloso entre estómago y piel aún no ha madurado: reintroducirla puede crear una falsa vía hacia el peritoneo. Hay que acudir al hospital. Con el estoma ya maduro, se puede colocar una sonda (o una Foley) para que no se cierre hasta el recambio."},{"id":321,"ex":"La Rioja EFyC · 2025","s":"ostom","q":"¿Cuál de las siguientes respuestas se pueden considerar que son complicaciones del estoma?:","o":["Estoma congestivo, necrosado o pálido.","Enrojecimiento periestomal.","Prolapso del estoma.","Las respuestas a y c son correctas."],"a":3,"e":"Las alteraciones del propio estoma (congestivo, necrosado o pálido por isquemia, y el prolapso) son complicaciones del estoma. El enrojecimiento de la piel periestomal es una complicación CUTÁNEA, no del estoma en sí. Por eso la respuesta es «a y c».","ns":1},{"id":322,"ex":"SES Urgencias AP · 2025","s":"sondas","q":"¿Cuál NO es una contraindicación absoluta para la colocación de una sonda nasogástrica?:","o":["Disminución del nivel de conciencia.","Sospecha de rotura esofágica.","Fractura de huesos faciales.","Coagulopatía grave no controlada."],"a":0,"e":"La disminución del nivel de conciencia no contraindica de forma absoluta la SNG: lo que se hace es proteger primero la vía aérea (intubación) y después sondar. Sí son contraindicaciones la sospecha de rotura esofágica, las fracturas faciales (o de la base del cráneo, en las que se usa la vía oral) y la coagulopatía grave no controlada."},{"id":323,"ex":"SES Urgencias AP · 2025","s":"sondas","q":"Atendemos a un paciente que presenta sangrado activo por varices esofágicas. ¿Qué sonda estaría indicada en este caso?:","o":["Sonda Nelaton modificada.","Sonda Sengstaken-Blakemore.","Sonda Ewald o Edlich.","Sonda Fouchard."],"a":1,"e":"En el sangrado activo por varices esofágicas que no se controla con fármacos ni endoscopia se usa la sonda de Sengstaken-Blakemore (o la Minnesota) para el taponamiento con balón. Ewald y Foucher son para el lavado gástrico y la Nelaton es vesical."},{"id":324,"ex":"SES Urgencias AP · 2025","s":"agudo","q":"¿Qué indica el signo de Blumberg cuando es positivo?:","o":["Irritación peritoneal.","Inflamación hepática.","Derrame peritoneal.","Distensión vesical."],"a":0,"e":"El signo de Blumberg es el dolor a la descompresión brusca del abdomen (dolor de rebote): indica irritación PERITONEAL. En la fosa iliaca derecha es típico de la apendicitis aguda."},{"id":325,"ex":"SES Urgencias AP · 2025","s":"valor","q":"Durante la anamnesis, un paciente refiere realizar deposiciones de color negro, sin brillo y de consistencia no pegajosa. ¿Qué nos indica este hallazgo?:","o":["Melenas debido a un sangrado digestivo alto.","Melenas debido a un sangrado digestivo bajo.","Deposiciones secundarias a la toma de hierro, carbón activado o alimentos oscuros.","Deposiciones secundarias a un cuadro de ictericia obstructiva."],"a":2,"e":"Unas heces negras pero sin brillo, no pegajosas y sin el olor fétido característico no son melenas: suelen deberse al hierro oral, el bismuto, el carbón activado o alimentos oscuros (morcilla, regaliz, arándanos). La melena verdadera es brillante, pegajosa («alquitrán») y maloliente."},{"id":326,"ex":"SES Urgencias AP · 2025","s":"valor","q":"Una hemorragia digestiva localizada en el estómago, ¿cómo se clasifica?:","o":["Hemorragia digestiva alta.","Hemorragia digestiva media.","Hemorragia digestiva baja.","No se utiliza esa clasificación en las hemorragias digestivas."],"a":0,"e":"La hemorragia digestiva se clasifica en ALTA (por encima del ángulo de Treitz: esófago, estómago y duodeno) y BAJA (por debajo). Un sangrado gástrico es, por tanto, una HDA. Algunos autores hablan de hemorragia «media» para el intestino delgado, pero no es la clasificación clásica."},{"id":327,"ex":"SES Urgencias AP · 2025","s":"valor","q":"De las opciones que se nombran a continuación, ¿cuál es la principal causa de hemorragia digestiva baja?:","o":["Síndrome de Mallory-Weiss.","Varices esofágicas.","Hemorroides.","Gangrena de Fournier."],"a":2,"e":"De las opciones, las hemorroides son la causa más frecuente de sangrado bajo (son la primera causa de rectorragia, aunque si se excluye la patología anorrectal la primera causa de HDB es la diverticulosis). El Mallory-Weiss y las varices esofágicas producen HDA y la gangrena de Fournier es una infección perineal."},{"id":328,"ex":"SES EFyC · 2025","s":"ostom","q":"Con  relación  al  protocolo  de  ostomías,  en  un  primer  momento,  NO  es  criterio  de  derivación  al  médico  de referencia:","o":["Granulomas.","Lesiones pseudoverrugosas.","Varices periostomales.","Irritación grave de la piel o úlceras."],"a":0,"e":"Los granulomas periestomales son benignos y los trata enfermería (nitrato de plata, ajustar el dispositivo para evitar el roce): no requieren derivación inicial. Sí se derivan las lesiones pseudoverrugosas, las varices periestomales (hipertensión portal, riesgo de sangrado) y la irritación grave o las úlceras."},{"id":329,"ex":"Aragón DGA · 2024","s":"ostom","q":"La apertura artificial del intestino delgado a la pared abdominal, desembocando en un estoma o ano artificial, se denomina:","o":["Colostomía.","Ileostomía.","Urostomía.","Estoma urinario."],"a":1,"e":"La ileostomía aboca el ÍLEON (intestino delgado) a la pared abdominal. La colostomía aboca el colon y la urostomía, la vía urinaria."},{"id":330,"ex":"Aragón DGA · 2024","s":"boca","q":"En el cuidado de un paciente con problemas de deglución, NO está indicado:","o":["Usar pajitas para la ingestión de líquidos.","Vigilar que no acumule la comida en los laterales de la boca.","Mantener al paciente sentado como mínimo 15 minutos después de comer.","Crear un entorno tranquilo a la hora de la comida."],"a":0,"e":"Las pajitas están desaconsejadas en la disfagia: aumentan la velocidad y el volumen del bolo y se pierde el control, con más riesgo de aspiración. Sí se recomienda vigilar los restos en los laterales de la boca, mantenerle sentado al menos 15-30 minutos después de comer y un ambiente tranquilo, sin distracciones."},{"id":331,"ex":"Aragón DGA - Llamamiento extraordinario · 2024","s":"ostom","q":"Entre las indicaciones para una colostomía, señale la respuesta INCORRECTA:","o":["Cáncer rectal","Estreñimiento.","Lesiones de médula espinal.","Lesiones traumáticas anales."],"a":1,"e":"El estreñimiento no es indicación de colostomía (se trata con medidas higiénico-dietéticas y laxantes). Sí lo son el cáncer rectal, las lesiones traumáticas anales o perineales y algunas lesiones medulares con incontinencia o problemas de evacuación graves."},{"id":332,"ex":"Aragón DGA - Llamamiento extraordinario · 2024","s":"ostom","q":"Entre las indicaciones para una ileostomía NO se encuentra:","o":["Colitis ulcerosa.","Enfermedad de Crohn.","Cáncer de colon.","Diarrea."],"a":3,"e":"Indicaciones de ileostomía: colitis ulcerosa (proctocolectomía), Crohn, poliposis familiar, cáncer de colon (como protección de la anastomosis) y traumatismos. La diarrea no es una indicación; de hecho, es una complicación de la ileostomía (riesgo de deshidratación)."},{"id":333,"ex":"La Rioja · 2025","s":"sondas","q":"De las siguientes opciones, ¿cuál NO corresponde a una sonda digestiva?:","o":["De Moss.","Bomba aspiración de Salem.","Plummer.","De Bénique."],"a":3,"e":"La sonda de Bénique es un dilatador UROLÓGICO (uretral), no una sonda digestiva. La Moss es una sonda gastroduodenal de 3 luces, la Salem es nasogástrica de doble luz y la Plummer es digestiva, para dilatar estenosis esofágicas."},{"id":334,"ex":"La Rioja · 2025","s":"sondas","q":"En cuanto a la técnica de colocación de la sonda nasogástrica, previo a su introducción debemos:","o":["Colocar al paciente, si está consciente, en posición trendelemburg.","Mediante la técnica de Hansen determinaremos la cantidad de sonda a introducir: mediremos desde la punta de la nariz al lóbulo de la oreja y desde este hasta hipogastrio.","Comprobar que las fosas nasales son permeables, eligiendo el orificio por el que respire mejor.","Todas las respuestas anteriores son incorrectas."],"a":2,"e":"Antes de introducir la sonda se comprueba la permeabilidad de las fosas nasales (tapando una y expulsando aire por la otra) y se elige la más permeable. El paciente se coloca en Fowler (no Trendelenburg) y la medida NEX llega hasta el apéndice XIFOIDES, no hasta el hipogastrio.","ns":1},{"id":335,"ex":"Aragón · 2026","s":"agudo","q":"Entre las medidas generales en la atención al paciente con abdomen agudo se encuentran todas menos una. Indique la INCORRECTA:","o":["Sueroterapia y vigilancia de alteraciones electrolíticas.","Capnografía y control del dióxido de carbono.","Sondaje vesical y control estricto de la diuresis.","Colocación de sonda nasogástrica."],"a":1,"e":"Medidas generales en el abdomen agudo: dieta absoluta, vía venosa con sueroterapia y control electrolítico, SNG para descomprimir si hay vómitos u obstrucción, sondaje vesical con control de diuresis, analgesia pautada y preparación para cirugía. La capnografía no es una medida general en este cuadro."},{"id":336,"ex":"Aragón · 2026","s":"ostom","q":"Según la forma de exteriorización de la ostomía (doble boca), elija la técnica quirúrgica correcta:","o":["Cañón de escopeta o Paul Mikulicz.","En asa con barra de soporte.","Terminal simple.","Anastomosis en Y de Roux."],"a":0,"e":"La ostomía de doble boca (Paul-Mikulicz) secciona el intestino por completo y exterioriza los dos cabos juntos, en paralelo, por la misma incisión: el aspecto de «cañón de escopeta». En la ostomía en asa con varilla el intestino no se secciona por completo."},{"id":337,"ex":"Aragón · 2026","s":"intestino","q":"¿En qué consiste el Programa de detección precoz de cáncer colorrectal del Servicio Aragonés de Salud?:","o":["Este programa se basa en la realización de un test de sangre oculta en heces (TSOH) cada 2 años y se dirige a las personas residentes en Aragón con edades comprendidas entre los 50 y 69 años.","Este programa se basa en la realización de un test de sangre oculta en heces (TSOH) cada 3 años y se dirige a las personas residentes en Aragón con edades comprendidas entre los 50 y 69 años.","Este programa se basa en la realización de un test de sangre oculta en heces (TSOH) cada 2 años y se dirige a las personas residentes en Aragón con edades comprendidas entre los 55 y 75 años.","Este programa se basa en la realización de un test de sangre oculta en heces (TSOH) cada 3 años y se dirige a las personas residentes en Aragón con edades comprendidas entre los 55 y 75 años."],"a":0,"e":"El programa aragonés, como el estatal, ofrece un test de sangre oculta en heces cada 2 AÑOS a las personas de 50 a 69 años; si es positivo, se hace una colonoscopia."},{"id":338,"ex":"SES · 2026","s":"ostom","q":"Las complicaciones más frecuentes que las enfermeras pueden abordar con los medicamentos que se incluyen en el protocolo para la indicación uso y dispensación de medicamentos sujetos a prescripción médica para ostomías, son todas EXCEPTO:","o":["Alteraciones del tránsito intestinal.","Obstrucción o estenosis.","Granulomas.","Infecciones y otras dermatitis de etiología no infecciosa."],"a":1,"e":"El protocolo de indicación enfermera para ostomías permite tratar alteraciones del tránsito, granulomas, infecciones y dermatitis periestomales. La obstrucción o estenosis del estoma requiere valoración médica o quirúrgica, por lo que queda fuera de la indicación enfermera."},{"id":339,"ex":"SES · 2026","s":"boca","q":"Sara es enfermera de la planta de medicina interna. Tiene a su cargo un paciente con disfagia, sin alteraciones cognitivas ni de lenguaje y con actividad muscular conservada. Si le indica “que ponga la lengua entre los dientes, trague y note un tirón en el cuello mientras lo hace sin tener alimento en la boca” ¿Qué maniobra deglutoria le estaría explicando al paciente?:","o":["Maniobra de Masako.","Deglución forzada.","Maniobra de Mendelssohn.","Deglución super-supraglótica."],"a":0,"e":"Maniobra de Masako: sacar la lengua, sujetarla suavemente entre los dientes y tragar saliva (sin alimento). Fortalece la pared posterior de la faringe y su contacto con la base de la lengua. Mendelsohn = mantener la laringe elevada al tragar; supersupraglótica = apnea, tragar y toser."},{"id":340,"ex":"SES · 2026","s":"boca","q":"¿Qué nivel de consistencia en alimentos sólidos es el más seguro para una persona que sufre un problema de disfagia grave?:","o":["Consistencia tipo néctar.","Consistencia tipo pudding.","Consistencia tipo miel.","Consistencia tipo fibrosa."],"a":1,"e":"En la disfagia grave, la textura más segura es la tipo PUDIN: homogénea, cohesiva, se toma con cuchara y no se dispersa en la boca, con lo que se reduce el riesgo de aspiración. Las texturas fibrosas, mixtas o que se fragmentan son peligrosas. El néctar y la miel son niveles de espesor para líquidos."},{"id":341,"ex":"SESCAM · 2026","s":"intestino","q":"La población diana del programa de Detección Precoz del Cáncer Colorrectal de Castilla-La Mancha se encuentra comprendida entre los:","o":["40 y 79 años de edad.","50 y 79 años de edad.","50 y 69 años de edad.","45 y 69 años de edad."],"a":2,"e":"La población diana del cribado de cáncer colorrectal en Castilla-La Mancha es de 50 a 69 años (como en el marco estatal, en proceso de ampliación hasta 74), con FIT bienal."},{"id":342,"ex":"SESCAM · 2026","s":"intestino","q":"¿Cuál de las siguientes combinaciones describe correctamente las diferencias entre la enfermedad de Crohn y la colitis ulcerosa?:","o":["La enfermedad de Crohn afecta únicamente al colon y cursa con afectación continua; la colitis ulcerosa afecta todo el tubo digestivo y es transmural.","La enfermedad de Crohn presenta afectación transmural y discontinua, empeora con el tabaco y no mejora con la defecación; la colitis ulcerosa afecta la mucosa de forma continua y mejora con la defecación.","La enfermedad de Crohn tiene alto riesgo de malignización y la cirugía es curativa; la colitis ulcerosa rara vez maligniza y la cirugía es paliativa.","La enfermedad de Crohn se asocia más frecuentemente a megacolon tóxico y la colitis ulcerosa a fístulas y obstrucciones."],"a":1,"e":"Crohn: transmural, discontinuo, de cualquier tramo, EMPEORA con el tabaco y el dolor no se calma con la defecación. Colitis ulcerosa: mucosa, continua desde el recto, el tabaco «protege» y el dolor mejora al defecar. Las demás opciones intercambian rasgos (malignización, cirugía curativa y megacolon son más propios de la CU)."},{"id":343,"ex":"SESCAM · 2026","s":"agudo","q":"Un paciente presenta dolor abdominal tras un traumatismo en hipocondrio izquierdo. Durante la exploración, se palpa dolor en el cuadrante superior izquierdo que se irradia al hombro izquierdo. Desde su labor como profesional de enfermería, ¿qué signo indica esta situación, típica de rotura esplénica?:","o":["Signo de Murphy.","Signo de Blumberg.","Signo de Kehr.","Signo de Rovsing."],"a":2,"e":"El signo de Kehr es el dolor referido al hombro izquierdo por irritación del diafragma (nervio frénico) debida a la sangre en una rotura esplénica. No confundir con el tubo de Kehr del drenaje biliar. Murphy = colecistitis; Blumberg = irritación peritoneal; Rovsing = apendicitis."},{"id":344,"ex":"INGESA · 2024","s":"sondas","q":"En los pacientes con alimentación por sonda enteral que se necesita administrar medicamentos directamente al tubo digestivo, pero dichos pacientes no pueden ingerirlos, y esta es la vía de administración indicada, hay que tener en cuenta los siguientes aspectos (Señale la respuesta FALSA):","o":["Comprobar la ubicación de la sonda y su permeabilidad.","Está contraindicada la administración de comprimidos con revestimiento entérico o líquidos oleosos.","Hay que tener especial precaución ante el riesgo de obstrucción en las sondas de poco calibre.","Está indicada cuando hay intolerancia oral."],"a":3,"e":"Antes de dar fármacos por sonda hay que comprobar su posición y permeabilidad, evitar las formas con cubierta entérica, de liberación retardada y los líquidos oleosos, y extremar la precaución en las sondas finas por el riesgo de obstrucción. Según la clave, la afirmación sobre la «intolerancia oral» como indicación es la falsa.","f":"La opción marcada como falsa (indicación por intolerancia oral) es discutible: en la práctica sí es una indicación. Revisar la clave."},{"id":345,"ex":"INGESA · 2026","s":"anat","q":"En un paciente con gastrectomía total o resección ileal, la suplementación de B12 es crítica. ¿En qué lugar anatómico exacto se absorbe el complejo B12-Factor Intrínseco?:","o":["Duodeno proximal.","Yeyuno medio.","Íleon terminal.","Colon ascendente."],"a":2,"e":"El complejo vitamina B12-factor intrínseco se absorbe en el ÍLEON TERMINAL. Por eso tanto la gastrectomía (falta de factor intrínseco) como la resección ileal o el Crohn ileal producen déficit de B12 y obligan a suplementarla por vía parenteral."},{"id":346,"ex":"INGESA · 2026","s":"estom","q":"Cuál de los siguientes enunciados NO está considerado como factor de riesgo de la úlcera gastroduodenal:","o":["Infección por Helicobacter pylori.","Dieta hiperproteica.","Tabaquismo.","El ácido acetilsalicílico."],"a":1,"e":"La dieta hiperproteica no es un factor de riesgo de úlcera. Sí lo son H. pylori (el principal), los AINE (incluido el AAS, por inhibir las prostaglandinas protectoras) y el tabaco (más recidivas y peor cicatrización)."},{"id":347,"ex":"INGESA · 2026","s":"bilipan","q":"En la consulta de enfermería, un paciente nos informa que tiene una obstrucción de la vía biliar y está pendiente de intervención quirúrgica. ¿Cómo serán las heces?:","o":["Heces negras y alquitranadas.","Heces grisáceas o blanquecinas.","Heces amarillentas y espumosas.","Heces líquidas y diarreicas."],"a":1,"e":"Si la vía biliar está obstruida, la bilis no llega al intestino y faltan los pigmentos que dan el color marrón: las heces son grisáceas o blanquecinas (acólicas), con ictericia, coluria y prurito. Las heces negras alquitranadas son melenas y las amarillentas espumosas sugieren esteatorrea."},{"id":348,"ex":"INGESA · 2026","s":"higado","q":"¿Qué dieta debe administrarse a los pacientes con una encefalopatía hepática crónica?:","o":["Hipoproteica e hiposódica.","Hiperproteica e hiposódica.","Hiperproteica e hipercalórica.","Hipercalórica y suplementos de vitamina C."],"a":null,"e":"Pregunta OBSOLETA (el tribunal dio por buena la dieta hipoproteica). Hoy la ESPEN recomienda NO restringir proteínas en la encefalopatía hepática, porque empeora la sarcopenia y el amoniaco: la dieta indicada es hipercalórica e hiperproteica, repartida en varias tomas, con un tentempié nocturno.","st":"O","now":2},{"id":349,"ex":"INGESA · 2026","s":"sondas","q":"Está administrando Fenitoína en suspensión por sonda nasogástrica a un paciente con nutrición enteral continua. ¿Cuál es el procedimiento correcto para evitar el fallo terapéutico por interacción?:","o":["Mezclar el fármaco directamente con la fórmula de nutrición para facilitar la absorción.","Detener la nutrición 1-2 horas antes y 1-2 horas después de la administración del fármaco.","Administrar el fármaco sin detener la nutrición, pero aumentar la dosis de fenitoína un 50%.","Cambiar la fenitoína por diazepam, ya
