"Andalucía · 2018","s":"boca","q":"¿Qué indicador no estaría relacionado con la valoración de la deglución?:","o":["Glucemia superior a 270 mg/dl.","Tos tras la deglución.","Mantiene la comida en la boca.","Controla las secreciones orales."],"a":0,"e":"Los indicadores de deglución valoran la seguridad y la eficacia: tos o cambios de voz tras tragar, retención de comida en la boca, manejo de las secreciones o sellado labial. Una glucemia elevada es un dato metabólico, no un indicador de deglución."},{"id":108,"ex":"Castilla - La Mancha · 2018","s":"valor","q":"La causa más frecuente de hemorragia digestiva alta es:","o":["Gastritis.","Úlcera Péptica.","Varices esofágicas.","Gastropatía portal hipertensiva."],"a":1,"e":"La úlcera péptica (sobre todo la duodenal) es la primera causa de HDA (más del 50%). Le siguen las varices esofagogástricas (en cirróticos), las lesiones agudas de la mucosa y el síndrome de Mallory-Weiss."},{"id":109,"ex":"Castilla - La Mancha · 2018","s":"sondas","q":"Señale la respuesta correcta en relación con la técnica de extracción manual de fecalomas:","o":["La mayoría de los fecalomas se localizan en el colon sigmoideo.","El paciente se colocará en decúbito lateral izquierdo, flexionando ligeramente la rodilla derecha.","Para romper el fecaloma se realizarán movimientos de rotación con el dedo índice.","Se extraerá el fecaloma en una única sesión, independiente de su tamaño."],"a":2,"e":"Para extraer un fecaloma se introduce el dedo enguantado y lubricado y se fragmenta la masa con movimientos suaves de rotación, sin forzar. La mayoría están en la ampolla RECTAL (no en el sigma), se extraen en varias sesiones con pausas y se vigila la respuesta vagal (bradicardia)."},{"id":110,"ex":"Castilla - La Mancha · 2018","s":"intestino","q":"Señale que grupo de edad constituye la población diana en el programa de prevención de cáncer colorrectal en Castilla-La Mancha:","o":["Entre 60 y 75 años.","Entre 40 y 70 años.","Entre 50 y 69 años.","Entre 55 y 80 años."],"a":2,"e":"La población diana del cribado poblacional de cáncer colorrectal en España es de 50 a 69 años (ampliándose progresivamente a 74), con test inmunoquímico fecal (FIT) cada 2 años y colonoscopia si es positivo."},{"id":111,"ex":"Comunitat Valenciana · 2018","s":"ostom","q":"Todas las ostomías que se citan a continuación son de eliminación, excepto una, que es de alimentación, ¿cuál?:","o":["leostomía.","Yeyunostomía.","Colostomía.","Ureterostomía."],"a":1,"e":"La yeyunostomía es una ostomía de ALIMENTACIÓN (la sonda llega al yeyuno para la nutrición enteral). Ileostomía y colostomía son de eliminación digestiva y la ureterostomía, de eliminación urinaria."},{"id":112,"ex":"Navarra · 2018","s":"intestino","q":"Indique cuál de las siguientes afirmaciones es correcta sobre la colitis ulcerosa:","o":["Es un trastorno inflamatorio intestinal crónico que afecta a la mucosa y a la submucosa del colon y el recto.","Las manifestaciones más predominantes son la diarrea, la rectorragia y el dolor abdominal.","La inflamación rectal causa impulso fecal y tenesmo intermitente.","Todas las respuestas son correctas."],"a":3,"e":"Todas son ciertas: la colitis ulcerosa es una inflamación crónica de la mucosa y submucosa del colon y el recto, continua desde el recto; produce diarrea con sangre (rectorragia) y dolor, y la afectación rectal causa urgencia y tenesmo.","ns":1},{"id":113,"ex":"Navarra · 2018","s":"estom","q":"El síndrome de Zollinger-Ellison es la úlcera péptica causada por un:","o":["Glucagonoma.","Gastrinoma.","Insulinoma.","Vipoma."],"a":1,"e":"El síndrome de Zollinger-Ellison se debe a un gastrinoma (tumor productor de gastrina, a menudo pancreático o duodenal). El exceso de gastrina provoca hipersecreción ácida y úlceras múltiples, recurrentes o de localización atípica."},{"id":114,"ex":"Aragón · 2018","s":"intestino","q":"En el Cribado del cáncer colorrectal (CCR) es cierto que:","o":["La detención de sangre oculta en heces cada 2 años entre los 40 y los 50 años de edad se ha demostrado como una estrategia efectiva en nuestro medio.","La dieta rica en vitamina D en dosis elevadas (1,000-2,000U/di1) se asocia con la reducción de riesgo de CCR en la población de riesgo medio.","En la población de riesgo medio, la administración de ácido acetil salicílico (AAS) no se asocia de forma consistente con la reducción de CCR.","Los individuos con historia familiar de CCR deberían iniciar el cribado mediante colonoscopia a partir de los 30 años de edad, o 5 años antes de la edad de diagnóstico del familiar afectado mas joven."],"a":null,"e":"Pregunta ANULADA: ninguna opción se ajustaba bien a la evidencia. Lo que debes saber: el cribado poblacional se hace de 50 a 69 años (no entre 40 y 50) con FIT bienal; el AAS sí reduce el riesgo de CCR con uso crónico; y en antecedentes familiares de primer grado la colonoscopia empieza a los 40 años o 10 años antes del diagnóstico del familiar más joven.","st":"N"},{"id":115,"ex":"Aragón · 2018","s":"agudo","q":"¿Cuál de las siguientes áreas del aparato gastro-intestinal está en especial riesgo de sufrir isquemia?:","o":["El duodeno.","El recto.","La flexión esplénica.","El estómago."],"a":2,"e":"El ángulo esplénico del colon es una zona «frontera» entre la mesentérica superior y la inferior (punto de Griffiths), con irrigación más pobre, por lo que es especialmente vulnerable a la isquemia (colitis isquémica). El estómago y el duodeno tienen una irrigación muy rica."},{"id":116,"ex":"Aragón - Llamamiento excepcional · 2018","s":"sondas","q":"La sonda más adecuada para realizar un lavado gástrico es:","o":["Sonda de Salem.","Sonda de Sengstaken-Blakemore.","Sonda de Foley.","Sonda de Levin."],"a":3,"e":"Entre las opciones, la Levin (una luz, varios orificios distales) es la indicada para lavados y recogida de muestras. La Salem se usa para drenaje o descompresión con aspiración, la Sengstaken para comprimir varices y la Foley es vesical. Con tóxicos sólidos se prefieren sondas orogástricas gruesas (Foucher/Ewald)."},{"id":117,"ex":"Aragón - Llamamiento excepcional · 2018","s":"sondas","q":"En relación a los cuidados del paciente al que hay que realizar un lavado gástrico, es FALSO que:","o":["Los objetivos de la descontaminación gastrointestinal son: eliminar el tóxico, favorecer la adsorción por otras sustancias, reducir la absorción y facilitar la eliminación.","El carbón activado es el tratamiento de primera elección para la descontaminación digestiva en pacientes con intoxicación por medicamentos, por delante de otros procedimientos como el lavado gástrico, la sonda nasogástrica o la inducción del vómito.","Si se dispone de un antídoto para el tóxico es necesario el uso del carbón activado ya que éste aumentaría su utilidad.","El mecanismo de acción es la absorción continuada de la droga en el todo el tubo gastrointestinal, evacuándose con las heces los complejos carbón-toxina."],"a":2,"e":"El carbón activado adsorbe muchos tóxicos y es la primera opción de descontaminación. Pero si existe un antídoto oral, el carbón puede adsorberlo y anular su efecto, por lo que no está indicado combinarlos. Por eso es falsa la afirmación de que el carbón «aumentaría su utilidad»."},{"id":118,"ex":"La Rioja · 2018","s":"bilipan","q":"El dolor en un enfermo con pancreatitis suele situarse:","o":["Retroesternal, puede irradiar al dorso.","Epigástrico, puede irradiar al dorso, especialmente en la zona subescapular derecha.","Epigástrico, puede irradiar al dorso o a la zona lumbar izquierda.","Hipogástrico, cuadrante inferior izquierdo o derecho."],"a":2,"e":"El dolor pancreático es epigástrico, continuo e intenso, irradiado «en cinturón» a la espalda y a la zona lumbar o hipocondrio izquierdo. Mejora inclinando el tronco hacia delante. Si irradia a la zona subescapular derecha orienta a patología biliar."},{"id":119,"ex":"La Rioja · 2018","s":"ostom","q":"Respecto a las ostomías digestivas: ¿qué afirmación es la correcta?:","o":["Según su localización podemos clasificarlas como colostomías de descompresión o colostomías de protección.","No todos los tipos de colostomías podrán ser permanentes o temporales, cada una tiene su indicación.","La cecostomía es la ostomía de la porción inicial del colon ascendente y las deposiciones serán líquidas.","Para el cuidado del estoma y la piel circundante, se lava con agua templada y jabón neutro y se aplicara un desinfectante acuoso para evitar la infección."],"a":2,"e":"La cecostomía aboca el ciego, la porción inicial del intestino grueso, por eso las deposiciones son líquidas y muy irritantes. La opción 4 es falsa: el estoma se lava con agua y jabón neutro, sin desinfectantes. Las colostomías se clasifican por su localización (ascendente, transversa...) y por su duración (temporales o permanentes)."},{"id":120,"ex":"La Rioja · 2019","s":"boca","q":"Índices de caries en dentición temporal más utilizadas. El promedio de dientes cariados y obturados por caries, es el índice:","o":["Índice Ceod.","Índice Ceos.","Índice Cod.","Índice Cos."],"a":2,"e":"En la dentición temporal, el índice cod suma dientes cariados (c) y obturados (o) y lo divide entre los individuos estudiados. No cuenta los ausentes porque pueden haberse perdido por exfoliación fisiológica. En la dentición permanente se usa el CAOD."},{"id":121,"ex":"La Rioja · 2019","s":"valor","q":"Características del vomito central:","o":["Se produce al adoptar determinada posición.","Variable, repetitivo, nunca es de iguales características.","Con esfuerzo precedido de nauseas con arcadas.","Sin esfuerzo no va precedido de nauseas."],"a":3,"e":"El vómito central (por estimulación directa del centro del vómito: hipertensión intracraneal, fármacos...) aparece de forma brusca, sin esfuerzo y sin náuseas previas: es el vómito «en escopetazo». El vómito de origen digestivo suele ir precedido de náuseas, arcadas y cortejo vegetativo."},{"id":122,"ex":"La Rioja · 2019","s":"intestino","q":"Cuál es estas afirmaciones, en relación a la colitis ulcerosa, es cierta:","o":["Implica inflamación transmural de la pared intestinal.","Puede afectar a cualquier segmento del tubo digestivo desde la boca hasta el ano.","Una complicación rara pero muy grave es el megacolon tóxico.","También se le puede llamar enteritis regional."],"a":2,"e":"El megacolon tóxico (colon transverso dilatado > 6 cm con toxicidad sistémica) es una complicación rara pero muy grave, más frecuente en la colitis ulcerosa. La afectación transmural, de boca a ano, y el nombre de «enteritis regional» corresponden a la enfermedad de Crohn."},{"id":123,"ex":"Aragón · 2019","s":"agudo","q":"¿Cuál de las siguientes patologías NO se relaciona con un cuadro de abdomen agudo?","o":["Apendicitis aguda.","Perforación de un divertículo de Meckel.","Reflujo gastroduodenal.","Rotura de aneurisma de aorta abdominal."],"a":2,"e":"El abdomen agudo es un dolor abdominal agudo que precisa diagnóstico y tratamiento rápidos: inflamatorio (apendicitis), perforativo (divertículo de Meckel perforado) o vascular (rotura de aneurisma aórtico). El reflujo gastroduodenal produce síntomas dispépticos, no abdomen agudo."},{"id":124,"ex":"Aragón · 2019","s":"higado","q":"En la encefalopatía hepática, el objetivo terapéutico es combatir los factores desencadenantes. Indique cual NO es una medida general de soporte:","o":["Colocar una sonda nasogástrica para administrar terapias orales en pacientes que no pueden tragar o con riesgo de aspiración.","Hidratación óptima. La administración de líquidos no salinos en gran cantidad debe realizarse con cautela para evitar la inducción de hiponatremia, particularmente en pacientes con cirrosis avanzada.","Corregir las alteraciones iónicas y acido-bases. En casos de hiponatremia grave debe corregirse lentamente.","Indicar dieta astringente para favorecer el estreñimiento."],"a":3,"e":"En la encefalopatía hepática hay que EVITAR el estreñimiento: las bacterias del colon producen amoniaco y cuanto más tiempo permanecen las heces, más se absorbe. Por eso se usan lactulosa o lactitol para lograr 2-3 deposiciones blandas al día; una dieta astringente sería contraproducente."},{"id":125,"ex":"Asturias · 2019","s":"intestino","q":"La población diana incluida en el Programa de Detección Precoz de Cáncer Colorrectal es la comprendida:","o":["Entre 55 y 69 años.","Entre 50 y 69 años.","Entre 50 y 65 años.","Todas las opciones son falsas."],"a":1,"e":"La población diana del programa de detección precoz de cáncer colorrectal es de 50 a 69 años (con ampliación progresiva hasta 74). Se invita a hombres y mujeres sin factores de riesgo a un FIT cada 2 años.","ns":1},{"id":126,"ex":"Asturias · 2019","s":"ostom","q":"¿En qué tipo de colostomías está indicado el uso de una irrigación?","o":["Colostomías terminales sigmoideas.","Colostomías con prolapso.","Ileostomías.","Colostomías ascendentes."],"a":0,"e":"La irrigación se indica en colostomías terminales descendentes o sigmoideas, con heces formes y tránsito regular. Está contraindicada si hay prolapso, hernia o estenosis, en las ileostomías y en las colostomías ascendentes (efluente líquido)."},{"id":127,"ex":"Canarias · 2019","s":"sondas","q":"¿Qué medida considera adecuada para la prevención de la aspiración en un paciente con alimentación por sonda nasogástrica?","o":["Colocar al paciente en posición Semi-Fowler.","Colocar al paciente en posición Trendelemburg.","Utilizar solo alimentos a temperatura corporal.","Administrar solamente a pacientes portadores de Sonda de Linton."],"a":0,"e":"Para prevenir la aspiración, el paciente con nutrición por sonda debe estar semiincorporado (semi-Fowler, 30-45°) durante la administración y al menos 30-60 minutos después. Trendelenburg aumenta el riesgo de reflujo; la temperatura del preparado no previene la aspiración."},{"id":128,"ex":"Canarias · 2019","s":"agudo","q":"Una obstrucción intestinal puede deberse a:","o":["Beber demasiada agua.","Una sonda nasogástrica.","Adherencias abdominales.","Toma de exceso de fibra en la dieta."],"a":2,"e":"Las adherencias (bridas) postquirúrgicas son la primera causa de obstrucción del intestino delgado en pacientes ya operados; en los no operados, lo son las hernias. En el intestino grueso la causa más frecuente es el cáncer colorrectal."},{"id":129,"ex":"Canarias · 2019","s":"agudo","q":"Un paciente ha desarrollado íleo paralítico tras ser sometido a cirugía recientemente. ¿Cuál es la consideración de enfermería más importante al respecto?:","o":["Asegurar la funcionalidad de la SNG.","Controlar ruidos intestinales cada hora.","Asegurarse que puede tomar una dieta líquida.","Mantener al paciente en reposo en cama estricto."],"a":0,"e":"En el íleo paralítico postoperatorio lo prioritario es descomprimir: dieta absoluta y SNG permeable y funcionante para aspirar gases y secreciones, aliviar la distensión y evitar vómitos y aspiración. Se promueve la movilización precoz (no el reposo absoluto) y no se inicia la dieta hasta que vuelve el peristaltismo."},{"id":130,"ex":"Canarias · 2019","s":"bilipan","q":"A un paciente se le ha realizado una colecistectomía con revisión de vías biliares, dejándole colocado un drenaje de tubo en T. ¿Cuándo sabremos que el drenaje está en la fase de poder retirarse?:","o":["El paciente refiere que las heces ya no son acólicas.","En la bolsa colectora apenas hay contenido biliar.","En la bolsa colectora hay menos de 300 ml de contenido biliar.","El paciente está soltando el drenaje."],"a":null,"e":"Pregunta ANULADA. Sobre el tubo en T (Kehr): se registra a diario el débito biliar; tras unos días se pinza antes y después de las comidas. Si el paciente tolera el pinzado (sin dolor, plenitud ni náuseas), el débito disminuye y la colangiografía de control es normal, se puede retirar. Varias opciones eran parcialmente válidas.","st":"N"},{"id":131,"ex":"Andalucía · 2019","s":"valor","q":"Uno de los signos que puede aparecer en el postoperatorio es el timpanismo, cuyo significado es:","o":["Paralización del peristaltismo intestinal.","Perforación timpánica por aumento de la presión.","Retención de gases en el intestino.","Dolor abdominal intenso."],"a":2,"e":"El timpanismo es el sonido hueco y agudo a la percusión que indica aire o gas acumulado en el intestino (distensión por gases), frecuente en el postoperatorio por la disminución del peristaltismo. La matidez, en cambio, indica estructuras macizas o líquido."},{"id":132,"ex":"Andalucía · 2019","s":"intestino","q":"La semana pasada María recibió una carta para el cribado de cáncer de colon en su centro de salud; el motivo es:","o":["Tiene 61 años y reciben la carta todos los andaluces entre 55-75 años.","Ha tenido una hermana que ha fallecido hace unos años por cáncer de colon.","Se hacen el cribado todos los andaluces incluidos en la BDU con más de 60 años y alguna enfermedad crónica.","Están incluidos todos los hombres y mujeres con edad entre 50-69 años."],"a":3,"e":"El cribado poblacional de cáncer colorrectal invita a todos los hombres y mujeres de 50 a 69 años sin factores de riesgo (se amplía progresivamente a 74). Tener una hermana fallecida por CCR la situaría en el grupo de RIESGO ELEVADO, que se sigue con colonoscopia, no con la carta del cribado."},{"id":133,"ex":"Andalucía · 2019","s":"ostom","q":"Señala la respuesta incorrecta en relación a los cuidados a pacientes con colostomía:","o":["Se debe dar una alimentación variada.","El zumo de naranja y el yogur ayudan a controlar los olores.","La cafeína y el chocolate ayudan a espesar las heces.","Los champiñones, el coco y los frutos secos pueden producir obstrucción intestinal."],"a":2,"e":"La cafeína y el chocolate NO espesan las heces: estimulan el peristaltismo y pueden aumentar el débito. Para espesar se usan arroz, pasta, patata, plátano o zanahoria cocida. Champiñones, coco y frutos secos pueden obstruir el estoma si no se mastican bien."},{"id":134,"ex":"Castilla y León · 2019","s":"bilipan","q":"La colecistitis aguda se caracteriza por la inflamación aguda de la vesícula biliar producida generalmente por:","o":["Cálculos biliares.","Traumatismos internos.","Hemorragia interna.","Obstrucción intestinal."],"a":0,"e":"La mayoría de las colecistitis agudas (90-95%) son litiásicas: un cálculo obstruye el conducto cístico y la vesícula se inflama. Las colecistitis alitiásicas (en pacientes críticos, con ayuno prolongado o nutrición parenteral) son menos frecuentes, pero más graves."},{"id":135,"ex":"Castilla y León · 2019","s":"agudo","q":"Cuando hablamos de un proceso patológico intraabdominal, de reciente inicio, que cursa con dolor, repercusión sistémica y requiere un rápido diagnóstico y tratamiento, estamos hablando de:","o":["Diarrea.","Gastritis.","Abdomen agudo.","Colecistitis."],"a":2,"e":"Esa es la definición de abdomen agudo: un proceso intraabdominal de inicio reciente, con dolor como síntoma principal y repercusión sistémica, que requiere diagnóstico y tratamiento rápidos (a menudo quirúrgicos). La colecistitis puede ser una de sus causas, pero no es la definición."},{"id":136,"ex":"Cataluña B · 2019","s":"ostom","q":"Respecto al procedimiento de la sonda de gastrostomía endoscópica percutánea (PEG), señala la respuesta CORRECTA:","o":["Hay que girar cada día la sonda 180º en el sentido de las agujas del reloj.","Al colocar la sonda, hay que introducirla en ángulo de 30º respecto al abdomen de la persona.","Si hay supuración a nivel del orificio de entrada de la sonda, hay que retirarla.","Al finalizar la administración de la alimentación por la PEG, hay que poner la persona en decúbito supino inmediatamente."],"a":0,"e":"La sonda de PEG debe girarse a diario (una vez cicatrizado el trayecto) para evitar adherencias y el síndrome de enterramiento del disco interno («buried bumper»). Si supura, se cura y se valora una infección, no se retira sin más. Después de alimentar, el cabecero se mantiene elevado al menos 30 minutos."},{"id":137,"ex":"Cataluña B · 2019","s":"anat","q":"Respecto a las secreciones pancreáticas que intervienen en el proceso de digestión, ¿cuál de estas afirmaciones es FALSA?:","o":["La lipasa es una enzima que participa en la digestión de las grasas.","Las secreciones pancreáticas tienen un pH ácido.","La tripsina es una enzima que participa en la digestión de las proteínas.","Las secreciones intestinales almacenan aproximadamente un litro al día del jugo pancreático."],"a":1,"e":"El jugo pancreático es ALCALINO: es rico en bicarbonato sódico, que neutraliza el quimo ácido que llega del estómago para que las enzimas actúen. Contiene lipasa (grasas), tripsina y quimotripsina (proteínas) y amilasa (hidratos de carbono)."},{"id":138,"ex":"Cataluña B · 2019","s":"higado","q":"Las varices esofágicas se desarrollan en la mayoría de las personas diagnosticadas de cirrosis hepática. ¿Cuál es el mecanismo fisiológico que las provoca?:","o":["Venotrombosis hepática.","Anomalías congénitas vasculares de la vena esplénica.","Vasculopatía periférica.","Hipertensión portal."],"a":3,"e":"En la cirrosis, la fibrosis dificulta el paso de la sangre portal por el hígado y sube la presión en la porta (hipertensión portal). La sangre busca circuitos colaterales hacia la circulación sistémica, que se dilatan: varices esofágicas, gástricas y hemorroidales y circulación colateral abdominal."},{"id":139,"ex":"Extremadura TL y disc · 2019","s":"anat","q":"¿Cuántos esfínteres tiene el esófago?:","o":["Uno.","Dos.","Tres.","Ninguno."],"a":1,"e":"El esófago tiene dos esfínteres: el superior (cricofaríngeo), que evita la entrada de aire al tubo digestivo, y el inferior o cardias, que evita el reflujo del contenido gástrico."},{"id":140,"ex":"Extremadura TL y disc · 2019","s":"bilipan","q":"Ante un colangiocarcinoma intrahepático que obstruye el árbol biliar, ¿qué signos y síntomas NO aparecen?:","o":["Heces de color blanco.","Pigmentación amarilla de la piel y mucosas.","Dolor en hipocondrio derecho.","Ninguna es correcta."],"a":3,"e":"Al obstruir el árbol biliar, la bilis no llega al intestino y pasa a la sangre: heces acólicas (blancas), ictericia, coluria, prurito y dolor en hipocondrio derecho. Todas las manifestaciones pueden aparecer, por eso «ninguna es correcta».","ns":1},{"id":141,"ex":"Extremadura TL y disc · 2019","s":"ostom","q":"Después de realizar una colostomía, ya sea temporal o permanente, la consistencia del material drenado dependerá de la ubicación de la misma. ¿Cómo son las heces en la colostomía sigmoidea?:","o":["Sólidas.","Semiblandas.","Blandas.","Líquidas."],"a":0,"e":"En la colostomía sigmoidea el colon ha absorbido casi toda el agua, por lo que las heces son SÓLIDAS y la evacuación se puede regular (incluso con irrigación). Secuencia: ciego líquidas → ascendente semilíquidas → transverso blandas → descendente semiblandas → sigma sólidas."},{"id":142,"ex":"Extremadura TL y disc · 2019","s":"agudo","q":"En una apendicitis aguda, ¿qué signo clínico NO se da?:","o":["Signo de Aarón.","Signo de Cope.","Signo de Dunphy.","Signo de Lasègue."],"a":3,"e":"Aaron, Cope (psoas y obturador) y Dunphy son signos de apendicitis. El signo de Lasègue (dolor al elevar la pierna extendida) indica irritación radicular lumbosacra, como en la ciática por hernia discal; no es un signo de apendicitis."},{"id":143,"ex":"Extremadura (2º llamamiento) · 2019","s":"boca","q":"En relación al riesgo de aspiración, señala la respuesta incorrecta:","o":["Recordar a los pacientes con demencia que mastiquen y traguen cada bocado.","Valorar los reflejos faríngeos.","En pacientes con hemiplejia, inclinar la cabeza del paciente hacia el lado afectado.","Controlar la ingestión de alimentos. Documentar la consistencia y cantidad de alimento que ingiere el paciente."],"a":2,"e":"En la hemiplejia, la cabeza se ROTA (gira) hacia el lado afectado, no se inclina: al girarla se cierra el seno piriforme de ese lado y el bolo pasa por el lado sano. También se recuerda a los pacientes con demencia que mastiquen y traguen, se valoran los reflejos y se registra la ingesta."},{"id":144,"ex":"Extremadura (2º llamamiento) · 2019","s":"ostom","q":"En relación a la localización de las colostomías su contenido varía, señala la respuesta correcta:","o":["Colostomía derecha o ascendente: Heces semilíquidas e irritantes - eliminación frecuente.","Colostomía transversa a derecha o izquierda del abdomen: Heces ya formadas, no irritantes. Eliminación similar a la expulsión por el ano.","Colostomía izquierda: Heces líquidas e irritantes. Eliminación menos frecuente.","Ninguna es correcta."],"a":0,"e":"La colostomía ascendente (derecha) produce heces semilíquidas, irritantes y de eliminación frecuente. La transversa produce heces blandas (no formadas) y la izquierda (descendente o sigma), heces semiblandas o sólidas y poco irritantes, al revés de lo que dice la opción 3.","ns":1},{"id":145,"ex":"Extremadura (2º llamamiento) · 2019","s":"ostom","q":"En una colostomía, ya sea temporal o permanente, ¿Cuánto tiempo tarda en funcionar después del postoperatorio?:","o":["12 horas.","24 horas.","48 horas.","De 3 a 6 días."],"a":3,"e":"La colostomía empieza a funcionar entre el 3.º y el 6.º día tras la cirugía, cuando se recupera el peristaltismo. Al principio puede emitir solo gases y moco. La ileostomía suele funcionar antes (24-72 h) y con débito alto."},{"id":146,"ex":"Extremadura (2º llamamiento) · 2019","s":"ostom","q":"Tras el cierre de una ileostomía de descarga temporal para la reconstrucción del tránsito intestinal, ¿Qué complicación puede presentar el postoperatorio?:","o":["Disfagia.","Rectorragias.","PVC positivas por encima de 8.","Hemoptisis."],"a":1,"e":"Al cerrar una ileostomía de protección se restablece el tránsito y se crea una anastomosis: pueden aparecer rectorragia (sangrado de la anastomosis o del recto desfuncionalizado), diarrea, íleo o fuga anastomótica. La disfagia y la hemoptisis no tienen relación con esta cirugía."},{"id":147,"ex":"Extremadura (2º llamamiento) · 2019","s":"anat","q":"El intestino delgado está formado por el duodeno, el yeyuno y el íleon. En él se realiza la absorción de los productos de la digestión. ¿Qué longitud tiene?:","o":["De tres a cinco metros.","De cuatro a seis metros.","De cinco a ocho metros.","De seis a nueve metros."],"a":1,"e":"El intestino delgado mide unos 6 metros (según la fuente, entre 4 y 7) y 2,5 cm de diámetro: duodeno (unos 25 cm), yeyuno e íleon. La opción que mejor recoge esa longitud es «de 4 a 6 metros». El intestino grueso mide alrededor de 1,5 m."},{"id":148,"ex":"Galicia · 2019","s":"intestino","q":"Según la Escala de Bristol, heces de tipo 3 y 4 se consideran:","o":["Heces duras, estreñimiento/constipación.","Heces blandas, tránsito regular.","Heces líquidas, diarrea.","La escala de Bristol no está relacionada con la forma de las heces."],"a":1,"e":"Escala de Bristol: tipos 1-2 = estreñimiento; 3-4 = heces ideales (el 4, «salchicha lisa y blanda», es el ideal); 5 = falta de fibra; 6-7 = diarrea. Los tipos 3 y 4 corresponden a un tránsito regular."},{"id":149,"ex":"Galicia · 2019","s":"intestino","q":"La dieta de una persona con diverticulosis intestinal debe ser:","o":["Rica en proteínas.","Rica en fibra.","Baja en sodio.","Hipercalórica."],"a":1,"e":"En la diverticulosis (sin inflamación) se recomienda una dieta RICA EN FIBRA y abundante agua: aumenta el volumen fecal, baja la presión intracolónica y previene el estreñimiento. En la diverticulitis aguda, en cambio, se pauta dieta absoluta o sin residuos."},{"id":150,"ex":"Galicia · 2019","s":"estom","q":"Tomás es un paciente diagnosticado de úlcera péptica. ¿Qué recomendaciones incluirías en su educación sanitaria?:","o":["Lavar las manos con frecuencia, preparación higiénica de los alimentos y beber agua segura.","Mantener el tratamiento indicado hasta la mejoría de los síntomas.","Tomar antiinflamatorios no esteroideos, AINES con leche.","Realizar 3 comidas y beber antes para evitar el dolor."],"a":0,"e":"H. pylori se transmite de persona a persona por vía fecal-oral y oral-oral, por lo que la higiene de manos y alimentos y el agua segura son medidas preventivas. El tratamiento se completa aunque mejoren los síntomas, se evitan los AINE y se reparten 4-5 comidas al día."},{"id":151,"ex":"Galicia · 2019","s":"sondas","q":"Tras colocar una sonda nasogástrica tipo Levin para alimentación, de los siguientes, ¿cuál sería el método más fiable de comprobación?:","o":["Medir la distancia desde la punta de la nariz del paciente a la oreja y desde ahí hasta el apéndice xifoides.","Inyectar 30 ml de aire y escuchar el sonido con el fonendoscopio situado en el epigastrio.","Introducir el extremo en un vaso de agua.","Aspirar y comprobar el pH del líquido extraído."],"a":3,"e":"El método más fiable a pie de cama es aspirar contenido y comprobar el pH (≤ 4 = estómago). Medir nariz-oreja-xifoides sirve para calcular la longitud, no para comprobar la posición. Auscultar aire o sumergir el extremo en agua no son métodos fiables."},{"id":152,"ex":"Cantabria · 2019","s":"intestino","q":"¿Cuál es la vía de contagio principal de las infecciones por Campylobacter?","o":["Contacto con fluidos corporales.","Transmisión aérea.","Transmisión hidro-fecal.","Contacto sexual."],"a":2,"e":"Campylobacter es una de las principales causas de gastroenteritis bacteriana. Se transmite por vía fecal-oral: agua y alimentos contaminados (sobre todo carne de pollo poco cocinada y leche sin pasteurizar)."},{"id":153,"ex":"Cantabria · 2019","s":"intestino","q":"¿En qué año se implanta el programa de cribado de cáncer de colon en la Comunidad Autónoma de Cantabria?","o":["2006.","2008.","2010.","2012."],"a":1,"e":"Dato autonómico (la clave señala 2008 para Cantabria). Lo que se pregunta en cualquier OPE: cribado de 50 a 69 años (con ampliación a 74), test inmunoquímico fecal cada 2 años y colonoscopia si es positivo.","f":"Dato de calendario autonómico: poco valor didáctico fuera de Cantabria."},{"id":154,"ex":"Cantabria · 2019","s":"sondas","q":"Respecto a los cuidados de enfermería en la administración de nutrición enteral por sonda; señale la respuesta INCORRECTA:","o":["Antes de administrar la nutrición se colocará al paciente en posición sentado o semisentado a unos 45º.","Se debe comprobar la correcta ubicación de la sonda mediante aspiración de contenido gástrico o auscultando epigastrio mientras introducimos aire con una jeringa.","Cuando existe sonda nasogástrica y está fijada a nariz, se debe cambiar el punto de fijación cada 72 h con cuidado de no mover mucho para evitar náuseas al paciente.","Para conservar el preparado nutricional, se pondrá fecha y hora de apertura, conservándose en nevera un máximo de 24 h."],"a":2,"e":"La fijación de la SNG a la nariz se cambia a DIARIO (y si está sucia o despegada), aprovechando para movilizar ligeramente la sonda y prevenir lesiones por presión. Cada 72 h es demasiado tiempo. Ten en cuenta que hoy la auscultación con aire tampoco se acepta como comprobación.","f":"La opción 2 incluye la auscultación, que hoy NO se considera un método fiable: la pregunta tiene dos opciones problemáticas."},{"id":155,"ex":"Cantabria · 2019","s":"intestino","q":"Respecto a las características de la \"colitis ulcerosa\", señale la respuesta INCORRECTA:","o":["Predominio de colon izquierdo.","Puede evolucionar a megacolon tóxico.","Distribución discontinua de las lesiones.","La inflamación afecta a mucosa y submucosa."],"a":2,"e":"La colitis ulcerosa tiene una distribución CONTINUA: empieza en el recto y avanza sin dejar zonas sanas. La distribución discontinua o «en parches» es propia del Crohn. La CU afecta a mucosa y submucosa, predomina en el colon izquierdo y puede complicarse con megacolon tóxico."},{"id":156,"ex":"Cantabria · 2019","s":"valor","q":"¿Con qué se relaciona la aparición de heces \"hipocólicas\" o \"acólicas\"?","o":["Sangrado gástrico.","Déficit de fibra en la dieta.","Patología biliar.","Deshidratación."],"a":2,"e":"Las heces hipocólicas o acólicas (pálidas, color masilla) indican que no llega bilis al intestino: obstrucción de la vía biliar (coledocolitiasis, tumores) o fase aguda de una hepatitis. Suelen acompañarse de ictericia y coluria."},{"id":157,"ex":"Cantabria · 2019","s":"estom","q":"¿Qué déficit vitamínico se relaciona con los pacientes gastrectomizados?","o":["Vitamina E.","Vitamina B3.","Vitamina B12.","Vitamina K."],"a":2,"e":"La gastrectomía elimina las células parietales que producen el factor intrínseco, necesario para absorber la vitamina B12 en el íleon. El déficit causa anemia megaloblástica y se trata con B12 intramuscular de por vida."},{"id":158,"ex":"Madrid · 2019","s":"estom","q":"La complicación más común en el paciente con úlcera péptida es:","o":["Una perforación.","Una hemorragia.","Desnutrición por cambios en la dieta.","Obstrucción pilórica."],"a":1,"e":"La hemorragia es la complicación MÁS FRECUENTE de la úlcera péptica; la perforación es la MÁS GRAVE. Otras son la penetración (sobre todo al páncreas) y la estenosis u obstrucción pilórica."},{"id":159,"ex":"Madrid · 2019","s":"valor","q":"Tras un sangrado gástrico, la hemorragia puede hacer que las heces sean de un color:","o":["Negro alquitranado (Melenas).","Posos de café.","Bilioso.","Blanquecino."],"a":0,"e":"La sangre procedente del estómago se digiere durante el tránsito y las heces salen negras y alquitranadas: melenas. Los «posos de café» describen el VÓMITO con sangre digerida, no las heces."},{"id":160,"ex":"Islas Baleares · 2019","s":"agudo","q":"En la valoración abdominal de un paciente que ha sufrido un traumatismo, se pueden presentar los siguientes signos de irritación peritoneal EXCEPTO:","o":["Ausencia de ruidos intestinales y rigidez muscular.","Distensión abdominal y defensa involuntaria.","Hiperestesia o hipoestesia.","Dolor a la palpación o dolor de rebote a la palpación."],"a":2,"e":"Los signos de irritación peritoneal son defensa o rigidez muscular («abdomen en tabla»), dolor a la palpación y a la descompresión (Blumberg), distensión y disminución o ausencia de ruidos. La hipoestesia cutánea no es un signo de irritación peritoneal."},{"id":161,"ex":"Islas Baleares · 2019","s":"ostom","q":"¿Cuál de las siguientes NO es una ostomía de eliminación?:","o":["Ileostomía.","Yeyunostomía.","Colostomía ascendente.","Ureterostomía."],"a":1,"e":"La yeyunostomía es de ALIMENTACIÓN. Ileostomía y colostomía son ostomías de eliminación digestiva y la ureterostomía, de eliminación urinaria."},{"id":162,"ex":"Islas Baleares · 2019","s":"sondas","q":"Para reducir el riesgo de aspiración en un paciente portador de sonda de alimentación, indique la CORRECTA:","o":["Un paciente con sonda de alimentación no presenta riesgo de aspiración.","La administración de alimentos y medicamentos a través de una sonda se debe realizar con el paciente en posición semi-fowler.","La alimentación de los pacientes a través de sonda colocada a nivel del estómago disminuye la frecuencia de regurgitación y aspiración.","Los pacientes con sonda de alimentación mediante bomba de infusión continua no deben mantener la posición semi-fowler."],"a":1,"e":"La nutrición y la medicación por sonda se administran con el paciente semiincorporado (semi-Fowler o Fowler), que se mantiene durante la infusión continua y después de cada bolo. Una sonda gástrica no elimina el riesgo de regurgitación; la posición pospilórica lo reduce."},{"id":163,"ex":"INGESA · 2019","s":"intestino","q":"¿Cuál es el síntoma más frecuente en la presentación del Cáncer de Colon?:","o":["Dolor Abdominal.","Distensión Abdominal.","Ascitis Abdominal.","Hemorragia Rectal."],"a":null,"e":"Pregunta ANULADA: el síntoma depende de la localización. Colon derecho: anemia ferropénica por sangrado oculto. Colon izquierdo: rectorragia, cambio del ritmo deposicional y heces «en lapicero». Recto: tenesmo y urgencia rectal. El dolor y la rectorragia son ambos frecuentes, de ahí la ambigüedad.","st":"N"},{"id":164,"ex":"Canarias 2º llamamiento · 2019","s":"agudo","q":"La obstrucción parcial o total del intestino produce:","o":["Íleo mecánico.","Íleo paralítico.","Acortamiento y engrosamiento del colon.","Hemorragia en forma de melenas."],"a":0,"e":"Si existe un obstáculo físico que ocluye total o parcialmente la luz intestinal (bridas, hernia, tumor, vólvulo, fecaloma...), hablamos de íleo MECÁNICO. El íleo paralítico es funcional: la luz está libre, pero no hay peristaltismo."},{"id":165,"ex":"Canarias 2º llamamiento · 2019","s":"intestino","q":"¿Por qué es importante la eliminación de los pólipos de colon?:","o":["Porque sirve para identificar las posibles alteraciones genéticas.","Para prevenir desarrollo de cáncer de colon.","Para facilitar un mejor examen del intestino.","Para aminorar los futuros problemas de estreñimiento."],"a":1,"e":"La mayoría de los cánceres colorrectales se desarrollan a partir de pólipos adenomatosos (secuencia adenoma-carcinoma). Extirparlos durante la colonoscopia (polipectomía) previene el cáncer. Los adenomas vellosos y los mayores de 1 cm son los de más riesgo."},{"id":166,"ex":"Canarias 2º llamamiento · 2019","s":"intestino","q":"Un paciente notifica al personal de enfermería que tanto su padre como su abuelo, murieron de cáncer colorrectal y el teme fallecer de la misma enfermedad. ¿Cuál de los siguientes puntos debe incluir el personal de enfermería entre sus recomendaciones?:","o":["No hay relación genética entre las personas afectadas de cáncer de colon.","El paciente debe someterse a una exploración de sangre oculta en heces y colonoscopia al año.","Todas las respuestas son correctas.","El paciente debe cambiar su dieta de inmediato."],"a":1,"e":"Los antecedentes familiares de primer grado son el principal factor de riesgo hereditario de CCR. Estas personas no entran en el cribado poblacional: siguen un programa de alto riesgo con colonoscopia (además de valorar la sangre oculta) y consejo genético si procede.","ns":1},{"id":167,"ex":"Madrid 2º Llamamiento · 2019","s":"estom","q":"Señale una de las causas de aparición de la hipoglucemia reactiva:","o":["Alteración de la motilidad gastrointestinal después de una cirugía gástrica.","Uso de esteroides y anabolizantes.","Pancreatitis asociada a excesiva ingesta de alcohol.","Traumatismo de huesos largos."],"a":0,"e":"El síndrome de dumping TARDÍO (90-180 min tras comer) es una hipoglucemia reactiva: tras la cirugía gástrica, los hidratos de carbono pasan rápido al intestino, se absorben de golpe y provocan un pico de insulina que acaba en hipoglucemia (sudoración, confusión, mareo)."},{"id":168,"ex":"Murcia · 2019","s":"sondas","q":"La finalidad del sondaje nasogástrico es:","o":["Preventiva.","Diagnóstica.","Terapéutica.","Todas las respuestas son correctas."],"a":3,"e":"El sondaje nasogástrico tiene finalidad preventiva (descompresión para evitar vómitos y aspiración), diagnóstica (obtener muestras de contenido gástrico) y terapéutica (alimentación, medicación, lavado gástrico, drenaje).","ns":1},{"id":169,"ex":"Murcia · 2019","s":"ostom","q":"Respecto a las ostomías digestivas, ¿qué afirmación es correcta?:","o":["Según su localización podemos clasificarlas como colostomías de descompresión o colostomías de protección.","No todos los tipos de colostomías podrán ser permanentes o temporales, cada una tiene su indicación.","La cecostomía es la ostomía de la porción inicial del colon ascendente y las deposiciones serán líquidas.","Para el cuidado del estoma y la piel circundante, se lava con agua templada y jabón neutro y se aplica un desinfectante acuoso para evitar la infección."],"a":null,"e":"Pregunta ANULADA en Murcia, aunque en La Rioja (2018) la misma pregunta dio por correcta la opción 3: la cecostomía aboca el ciego y sus heces son líquidas. La opción 4 es falsa (el estoma no se desinfecta, se lava con agua y jabón neutro). Útil para ver que una misma pregunta puede tener destino distinto en cada tribunal.","st":"N"},{"id":170,"ex":"Murcia 2º llamamiento · 2019","s":"estom","q":"El síndrome de ZOLLINGER-ELLISON es la úlcera péptica causada por un:","o":["Glucagoma.","Gastrinoma.","Insulinoma.","Vipoma."],"a":1,"e":"El Zollinger-Ellison se debe a un gastrinoma: el exceso de gastrina estimula una hipersecreción ácida masiva, con úlceras múltiples, refractarias y de localización atípica. Insulinoma = hipoglucemias; glucagonoma = hiperglucemia y eritema; vipoma = diarrea acuosa."},{"id":171,"ex":"Murcia 2º llamamiento · 2019","s":"valor","q":"¿En qué posición debe de estar el paciente durante la realización de una colonoscopia?:","o":["En decúbito lateral derecho con las piernas elevadas hacia el tórax.","En decúbito lateral izquierdo con las piernas elevadas hacia el tórax.","En decúbito prono.","En decúbito supino y con las piernas flexionales."],"a":1,"e":"La colonoscopia se realiza en decúbito lateral izquierdo con las rodillas flexionadas hacia el pecho: así se sigue la anatomía del sigma y el recto. Es la misma postura que para administrar un enema."},{"id":172,"ex":"Murcia 2º llamamiento · 2019","s":"valor","q":"El test de Guayaco se emplea:","o":["Para el control de la fertilidad.","Para detectar sangre en las heces.","En las pruebas de Alergia.","En las pruebas Hepáticas."],"a":1,"e":"El test del guayaco detectaba sangre oculta en heces por la actividad peroxidasa de la hemoglobina. Requería dieta previa (sin carne roja ni vitamina C) y daba muchos falsos positivos. Hoy está en desuso y ha sido sustituido por el test inmunoquímico fecal (FIT)."},{"id":173,"ex":"Murcia 2º llamamiento · 2019","s":"ostom","q":"Las ostomías se pueden dividir en dos grandes grupos: nutricionales y de eliminación. Señale cuál de estas ostomías se considera únicamente de eliminación:","o":["Faringostomía.","Gatrostomía.","Yeyunostomía.","Ileostomía."],"a":3,"e":"La ileostomía es exclusivamente de eliminación (el íleon se aboca a la piel). La faringostomía, la gastrostomía y la yeyunostomía son ostomías de nutrición."},{"id":174,"ex":"Murcia 2º llamamiento · 2019","s":"estom","q":"La erosión de la mucosa gástrica o duodenal que alcanza o sobrepasa la muscularis mucosae se denomina:","o":["Gastritis aguda.","Gastritis crónica.","Úlcera péptica.","Colitis ulcerosa."],"a":2,"e":"La úlcera péptica es la lesión gástrica o duodenal que alcanza o sobrepasa la muscularis mucosae. Si es más superficial y no llega a esa capa, hablamos de erosión."},{"id":175,"ex":"Galicia EFyC · 2020","s":"valor","q":"En un domicilio al que acudimos a realizar la cura de una úlcera a un paciente encamado de 84 años, totalmente dependiente para las actividades de la vida diaria, el cuidador nos indica que está preocupado porque las tres últimas deposiciones son de color negro, brillante y maloliente. ¿Qué tipo de deposiciones está teniendo el paciente?:","o":["Hematoquecia.","Melenas.","Rectorragia.","Ninguna es correcta."],"a":1,"e":"Heces negras, brillantes, pegajosas y malolientes son MELENAS: sangre digerida, generalmente de origen digestivo alto. En un anciano dependiente obliga a valorar una HDA (úlcera, AINE, anticoagulantes). La hematoquecia y la rectorragia son sangre roja.","ns":1},{"id":176,"ex":"Galicia EFyC · 2020","s":"sondas","q":"Acudimos al domicilio de una paciente para colocar una sonda nasogástrica (SNG). Según el Procedimiento de colocación y cuidados de la SNG, del portal FEMORA, del Servicio Gallego de Salud, ¿Cuál es la prueba de primera línea para comprobar la colocación?:","o":["El control radiológico.","La utilización de papel tornasol o papel pH para medir la concentración de iones hidrógeno en el contenido gástrico.","La medición del pH gástrico con tiras reactivas.","La auscultación en el epigastrio de aire insuflado por la SNG."],"a":2,"e":"Según el procedimiento del SERGAS, la primera línea es medir el pH del aspirado con tiras reactivas de pH (escala graduada), que discriminan valores ≤ 5,5. El papel tornasol solo indica ácido o básico, no es suficiente. La radiografía es la prueba de referencia, pero no la de primera línea en domicilio."},{"id":177,"ex":"Galicia EFyC · 2020","s":"ostom","q":"Un hombre de 59 años, portador de una colostomía tras ser intervenido de un cáncer de colon, viene a la consulta solicitando información sobre muchos aspectos relacionados con sus hábitos de vida, la colostomía, la vuelta a su puesto de trabajo como bedel en un colegio de educación primaria y la práctica de su deporte favorito (va a jugar al pádel con sus amigos tras días a la semana). Indicará al paciente que puede:","o":["Bañarse en el mar o piscina.","Reincorporarse a su puesto de trabajo.","Practicar el deporte que hacía con anterioridad a la intervención.","Todas son correctas."],"a":3,"e":"Una colostomía no impide una vida normal: puede bañarse en el mar o la piscina (con bolsa o tapón, o colector pequeño), volver al trabajo y hacer deporte. Solo se evitan los deportes de contacto violento y los grandes esfuerzos en los primeros meses (riesgo de hernia), con faja adaptada si hace falta.","ns":1},{"id":178,"ex":"Galicia EFyC · 2020","s":"intestino","q":"Acude a nuestra consulta un paciente de 54 años que en un control de salud en su empresa le detectaron una cifra de glucemia de 115 mg/dl y sobrepeso. Le recomiendan acudir a su centro de salud para realizar nuevos controles. Durante la entrevista nos dice que no es fumador, solo toma una copa de vino al mediodía y se considera una persona sana, por lo que no suele acudir al médico; tampoco tiene antecedentes familiares relevantes. Cree que el problema está en que lleva un año sin realizar nada de ejercicio  y, por este motivo, lleva unos meses estreñido, sus hemorroides han empeorado y a veces tiene pequeños sangrados. ¿Qué recomendación no tendríamos que dar  a este paciente?:","o":["Realizar nuevos controles entre los que se incluya la prueba de sangre oculta en heces.","Aumentar el consumo de fruta y verdura. Hacer ejercicio físico regularmente.","Limitar el consumo de hidratos de carbono y grasas de origen animal.","Explicar al paciente que no debe preocuparse ya que el sangrado se produce porque la hemorroide se abre con el esfuerzo de la defecación."],"a":3,"e":"No se debe atribuir un sangrado rectal a las hemorroides sin descartar antes otras causas, sobre todo un cáncer colorrectal en un paciente de 54 años, en edad de cribado. Por eso es incorrecto tranquilizarle sin más. Sí procede indicar sangre oculta en heces, fibra, ejercicio y control del peso y la glucemia."},{"id":179,"ex":"Galicia EFyC · 2020","s":"valor","q":"Tomás de 56 años recibe en su domicilio el resultado de la prueba de detección de sangre oculta en heces. En ella se le informa que se encontraron indicios de sangre, por lo que será necesaria la realización de una colonoscopia. ¿Cuál de estas indicaciones no debemos dar al paciente?:","o":["No es necesario que vaya acompañado a realizar la prueba.","Se le darán instrucciones precisas sobre la dieta en los días previos.","Se entregarán el producto farmacológico y las instrucciones de cómo deberá tomarlo para una correcta preparación del intestino.","La importancia de no comer y beber nada en las cuatro horas previas a la realización de la prueba."],"a":0,"e":"La colonoscopia suele hacerse con sedación, por lo que el paciente DEBE ir acompañado y no puede conducir después. Sí se le dan instrucciones de dieta (pobre en residuos 48 h antes y líquidos claros 24 h antes), la solución evacuante y el ayuno previo."},{"id":180,"ex":"Andalucía · 2021","s":"sondas","q":"Dada la disminución del nivel de conciencia que presenta Antonio, la enfermera le ha colocado una sonda nasogástrica; señale el método NO aconsejado para verificar la localización de la sonda:","o":["Auscultación por debajo del apéndice xifoides del gorgoteo del aire insuflado por la SNG (prueba “whoosh”).","Solicitud de radiografía y visualización de colocación de la SNG.","Medición del pH del contenido aspirado por la SNG.","Todos son correctos."],"a":0,"e":"La auscultación del aire insuflado (prueba «whoosh») NO es un método fiable para verificar la posición de la sonda y no se recomienda. En pacientes con disminución del nivel de consciencia se recomienda confirmar con radiografía; a pie de cama, con el pH del aspirado."},{"id":181,"ex":"Castilla y León SS · 2021","s":"boca","q":"Indique la afirmación correcta respecto a la escala EAT-10:","o":["La puntuación máxima total es de 50 puntos.","Es un cuestionario de 10 preguntas.","Incluye una fórmula para el cálculo de la puntuación final.","Contiene subescalas."],"a":1,"e":"El EAT-10 es un cuestionario autoadministrado de 10 preguntas con escala Likert de 0 a 4: la puntuación va de 0 a 40 y un valor ≥ 3 indica posible disfagia. Es una simple suma, sin fórmula ni subescalas, y se usa como cribado en pacientes con nivel cognitivo conservado."},{"id":182,"ex":"Castilla y León SS · 2021","s":"intestino","q":"La Clasificación de Montreal de la Enfermedad de Crohn, define el patrón de la enfermedad según:","o":["La edad de comienzo, localización y comportamiento.","El tratamiento de mantenimiento y su duración.","El número de brotes leves o moderados.","Las terapias de rescate."],"a":0,"e":"La clasificación de Montreal para el Crohn usa la edad al diagnóstico (A1 ≤ 16, A2 17-40, A3 > 40), la localización (L1 ileal, L2 cólica, L3 ileocólica, L4 tracto alto) y el comportamiento (B1 inflamatorio, B2 estenosante, B3 fistulizante; «p» si hay afectación perianal)."},{"id":183,"ex":"Castilla y León SS · 2021","s":"boca","q":"Respecto a las medidas higiénico-dietéticas en relación con el reflujo gastroesofágico, señale la respuesta incorrecta:","o":["Evitar dormir hasta 2-4 horas después de las comidas.","Elevar el cabecero de la cama a 15º.","Realizar comidas poco copiosas y bajas en grasa.","Evitar tabaco, teína y cafeína."],"a":1,"e":"El cabecero se eleva 15-20 CENTÍMETROS con tacos bajo las patas, no 15 grados, y sin usar varias almohadas (flexionan el abdomen y aumentan la presión). También se aconseja no acostarse tras comer, hacer comidas poco copiosas y bajas en grasa y evitar el tabaco, el té y el café."},{"id":184,"ex":"INGESA · 2021","s":"ostom","q":"Todas las ostomías que se citan a continuación son de eliminación excepto una que es de alimentación, ¿cuál es?:","o":["Colostomía.","Yeyunostomía.","Ileostomía.","Ureterostomía."],"a":1,"e":"La yeyunostomía es una ostomía de alimentación. Colostomía e ileostomía son de eliminación intestinal y la ureterostomía, de eliminación urinaria."},{"id":185,"ex":"INGESA · 2021","s":"estom","q":"De los siguientes factores de riesgo, cual NO está relacionado con la ulcera gastroduodenal:","o":["Infección crónica por Helicobacter pylori.","Uso de antinflamatorios no esteroideos.","Tabaquismo.","Intolerancia a la lactosa."],"a":3,"e":"Los factores de la úlcera gastroduodenal son H. pylori (1.º), AINE (2.º) y, como cofactores, el tabaco, el estrés grave y los estados de hipersecreción ácida. La intolerancia a la lactosa produce diarrea y flatulencia, pero no úlcera."},{"id":186,"ex":"INGESA · 2021","s":"valor","q":"Al realizar una prueba de sangre oculta en heces, ¿cuál de los siguientes productos puede dar como resultado un falso negativo si es ingerido en los días previos a la realización de la prueba?:","o":["Hierro.","Yodo.","Vitamina C.","Colchicina."],"a":2,"e":"La vitamina C (> 250 mg/día) es un antioxidante que interfiere con la reacción del guayaco y produce FALSOS NEGATIVOS. La carne roja, ciertos vegetales y los AINE daban falsos positivos. El FIT actual no tiene estas interferencias."},{"id":187,"ex":"INGESA · 2021","s":"ostom","q":"Cuando el paciente ya pueda ingerir alimentos con normalidad, ¿cómo serán las heces que expulsara por el estoma?:","o":["Líquidas.","Formadas.","Semilíquidas.","Blandas."],"a":1,"e":"En el supuesto original, el estoma era una colostomía distal (descendente o sigmoidea). Cuando el paciente come con normalidad, el colon absorbe agua y las heces salen FORMADAS. Recuerda: cuanto más distal el estoma, más sólidas y menos irritantes las heces.","f":"Pregunta de supuesto práctico: depende del caso original (estoma en colon descendente o sigmoide). Conviene añadir el contexto o retirarla."},{"id":188,"ex":"La Rioja · 2021","s":"estom","q":"Entre las siguientes recomendaciones dietéticas en un paciente con Síndrome de Dumping, ¿cuál de ellas no incluiremos?:","o":["Repartir la dieta en seis o más tomas de pequeño tamaño.","Tomar alimentos con hidratos de carbono simples.","Los líquidos deben tomarse separados de las comidas, entre 30 y 60 minutos antes o después.","Evitar el consumo de refrescos y zumos."],"a":1,"e":"En el síndrome de dumping se RESTRINGEN los hidratos de carbono simples (azúcares, dulces, zumos), que aceleran el vaciamiento y provocan hipoglucemia reactiva. Se reparten 6 o más tomas pequeñas, los líquidos se toman 30-60 min antes o después de comer y se aumentan las proteínas y la fibra."},{"id":189,"ex":"La Rioja · 2021","s":"higado","q":"Ante un paciente con cirrosis descompensada y ascitis, ¿cuál de los siguientes cuidados de enfermería no realizaría?:","o":["Reposición de la volemia con albúmina.","Control de electrolitos.","Administrar AINES.","Suspender los líquidos según la respuesta diurética."],"a":2,"e":"En el cirrótico están contraindicados los AINE: reducen las prostaglandinas renales, favorecen la insuficiencia renal y el síndrome hepatorrenal, la retención de sodio, la resistencia a los diuréticos y el sangrado digestivo. Sí se controla la diuresis, los electrolitos y se repone albúmina tras la paracentesis."},{"id":190,"ex":"Castilla - La Mancha · 2022","s":"intestino","q":"En un paciente ingresado con un brote activo de colitis ulcerosa, podríamos identificar en nuestra valoración los siguientes diagnósticos de enfermería, EXCEPTO:","o":["Desequilibrio nutricional por ingesta inferior a las necesidades relacionado con restricciones dietéticas y malabsorción.","Déficit de volumen de líquidos relacionado con anorexia y diarrea.","Alteraciones de la imagen corporal relacionadas con los cambios de funcionamiento del cuerpo.","Riesgo de deterioro de la integridad tisular por fisuras o fístulas en el intestino delgado."],"a":3,"e":"Las fisuras y las fístulas son propias de la enfermedad de Crohn (afectación transmural), no de la colitis ulcerosa, que es superficial y se limita al colon y el recto. En un brote de CU sí son esperables la desnutrición, el déficit de volumen por la diarrea y la alteración de la imagen corporal."},{"id":191,"ex":"Castilla - La Mancha - Llamamiento extraordinario · 2022","s":"sondas","q":"Para la administración de un enema en un paciente encamado colocaremos al paciente, siempre que sea posible, en la posición:","o":["Decúbito lateral derecho.","Sims.","Litotomía.","Fowler."],"a":1,"e":"El enema se administra en posición de Sims (decúbito lateral IZQUIERDO con la rodilla derecha flexionada): la solución fluye por gravedad siguiendo la curva del recto y el sigma hacia el colon descendente, que queda en declive, y se retiene mejor."},{"id":192,"ex":"Castilla - La Mancha - Llamamiento extraordinario · 2022","s":"higado","q":"Ante un paciente hospitalizado por cirrosis hepática que presenta síntomas de deterioro del estado mental, alteración de la conciencia y/o comportamiento agresivo durante la vigilia, debemos sospechar del desarrollo de:","o":["Hemorragia digestiva alta por varices esofágicas.","Encefalopatía hepática.","Hemorragia digestiva alta por úlcera gástrica/duodenal.","Ascitis."],"a":1,"e":"Las alteraciones del estado mental, de la conciencia o del comportamiento (confusión, agresividad, inversión del ritmo del sueño, asterixis) en un cirrótico deben hacer sospechar una encefalopatía hepática, por acumulación de amoniaco y otras toxinas que el hígado no depura."},{"id":193,"ex":"Castilla - La Mancha - Llamamiento extraordinario · 2022","s":"sondas","q":"Señale cuál de las siguientes es una contraindicación absoluta del sondaje nasogástrico:","o":["Varices esofágicas y esofagitis.","Disminución del nivel de conciencia.","Intubación orotraqueal.","Ingestión de ácidos o álcalis."],"a":3,"e":"La ingesta de cáusticos (ácidos o álcalis) contraindica de forma ABSOLUTA el sondaje: puede perforar un esófago lesionado e inducir el vómito, que vuelve a quemar la mucosa. Las varices son una contraindicación relativa y la disminución de conciencia obliga a proteger antes la vía aérea. La intubación es una indicación."},{"id":194,"ex":"Aragón 2º llamamiento · 2022","s":"intestino","q":"Según la guía de buenas prácticas de la RNAO 2020 sobre el manejo vesical e intestinal en adultos, ¿cuál no corresponde a un subtítulo de tipo de incontinencia intestinal?:","o":["lncontinencia intestinal pasiva.","Incontinencia intestinal de urgencia.","Incontinencia intestinal funcional.","Incontinencia intestinal emocional."],"a":3,"e":"La guía RNAO 2020 diferencia tres tipos de incontinencia intestinal: PASIVA (pérdida sin aviso, por disfunción del esfínter interno), de URGENCIA (no puede posponer la defecación, por disfunción del esfínter externo) y FUNCIONAL (por limitaciones de movilidad o del entorno). La «emocional» no existe."},{"id":195,"ex":"Aragón 2º llamamiento · 2022","s":"ostom","q":"La colocación de una ostomía viene definida principalmente por la duración del soporte nutricional por vía enteral, es decir, periodos superiores a 4-6 semanas. Indica, en este caso, cuál es la ostomía de elección preferente:","o":["Duodenostomía.","Gastrostomía.","Faringostomía.","Esofagostomía."],"a":1,"e":"Si la nutrición enteral va a durar más de 4-6 semanas, se prefiere una ostomía a la sonda nasal, y la de elección es la gastrostomía (habitualmente PEG): es más cómoda, se desplaza menos y tiene menos riesgo de aspiración que la SNG."},{"id":196,"ex":"Aragón 2º llamamiento · 2022","s":"boca","q":"Para la valoración de la disfagia orofaríngea, se utiliza el test de:","o":["MECV-V.","MNA.","GOLDBERG.","CAMP"],"a":0,"e":"El MECV-V (Método de Exploración Clínica Volumen-Viscosidad) detecta la disfagia orofaríngea: administra bolos de 5, 10 y 20 ml con viscosidades néctar, líquido y pudin, valorando la seguridad (tos, cambio de voz, desaturación ≥ 3%) y la eficacia. El MNA valora la nutrición y el Goldberg, ansiedad y depresión."},{"id":197,"ex":"Euskadi A · 2022","s":"intestino","q":"¿Cuál es el proceso inflamatorio no transmural con afectación superficial del colon caracterizado por múltiples ulceraciones, inflamaciones difusas, descamación del epitelio del colon manifestado por hemorragia rectal, dolor abdominal en cuadrante inferior izquierdo, exacerbaciones y remisiones?:","o":["Ulcera péptica.","Enfermedad de Crohn.","Colitis ulcerosa.","Gastritis."],"a":2,"e":"Inflamación no transmural, superficial, continua y limitada al colon, con úlceras, rectorragia, dolor en fosa iliaca izquierda y brotes y remisiones: es la colitis ulcerosa. El Crohn es transmural y segmentario."},{"id":198,"ex":"Euskadi A · 2022","s":"valor","q":"¿Cómo definimos la MELENA? :","o":["Emisión de sangre roja por esfínter anal, generalmente originada en la parte baja de tubo digestivo.","Presencia de sangre roja en heces, no modificada por la acción de los fermentos digestivos.","Emisión de sangre digerida por el ano. Deposiciones pegajosas y de un olor fétido característico que provienen generalmente del tracto digestivo superior.","Vómito de sangre o coágulos procedentes de la parte alta del tubo digestivo."],"a":2,"e":"Melena: emisión por el ano de sangre DIGERIDA, en forma de heces negras, pegajosas y de olor fétido, que suele proceder del tracto digestivo superior. La opción 1 define la rectorragia, la 2 la hematoquecia y la 4 la hematemesis."},{"id":199,"ex":"Extremadura 1 TL y discap · 2022","s":"sondas","q":"Con respecto al sondaje nasogástrico señala la opción FALSA:","o":["Está recomendada en pacientes con esófago obstruido o perforación esofágica.","Está indicado su uso para aliviar y/o prevenir la distensión gástrica en caso posible de obstrucción intestinal.","Se usa para alimentar a un paciente cuando no puede por vía oral.","Su uso está indicado para prevenir la broncoaspiración en pacientes intubados."],"a":0,"e":"La obstrucción o perforación esofágica es una CONTRAINDICACIÓN del sondaje nasogástrico, no una indicación. La SNG sí está indicada para descomprimir el estómago en la obstrucción intestinal, alimentar a quien no puede comer y reducir el riesgo de aspiración en pacientes intubados."},{"id":200,"ex":"Extremadura 1 TL y discap · 2022","s":"valor","q":"La presencia de sangre roja y/o coágulos junto con las heces se denomina:","o":["Hematoquecia.","Hemorragia oculta crónica.","Melenas.","Hematemesis."],"a":0,"e":"La hematoquecia es la emisión de sangre roja, con o sin coágulos, mezclada con las heces. Suele indicar un origen bajo o un sangrado alto muy masivo con tránsito rápido. Las melenas son negras y la hematemesis es el vómito de sangre."},{"id":201,"ex":"Extremadura 1 TL y discap · 2022","s":"estom","q":"Al conjunto de signos y síntomas que aparecen tras una gastrectomía por un vaciamiento rápido del contenido gástrico se conoce como:","o":["Síndrome de Dumping.","Síndrome de Mallory-Weiss.","Síndrome de abdomen agudo.","Síndrome de íleo paralítico."],"a":0,"e":"El síndrome de dumping es el conjunto de síntomas vasomotores (sudoración, palpitaciones, rubor) y digestivos (plenitud, diarrea) por el vaciamiento rápido del contenido gástrico tras una gastrectomía. El Mallory-Weiss es un desgarro esófago-gástrico por vómitos intensos."},{"id":202,"ex":"Extremadura 1 TL y discap · 2022","s":"boca","q":"Para la realización del Test clínico volumen- viscosidad (MECV-V), se utilizan tres viscosidades entre las que NO se encuentra:","o":["Néctar.","Pudding.","Miel.","Líquido."],"a":null,"e":"Pregunta ANULADA, probablemente porque «miel» se usa como sinónimo de viscosidades espesas en algunas guías. En el MECV-V del Dr. Clavé las viscosidades son tres: NÉCTAR (se empieza por ella, con 5 ml), LÍQUIDO y PUDIN. Si hay alteración de la seguridad con néctar se salta el líquido y se pasa a pudin.","st":"N"},{"id":203,"ex":"Extremadura 2 TL y discap · 2022","s":"intestino","q":"Indique ¿qué tipo de prevención se realiza en el programa de detección precoz de cáncer colorrectal?:","o":["Prevención primaria.","Prevención secundaria.","Prevención terciaria.","Prevención cuaternaria."],"a":1,"e":"El cribado detecta la enfermedad en fase preclínica (pólipos o cáncer precoz) en personas asintomáticas para tratarla antes: es prevención SECUNDARIA. La primaria evita que aparezca (dieta, ejercicio) y la terciaria reduce las secuelas (seguimiento tras el tratamiento)."},{"id":204,"ex":"Extremadura 2 TL y discap · 2022","s":"higado","q":"La clasificación de “Child-Pugh” está relacionada según cartera de servicios de SES con:","o":["Tabaquismo.","Insuficiencia renal aguda.","Severidad de enfermedad hepática.","EPOC ."],"a":2,"e":"La clasificación de Child-Pugh mide la gravedad y el pronóstico de la cirrosis con bilirrubina, albúmina, tiempo de protrombina, ascitis y encefalopatía (clases A, B y C). El sistema MELD usa creatinina, bilirrubina e INR para priorizar el trasplante."},{"id":205,"ex":"Extremadura 2 TL y discap · 2022","s":"ostom","q":"¿Cuál de las siguientes ostomías se realiza con el fin de la nutrición del paciente?:","o":["Yeyunostomía.","Ileostomía.","Colostomía.","Nefrostomía."],"a":0,"e":"La yeyunostomía es una ostomía de nutrición: la sonda se coloca en el yeyuno para administrar alimentación enteral (por ejemplo, cuando el estómago no se puede usar). La ileostomía y la colostomía son de eliminación digestiva y la nefrostomía, urinaria."},{"id":206,"ex":"Extremadura 2 TL y discap · 2022","s":"boca","q":"A la inflamación de las glándulas salivares se le denomina:","o":["Sialatorrea.","Sialadenitis.","Sialacistitis.","Salidanitis."],"a":1,"e":"Sialadenitis (o sialoadenitis) es la inflamación de las glándulas salivales. La causa infecciosa más frecuente es el virus de la parotiditis y la autoinmune, el síndrome de Sjögren. La sialolitiasis son cálculos y la sialoadenosis, un aumento de tamaño no inflamatorio."},{"id":207,"ex":"Extremadura 2 TL y discap · 2022","s":"boca","q":"Al dolor agudo que se produce con la deglución se le denomina:","o":["Odinofagia.","Afagia.","Disfagia.","Aerofagia."],"a":0,"e":"La odinofagia es el dolor al tragar. La afagia es la imposibilidad completa de deglutir (la causa más frecuente es la impactación del bolo), la disfagia es la dificultad para tragar y la aerofagia, la deglución excesiva de aire."},{"id":208,"ex":"Extremadura 2 TL y discap · 2022","s":"sondas","q":"No es un tipo de Sonda Nasogástrica:","o":["Salem.","Levin.","Robinson.","Miller-Abbott."],"a":2,"e":"La Robinson (o Nelaton) es una sonda recta de un solo uso, vesical o rectal, no una sonda nasogástrica. Salem y Levin son nasogástricas y la Miller-Abbott, nasoentérica."},{"id":209,"ex":"Comunidad Valenciana · 2022","s":"agudo","q":"Acude a la consulta de urgencias, un paciente de 18 años que refiere dolor periumbilical sordo, junto con náuseas y vómitos. El dolor es persistente y continuo, y se localiza en el punto medio entre el ombligo y la cresta ilíaca derecha, usted sabe que ese punto recibe el nombre de:","o":["Punto de Chandeleir.","Punto de McBurney.","Punto de Cruveilhier.","Punto de Mannkopf."],"a":1,"e":"El punto de McBurney está en la unión del tercio externo con los dos tercios internos de la línea que une el ombligo con la espina iliaca anterosuperior derecha. Es la proyección de la base del apéndice y el punto de máximo dolor en la apendicitis, que empieza periumbilical y migra a la fosa iliaca derecha."},{"id":210,"ex":"Comunidad Valenciana · 2022","s":"intestino","q":"El Programa de Prevención de cáncer colorrectal de la Comunitat Valenciana plantea, para la investigación de los TSOH positivos, la colonoscopia sin ingreso hospitalario. En este sentido es correcto:","o":["La preparación utilizada para la limpieza de colon puede ser preparación con polietilenglicol (PEG), fosfato disódico o citrato magnésico.","En ningún caso se planteará el uso de enemas de limpieza para las pruebas del cribado.","Según la escala de Aronchick para evaluar el grado de limpieza del colon, una preparación excelente es aquella en el que el colon presente algunos restos fecales semisólidos aspirables para explorar el 90 % del colon.","Para las colonoscopias de cribado no se requiere la suspensión de ningún fármaco que lleve el paciente de forma crónica."],"a":0,"e":"Para la colonoscopia ambulatoria se usan preparaciones con polietilenglicol, fosfato disódico o citrato magnésico. Los enemas pueden ser necesarios si la limpieza no es adecuada. En la escala de Aronchick, la preparación EXCELENTE deja solo pequeños restos de líquido claro. Y sí se ajustan fármacos como anticoagulantes o hierro."},{"id":211,"ex":"Aragón · 2022","s":"intestino","q":"Según el programa de detección precoz del cáncer de colon del Gobierno de Aragón, señale la respuesta correcta:","o":["La población diana incluye a hombres y mujeres de 50 a 69 años, iniciándose por edades comprendidas entre los 60 y 69 años.","La prueba de sangre oculta en heces se realiza cada tres años.","Para la realización de la prueba de sangre oculta en heces hay que realizar una dieta pobre en residuos las 24 horas previas.","Se puede realizar esta prueba si tiene la menstruación siempre y cuando realice un correcto lavado genital."],"a":0,"e":"En Aragón la población diana es de 50 a 69 años, y el programa se implantó empezando por las edades de 60 a 69. El FIT se repite cada 2 AÑOS, NO requiere dieta previa y no debe hacerse durante la menstruación ni con hemorroides sangrantes (se espera 3 días sin sangrado)."},{"id":212,"ex":"Aragón · 2022","s":"sondas","q":"¿En qué posición se debería situar a una paciente para insertarle una sonda nasogástrica?:","o":["En la que esté más cómoda.","En decúbito supino.","En posición de Fowler.","En decúbito prono."],"a":2,"e":"La SNG se inserta con el paciente en Fowler (sentado, cabecero a 45° o más) y el cuello ligeramente flexionado hacia delante al avanzar: facilita la deglución, dirige la sonda al esófago y reduce la aspiración si vomita."},{"id":213,"ex":"Navarra · 2022","s":"intestino","q":"¿A qué tipo de incontinencia fecal suelen asociarse las demencias?:","o":["Incontinencia neurógena.","Incontinencia funcional.","Incontinencia por sobrecarga del esfínter.","Incontinencia por rebosamiento."],"a":1,"e":"En las demencias es típica la incontinencia FUNCIONAL: el aparato esfinteriano funciona, pero el paciente no reconoce la necesidad, no localiza el baño o no puede desvestirse a tiempo. La incontinencia por rebosamiento se asocia al fecaloma."},{"id":214,"ex":"Navarra · 2022","s":"estom","q":"¿Cuál de los siguientes enunciados no es correcto, en relación con la clínica de las úlceras gástricas y duodenales?:","o":["El dolor en la úlcera duodenal se alivia con la ingesta o con antiácidos.","El dolor en las úlceras duodenales se localiza en epigastrio.","En la úlcera gástrica, el dolor no se alivia habitualmente con la ingesta de alimentos.","El dolor en las úlceras gástricas se localiza en hipogastrio."],"a":3,"e":"El dolor de ambas úlceras (gástrica y duodenal) es EPIGÁSTRICO, no hipogástrico. Diferencias: la duodenal duele 1,5-3 h tras comer y se alivia con la ingesta; la gástrica duele a los 20-30 min y no se alivia (incluso empeora) con la comida."},{"id":215,"ex":"Navarra aplazado · 2022","s":"ostom","q":"Entre las complicaciones de los estomas, aquella que se caracteriza por presentar un estoma elongado y edematoso con retorno deficiente de la solución de irrigación se denomina:","o":["Prolapso.","Retracción.","Ulceración.","Herniación."],"a":0,"e":"El prolapso es la protrusión excesiva del intestino a través del estoma: se ve alargado y edematoso, y dificulta la irrigación (el líquido retorna mal). Se intenta reducir manualmente con el paciente tumbado (frío o azúcar para el edema); si no se consigue, se valora la cirugía. La retracción es lo contrario: el estoma queda por debajo de la piel."},{"id":216,"ex":"Andalucía aplazado TL · 2022","s":"sondas","q":"La posición correcta para realizar un lavado gástrico en un paciente consciente e intoxicado es:","o":["Sentado en ángulo de 90º con hiperextensión del cuello.","Decúbito lateral izquierdo y en Trendelenburg 10º-15º.","Decúbito lateral derecho y en Trendelenburg 10º-15º.","Da igual la postura, lo importante es administrar carbón activado."],"a":1,"e":"El lavado gástrico se hace en decúbito lateral IZQUIERDO con ligero Trendelenburg (10-15°): el píloro queda más alto, se retrasa el paso del tóxico al duodeno y, si vomita, el contenido sale por la boca y no va a la vía aérea. Nunca con el cuello hiperextendido."},{"id":217,"ex":"Andalucía aplazado TL · 2022","s":"sondas","q":"Observamos que Mario tiene dificultad para la deglución, por lo que será necesario ponerle una sonda nasogástrica. Señale la respuesta incorrecta respecto a este procedimiento:","o":["Explicar a Mario lo que vamos a hacer y colocarlo en posición de Roser.","Nos puede servir tanto para aspirar el contenido gastrointestinal, como para descomprimirlo, hacer un lavado gástrico, introducir alimentación o medicamentos.","Está contraindicada en caso de fractura facial o de la base del cráneo.","La medición correcta sería desde la punta de la nariz a la apófisis mastoides y de aquí al apéndice xifoides."],"a":0,"e":"La posición de Roser (decúbito supino con la cabeza colgando en hiperextensión) se usa, por ejemplo, en la cirugía de tiroides. Para la SNG se usa Fowler con el cuello en ligera flexión. La SNG sirve para aspirar, descomprimir, lavar, alimentar y dar medicación, y está contraindicada en fracturas faciales o de la base del cráneo."},{"id":218,"ex":"Castilla y León PI · 2023","s":"intestino","q":"En la diarrea de tipo secretor aparece una de las siguientes manifestaciones fisiopatológicas:","o":["El pH de las heces es ácido.","La osmolaridad de las heces es normal.","El hiato osmolal de las heces es elevado.","La diarrea cede con el ayuno."],"a":1,"e":"En la diarrea SECRETORA el intestino secreta agua y electrolitos (toxinas, tumores): las heces tienen osmolaridad normal, pH normal, gran volumen, y la diarrea NO cede con el ayuno. En la OSMÓTICA (solutos no absorbibles) el pH es ácido, el hiato osmolal está elevado y la diarrea sí cede con el ayuno."},{"id":219,"ex":"Castilla y León PI · 2023","s":"intestino","q":"En la escala de heces de Bristol, el tipo 4 corresponde con:","o":["Estreñimiento importante.","Falta de fibra.","Diarrea importante.","Heces normales."],"a":3,"e":"Bristol tipo 4: «como una salchicha o serpiente, lisa y blanda» = heces normales e ideales. Los tipos 1-2 indican estreñimiento, el 5 falta de fibra y los 6-7 diarrea."},{"id":220,"ex":"Castilla y León Servicios sociales · 2023","s":"sondas","q":"De las siguientes sondas de nutrición enteral, ¿cuál es una sonda nasogástrica?:","o":["Sonda de Miller Abbott.","Sonda de Cantor.","Sonda de Salem.","Sonda de Foley."],"a":2,"e":"La Salem es una sonda nasogástrica de doble luz (una de aspiración y otra de entrada de aire que evita que la mucosa se adhiera). Miller-Abbott y Cantor son nasoentéricas largas para descompresión intestinal y la Foley es vesical."},{"id":221,"ex":"Castilla y León Servicios sociales · 2023","s":"sondas","q":"Las contraindicaciones a la intubación nasogástrica incluyen:","o":["Coma o depresión del sensorio.","Desnutrición calórico-proteica grave.","Traumatismo maxilofacial grave.","Hipertensión arterial."],"a":2,"e":"El traumatismo maxilofacial grave (o la fractura de la base del cráneo) contraindica la vía nasal por riesgo de falsa vía, incluso intracraneal: se usa la vía orogástrica. El coma no la contraindica (se protege antes la vía aérea) y la desnutrición es, al contrario, una indicación de nutrición por sonda."},{"id":222,"ex":"Castilla y León Servicios sociales · 2023","s":"bilipan","q":"El signo de Murphy es indicativo de:","o":["Apendicitis.","Diverticulitis.","Colecistitis.","Úlcera gástrica."],"a":2,"e":"Signo de Murphy: al presionar bajo el reborde costal derecho mientras el paciente inspira profundamente, la vesícula inflamada desciende, choca con los dedos y el dolor detiene la inspiración. Es característico de la colecistitis aguda."},{"id":223,"ex":"Galicia · 2023","s":"sondas","q":"Para la compresión de las varices esofágicas sangrantes, se utiliza la sonda:","o":["Salem.","Sengstaken-Blakemore.","Miller-Abbot.","Levin."],"a":1,"e":"La sonda de Sengstaken-Blakemore (3 vías y 2 balones) comprime las varices esofágicas sangrantes: el balón gástrico se ancla en el cardias y el esofágico comprime directamente las varices. Se usa como puente cuando fallan los fármacos y la endoscopia."},{"id":224,"ex":"Galicia · 2023","s":"ostom","q":"Las heces que se expulsan por una ileostomía son:","o":["No se expulsan heces.","Semisólidas y escasas.","Líquidas y continuas.","Sólidas."],"a":2,"e":"Por la ileostomía salen heces LÍQUIDAS (pastosas cuando se adapta), de forma continua, ricas en enzimas digestivas e irritantes para la piel, porque no pasan por el colon, que es quien absorbe el agua. Por eso se usan bolsas abiertas (vaciables) y se vigila la deshidratación."},{"id":225,"ex":"Galicia · 2023","s":"sondas","q":"Para administrar un enema, señale cuál sería la posición correcta:","o":["Decúbito lateral derecho.","Decúbito prono.","Posición genupectoral.","Posición de Sims."],"a":3,"e":"La posición de Sims (decúbito lateral izquierdo, pierna derecha flexionada) es la de elección para el enema: aprovecha la anatomía del sigma y el colon descendente, que quedan en declive, para que la solución fluya y se retenga."},{"id":226,"ex":"Galicia · 2023","s":"intestino","q":"La enfermedad de Crohn se caracteriza por todo lo siguiente, excepto una, indíquela:","o":["Es una afectación inflamatoria de todo el tubo digestivo.","Es una enfermedad crónica.","Afecta solo a la mucosa del colon.","Afecta a toda la pared del intestino, no solo a la mucosa."],"a":2,"e":"La enfermedad de Crohn NO afecta solo a la mucosa del colon: es transmural (toda la pared) y puede afectar a cualquier segmento del tubo digestivo, de la boca al ano. Es crónica, con brotes. Afectar solo a la mucosa es más propio de la colitis ulcerosa."},{"id":227,"ex":"Galicia · 2023","s":"ostom","q":"Señale lo incorrecto con respecto a los cuidados de una sonda PEG (gastrostomía endoscópica percutánea):","o":["El paciente puede ducharse sin protección pasada una semana desde su colocación, siempre que el estoma no presente ninguna complicación.","Se debe de inspeccionar diariamente la zona de la inserción.","Los medicamentos administrados a través de ella, se deben de mezclar con la alimentación, para facilitar su dilución.","Girar diariamente la sonda para que no quede adherida a la piel."],"a":2,"e":"Los fármacos NO deben mezclarse con la nutrición: pueden precipitar, obstruir la sonda e interactuar. Se administran por separado, uno a uno, lavando con agua antes y después. La inspección diaria del estoma, el giro diario de la sonda y la ducha a partir de la semana (sin complicaciones) sí son correctos.","ns":1},{"id":228,"ex":"Defensa Estabilización · 2023","s":"anat","q":"El peritoneo parietal cubre:","o":["Cara inferior del diafragma.","Estómago.","Hígado.","Riñones."],"a":0,"e":"El peritoneo PARIETAL tapiza la cara interna de la pared abdominal y la cara inferior del diafragma. El peritoneo VISCERAL (serosa) recubre órganos como el estómago y el hígado. Los riñones son retroperitoneales."},{"id":229,"ex":"Defensa Examen libre · 2023","s":"anat","q":"La arteria esplénica es rama de:","o":["La arteria mesentérica inferior.","La arteria cólica media.","El tronco celiaco.","Es una rama de la arteria esofágica inferior."],"a":2,"e":"El tronco celíaco se divide en tres ramas: arteria gástrica izquierda, arteria ESPLÉNICA y arteria hepática común. Irriga el esófago abdominal, el estómago, el duodeno, el hígado, la vesícula, el páncreas y el bazo."},{"id":230,"ex":"Defensa Examen libre · 2023","s":"intestino","q":"Un paciente con diverticulosis, al contrario que con diverticulitis:","o":["Tiene hemorragias rectales.","No suele tener síntomas.","Tiene dolor espástico localizado.","Frecuentemente desarrolla peritonitis."],"a":1,"e":"La diverticulosis (presencia de divertículos sin inflamación) suele ser ASINTOMÁTICA y se descubre casualmente. Cuando un divertículo se inflama (diverticulitis) aparecen dolor en fosa iliaca izquierda, fiebre y posibles complicaciones como absceso o peritonitis. Es la primera causa de HDB."},{"id":231,"ex":"Defensa Examen libre · 2023","s":"ostom","q":"¿Qué es la Bolsa de Kock?:","o":["Una Proctocolectomía.","Una colostomía sigmoide.","Una colostomía trasversa.","Una ileostomía continente."],"a":3,"e":"La bolsa (saco) de Kock es una ileostomía continente: se crea un reservorio interno con íleon que se aboca a la piel mediante una válvula en forma de pezón autosellante. El paciente la vacía varias veces al día con una sonda, sin llevar bolsa externa."},{"id":232,"ex":"Defensa Examen - Extraordinario · 2023","s":"estom","q":"¿Qué vitamina será necesario suplementar en caso de gastrectomía total por una falta del factor intrínseco necesario para su absorción intestinal?:","o":["B1.","B12.","B6.","E."],"a":1,"e":"Tras una gastrectomía total desaparecen las células parietales, que producen el factor intrínseco. Sin él no se absorbe la vitamina B12 en el íleon, por lo que hay que suplementarla por vía parenteral (intramuscular) de por vida para evitar la anemia megaloblástica y las alteraciones neurológicas."},{"id":233,"ex":"Defensa Examen - Extraordinario · 2023","s":"anat","q":"La vena porta está formada por:","o":["La coronaria estomáquica y la vena mesentérica inferior.","La vena mesentérica superior y la vena esplénica.","Por la unión de las venas esofágica inferior y la vena mesentérica inferior.","Es una rama de la vena cava."],"a":1
