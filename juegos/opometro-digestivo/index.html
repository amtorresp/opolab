 insuficiencia renal y el síndrome hepatorrenal, la retención de sodio, la resistencia a los diuréticos y el sangrado digestivo. Sí se controla la diuresis, los electrolitos y se repone albúmina tras la paracentesis.","a":2},{"id":190,"ex":"Castilla - La Mancha · 2022","org":"Castilla-La Mancha","y":2022,"s":"intestino","t":"eii","q":"En un paciente ingresado con un brote activo de colitis ulcerosa, podríamos identificar en nuestra valoración los siguientes diagnósticos de enfermería, EXCEPTO:","o":["Desequilibrio nutricional por ingesta inferior a las necesidades relacionado con restricciones dietéticas y malabsorción.","Déficit de volumen de líquidos relacionado con anorexia y diarrea.","Alteraciones de la imagen corporal relacionadas con los cambios de funcionamiento del cuerpo.","Riesgo de deterioro de la integridad tisular por fisuras o fístulas en el intestino delgado."],"e":"Las fisuras y las fístulas son propias de la enfermedad de Crohn (afectación transmural), no de la colitis ulcerosa, que es superficial y se limita al colon y el recto. En un brote de CU sí son esperables la desnutrición, el déficit de volumen por la diarrea y la alteración de la imagen corporal.","tr":"cucrohn","a":3,"po":["Aplicable: la diarrea y la anorexia desnutren.","Aplicable: la diarrea deshidrata.","Aplicable: la enfermedad crónica afecta a la imagen corporal.",""]},{"id":191,"ex":"Castilla - La Mancha - Llamamiento extraordinario · 2022","org":"Castilla-La Mancha","y":2022,"s":"sondas","t":"enemas","q":"Para la administración de un enema en un paciente encamado colocaremos al paciente, siempre que sea posible, en la posición:","o":["Decúbito lateral derecho.","Sims.","Litotomía.","Fowler."],"e":"El enema se administra en posición de Sims (decúbito lateral IZQUIERDO con la rodilla derecha flexionada): la solución fluye por gravedad siguiendo la curva del recto y el sigma hacia el colon descendente, que queda en declive, y se retiene mejor.","tr":"posiciones","a":1,"po":["El lado derecho no sigue la anatomía del sigma.","","La litotomía es para la exploración ginecológica o perineal.","Fowler (sentado) dificulta la retención del enema."]},{"id":192,"ex":"Castilla - La Mancha - Llamamiento extraordinario · 2022","org":"Castilla-La Mancha","y":2022,"s":"higado","t":"encefalo","q":"Ante un paciente hospitalizado por cirrosis hepática que presenta síntomas de deterioro del estado mental, alteración de la conciencia y/o comportamiento agresivo durante la vigilia, debemos sospechar del desarrollo de:","o":["Hemorragia digestiva alta por varices esofágicas.","Encefalopatía hepática.","Hemorragia digestiva alta por úlcera gástrica/duodenal.","Ascitis."],"e":"Las alteraciones del estado mental, de la conciencia o del comportamiento (confusión, agresividad, inversión del ritmo del sueño, asterixis) en un cirrótico deben hacer sospechar una encefalopatía hepática, por acumulación de amoniaco y otras toxinas que el hígado no depura.","tr":"encefalo","a":1,"po":["La HDA da hematemesis, melenas e hipotensión, no alteraciones de conducta (aunque puede DESENCADENAR una encefalopatía).","","La úlcera sangrante no explica el cuadro mental por sí misma.","La ascitis da distensión, no clínica neurológica."]},{"id":193,"ex":"Castilla - La Mancha - Llamamiento extraordinario · 2022","org":"Castilla-La Mancha","y":2022,"s":"sondas","t":"sng","q":"Señale cuál de las siguientes es una contraindicación absoluta del sondaje nasogástrico:","o":["Varices esofágicas y esofagitis.","Disminución del nivel de conciencia.","Intubación orotraqueal.","Ingestión de ácidos o álcalis."],"e":"La ingesta de cáusticos (ácidos o álcalis) contraindica de forma ABSOLUTA el sondaje: puede perforar un esófago lesionado e inducir el vómito, que vuelve a quemar la mucosa. Las varices son una contraindicación relativa y la disminución de conciencia obliga a proteger antes la vía aérea. La intubación es una indicación.","tr":"contraindica","a":3,"po":["Las varices son una contraindicación relativa.","La disminución de conciencia no es absoluta: se protege antes la vía aérea.","La intubación es una INDICACIÓN de SNG.",""]},{"id":194,"ex":"Aragón 2º llamamiento · 2022","org":"Aragón","y":2022,"s":"intestino","t":"eliminacion","q":"Según la guía de buenas prácticas de la RNAO 2020 sobre el manejo vesical e intestinal en adultos, ¿cuál no corresponde a un subtítulo de tipo de incontinencia intestinal?","o":["Incontinencia intestinal pasiva.","Incontinencia intestinal de urgencia.","Incontinencia intestinal funcional.","Incontinencia intestinal emocional."],"e":"La guía RNAO 2020 diferencia tres tipos de incontinencia intestinal: PASIVA (pérdida sin aviso, por disfunción del esfínter interno), de URGENCIA (no puede posponer la defecación, por disfunción del esfínter externo) y FUNCIONAL (por limitaciones de movilidad o del entorno). La «emocional» no existe.","a":3},{"id":195,"ex":"Aragón 2º llamamiento · 2022","org":"Aragón","y":2022,"s":"ostom","t":"peg","q":"La colocación de una ostomía viene definida principalmente por la duración del soporte nutricional por vía enteral, es decir, periodos superiores a 4-6 semanas. Indica, en este caso, cuál es la ostomía de elección preferente:","o":["Duodenostomía.","Gastrostomía.","Faringostomía.","Esofagostomía."],"e":"Si la nutrición enteral va a durar más de 4-6 semanas, se prefiere una ostomía a la sonda nasal, y la de elección es la gastrostomía (habitualmente PEG): es más cómoda, se desplaza menos y tiene menos riesgo de aspiración que la SNG.","a":1},{"id":196,"ex":"Aragón 2º llamamiento · 2022","org":"Aragón","y":2022,"s":"boca","t":"disfagia","q":"Para la valoración de la disfagia orofaríngea, se utiliza el test de:","o":["MECV-V.","MNA.","GOLDBERG.","CAMP."],"e":"El MECV-V (Método de Exploración Clínica Volumen-Viscosidad) detecta la disfagia orofaríngea: administra bolos de 5, 10 y 20 ml con viscosidades néctar, líquido y pudin, valorando la seguridad (tos, cambio de voz, desaturación ≥ 3%) y la eficacia. El MNA valora la nutrición y el Goldberg, ansiedad y depresión.","a":0},{"id":197,"ex":"Euskadi A · 2022","org":"País Vasco","y":2022,"s":"intestino","t":"ulcera","q":"¿Cuál es el proceso inflamatorio no transmural con afectación superficial del colon caracterizado por múltiples ulceraciones, inflamaciones difusas, descamación del epitelio del colon manifestado por hemorragia rectal, dolor abdominal en cuadrante inferior izquierdo, exacerbaciones y remisiones?","o":["Úlcera péptica.","Enfermedad de Crohn.","Colitis ulcerosa.","Gastritis."],"e":"Inflamación no transmural, superficial, continua y limitada al colon, con úlceras, rectorragia, dolor en fosa iliaca izquierda y brotes y remisiones: es la colitis ulcerosa. El Crohn es transmural y segmentario.","tr":"cucrohn","a":2,"po":["La úlcera péptica es gástrica o duodenal, no del colon.","El Crohn es transmural y segmentario.","","La gastritis afecta al estómago."]},{"id":198,"ex":"Euskadi A · 2022","org":"País Vasco","y":2022,"s":"valor","t":"hemorragia","q":"¿Cómo definimos la MELENA?","o":["Emisión de sangre roja por esfínter anal, generalmente originada en la parte baja de tubo digestivo.","Presencia de sangre roja en heces, no modificada por la acción de los fermentos digestivos.","Emisión de sangre digerida por el ano. Deposiciones pegajosas y de un olor fétido característico que provienen generalmente del tracto digestivo superior.","Vómito de sangre o coágulos procedentes de la parte alta del tubo digestivo."],"e":"Melena: emisión por el ano de sangre DIGERIDA, en forma de heces negras, pegajosas y de olor fétido, que suele proceder del tracto digestivo superior. La opción a define la rectorragia, la b la hematoquecia y la d la hematemesis.","a":2,"ns":1},{"id":199,"ex":"Extremadura 1 TL y discap · 2022","org":"Extremadura","y":2022,"s":"sondas","t":"sng","q":"Con respecto al sondaje nasogástrico señala la opción FALSA:","o":["Está recomendada en pacientes con esófago obstruido o perforación esofágica.","Está indicado su uso para aliviar y/o prevenir la distensión gástrica en caso posible de obstrucción intestinal.","Se usa para alimentar a un paciente cuando no puede por vía oral.","Su uso está indicado para prevenir la broncoaspiración en pacientes intubados."],"e":"La obstrucción o perforación esofágica es una CONTRAINDICACIÓN del sondaje nasogástrico, no una indicación. La SNG sí está indicada para descomprimir el estómago en la obstrucción intestinal, alimentar a quien no puede comer y reducir el riesgo de aspiración en pacientes intubados.","tr":"contraindica","a":0,"po":["","Es cierto: indicada para descomprimir en la obstrucción.","Es cierto: indicada para alimentar.","Es cierto: reduce la aspiración en intubados."]},{"id":200,"ex":"Extremadura 1 TL y discap · 2022","org":"Extremadura","y":2022,"s":"valor","t":"hemorragia","q":"La presencia de sangre roja y/o coágulos junto con las heces se denomina:","o":["Hematoquecia.","Hemorragia oculta crónica.","Melenas.","Hematemesis."],"e":"La hematoquecia es la emisión de sangre roja, con o sin coágulos, mezclada con las heces. Suele indicar un origen bajo o un sangrado alto muy masivo con tránsito rápido. Las melenas son negras y la hematemesis es el vómito de sangre.","a":0},{"id":201,"ex":"Extremadura 1 TL y discap · 2022","org":"Extremadura","y":2022,"s":"estom","t":"dumping","q":"Al conjunto de signos y síntomas que aparecen tras una gastrectomía por un vaciamiento rápido del contenido gástrico se conoce como:","o":["Síndrome de Dumping.","Síndrome de Mallory-Weiss.","Síndrome de abdomen agudo.","Síndrome de íleo paralítico."],"e":"El síndrome de dumping es el conjunto de síntomas vasomotores (sudoración, palpitaciones, rubor) y digestivos (plenitud, diarrea) por el vaciamiento rápido del contenido gástrico tras una gastrectomía. El Mallory-Weiss es un desgarro esófago-gástrico por vómitos intensos.","a":0},{"id":203,"ex":"Extremadura 2 TL y discap · 2022","org":"Extremadura","y":2022,"s":"intestino","t":"ccr","q":"Indique ¿qué tipo de prevención se realiza en el programa de detección precoz de cáncer colorrectal?","o":["Prevención primaria.","Prevención secundaria.","Prevención terciaria.","Prevención cuaternaria."],"e":"El cribado detecta la enfermedad en fase preclínica (pólipos o cáncer precoz) en personas asintomáticas para tratarla antes: es prevención SECUNDARIA. La primaria evita que aparezca (dieta, ejercicio) y la terciaria reduce las secuelas (seguimiento tras el tratamiento).","a":1},{"id":204,"ex":"Extremadura 2 TL y discap · 2022","org":"Extremadura","y":2022,"s":"higado","t":"cirrosis","q":"La clasificación de «Child-Pugh» está relacionada según cartera de servicios de SES con:","o":["Tabaquismo.","Insuficiencia renal aguda.","Severidad de enfermedad hepática.","EPOC."],"e":"La clasificación de Child-Pugh mide la gravedad y el pronóstico de la cirrosis con bilirrubina, albúmina, tiempo de protrombina, ascitis y encefalopatía (clases A, B y C). El sistema MELD usa creatinina, bilirrubina e INR para priorizar el trasplante.","a":2},{"id":205,"ex":"Extremadura 2 TL y discap · 2022","org":"Extremadura","y":2022,"s":"ostom","t":"ostomias","q":"¿Cuál de las siguientes ostomías se realiza con el fin de la nutrición del paciente?","o":["Yeyunostomía.","Ileostomía.","Colostomía.","Nefrostomía."],"e":"La yeyunostomía es una ostomía de nutrición: la sonda se coloca en el yeyuno para administrar alimentación enteral (por ejemplo, cuando el estómago no se puede usar). La ileostomía y la colostomía son de eliminación digestiva y la nefrostomía, urinaria.","tr":"alimentacion","a":0,"po":["","La ileostomía es de eliminación.","La colostomía es de eliminación.","La nefrostomía es de eliminación urinaria."]},{"id":206,"ex":"Extremadura 2 TL y discap · 2022","org":"Extremadura","y":2022,"s":"boca","t":"bucal","q":"A la inflamación de las glándulas salivares se le denomina:","o":["Sialatorrea.","Sialadenitis.","Sialacistitis.","Salidanitis."],"e":"Sialadenitis (o sialoadenitis) es la inflamación de las glándulas salivales. La causa infecciosa más frecuente es el virus de la parotiditis y la autoinmune, el síndrome de Sjögren. La sialolitiasis son cálculos y la sialoadenosis, un aumento de tamaño no inflamatorio.","a":1},{"id":207,"ex":"Extremadura 2 TL y discap · 2022","org":"Extremadura","y":2022,"s":"boca","t":"disfagia","q":"Al dolor agudo que se produce con la deglución se le denomina:","o":["Odinofagia.","Afagia.","Disfagia.","Aerofagia."],"e":"La odinofagia es el dolor al tragar. La afagia es la imposibilidad completa de deglutir (la causa más frecuente es la impactación del bolo), la disfagia es la dificultad para tragar y la aerofagia, la deglución excesiva de aire.","a":0},{"id":208,"ex":"Extremadura 2 TL y discap · 2022","org":"Extremadura","y":2022,"s":"sondas","t":"sondas_tipos","q":"No es un tipo de sonda nasogástrica:","o":["Salem.","Levin.","Robinson.","Miller-Abbott."],"e":"La Robinson (o Nelaton) es una sonda recta de un solo uso, vesical o rectal, no una sonda nasogástrica. Salem y Levin son nasogástricas y la Miller-Abbott, nasoentérica.","a":2},{"id":209,"ex":"Comunidad Valenciana · 2022","org":"C. Valenciana","y":2022,"s":"agudo","t":"apendic","q":"Acude a la consulta de urgencias, un paciente de 18 años que refiere dolor periumbilical sordo, junto con náuseas y vómitos. El dolor es persistente y continuo, y se localiza en el punto medio entre el ombligo y la cresta ilíaca derecha, usted sabe que ese punto recibe el nombre de:","o":["Punto de Chandeleir.","Punto de McBurney.","Punto de Cruveilhier.","Punto de Mannkopf."],"e":"El punto de McBurney está en la unión del tercio externo con los dos tercios internos de la línea que une el ombligo con la espina iliaca anterosuperior derecha. Es la proyección de la base del apéndice y el punto de máximo dolor en la apendicitis, que empieza periumbilical y migra a la fosa iliaca derecha.","a":1},{"id":210,"ex":"Comunidad Valenciana · 2022","org":"C. Valenciana","y":2022,"s":"intestino","t":"peg","q":"El Programa de Prevención de cáncer colorrectal de la Comunitat Valenciana plantea, para la investigación de los TSOH positivos, la colonoscopia sin ingreso hospitalario. En este sentido es correcto:","o":["La preparación utilizada para la limpieza de colon puede ser preparación con polietilenglicol (PEG), fosfato disódico o citrato magnésico.","En ningún caso se planteará el uso de enemas de limpieza para las pruebas del cribado.","Según la escala de Aronchick para evaluar el grado de limpieza del colon, una preparación excelente es aquella en el que el colon presente algunos restos fecales semisólidos aspirables para explorar el 90 % del colon.","Para las colonoscopias de cribado no se requiere la suspensión de ningún fármaco que lleve el paciente de forma crónica."],"e":"Para la colonoscopia ambulatoria se usan preparaciones con polietilenglicol, fosfato disódico o citrato magnésico. Los enemas pueden ser necesarios si la limpieza no es adecuada. En la escala de Aronchick, la preparación EXCELENTE deja solo pequeños restos de líquido claro. Y sí se ajustan fármacos como anticoagulantes o hierro.","a":0},{"id":211,"ex":"Aragón · 2022","org":"Aragón","y":2022,"s":"intestino","t":"ccr","q":"Según el programa de detección precoz del cáncer de colon del Gobierno de Aragón, señale la respuesta correcta:","o":["La población diana incluye a hombres y mujeres de 50 a 69 años, iniciándose por edades comprendidas entre los 60 y 69 años.","La prueba de sangre oculta en heces se realiza cada tres años.","Para la realización de la prueba de sangre oculta en heces hay que realizar una dieta pobre en residuos las 24 horas previas.","Se puede realizar esta prueba si tiene la menstruación siempre y cuando realice un correcto lavado genital."],"e":"En Aragón la población diana es de 50 a 69 años, y el programa se implantó empezando por las edades de 60 a 69. El FIT se repite cada 2 AÑOS, NO requiere dieta previa y no debe hacerse durante la menstruación ni con hemorroides sangrantes (se espera 3 días sin sangrado).","a":0},{"id":212,"ex":"Aragón · 2022","org":"Aragón","y":2022,"s":"sondas","t":"sng","q":"¿En qué posición se debería situar a una paciente para insertarle una sonda nasogástrica?","o":["En la que esté más cómoda.","En decúbito supino.","En posición de Fowler.","En decúbito prono."],"e":"La SNG se inserta con el paciente en Fowler (sentado, cabecero a 45° o más) y el cuello ligeramente flexionado hacia delante al avanzar: facilita la deglución, dirige la sonda al esófago y reduce la aspiración si vomita.","tr":"posiciones","a":2,"po":["La comodidad no basta: la posición correcta es Fowler.","El decúbito supino aumenta el riesgo de aspiración.","","Prono es inadecuado."]},{"id":213,"ex":"Navarra · 2022","org":"Navarra","y":2022,"s":"intestino","t":"eliminacion","q":"¿A qué tipo de incontinencia fecal suelen asociarse las demencias?","o":["Incontinencia neurógena.","Incontinencia funcional.","Incontinencia por sobrecarga del esfínter.","Incontinencia por rebosamiento."],"e":"En las demencias es típica la incontinencia FUNCIONAL: el aparato esfinteriano funciona, pero el paciente no reconoce la necesidad, no localiza el baño o no puede desvestirse a tiempo. La incontinencia por rebosamiento se asocia al fecaloma.","a":1},{"id":214,"ex":"Navarra · 2022","org":"Navarra","y":2022,"s":"estom","t":"ulcera","q":"¿Cuál de los siguientes enunciados no es correcto, en relación con la clínica de las úlceras gástricas y duodenales?","o":["El dolor en la úlcera duodenal se alivia con la ingesta o con antiácidos.","El dolor en las úlceras duodenales se localiza en epigastrio.","En la úlcera gástrica, el dolor no se alivia habitualmente con la ingesta de alimentos.","El dolor en las úlceras gástricas se localiza en hipogastrio."],"e":"El dolor de ambas úlceras (gástrica y duodenal) es EPIGÁSTRICO, no hipogástrico. Diferencias: la duodenal duele 1,5-3 h tras comer y se alivia con la ingesta; la gástrica duele a los 20-30 min y no se alivia (incluso empeora) con la comida.","tr":"ulceradolor","a":3,"po":["Es cierto: la duodenal se alivia con la comida.","Es cierto: es epigástrico.","Es cierto: la gástrica no se alivia con la comida.",""]},{"id":215,"ex":"Navarra aplazado · 2022","org":"Navarra","y":2022,"s":"ostom","t":"irrigacion","q":"Entre las complicaciones de los estomas, aquella que se caracteriza por presentar un estoma elongado y edematoso con retorno deficiente de la solución de irrigación se denomina:","o":["Prolapso.","Retracción.","Ulceración.","Herniación."],"e":"El prolapso es la protrusión excesiva del intestino a través del estoma: se ve alargado y edematoso, y dificulta la irrigación (el líquido retorna mal). Se intenta reducir manualmente con el paciente tumbado (frío o azúcar para el edema); si no se consigue, se valora la cirugía. La retracción es lo contrario: el estoma queda por debajo de la piel.","a":0},{"id":216,"ex":"Andalucía aplazado TL · 2022","org":"Andalucía","y":2022,"s":"sondas","t":"lavado","q":"La posición correcta para realizar un lavado gástrico en un paciente consciente e intoxicado es:","o":["Sentado en ángulo de 90º con hiperextensión del cuello.","Decúbito lateral izquierdo y en Trendelenburg 10º-15º.","Decúbito lateral derecho y en Trendelenburg 10º-15º.","Da igual la postura, lo importante es administrar carbón activado."],"e":"El lavado gástrico se hace en decúbito lateral IZQUIERDO con ligero Trendelenburg (10-15°): el píloro queda más alto, se retrasa el paso del tóxico al duodeno y, si vomita, el contenido sale por la boca y no va a la vía aérea. Nunca con el cuello hiperextendido.","tr":"posiciones","a":1,"po":["La hiperextensión del cuello facilita la aspiración.","","El lado derecho favorece el paso del tóxico al duodeno.","La postura sí importa; el carbón no sustituye a la protección de la vía aérea."]},{"id":217,"ex":"Andalucía aplazado TL · 2022","org":"Andalucía","y":2022,"s":"sondas","t":"lavado","q":"Observamos que Mario tiene dificultad para la deglución, por lo que será necesario ponerle una sonda nasogástrica. Señale la respuesta incorrecta respecto a este procedimiento:","o":["Explicar a Mario lo que vamos a hacer y colocarlo en posición de Roser.","Nos puede servir tanto para aspirar el contenido gastrointestinal, como para descomprimirlo, hacer un lavado gástrico, introducir alimentación o medicamentos.","Está contraindicada en caso de fractura facial o de la base del cráneo.","La medición correcta sería desde la punta de la nariz a la apófisis mastoides y de aquí al apéndice xifoides."],"e":"La posición de Roser (decúbito supino con la cabeza colgando en hiperextensión) se usa, por ejemplo, en la cirugía de tiroides. Para la SNG se usa Fowler con el cuello en ligera flexión. La SNG sirve para aspirar, descomprimir, lavar, alimentar y dar medicación, y está contraindicada en fracturas faciales o de la base del cráneo.","tr":"posiciones","a":0,"po":["","Es cierto: estas son sus funciones.","Es cierto: está contraindicada en esas fracturas.","Según la clave se admite (punta de la nariz → oreja → xifoides)."]},{"id":218,"ex":"Castilla y León PI · 2023","org":"Castilla y León","y":2023,"s":"intestino","t":"erge","q":"En la diarrea de tipo secretor aparece una de las siguientes manifestaciones fisiopatológicas:","o":["El pH de las heces es ácido.","La osmolaridad de las heces es normal.","El hiato osmolal de las heces es elevado.","La diarrea cede con el ayuno."],"e":"En la diarrea SECRETORA el intestino secreta agua y electrolitos (toxinas, tumores): las heces tienen osmolaridad normal, pH normal, gran volumen, y la diarrea NO cede con el ayuno. En la OSMÓTICA (solutos no absorbibles) el pH es ácido, el hiato osmolal está elevado y la diarrea sí cede con el ayuno.","a":1},{"id":219,"ex":"Castilla y León PI · 2023","org":"Castilla y León","y":2023,"s":"intestino","t":"eliminacion","q":"En la escala de heces de Bristol, el tipo 4 corresponde con:","o":["Estreñimiento importante.","Falta de fibra.","Diarrea importante.","Heces normales."],"e":"Bristol tipo 4: «como una salchicha o serpiente, lisa y blanda» = heces normales e ideales. Los tipos 1-2 indican estreñimiento, el 5 falta de fibra y los 6-7 diarrea.","a":3},{"id":220,"ex":"Castilla y León Servicios sociales · 2023","org":"Castilla y León","y":2023,"s":"sondas","t":"sondas_tipos","q":"De las siguientes sondas de nutrición enteral, ¿cuál es una sonda nasogástrica?","o":["Sonda de Miller-Abbott.","Sonda de Cantor.","Sonda de Salem.","Sonda de Foley."],"e":"La Salem es una sonda nasogástrica de doble luz (una de aspiración y otra de entrada de aire que evita que la mucosa se adhiera). Miller-Abbott y Cantor son nasoentéricas largas para descompresión intestinal y la Foley es vesical.","a":2},{"id":221,"ex":"Castilla y León Servicios sociales · 2023","org":"Castilla y León","y":2023,"s":"sondas","t":"sng","q":"Las contraindicaciones a la intubación nasogástrica incluyen:","o":["Coma o depresión del sensorio.","Desnutrición calórico-proteica grave.","Traumatismo maxilofacial grave.","Hipertensión arterial."],"e":"El traumatismo maxilofacial grave (o la fractura de la base del cráneo) contraindica la vía nasal por riesgo de falsa vía, incluso intracraneal: se usa la vía orogástrica. El coma no la contraindica (se protege antes la vía aérea) y la desnutrición es, al contrario, una indicación de nutrición por sonda.","tr":"contraindica","a":2,"po":["El coma no contraindica: se intuba y se sonda.","La desnutrición es una indicación de nutrición por sonda.","","La hipertensión arterial no tiene relación."]},{"id":222,"ex":"Castilla y León Servicios sociales · 2023","org":"Castilla y León","y":2023,"s":"bilipan","t":"biliar","q":"El signo de Murphy es indicativo de:","o":["Apendicitis.","Diverticulitis.","Colecistitis.","Úlcera gástrica."],"e":"Signo de Murphy: al presionar bajo el reborde costal derecho mientras el paciente inspira profundamente, la vesícula inflamada desciende, choca con los dedos y el dolor detiene la inspiración. Es característico de la colecistitis aguda.","tr":"charcot","a":2,"po":["En la apendicitis se usan McBurney, Blumberg y Rovsing.","La diverticulitis da dolor en FII, sin Murphy.","","La úlcera gástrica no tiene un signo de Murphy."]},{"id":223,"ex":"Galicia · 2023","org":"Galicia","y":2023,"s":"sondas","t":"sondas_tipos","q":"Para la compresión de las varices esofágicas sangrantes, se utiliza la sonda:","o":["Salem.","Sengstaken-Blakemore.","Miller-Abbott.","Levin."],"e":"La sonda de Sengstaken-Blakemore (3 vías y 2 balones) comprime las varices esofágicas sangrantes: el balón gástrico se ancla en el cardias y el esofágico comprime directamente las varices. Se usa como puente cuando fallan los fármacos y la endoscopia.","tr":"balones","a":1,"po":["Salem: aspiración gástrica.","","Miller-Abbott: descompresión intestinal.","Levin: aspiración y nutrición."]},{"id":224,"ex":"Galicia · 2023","org":"Galicia","y":2023,"s":"ostom","t":"heces_ostomia","q":"Las heces que se expulsan por una ileostomía son:","o":["No se expulsan heces.","Semisólidas y escasas.","Líquidas y continuas.","Sólidas."],"e":"Por la ileostomía salen heces LÍQUIDAS (pastosas cuando se adapta), de forma continua, ricas en enzimas digestivas e irritantes para la piel, porque no pasan por el colon, que es quien absorbe el agua. Por eso se usan bolsas abiertas (vaciables) y se vigila la deshidratación.","tr":"distal","a":2,"po":["Sí se expulsan heces.","Semisólidas: corresponde a colostomías distales.","","Sólidas: sigmoidostomía."]},{"id":225,"ex":"Galicia · 2023","org":"Galicia","y":2023,"s":"sondas","t":"enemas","q":"Para administrar un enema, señale cuál sería la posición correcta:","o":["Decúbito lateral derecho.","Decúbito prono.","Posición genupectoral.","Posición de Sims."],"e":"La posición de Sims (decúbito lateral izquierdo, pierna derecha flexionada) es la de elección para el enema: aprovecha la anatomía del sigma y el colon descendente, que quedan en declive, para que la solución fluya y se retenga.","tr":"posiciones","a":3,"po":["El lado derecho no sigue la anatomía del sigma.","Prono dificulta la técnica.","La genupectoral se usa para algunas exploraciones rectales, no para el enema estándar.",""]},{"id":226,"ex":"Galicia · 2023","org":"Galicia","y":2023,"s":"intestino","t":"eii","q":"La enfermedad de Crohn se caracteriza por todo lo siguiente, excepto una, indíquela:","o":["Es una afectación inflamatoria de todo el tubo digestivo.","Es una enfermedad crónica.","Afecta solo a la mucosa del colon.","Afecta a toda la pared del intestino, no solo a la mucosa."],"e":"La enfermedad de Crohn NO afecta solo a la mucosa del colon: es transmural (toda la pared) y puede afectar a cualquier segmento del tubo digestivo, de la boca al ano. Es crónica, con brotes. Afectar solo a la mucosa es más propio de la colitis ulcerosa.","tr":"cucrohn","a":2,"po":["Es cierto: puede afectar a todo el tubo digestivo.","Es cierto: es crónica.","","Es cierto: es transmural."]},{"id":227,"ex":"Galicia · 2023","org":"Galicia","y":2023,"s":"ostom","t":"peg","q":"Señale lo incorrecto con respecto a los cuidados de una sonda PEG (gastrostomía endoscópica percutánea):","o":["El paciente puede ducharse sin protección pasada una semana desde su colocación, siempre que el estoma no presente ninguna complicación.","Se debe de inspeccionar diariamente la zona de la inserción.","Los medicamentos administrados a través de ella, se deben de mezclar con la alimentación, para facilitar su dilución.","Girar diariamente la sonda para que no quede adherida a la piel."],"e":"Los fármacos NO deben mezclarse con la nutrición: pueden precipitar, obstruir la sonda e interactuar. Se administran por separado, uno a uno, lavando con agua antes y después. La inspección diaria del estoma, el giro diario de la sonda y la ducha a partir de la semana (sin complicaciones) sí son correctos.","a":2,"ns":1},{"id":228,"ex":"Defensa Estabilización · 2023","org":"Defensa","y":2023,"s":"anat","t":"obstruccion","q":"El peritoneo parietal cubre:","o":["Cara inferior del diafragma.","Estómago.","Hígado.","Riñones."],"e":"El peritoneo PARIETAL tapiza la cara interna de la pared abdominal y la cara inferior del diafragma. El peritoneo VISCERAL (serosa) recubre órganos como el estómago y el hígado. Los riñones son retroperitoneales.","a":0},{"id":229,"ex":"Defensa Examen libre · 2023","org":"Defensa","y":2023,"s":"anat","t":"anatomia","q":"La arteria esplénica es rama de:","o":["La arteria mesentérica inferior.","La arteria cólica media.","El tronco celiaco.","Es una rama de la arteria esofágica inferior."],"e":"El tronco celíaco se divide en tres ramas: arteria gástrica izquierda, arteria ESPLÉNICA y arteria hepática común. Irriga el esófago abdominal, el estómago, el duodeno, el hígado, la vesícula, el páncreas y el bazo.","a":2},{"id":230,"ex":"Defensa Examen libre · 2023","org":"Defensa","y":2023,"s":"intestino","t":"hemorragia","q":"Un paciente con diverticulosis, al contrario que con diverticulitis:","o":["Tiene hemorragias rectales.","No suele tener síntomas.","Tiene dolor espástico localizado.","Frecuentemente desarrolla peritonitis."],"e":"La diverticulosis (presencia de divertículos sin inflamación) suele ser ASINTOMÁTICA y se descubre casualmente. Cuando un divertículo se inflama (diverticulitis) aparecen dolor en fosa iliaca izquierda, fiebre y posibles complicaciones como absceso o peritonitis. Es la primera causa de HDB.","a":1},{"id":231,"ex":"Defensa Examen libre · 2023","org":"Defensa","y":2023,"s":"ostom","t":"ostomias","q":"¿Qué es la Bolsa de Kock?","o":["Una Proctocolectomía.","Una colostomía sigmoide.","Una colostomía transversa.","Una ileostomía continente."],"e":"La bolsa (saco) de Kock es una ileostomía continente: se crea un reservorio interno con íleon que se aboca a la piel mediante una válvula en forma de pezón autosellante. El paciente la vacía varias veces al día con una sonda, sin llevar bolsa externa.","a":3},{"id":232,"ex":"Defensa Examen - Extraordinario · 2023","org":"Defensa","y":2023,"s":"estom","t":"dumping","q":"¿Qué vitamina será necesario suplementar en caso de gastrectomía total por una falta del factor intrínseco necesario para su absorción intestinal?","o":["B1.","B12.","B6.","E."],"e":"Tras una gastrectomía total desaparecen las células parietales, que producen el factor intrínseco. Sin él no se absorbe la vitamina B12 en el íleon, por lo que hay que suplementarla por vía parenteral (intramuscular) de por vida para evitar la anemia megaloblástica y las alteraciones neurológicas.","tr":"b12","a":1,"po":["La B1 no depende del factor intrínseco.","","La B6 no depende del factor intrínseco.","La vitamina E es liposoluble."]},{"id":233,"ex":"Defensa Examen - Extraordinario · 2023","org":"Defensa","y":2023,"s":"anat","t":"anatomia","q":"La vena porta está formada por:","o":["La coronaria estomáquica y la vena mesentérica inferior.","La vena mesentérica superior y la vena esplénica.","Por la unión de las venas esofágica inferior y la vena mesentérica inferior.","Es una rama de la vena cava."],"e":"La vena porta se forma por la unión de la vena mesentérica superior y la vena esplénica, por detrás del cuello del páncreas. La mesentérica inferior suele desembocar en la esplénica o en la mesentérica superior. La porta lleva al hígado la sangre del bazo, el páncreas, la vesícula y el tubo digestivo.","a":1},{"id":234,"ex":"Defensa Examen - Extraordinario · 2023","org":"Defensa","y":2023,"s":"agudo","t":"apendic","q":"La causa más frecuente de una apendicitis es:","o":["Adenitis mesentérica.","Invaginación intestinal.","Enfermedad intestinal inflamatoria.","Obstrucción luminal."],"e":"La apendicitis se produce por obstrucción de la luz del apéndice (sobre todo por fecalitos o coprolitos; también por hiperplasia linfoide, parásitos, cuerpos extraños o tumores). La obstrucción aumenta la presión, compromete la irrigación y favorece la infección, la necrosis y la perforación.","a":3},{"id":235,"ex":"Defensa Examen - Extraordinario · 2023","org":"Defensa","y":2023,"s":"boca","t":"erge","q":"El divertículo de Zenker, es un divertículo:","o":["Cólico.","Yeyunal.","Duodenal.","Esofágico."],"e":"El divertículo de Zenker es un divertículo esofágico (faringoesofágico): una herniación de la mucosa por encima del músculo cricofaríngeo (esfínter esofágico superior). Produce disfagia alta, regurgitación de alimento sin digerir, halitosis y riesgo de aspiración. El divertículo de Meckel está en el íleon.","a":3},{"id":236,"ex":"Defensa Examen - Extraordinario · 2023","org":"Defensa","y":2023,"s":"bilipan","t":"ostomias","q":"Cuando se práctica una pancreaticoduodenectomía, ¿qué estamos realizando?","o":["Paracentesis.","Procedimiento de whipple.","Terapia de Douglas.","Cierre de Hartmann."],"e":"La pancreaticoduodenectomía cefálica es la intervención de Whipple: se extirpan la cabeza del páncreas, el duodeno, la vía biliar distal, la vesícula y a veces parte del estómago. Es la cirugía de elección en los tumores resecables de la cabeza del páncreas y la región periampular.","a":1},{"id":237,"ex":"Defensa Examen - Extraordinario · 2023","org":"Defensa","y":2023,"s":"sondas","t":"sondas_tipos","q":"Cuál NO es un tipo de sonda nasogástrica:","o":["Sonda de Levin.","Sonda de Salem.","Sonda Nelaton.","Sonda de Sengstaken-Blakemore."],"e":"La sonda Nelaton es una sonda recta y semirrígida de uso vesical (sondaje intermitente) o rectal, no nasogástrica. Levin, Salem y Sengstaken-Blakemore sí se introducen por vía nasogástrica.","a":2},{"id":238,"ex":"Defensa Examen - Extraordinario · 2023","org":"Defensa","y":2023,"s":"ostom","t":"ostomias","q":"La técnica de colostomía temporal en la que se reseca un tramo intestinal y quedan dos estomas separados y distantes, se denomina:","o":["Colostomía de Paul-Mikulicz.","Colostomía en asa.","Colostomía de Hartmann.","Colostomía tipo Devin."],"e":"En la colostomía tipo Devine se reseca un tramo de colon y los dos cabos se exteriorizan como estomas SEPARADOS y distantes: uno funcional y otro mucoso. En la técnica de Paul-Mikulicz (doble boca) los dos cabos quedan juntos, «en cañón de escopeta». En la colostomía en asa no se secciona completamente el intestino.","a":3},{"id":239,"ex":"Comunidad Valenciana aplazado · 2023","org":"C. Valenciana","y":2023,"s":"bilipan","t":"pancreas","q":"Se encuentra usted en un servicio hospitalario atendiendo a un paciente diagnosticado de pancreatitis necrotizante al que se le va a practicar un drenaje percutáneo radiológico (PCD). Usted sabe que la técnica utilizada para el drenaje de colecciones es:","o":["La PAAF.","La técnica de Seldinger.","La embolización.","La quimioembolización."],"e":"El drenaje percutáneo de colecciones guiado por imagen se hace con la técnica de Seldinger: punción con aguja, paso de una guía metálica, retirada de la aguja y colocación del catéter de drenaje sobre la guía. La PAAF solo obtiene muestras y la embolización ocluye vasos.","a":1},{"id":240,"ex":"Comunidad Valenciana aplazado · 2023","org":"C. Valenciana","y":2023,"s":"estom","t":"dumping","q":"Se encuentra usted en la planta de Cirugía y tiene a su cuidado a Miguel Sánchez que ha sido intervenido de una gastrectomía, ¿Cuál de las siguientes recomendaciones dietéticas NO sería indicada para una persona que ha sido gastrectomizada?","o":["Realizar comidas frecuentes (5-6) comidas al día.","Masticar muy bien los alimentos, comiendo despacio.","Acompañar la ingesta de alimentos con abundante líquido.","Realizar reposo postprandial."],"e":"Tras una gastrectomía, los líquidos deben tomarse SEPARADOS de las comidas (30-60 min antes o después): acompañar la comida con mucho líquido acelera el vaciamiento y provoca dumping. Sí se recomiendan 5-6 comidas pequeñas, masticar bien y reposar tras comer.","a":2},{"id":241,"ex":"Euskadi · 2023","org":"País Vasco","y":2023,"s":"intestino","t":"eii","q":"¿Cuál NO es correcta con respecto a la enfermedad inflamatoria intestinal?","o":["Las fístulas y los abscesos perianales son comunes en la enfermedad de Crohn.","La colitis ulcerosa afecta de manera primordial al recto y hemicolon izquierdo.","La hemorragia rectal es rara en la enfermedad de Crohn.","La colitis ulcerosa se caracteriza por lesiones granulomatosas bien delimitadas."],"e":"Los granulomas (no caseificantes) son característicos de la enfermedad de CROHN, no de la colitis ulcerosa. En la CU hay úlceras superficiales, abscesos crípticos e inflamación continua desde el recto. En el Crohn son frecuentes las fístulas y los abscesos perianales, y la rectorragia es menos habitual.","tr":"cucrohn","a":3,"po":["Es cierto: fístulas y abscesos perianales son típicos del Crohn.","Es cierto: la CU predomina en el recto y el colon izquierdo.","Es cierto: la rectorragia es menos habitual en el Crohn.",""]},{"id":242,"ex":"Castilla y León 22 octubre · 2023","org":"Castilla y León","y":2023,"s":"sondas","t":"sondas_tipos","q":"¿Cuál de las siguientes no es una vía de administración de la alimentación enteral?","o":["Por sonda Levin.","Por sonda Salem.","Por sonda Faucher.","Por gastrostomía endoscópica percutánea."],"e":"La sonda de Faucher (Foucher) es orogástrica, de gran calibre, y se usa para el lavado gástrico, no para alimentar. Levin, Salem y la gastrostomía (PEG) sí sirven para administrar nutrición enteral.","tr":"lavado","a":2,"po":["La Levin sí sirve para nutrir.","La Salem también puede usarse para nutrir.","","La PEG es una vía de nutrición prolongada."]},{"id":243,"ex":"Castilla y León 22 octubre · 2023","org":"Castilla y León","y":2023,"s":"sondas","t":"sng","q":"¿En cuál de las siguientes situaciones está indicado colocar una sonda nasogástrica?","o":["Ingestión reciente de cáusticos.","Traumatismo facial grave.","Obstrucción esofágica.","Nutrición en pacientes con ventilación mecánica."],"e":"El paciente con ventilación mecánica que no puede comer es una indicación clara de SNG para nutrición enteral. La ingesta de cáusticos, el traumatismo facial grave (riesgo de vía intracraneal) y la obstrucción esofágica son contraindicaciones.","tr":"contraindica","a":3,"po":["Los cáusticos contraindican la SNG.","El traumatismo facial grave contraindica la vía nasal.","La obstrucción esofágica contraindica la SNG.",""]},{"id":244,"ex":"Castilla y León 22 octubre · 2023","org":"Castilla y León","y":2023,"s":"sondas","t":"sondas_tipos","q":"No es un tipo de sonda nasogástrica:","o":["Salem.","Levin.","Robinson.","Miller-Abbott."],"e":"La sonda Robinson es una sonda recta de un solo uso, vesical o rectal. Salem y Levin son nasogástricas y la Miller-Abbott es nasoentérica (se introduce también por la nariz).","a":2},{"id":245,"ex":"Andalucía · 2023","org":"Andalucía","y":2023,"s":"agudo","t":"obstruccion","q":"Tras un traumatismo abdominal que produce hemorragia interna, ¿qué signo NO nos vamos a encontrar?","o":["Abdomen en tabla.","Hipotensión.","Hipersensibilidad abdominal.","Aumento de los ruidos intestinales."],"e":"La sangre en la cavidad peritoneal (hemoperitoneo) irrita el peritoneo y produce defensa o «abdomen en tabla», hipersensibilidad y una DISMINUCIÓN de los ruidos intestinales (íleo reflejo), además de hipotensión y taquicardia por la hipovolemia. No hay aumento de los ruidos.","a":3},{"id":246,"ex":"Murcia CARM Salud pública · 2023","org":"Murcia","y":2023,"s":"sondas","t":"sng_verif","q":"¿Cuál de las siguientes afirmaciones es correcta acerca de los cuidados de enfermería a pacientes con sonda nasogástrica?","o":["Las sondas nasogástricas se utilizan exclusivamente para la administración de medicamentos.","No es necesario asegurarse de que la sonda esté colocada correctamente antes de su uso.","Es esencial verificar el posicionamiento de la sonda antes de administrar cualquier alimento o medicamento.","No es necesario realizar un lavado gástrico previo al uso de la sonda nasogástrica."],"e":"Antes de administrar alimento o medicación hay que verificar siempre la posición de la sonda (marca externa, pH del aspirado, radiografía si hay dudas), porque puede haberse desplazado y una administración en la vía aérea es grave. La SNG no se usa solo para fármacos y no requiere lavado gástrico previo.","tr":"verificacion","a":2,"po":["Falso: también sirve para alimentar, drenar y descomprimir.","Falso: siempre hay que verificar.","","Es cierto, pero la clave es la c)."]},{"id":247,"ex":"Murcia Modelo B · 2023","org":"Murcia","y":2023,"s":"valor","t":"ulcera","q":"¿Cuál es el tratamiento inicial de elección en un paciente con una úlcera péptica sangrante que presenta signos de shock hipovolémico?","o":["Endoscopia terapéutica.","Antibióticos de amplio espectro.","Infusión de solución salina.","Cirugía de emergencia."],"e":"Ante una HDA con shock hipovolémico, la prioridad es la estabilización hemodinámica: dos vías gruesas y reposición de volumen con cristaloides (suero fisiológico), con transfusión si es preciso. Una vez estabilizado se hace la endoscopia terapéutica; la cirugía se reserva para cuando esta fracasa.","a":2},{"id":248,"ex":"Murcia Modelo B · 2023","org":"Murcia","y":2023,"s":"intestino","t":"eii","q":"En un paciente con enfermedad de Crohn, indique la opción correcta:","o":["Los cólicos abdominales mejoran tras la ingesta.","Pueden aparecer abscesos abdominales y anales.","Se recomienda una dieta rica en residuo.","Tiene alivio tras defecación."],"e":"Por su afectación transmural, la enfermedad de Crohn puede complicarse con fístulas y ABSCESOS abdominales y perianales. Los cólicos empeoran tras la ingesta (no mejoran), y en los brotes se recomienda una dieta POBRE en residuos, sobre todo si hay estenosis.","a":1},{"id":249,"ex":"Murcia Modelo B · 2023","org":"Murcia","y":2023,"s":"bilipan","t":"biliar","q":"Un paciente se encuentra ingresado a consecuencia de una pancreatitis aguda por litiasis biliar. ¿Cuál de las siguientes manifestaciones nos haría sospechar de un nuevo episodio de pancreatitis?","o":["Dolor epigástrico irradiado a la espalda.","Hiperglucemia.","Esteatorrea y diarrea.","Distensión abdominal."],"e":"El síntoma cardinal de la pancreatitis es el dolor epigástrico intenso irradiado en cinturón a la espalda. Si reaparece, debe sospecharse un nuevo brote (con elevación de amilasa y lipasa). La esteatorrea y la hiperglucemia son más propias de la insuficiencia pancreática crónica.","a":0},{"id":250,"ex":"Murcia Modelo B · 2023","org":"Murcia","y":2023,"s":"sondas","t":"sng","q":"Con respecto al sondaje nasogástrico, señale la opción incorrecta:","o":["Su uso está indicado para prevenir la broncoaspiración en pacientes intubados.","Está recomendada en pacientes con esófago obstruido o perforación esofágica.","Se usa para alimentar a un paciente cuando no puede por vía oral.","Está indicado su uso para aliviar y/o prevenir la distensión gástrica en caso de posible obstrucción intestinal."],"e":"La obstrucción y la perforación esofágica CONTRAINDICAN la SNG, por riesgo de lesión o perforación. Son indicaciones correctas: descomprimir en la obstrucción intestinal, alimentar a quien no puede comer y proteger de la aspiración a pacientes intubados.","tr":"contraindica","a":1,"po":["Es cierto: indicada en intubados.","","Es cierto: indicada para alimentar.","Es cierto: indicada en la obstrucción."]},{"id":251,"ex":"Castilla y León aplazado · 2023","org":"Castilla y León","y":2023,"s":"ostom","t":"ostomias","q":"¿Qué zona elegiría para el marcaje de estoma de eliminación?","o":["Hipocondrio derecho.","Músculo recto del abdomen.","Ángulo esplénico.","Hipocondrio izquierdo."],"e":"El estoma de eliminación se marca sobre el músculo recto anterior del abdomen, en el punto central del triángulo formado por el ombligo, la espina iliaca y el pubis, y siempre comprobando con el paciente de pie, sentado y tumbado. Así se reduce el riesgo de hernia paraestomal y de prolapso.","a":1},{"id":252,"ex":"Castilla y León aplazado · 2023","org":"Castilla y León","y":2023,"s":"sondas","t":"sondas_tipos","q":"Señale la respuesta falsa en relación con la sonda nasoyeyunal:","o":["Se pondrá mediante gastroscopia o mediante radiología intervencionista.","La luz proximal estará localizada en el estómago.","La luz distal se localizará en el yeyuno.","Cada una de las luces se inserta a través de una coana."],"e":"La sonda nasoyeyunal de doble luz es UN solo tubo con dos luces que entra por una misma coana: la luz proximal queda en el estómago (aspiración o descompresión) y la distal en el yeyuno (nutrición). Se coloca por endoscopia o radiología intervencionista. La afirmación falsa es que cada luz entre por una coana.","a":3},{"id":253,"ex":"Islas Baleares · 2023","org":"Islas Baleares","y":2023,"s":"higado","t":"sng","q":"Señale la afirmación incorrecta:","o":["Si un paciente con enfermedad hepática crónica no puede alcanzar sus necesidades energético-proteicas por la vía oral a causa de un nivel de consciencia bajo, la nutrición enteral debe ser la primera vía que debe considerarse.","Las ingestas de poco volumen y frecuentes son mejor toleradas en los casos de cirrosis.","No es importante la ingesta previa al descanso nocturno en pacientes con una enfermedad hepática.","La obesidad aumenta la morbilidad y la mortalidad."],"e":"En la hepatopatía crónica SÍ es importante una ingesta antes de dormir (snack nocturno con hidratos de carbono complejos): el hígado cirrótico tiene poco glucógeno, y el ayuno nocturno activa el catabolismo muscular. Se prefieren tomas pequeñas y frecuentes, y si la vía oral no es suficiente, la nutrición enteral es la primera opción.","a":2},{"id":254,"ex":"Canarias batería preguntas B · 2023","org":"Canarias","y":2023,"s":"intestino","t":"eliminacion","q":"¿Cuál es la principal medida higiénica para la prevención de la gastroenteritis?","o":["Lavado de manos con agua y jabón.","Lactancia materna.","La vacunación contra el rotavirus.","Ninguna es correcta."],"e":"La higiene de manos con agua y jabón es la principal medida para prevenir la gastroenteritis, que se transmite por vía fecal-oral. La lactancia materna y la vacuna del rotavirus son preventivas en lactantes, pero la medida higiénica principal y universal es el lavado de manos.","a":0,"ns":1},{"id":255,"ex":"Canarias batería preguntas B · 2023","org":"Canarias","y":2023,"s":"sondas","t":"sng","q":"¿Cuándo está contraindicado el sondaje nasogástrico? Elige la opción INCORRECTA:","o":["Fractura facial o de la base del cráneo.","Estenosis esofágica o sospecha de perforación esofágica.","Ingestión o lesiones por cáusticos.","Cirugía maxilofacial."],"e":"Las fracturas faciales o de la base del cráneo, la estenosis o perforación esofágica y la ingesta de cáusticos son contraindicaciones del sondaje nasogástrico. La cirugía maxilofacial en sí no es una contraindicación general (incluso se coloca SNG en el quirófano bajo visión directa).","tr":"contraindica","a":3,"po":["Es una contraindicación verdadera.","Es una contraindicación verdadera.","Es una contraindicación verdadera.",""]},{"id":256,"ex":"Canarias batería preguntas B · 2023","org":"Canarias","y":2023,"s":"sondas","t":"sng","q":"¿Cuáles son la indicaciones del sondaje nasogástrico? Elige la opción INCORRECTA:","o":["Diarreas.","Incremento de los requerimientos nutricionales (sepsis, quemados, politraumatizados).","Pacientes tratados con ventilación mecánica.","Síndrome de intestino corto."],"e":"La diarrea no es una indicación de sondaje nasogástrico (incluso puede ser una complicación de la nutrición enteral). Sí lo son los requerimientos nutricionales aumentados que no se cubren por boca (sepsis, quemados, politraumatizados), la ventilación mecánica y el síndrome de intestino corto.","a":0},{"id":257,"ex":"Canarias batería preguntas B · 2023","org":"Canarias","y":2023,"s":"sondas","t":"sng","q":"¿Cuáles son los cuidados de enfermería estandarizados al paciente portador de sonda nasogástrica? Elige la opción INCORRECTA:","o":["Habrá que limpiar diariamente la parte externa de la sonda, tras cada administración de nutrición y habrá que pasar siempre unos 20 o 30 ml de agua.","Elevar el cabecero de la cama a unos 25 - 30 grados durante la administración de la alimentación.","En caso de tener que trasladar, mover o asear al paciente (habrá que mantenerlo en una postura inferior a 30 grados), hay que suspender la alimentación por sonda una hora antes.","Comprobar la existencia de residuos cada 4- 6 horas durante las primeras 24 horas y luego cada 8 horas."],"e":"Durante la alimentación por sonda el cabecero debe elevarse a 30-45° (no 25-30°) y mantenerse así hasta 30-60 minutos después, para reducir el reflujo y la aspiración. La limpieza diaria, los lavados con 20-30 ml de agua y el control del residuo sí son cuidados correctos.","a":1},{"id":258,"ex":"Canarias batería preguntas B · 2023","org":"Canarias","y":2023,"s":"sondas","t":"sng","q":"¿Cuáles son las complicaciones del sondaje nasogástrico?","o":["Mecánicas.","Infecciosas.","Gastrointestinales y metabólicas.","Todas las respuestas son ciertas."],"e":"Las complicaciones del sondaje y la nutrición enteral se clasifican en mecánicas (obstrucción, desplazamiento, lesiones nasales), infecciosas (neumonía por aspiración, sinusitis), gastrointestinales (diarrea, distensión, vómitos) y metabólicas (hiperglucemia, alteraciones electrolíticas).","a":3,"ns":1},{"id":259,"ex":"Canarias batería preguntas B · 2023","org":"Canarias","y":2023,"s":"sondas","t":"sng_verif","q":"Elige la opción INCORRECTA en el procedimiento del lavado gástrico:","o":["Medir la porción de la sonda que es necesario implantar en el paciente.","Lubrificar bien la porción distal de la sonda con lubricante hidrosoluble y, si la sonda está autolubricada, humedecerlo con agua o suero.","Una vez introducida hasta la medida que hemos estimado oportuna, confirmar la correcta colocación de la sonda. Para ello podemos insuflar aire a la vez que auscultamos en el epigastrio o retirar una pequeña cantidad de contenido gástrico y medir su pH mediante tiras reactivas obteniendo un pH mayor 4 para la correcta colocación de la sonda en estómago.","Después de 2-3 minutos en el estómago, evacuar el líquido introducido mediante aspiración con la jeringa o bajando la sonda por debajo del estómago (método de sifón) permitiendo el drenaje del contenido por gravedad a una bolsa colectora. La cantidad evacuada debe ser aproximadamente igual a la instilada."],"e":"La posición gástrica se confirma con un pH ÁCIDO, ≤ 4 (no «mayor de 4»), y la auscultación de aire no es un método fiable. El resto del procedimiento es correcto: medir la sonda, lubricar con lubricante hidrosoluble y evacuar por aspiración o sifón un volumen similar al instilado.","tr":"verificacion","a":2,"po":["Es correcto: medir la sonda.","Es correcto: lubricante hidrosoluble.","","Es correcto: evacuar un volumen similar al instilado."]},{"id":260,"ex":"Canarias batería preguntas B · 2023","org":"Canarias","y":2023,"s":"ostom","t":"ostomias","q":"Elige la opción INCORRECTA. Las patologías más frecuentes para la realización de una ostomía digestiva son:","o":["Paraplejias.","Enfermedad de Hirschsprung.","Enfermedad de Crohn.","Colitis ulcerosa."],"e":"Las causas más frecuentes de ostomía digestiva son el cáncer colorrectal, la enfermedad inflamatoria intestinal (Crohn, colitis ulcerosa), la diverticulitis complicada y, en niños, malformaciones como el Hirschsprung. La paraplejía no es una causa frecuente.","a":0},{"id":261,"ex":"Canarias batería preguntas B · 2023","org":"Canarias","y":2023,"s":"ostom","t":"ostomias","q":"En el cuidado del estoma, ¿ qué NO se debe hacer en el cambio de dispositivo?","o":["La placa puede permanecer hasta 3-4 días adherida a la piel, dependiendo de las fugas y las necesidades del paciente.","Limpiar el estoma con gasas, toallitas o esponja con agua y jabón (no utilizar toallitas con cremas o alcohol) SIN FRICCIONAR.","Medir el diámetro del estoma con una plantilla que también nos indicará la forma. Es conveniente realizar la medición una vez al mes y si existe edema cada 24 horas ya que el estoma va modificándose.","Elección del dispositivo, en el postoperatorio lo ideal es un dispositivo de dos piezas transparente que permita visualizar y acceder al estoma cada vez que sea necesario."],"e":"En las primeras semanas el estoma se reduce a medida que cede el edema, por eso hay que medirlo con la plantilla en CADA cambio durante las 6-8 primeras semanas, no una vez al mes. El resto es correcto: placa hasta 3-4 días, limpiar sin frotar y usar un dispositivo de dos piezas transparente en el postoperatorio.","a":2},{"id":262,"ex":"Canarias batería preguntas B · 2023","org":"Canarias","y":2023,"s":"valor","t":"enemas","q":"Elige opción INCORRECTA. En la actuación inicial ante una hemorragia digestiva alta en pacientes con estabilidad hemodinámica: pérdidas del 10-20 % del volumen circulante (500-1000 ml), requiere terapéutica y vigilancia ordinarias:","o":["Sonda nasogástrica.","Determinación de la TA cada 2-4 h. al ingreso y cada 6-8 horas posteriormente.","Enema cada 12 horas (color heces).","2.000-2.500 ml/ días i.v. (mitad fisiológico y mitad glucosado al 5-10%). 20-50 meq/días de ClK."],"e":"En la HDA con estabilidad hemodinámica se coloca SNG si procede, se controlan la TA y las heces y se mantiene una sueroterapia de mantenimiento. Según la clave, la pauta de líquidos propuesta (2.000-2.500 ml/día con ClK) es la incorrecta para este protocolo. La idea general: reponer con prudencia y vigilar los signos de resangrado.","a":3,"f":"Pregunta basada en un protocolo concreto (Canarias): la opción considerada incorrecta (sueroterapia) es difícil de razonar sin ese documento. Conviene revisar."},{"id":263,"ex":"Canarias batería preguntas B · 2023","org":"Canarias","y":2023,"s":"sondas","t":"sondas_tipos","q":"En el tratamiento de la hemorragias digestivas altas, ¿ Cuál es la sonda nasogástrica para realizar el taponamiento con balón?","o":["Sonda de Sengstaken-Blakemore o de Minnesota.","Sonda Levin.","Sonda Andersen.","Sonda Salem."],"e":"Las sondas de taponamiento con balón para la hemorragia por varices son la Sengstaken-Blakemore (3 vías, 2 balones) y la Minnesota (4 vías, 2 balones); para las varices fúndicas, la Linton-Nachlas (1 balón gástrico). Levin, Salem y Andersen no tienen balones de compresión.","tr":"balones","a":0,"po":["","Levin: sin balones.","Andersen: nasoentérica con lastre de tungsteno.","Salem: sin balones."]},{"id":264,"ex":"Canarias batería preguntas B · 2023","org":"Canarias","y":2023,"s":"valor","t":"cirrosis","q":"Elige la opción INCORRECTA: ¿Cuál es la actuación ante un paciente con una hemorragia digestiva baja grave?","o":["Colocación de 2 vías periféricas de calibre grueso que permitan una reposición rápida de la volemia o transfusión si es preciso.","Dieta absoluta las primeras 24 h; si el paciente se mantiene estable, puede iniciarse la solución evacuante para la colonoscopia.","Reposición de la volemia. Se utilizarán cristaloides (suero fisiológico). Se recomienda la administración de un bolo inicial de 250 a 500 ml en presencia de signos de hipovolemia.","Analítica urgente que incluya hemograma, coagulación, función renal y hepática."],"e":"Ante una HDB grave: dos vías periféricas gruesas, analítica urgente (hemograma, coagulación, función renal y hepática), dieta absoluta y reposición de volumen con cristaloides. La clave considera incorrecta la pauta de reposición de la opción c según el protocolo de referencia; retén la secuencia general: estabilizar, analizar y localizar el sangrado con colonoscopia.","a":2,"ns":1,"f":"Pregunta de protocolo (Canarias): lo que hace incorrecta la opción 3 no se deduce con claridad del temario general. Revisar."},{"id":265,"ex":"Canarias batería preguntas C · 2023","org":"Canarias","y":2023,"s":"boca","t":"bucal","q":"¿De qué depende la eficacia de la higiene oral?","o":["Del compuesto que se utilice.","De la concentración de flúor.","Del tiempo que la pasta permanece en la boca (debe ser superior a un minuto).","Todas son correctas."],"e":"La eficacia de la higiene oral depende del compuesto de la pasta, de su concentración de flúor (1.000-1.450 ppm en adultos) y del tiempo de contacto: se recomienda cepillar unos 2 minutos y escupir sin enjuagar con abundante agua, para que el flúor actúe.","a":3,"ns":1},{"id":266,"ex":"EFyC Galicia · 2024","org":"Galicia","y":2024,"s":"boca","t":"sng","q":"Acudes a realizar una visita domiciliaria a José de 88 años, con deterioro cognitivo moderado y limitación importante de la movilidad. Pasa la mayor parte del tiempo en la cama, levantándose unas dos horas al sofá, coincidiendo con las comidas principales. Vive con su hija Carmen, cuidadora principal. Durante la valoración del patrón nutricional-metabólico su hija te comenta que cuando le da de comer en ocasiones se atraganta debido a su disfagia. Para prevenir el riesgo de aspiración le recomiendas:","o":["Dar pequeñas tomas frecuentes de líquidos.","Uso de la flexión cervical anterior como estrategia postural.","Incluir en la dieta alimentos con texturas mixtas como la sopa con pasta.","El uso de alimentación enteral con sonda nasogástrica."],"e":"La flexión cervical anterior («barbilla al pecho») estrecha la entrada de la vía aérea y protege frente a la aspiración: es la maniobra postural básica. Las texturas mixtas (sopa con pasta) están contraindicadas, los líquidos finos sin espesar aumentan el riesgo y la SNG no es la primera opción.","tr":"disfagia","a":1,"po":["Los líquidos finos, aunque se den en pequeñas tomas, siguen siendo de riesgo: hay que espesarlos.","","Las texturas mixtas (sopa con pasta) son peligrosas.","La SNG no es la primera opción si se puede adaptar la dieta y la postura."]},{"id":267,"ex":"EFyC Galicia · 2024","org":"Galicia","y":2024,"s":"intestino","t":"ccr","q":"José, de 50 años, ha sido incluido en el Programa gallego de detección precoz del cáncer colorrectal. Tras dar un resultado anómalo en el test de sangre oculta en heces se le realizó una colonoscopia diagnóstica, siendo esta normal (no se observaron lesiones con sospecha de malignidad). ¿Cuándo se tendrá que repetir nuevamente el cribado a José?","o":["El cribado se realizará mediante test de sangre oculta en heces a los 1O años.","El cribado se realizará cada dos años hasta que cumpla 70 años.","El cribado se realizará mediante colonoscopia a los 1O años, dados los antecedentes del paciente.","No precisa repetir el cribado ya que el resultado de la colonoscopia es normal."],"e":"Si el FIT es positivo pero la colonoscopia es normal (sin lesiones), el riesgo es bajo. Según el programa gallego, la persona sale temporalmente del cribado y vuelve a ser invitada con test de sangre oculta pasados 10 años, si sigue en la edad diana. No se pasa a colonoscopias periódicas.","a":0},{"id":268,"ex":"EFyC Galicia · 2024","org":"Galicia","y":2024,"s":"ostom","t":"ostomias","q":"Juan es un paciente portador de una ileostomía. ¿Cuál de las siguientes recomendaciones sobre su cuidado es incorrecta?","o":["Tomar la fruta pelada, madura y sin semillas.","Beber abundantes líquidos, preferentemente fuera de las comidas.","La bolsa recolectora debe vaciarse a los dos tercios de su capacidad.","Puede ducharse, con o sin bolsa."],"e":"La bolsa de ileostomía se vacía cuando está a 1/3 o, como mucho, a la mitad de su capacidad (cada 4-6 horas). Si se deja llegar a 2/3, el peso puede despegar la placa y causar fugas e irritación. Las demás recomendaciones son correctas.","a":2},{"id":269,"ex":"EFyC Galicia · 2024","org":"Galicia","y":2024,"s":"ostom","t":"peg","q":"Carmen es una paciente inmovilizada, con deterioro cognitivo grave, que acaba de ser dada de alta del hospital tras colocarle una sonda tipo PEG. Durante la visita, explicas a su hija los cuidados y manejo de la sonda PEG. Respecto a la administración de medicación no está indicado:","o":["Lavar la sonda con 5cc de agua después de administrar cada fármaco.","Los fármacos triturados se diluirán en 10-15 cc de agua para su administración.","Los fármacos de liberación retardada se administrarán de primeros y siempre diluidos.","Evitar administrar los medicamentos mezclados con la alimentación."],"e":"Los fármacos de liberación retardada (y los de cubierta entérica, sublinguales o efervescentes) NO deben triturarse ni administrarse por sonda: se pierde su efecto o se produce toxicidad. Se busca una presentación líquida o una alternativa. Los demás cuidados son correctos.","a":2},{"id":270,"ex":"EFyC Galicia · 2024","org":"Galicia","y":2024,"s":"estom","t":"ulcera","q":"Cristina lleva semanas con dispepsia y epigastralgias. Su médico le ha solicitado una prueba de heces para analizar la presencia de la bacteria Helicobacter pylori. En relación a las recomendaciones para la recogida de heces y preparación previa, señale el enunciado correcto:","o":["No debe tomar inhibidores de la bomba de protones al menos 7 días antes de la prueba.","Debe evitar tomar antibióticos como mínimo 14 días antes de realizar la prueba.","Puede seguir tomando hidróxido de aluminio porque no interfiere en los resultados de la prueba.","Se debe recoger una muestra de heces del tamaño de una nuez y guardarla refrigerada en la nevera un máximo de 2 horas."],"e":"Los antiácidos (hidróxido de aluminio o magnesio) no interfieren en las pruebas de H. pylori y pueden usarse para controlar los síntomas. En cambio, los IBP deben suspenderse al menos 2 semanas antes, y los antibióticos y el bismuto, 4 semanas antes.","a":2},{"id":271,"ex":"EFyC Galicia · 2024","org":"Galicia","y":2024,"s":"boca","t":"erge","q":"Luisa acude a su consulta a un control de salud. Refiere que en las últimas semanas sufre de pirosis asociada a episodios de regurgitación. ¿Cuál de las siguientes indicaciones no le daría a Luisa?","o":["Realizar comidas ricas en proteínas.","Evitar el chocolate y la menta.","Dormir sobre el lado derecho.","Consumir chicles."],"e":"En la ERGE se desaconseja dormir sobre el lado DERECHO, porque favorece el reflujo (el decúbito lateral izquierdo lo reduce). Sí se aconsejan comidas ricas en proteínas (aumentan el tono del EEI), evitar chocolate y menta, y el chicle, que aumenta la saliva y el aclaramiento esofágico.","tr":"cabecero","a":2,"po":["Es correcto: las proteínas aumentan el tono del EEI.","Es correcto: el chocolate y la menta relajan el EEI.","","Es correcto: el chicle aumenta la saliva, que neutraliza el ácido."]},{"id":272,"ex":"Islas Baleares - 2º llamamiento · 2023","org":"Islas Baleares","y":2023,"s":"bilipan","t":"pancreas","q":"¿Cuál es la causa más frecuente de la pancreatitis aguda entre las mujeres?","o":["Litiasis vesicular.","Alcoholismo.","Factores hereditarios.","Idiopática."],"e":"La litiasis biliar es la primera causa de pancreatitis aguda en nuestro medio y es especialmente predominante en mujeres (los cálculos son más frecuentes en ellas). El alcohol, la segunda causa, es más frecuente en varones.","a":0},{"id":273,"ex":"La Rioja · 2024","org":"La Rioja","y":2024,"s":"higado","t":"cirrosis","q":"¿Cuáles son los síntomas que pueden ocasionar las varices esofágicas?","o":["Vómitos en posos de café y hematemesis indolora masiva.","Melenas y dolor articular.","Vómitos en posos de café y migraña.","Hipertensión."],"e":"Las varices esofágicas suelen ser asintomáticas hasta que se rompen: entonces causan una hemorragia digestiva alta masiva e indolora, con hematemesis (roja o en «posos de café») y melenas, con riesgo de shock. No se asocian a dolor articular ni a hipertensión arterial.","a":0},{"id":274,"ex":"La Rioja · 2024","org":"La Rioja","y":2024,"s":"boca","t":"bucal","q":"Las glándulas salivares drenan la saliva a través de distintos conductos, las glándulas parótidas lo hacen a través del conducto:","o":["Conducto de Stenon.","Conducto de Wharton.","Conducto de Rivinus.","Ninguna respuesta es correcta."],"e":"Parótida → conducto de STENON (se abre frente al segundo molar superior). Submandibular → conducto de WHARTON (junto al frenillo lingual). Sublingual → conductos de RIVINUS.","a":0,"ns":1},{"id":275,"ex":"La Rioja - 2º llamamiento · 2024","org":"La Rioja","y":2024,"s":"boca","t":"bucal","q":"La enfermedad más prevalente de la cavidad oral es:","o":["Gingivitis.","Periodontitis.","Caries.","Absceso peribucal."],"e":"La caries es la enfermedad más prevalente de la cavidad oral (y una de las más prevalentes del mundo). Se debe a la fermentación bacteriana de los azúcares, que produce ácidos que desmineralizan el esmalte. Le siguen la gingivitis y la periodontitis.","a":2},{"id":276,"ex":"La Rioja - 2º llamamiento · 2024","org":"La Rioja","y":2024,"s":"bilipan","t":"biliar","q":"Definimos colecistitis aguda como:","o":["Presencia de litiasis en la vesícula biliar.","Es la inflamación aguda de la vesícula biliar.","Es la presencia de cálculos en la vía biliar principal.","Es la presencia de litiasis en el páncreas."],"e":"La colecistitis aguda es la inflamación aguda de la pared de la vesícula biliar, casi siempre por un cálculo que obstruye el conducto cístico. La presencia de cálculos en la vesícula es colelitiasis y en el colédoco, coledocolitiasis.","a":1},{"id":277,"ex":"Navarra · 2024","org":"Navarra","y":2024,"s":"sondas","t":"sondas_tipos","q":"De los siguientes tipos de sondas, ¿cuál es la indicada para la compresión de las varices esofágicas sangrantes?","o":["Salem.","Sengstaken-Blakemore.","Miller-Abbott.","Levin."],"e":"La Sengstaken-Blakemore es la sonda de taponamiento para las varices esofágicas sangrantes: el balón gástrico se ancla en el cardias y el esofágico comprime las varices. Salem y Levin son nasogástricas de aspiración o alimentación y la Miller-Abbott es nasoentérica.","tr":"balones","a":1,"po":["Salem: aspiración.","","Miller-Abbott: descompresión intestinal.","Levin: sin balones."]},{"id":278,"ex":"Navarra · 2024","org":"Navarra","y":2024,"s":"ostom","t":"heces_ostomia","q":"Las heces que se expulsan por una cecostomía son:","o":["No se expulsan heces.","Semisólidas y escasas.","Líquidas y continuas.","Sólidas."],"e":"La cecostomía aboca el ciego, el primer tramo del intestino grueso, antes de que el colon absorba el agua: las heces son LÍQUIDAS, continuas y muy irritantes para la piel.","tr":"distal","a":2,"po":["Sí se expulsan heces.","Semisólidas: colostomías distales.","","Sólidas: sigmoidostomía."]},{"id":279,"ex":"Hospital General de Valencia · 2024","org":"C. Valenciana","y":2024,"s":"sondas","t":"sondas_tipos","q":"¿De cuántas luces se compone la sonda Sengstaken-Blakemore?","o":["De dos luces.","De cuatro luces.","De seis luces.","De ocho luces."],"e":"Según el manual, la Sengstaken-Blakemore tiene 3 vías (aspiración gástrica, balón gástrico y balón esofágico) y la de Minnesota, 4 (añade la aspiración esofágica). El tribunal dio por buena «cuatro luces», probablemente contando la Sengstaken modificada. En tu examen: Sengstaken = 3 vías y 2 balones; Minnesota = 4 vías.","a":1,"f":"Discrepancia con el manual: la Sengstaken-Blakemore tiene TRES vías; la de cuatro es la Minnesota. La opción correcta (3) no aparece entre las respuestas. Revisar o anular en el juego."},{"id":280,"ex":"SESPA · 2024","org":"Asturias","y":2024,"s":"higado","t":"cirrosis","q":"En relación con la esteatosis hepática metabólica (Ehmet), señale la respuesta incorrecta:","o":["Es una enfermedad clínicamente heterogénea que cursa con la acumulación de grasa en el hígado.","Dentro de los factores de riesgo de mayor influencia para desarrollar una EHmet se encuentran la obesidad y el síndrome metabólico.","Las modificaciones en la dieta y el estilo de vida son el pilar del tratamiento fundamental de esta enfermedad.","Dentro de las recomendaciones dietéticas se encuentran elevar el consumo de grasas saturadas y el consumo moderado de alcohol."],"e":"En la esteatosis hepática metabólica se recomienda REDUCIR las grasas saturadas, los azúcares y el alcohol (lo ideal es la abstinencia), con dieta mediterránea, ejercicio y pérdida de peso, que son el pilar del tratamiento. La obesidad y el síndrome metabólico son sus principales factores de riesgo.","a":3},{"id":281,"ex":"SESPA · 2024","org":"Asturias","y":2024,"s":"ostom","t":"ostomias","q":"En relación con los pasos a seguir para el cambio de dispositivo de ostomía, señale la opción incorrecta:","o":["Despegar el dispositivo con delicadeza, de arriba a abajo, sujetando la piel con la otra mano para evitar dermatitis traumáticas.","Lavado con agua tibia, jabón y esponja suave (no es necesario limpiar con suero). No usar alcohol ni desinfectantes sobre el estoma.","Secar con secador y rasurar si hay vello en la zona de colocación del dispositivo.","Se recomienda al paciente con colostomía o ileostomía que el cambio de dispositivo lo realice en ayunas o lo realice tras 1 hora y media desde la ingesta de comida."],"e":"La piel periestomal se seca suavemente con toalla o pañuelo de papel, NO con secador, y el vello se corta (sin cuchilla) para no causar foliculitis. Se despega de arriba abajo, sujetando la piel, se lava con agua tibia y jabón neutro y el cambio se hace en ayunas o 1,5 h después de comer.","a":2},{"id":282,"ex":"SESPA · 2024","org":"Asturias","y":2024,"s":"bilipan","t":"charcot","q":"En relación con la colangitis aguda, ¿cómo se denomina la triada que se caracteriza por las manifestaciones clínicas de dolor abdominal, ictericia y fiebre?","o":["Triada de Virchow.","Triada de Charcot.","Triada de Beck.","Triada de Herbst."],"e":"La tríada de Charcot (dolor, fiebre e ictericia) define la colangitis aguda; si se añaden shock y confusión es la pentada de Reynolds. La tríada de Virchow explica la trombosis y la de Beck, el taponamiento cardiaco.","tr":"charcot","a":1,"po":["Virchow = trombosis (estasis, lesión endotelial, hipercoagulabilidad).","","Beck = taponamiento cardiaco.","Herbst no es una tríada de patología biliar."]},{"id":283,"ex":"Castilla - La Mancha · 2024","org":"Castilla-La Mancha","y":2024,"s":"ostom","t":"heces_ostomia","q":"Manuel es un paciente que acude a nuestra consulta de enfermería, al cual ha colocado recientemente un estoma de eliminación. En la educación al paciente, le informaremos que en función de la localización del estoma, no es previsible que las heces sean:","o":["Ileostomía: líquidas e irritativas.","Colon ascendente: líquidas e irritativas.","Cecostomía: líquidas no irritativas.","Sigmoidostomía: heces formadas y olorosas."],"e":"La cecostomía produce heces líquidas y MUY irritantes, no «no irritativas»: es la más proximal del colon y el efluente aún lleva enzimas. Las demás son correctas: ileostomía y colon ascendente dan heces líquidas e irritantes; la sigmoidostomía, heces formadas y con olor.","tr":"distal","a":2,"po":["Es previsible: la ileostomía da heces líquidas e irritantes.","Es previsible: la ascendente da heces líquidas e irritantes.","","Es previsible: la sigmoidostomía da heces formadas."]},{"id":284,"ex":"Castilla - La Mancha · 2024","org":"Castilla-La Mancha","y":2024,"s":"bilipan","t":"biliar","q":"En un paciente que ingresa en planta después de una cirugía biliar con un drenaje en T o de Kehr, ¿cuál de estas intervenciones de enfermería NO sería correcta?","o":["Valorar cantidad, color y consistencia del líquido drenado según pauta médica.","Conservar la bolsa de drenaje a nivel del Kehr.","Inspeccionar la piel alrededor del sitio de inserción de la sonda para buscar signos de inflamación, enrojecimiento, hinchazón o fuga de bilis.","Identificar drenaje fétido y purulento que indique infección."],"e":"La bolsa del drenaje de Kehr debe quedar POR DEBAJO del nivel de inserción (en declive), nunca a su altura o por encima: así se favorece el drenaje por gravedad y se evita el reflujo de bilis, que podría causar infección. Se registra el débito, se cuida la piel y se vigilan los signos de infección.","a":1},{"id":285,"ex":"Castilla - La Mancha - Llamamiento extraordinario · 2024","org":"Castilla-La Mancha","y":2024,"s":"bilipan","t":"charcot","q":"¿Cuál de los siguientes signos o síntomas no aparecen en la Triada de Charcot, característica de la colangitis aguda?","o":["Náuseas y vómitos.","Dolor abdominal.","Fiebre.","Ictericia."],"e":"La tríada de Charcot de la colangitis es dolor abdominal (hipocondrio derecho, tipo cólico), fiebre (a menudo con escalofríos) e ictericia. Las náuseas y los vómitos pueden aparecer, pero no forman parte de la tríada.","tr":"charcot","a":0,"po":["","El dolor forma parte de la tríada.","La fiebre forma parte de la tríada.","La ictericia forma parte de la tríada."]},{"id":287,"ex":"Cataluña · 2024","org":"Cataluña","y":2024,"s":"boca","t":"disfagia","q":"Una vez estabilizado, se decide que Enric inicie tolerancia oral. La enfermera le hace el test de disfagia, Método de Exploración Clínica Volumen-Viscosidad (MECV-V), para determinar el tipo de dieta que podrá ingerir. En cuanto a la disfagia orofaríngea, ¿cuáles son los signos clínicos relacionados con la alteración de la eficacia?","o":["Cambio de voz, disminución de la saturación de oxígeno, tos.","Sello labial insuficiente, residuos orales, deglución fraccionada, residuos faríngeos.","Cambio de voz, sello labial insuficiente, deglución fraccionada, tos.","Sello labial insuficiente, disminución de la saturación de oxígeno, deglución fraccionada, tos."],"e":"En el MECV-V se distinguen dos tipos de signos. EFICACIA: sello labial insuficiente, residuo oral o faríngeo y deglución fraccionada (comprometen la nutrición y la hidratación). SEGURIDAD: tos, cambio de voz y desaturación ≥ 3% (riesgo de aspiración).","a":1},{"id":288,"ex":"Aragón · 2024","org":"Aragón","y":2024,"s":"intestino","t":"ccr","q":"Según el vigente Programa de detección precoz de cáncer colorrectal del Gobierno de Aragón, es un criterio de indicación, de cribado poblacional:","o":["Hombres y mujeres entre 50 y 59 años con antecedentes familiares de la enfermedad.","Hombres y mujeres entre 50 y 69 años con historial previo de cáncer colorrectal.","Hombres y mujeres entre 45 y 59 años en los que no existen antecedentes de la enfermedad.","Hombres y mujeres entre 50 y 69 años en los que no existen antecedentes de la enfermedad."],"e":"El cribado POBLACIONAL va dirigido a hombres y mujeres de 50 a 69 años SIN antecedentes ni síntomas (riesgo medio). Quien tiene antecedentes personales o familiares de CCR es de riesgo elevado y sigue otro circuito, con colonoscopias.","a":3},{"id":289,"ex":"Aragón · 2024","org":"Aragón","y":2024,"s":"sondas","t":"lavado","q":"Indique cuál de las siguientes sondas NO está indicada en el lavado gástrico en un adulto:","o":["Sonda Levin.","Sonda Faucher.","Sonda Sengstaken-Blakemore.","Sonda Salem."],"e":"La Sengstaken-Blakemore es una sonda de taponamiento con balones para la hemorragia por varices esofágicas, no para el lavado gástrico. Para lavar se usan Faucher/Ewald (orogástricas gruesas) o, según la clave, Levin y Salem.","tr":"lavado","a":2,"po":["La Levin sí se puede usar para lavar.","La Faucher es LA sonda del lavado gástrico.","","La Salem sí se puede usar."]},{"id":290,"ex":"Andalucía Aplazado · 2024","org":"Andalucía","y":2024,"s":"sondas","t":"lavado","q":"¿Cuál de las siguientes afirmaciones NO ES CORRECTA si realizamos un lavado gástrico a un paciente por ingesta de sustancias tóxicas?","o":["Invitar al paciente a colocarse en posición sentada para la inserción del catéter.","Colocar al paciente en posición de decúbito lateral izquierdo y Trendelenburg para realizar el lavado gástrico.","Está indicado realizar el lavado gástrico hasta 6-8 horas posterior a la ingesta de fármacos como AAS, anticolinérgicos o narcóticos.","Si se dispone de un antídoto para el tóxico, mezclarlo con carbón activado potencia el efecto."],"e":"El carbón activado ADSORBE el antídoto oral y lo inactiva, así que no se mezclan: se elige uno u otro según el tóxico. Sí son correctos el decúbito lateral izquierdo con Trendelenburg durante el lavado y que con tóxicos que retrasan el vaciamiento (AAS, anticolinérgicos, opiáceos) se pueda lavar más tarde.","a":3},{"id":291,"ex":"Aragón - Llamamiento excepcional · 2024","org":"Aragón","y":2024,"s":"sondas","t":"lavado","q":"Indique cuál de las siguientes sondas NO está indicada en el lavado gástrico en un adulto:","o":["Sonda Levin.","Sonda Faucher.","Sonda Sengstaken-Blakemore.","Sonda Salem."],"e":"La Sengstaken-Blakemore tiene balones para comprimir varices esofágicas sangrantes; no está indicada para el lavado gástrico. Para el lavado se usan sondas de una o dos luces (Levin, Salem) o, mejor, orogástricas gruesas (Faucher).","tr":"lavado","a":2,"po":["La Levin sí se puede usar para lavar.","La Faucher es LA sonda del lavado gástrico.","","La Salem sí se puede usar."]},{"id":292,"ex":"Aragón - Llamamiento excepcional · 2024","org":"Aragón","y":2024,"s":"ostom","t":"ostomias","q":"Dentro de las recomendaciones generales a una persona con ostomía, indique la correcta:","o":["Tratar de hacer 3 comidas durante el día evitando las comidas copiosas y periodos prolongados sin ingesta.","Mantener horarios regulares creando una rutina.","Tomar de 8 a 10 vasos de líquidos al día (aproximadamente 2 litros), preferiblemente a la hora de las comidas.","Tomar bebidas carbonatadas."],"e":"Mantener horarios regulares ayuda a regular el ritmo intestinal y la salida de heces por el estoma. Se aconsejan 5-6 comidas pequeñas (no 3), unos 2 litros de líquido preferentemente FUERA de las comidas, y evitar las bebidas con gas, que producen gases.","a":1},{"id":293,"ex":"Cantabria · 2024","org":"Cantabria","y":2024,"s":"estom","t":"dumping","q":"¿Cuál de las siguientes es una causa de déficit de vitamina B12?","o":["Consumo insuficiente por dietas vegetarianas estrictas.","Déficit de absorción.","Ausencia de factor intrínseco.","Todas son causas de déficit de vitamina B12."],"e":"Todas son causas de déficit de B12: falta de aporte (dieta vegana estricta, porque la B12 está en alimentos de origen animal), ausencia de factor intrínseco (anemia perniciosa, gastrectomía) y malabsorción (resección ileal, Crohn ileal, SIBO, metformina, IBP crónicos).","tr":"b12","a":3,"ns":1,"po":["Es causa, pero no la única.","Es causa, pero no la única.","Es causa, pero no la única.",""]},{"id":294,"ex":"Aragón Comunitaria · 2025","org":"Aragón","y":2025,"s":"bilipan","t":"charcot","q":"La triada de Charcot (fiebre, ictericia y dolor en hipocondrio derecho) es característica de:","o":["Colecistitis aguda.","Colangitis aguda.","Pancreatitis aguda.","Hepatitis aguda."],"e":"Fiebre, ictericia y dolor en hipocondrio derecho = tríada de Charcot = colangitis aguda (infección de la vía biliar por obstrucción del colédoco). Si se añaden shock y confusión, es la pentada de Reynolds.","tr":"charcot","a":1,"po":["Colecistitis = dolor + fiebre + leucocitosis + Murphy.","","Pancreatitis = dolor en cinturón + amilasa y lipasa.","Hepatitis = ictericia y transaminasas, sin la tríada."]},{"id":295,"ex":"Aragón Comunitaria · 2025","org":"Aragón","y":2025,"s":"ostom","t":"ostomias","q":"¿Cuál es el cuidado más importante en una ostomía?","o":["Cambiar la bolsa frecuentemente.","Irrigar el estoma constantemente.","Aplicar polvos cicatrizantes.","Vigilar la piel periestomal."],"e":"Vigilar y proteger la piel periestomal es el cuidado más importante: la dermatitis por contacto con el efluente es la complicación más frecuente y dificulta la adherencia del dispositivo. La bolsa se cambia solo cuando es necesario y la irrigación se reserva para colostomías distales seleccionadas.","a":3},{"id":296,"ex":"Comunidad de Madrid · 2025","org":"Madrid","y":2025,"s":"ostom","t":"heces_ostomia","q":"Características de las heces en ostomías localizadas en colon sigmoideo:","o":["Líquidas e irritativas.","Semiformadas.","Sólidas y no irritativas.","Todas son falsas."],"e":"En la colostomía sigmoidea el colon ya ha absorbido el agua: las heces son SÓLIDAS (formadas) y poco irritantes, y la evacuación es similar a la normal. Por eso estas colostomías admiten irrigación y bolsas cerradas.","tr":"distal","
