<style>
:root{--navy:#172b4d;--blue:#30a5e8;--ink:#29384d;--muted:#738095;--bg:#f3f6f8;--card:#fff;--line:#dfe6ec;--shadow:0 16px 45px rgba(22,43,77,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(880px,calc(100% - 32px));margin:32px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:clamp(30px,6vw,62px);text-align:center}.flask{font-size:64px}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;color:#078caf;text-transform:uppercase;margin:12px 0}h1{font-size:clamp(38px,7vw,62px);letter-spacing:-2px;color:var(--navy);margin:0}h1 span{color:var(--blue)}p{color:var(--muted);line-height:1.6;max-width:600px;margin:14px auto 30px}.game{display:block;text-decoration:none;text-align:left;border:1px solid var(--line);border-radius:18px;padding:20px 22px;transition:.2s;background:#fff}.game:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(22,43,77,.10)}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#078caf;font-weight:900}.game h2{color:var(--navy);margin:7px 0 5px}.game p{margin:0;color:var(--muted)}footer{text-align:center;color:#7a8797;font-size:13px;margin-top:22px}footer b{color:#079dcc}
